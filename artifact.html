 aux mains qui tremblent et aux yeux qui décrochent.","inversion":"Je paie dans l'autre sens : je dors une nuit d'avance et je la cède, et celui qui la reçoit se relève reposé au milieu d'un combat qu'il avait déjà perdu.","maximum":"Je réclame en une seule fois tout le sommeil que je dois depuis l'enfance. Celui qui l'endosse ne se réveille pas, et moi je ne me rendors plus jamais.","archetype":"échange"},{"id":"heritage-marques","nom":"L'Héritage des Marques","enonce":"Toute cicatrice que je touche devient une cicatrice que je porte.","consequence":"Après vingt contacts je porte les fractures de vingt corps, et je peux les rouvrir sur eux à l'endroit exact et dans l'ordre exact. Poussée jusqu'à la marque de naissance, l'homme redevient l'enfant qu'on a ouvert.","limite":"Il faut la peau nue et la marque refermée. Les blessures fraîches ne se transmettent pas, celui qui n'a jamais été entamé ne me laisse rien, et une manche suffit à me rendre inoffensif.","inversion":"Je déshérite : je retire la marque et son histoire avec elle. L'os ressoudé se ressoude autrement, et l'homme perd jusqu'au souvenir de la manière dont on l'a coupé.","maximum":"Je fais de la loi ma propre cicatrice et je l'hérite : tout ce qui m'a marqué devient transmissible par simple contact, y compris la blessure dont je mourrai, que je peux donner avant de l'avoir reçue.","archetype":"lien"},{"id":"archive-du-bruit","nom":"L'Archive du Bruit","enonce":"Aucun son émis devant moi n'a le droit de finir.","consequence":"Je garde cinq ans de sons dans une pièce close, puis j'ouvre : la pression cumulée casse les vitres, les tympans et les cages thoraciques dans cet ordre, et le cri d'un mort de février s'entend distinctement à la fin.","limite":"Ce que je conserve, je le porte. Chaque son gardé occupe une place, et un adversaire qui parle sans arrêt me remplit jusqu'à ce que je doive tout lâcher au même endroit — c'est-à-dire sur moi autant que sur lui.","inversion":"Je laisse fuir : un son conservé s'efface de l'air, des murs et des mémoires, et la phrase prononcée devant moi n'a plus jamais été prononcée par personne.","maximum":"Je conserve le son de mon propre énoncé : la loi ne finit plus de se dire, elle s'applique en continu, et je n'entendrai plus jamais rien d'autre.","archetype":"répétition"},{"id":"coupe-d-ombre","nom":"La Coupe d'Ombre","enonce":"Ce que je sépare de son ombre cesse de tenir ensemble.","consequence":"Un mur privé de son ombre s'écroule à la seconde suivante. Un homme séparé de la sienne se défait par couches, du bas vers le haut, à la vitesse à laquelle le soleil monte au-dessus de lui.","limite":"Il me faut une source de lumière unique et un sol pour recevoir l'ombre. Dans le noir complet, ou sous deux lampes qui se contredisent, la loi n'a rien à couper.","inversion":"Je recolle : je rends son ombre à ce qui l'avait perdue et la chose se retient — un corps ouvert tient à sa propre ombre le temps qu'on le recouse.","maximum":"Je me sépare de mon ombre. La coupe n'a plus besoin de lumière : tout ce que je désigne se défait, et plus rien ne me suit au sol.","archetype":"soustraction"},{"id":"versement-de-faim","nom":"Le Versement de Faim","enonce":"La faim se transporte d'un corps à un autre comme un objet qu'on pose.","consequence":"Je verse dans un homme les quatre jours de faim d'un autre : les sucs remontent, l'estomac se digère lui-même, et il mord ce qui est le plus proche de sa bouche, y compris sa propre main.","limite":"La faim doit exister quelque part avant d'être versée. Dans une ville rassasiée je n'ai presque rien à déplacer, et celui qui a mangé une heure plus tôt n'encaisse qu'une charge dérisoire.","inversion":"Je transporte la satiété au lieu du manque : un mourant est nourri sans rien avaler, et du poids revient sur ses os en quelques battements.","maximum":"Je verse en moi la faim de tout ce qui a faim à portée d'oreille, et je décide de ne rien manger tant qu'elle n'a pas trouvé un autre corps.","archetype":"échange"},{"id":"concordance-des-ages","nom":"La Concordance des Âges","enonce":"Deux choses qui se touchent finissent par avoir le même âge.","consequence":"Ma paume à plat sur une poutre de trois cents ans : mes cheveux blanchissent par la pointe pendant que la poutre reprend de la sève. L'écart se comble par le milieu, et sur un enfant la moyenne se fait aussi.","limite":"Je ne choisis pas la part et la moyenne va toujours dans les deux sens. Il suffit de me faire toucher plus vieux que moi — un mur, un os, une pierre — pour me coûter des décennies en un contact.","inversion":"J'écarte les âges au lieu de les rapprocher : je rends dix ans à l'un en les prenant à l'autre, avec un choix que le sens direct ne m'accorde jamais.","maximum":"Je pose les deux paumes à plat sur la terre et je laisse la concordance se faire avec elle.","archetype":"métamorphose"},{"id":"remontee-de-ligne","nom":"La Remontée de Ligne","enonce":"Un coup porté à un homme se paie d'abord sur la ligne qui l'a fait.","consequence":"Je frappe un cadet et trois générations reçoivent le coup avant lui, déterrées à distance. Quand la lignée est longue, il ne sent presque rien ; quand elle est courte, il n'en reste pas assez pour tomber.","limite":"Je n'atteins que ce qui a des ascendants nommés. Un homme sans nom de famille, un enfant abandonné, un fléau sans naissance absorbe seul la totalité du coup et reste debout devant moi.","inversion":"Je descends la ligne au lieu de la remonter : le coup se paie sur les descendants, y compris ceux qui ne sont pas encore nés — la loi les compte, donc ils sont.","maximum":"Je me frappe moi-même : toute ma ligne encaisse au même instant, et il ne reste plus personne pour porter la loi après moi.","archetype":"lien"},{"id":"passage-oblige","nom":"Le Passage Obligé","enonce":"Aucune douleur n'atteint un corps avant d'avoir traversé le mien.","consequence":"Je me place entre la lame et lui : le coup me traverse d'abord et lui arrive tiède. Sur une salle entière, plus personne ne peut souffrir tant que je tiens debout, et je tiens tout, jusqu'à la brûlure d'un enfant à l'étage.","limite":"Tout passe par un seul corps, et un corps a une capacité. Il suffit de blesser beaucoup de monde à la fois : la file me tue avant d'avoir atteint le troisième nom.","inversion":"Je renvoie au lieu d'absorber : la douleur repart par où elle est venue, remonte le bras, et la main qui a frappé reçoit l'intégralité de ce qui devait être reçu.","maximum":"Je me déclare passage de toute douleur à trente pas, puis je refuse de la relayer : autour de moi plus rien ne souffre, plus rien ne se protège, et je porte seul la totalité de ce que le monde aurait dû sentir.","archetype":"seuil"},{"id":"elan-confisque","nom":"L'Élan Confisqué","enonce":"Tout élan pris devant moi cesse d'appartenir à celui qui l'a pris.","consequence":"Dix pas de course me sont cédés ; je les replace dans un éclat de verre. La chute de quelqu'un est une réserve : je la garde une heure et je la dépose plus tard contre une nuque, avec toute la hauteur d'origine.","limite":"L'immobilité me prive de tout. Contre un adversaire qui ne se déplace plus et qui frappe du seul poignet, je n'ai rien à confisquer sinon mon propre mouvement, et je me vide en avançant.","inversion":"Je restitue l'élan à ce qui l'a perdu : un corps arrêté reprend exactement la vitesse qu'on lui avait ôtée, dans la direction d'origine, et le geste interrompu s'achève.","maximum":"Je confisque mon propre élan et je le garde : je ne peux plus bouger, et tout le mouvement du terrain m'appartient — chaque pas de l'autre est un pas que je place.","archetype":"soustraction"},{"id":"registre-du-sang","nom":"Le Registre du Sang","enonce":"Le sang qui a quitté un corps demeure sous mon autorité.","consequence":"Une goutte séchée sous un plancher depuis vingt ans m'obéit encore. Je la rappelle, et le trajet du retour ouvre tout ce qui se trouve entre elle et le corps qui l'a perdue, murs compris.","limite":"Le sang lavé, brûlé ou mêlé à celui d'un autre sort du registre. On me combat en saignant dans un seau d'eau salée, et il suffit de ne jamais saigner deux fois au même endroit.","inversion":"Je rends le sang à son corps : la restitution est entière et immédiate, l'homme se relève avec ses cinq litres — mais ce sang sort à jamais de mon autorité et ne me répondra plus.","maximum":"Je rappelle en une fois tout le sang que j'ai moi-même perdu depuis ma naissance, où qu'il soit et quel que soit ce qu'il doit traverser pour revenir.","archetype":"lien"},{"id":"executoire","nom":"L'Exécutoire","enonce":"Une promesse prononcée devant moi devient exigible dans sa lettre.","consequence":"« Je reviens tout de suite » oblige un homme à revenir d'où qu'il soit : les murs deviennent ce qu'il traverse et non ce qui l'arrête. Ce qui reste de lui arrive quand même, et à l'heure.","limite":"Je n'exige que la lettre, jamais l'intention. Une promesse ambiguë s'exécute au moins-disant, et celui qui ne promet rien — ou qui promet l'impossible — me laisse une créance nulle entre les mains.","inversion":"Je délie au lieu d'exiger : une promesse devient inexécutable pour toujours, et ce qu'elle retenait tombe — une garde, une allégeance, un serment gravé sous un sceau.","maximum":"Je prononce devant moi la promesse de tenir cette loi. Elle devient exigible contre moi dans sa lettre : je ne peux plus mentir, ni m'interrompre, ni mourir avant de l'avoir tenue.","archetype":"témoignage"},{"id":"droit-d-entree","nom":"Le Droit d'Entrée","enonce":"Nul n'entre dans une pièce où je me tiens sans y laisser une chose.","consequence":"Le prélèvement se fait à son insu : une lettre de son nom, le visage de quelqu'un, la sensibilité d'un doigt. Au bout de six pièces, celui qui me poursuit ne sait plus qui il poursuit et sa main tient mal.","limite":"C'est la pièce qui prélève, pas moi, et je ne choisis rien de ce qui est pris. En terrain ouvert, sans porte ni cloison, la loi ne s'exerce pas du tout — on me combat dehors.","inversion":"Je rends à la sortie : celui qui quitte la pièce récupère tout ce qu'il y avait laissé, et davantage — on en ressort avec ce que les autres y ont perdu.","maximum":"Je fais du monde une seule pièce et je me place dedans : chaque pas de chaque vivant vers moi lui coûte une chose, et je ne saurai jamais laquelle.","archetype":"seuil"},{"id":"trois-traits","nom":"Les Trois Traits","enonce":"Une chose décrite en trois traits vrais ne peut plus être que ces trois traits.","consequence":"Je décris un homme : grand, gaucher, essoufflé. Il perd tout le reste — la vue, le nom, l'estomac, la capacité de saigner — et se tient debout comme un meuble jusqu'à ce qu'on le pousse.","limite":"Je dois dire vrai : un seul trait faux annule la description entière. Celui qui se rend illisible — masqué, muet, immobile — ne me laisse jamais trois traits sûrs à énoncer.","inversion":"Je désécris : j'ôte les trois traits et je rends tout le reste. Un corps réduit reprend ses organes ; un fléau simplifié récupère une complexité qu'il ne sait plus gouverner.","maximum":"Je me décris moi-même : vivant, debout, porteur de la loi. Rien d'autre n'est vrai de moi, donc rien d'autre ne peut m'être retiré.","archetype":"métamorphose"},{"id":"oubli-operant","nom":"L'Oubli Opérant","enonce":"Ce dont je perds le souvenir cesse d'exister pour tout le monde.","consequence":"Une rue oubliée disparaît du plan et des jambes qui l'empruntaient. Poussée, j'oublie une technique adverse pendant qu'elle est en cours et elle s'interrompt au milieu de son geste, sans que son porteur sache ce qu'il faisait.","limite":"Je ne choisis pas ce que j'oublie et je perds réellement : chaque suppression prélève un morceau de ma propre vie. Il suffit de me faire oublier ce que je suis venu défendre pour que je le défasse moi-même.","inversion":"Je me souviens de ce qui n'a pas eu lieu et cela commence à exister : un mort revient, mais seulement la part que j'en garde, et il s'aperçoit très vite de ce qui manque.","maximum":"Je m'oublie moi-même. La loi reste, et continue de s'appliquer, sans plus personne pour se rappeler qui l'a énoncée.","archetype":"soustraction"},{"id":"plafond-releve","nom":"Le Plafond Relevé","enonce":"Ce que j'ai mesuré une fois ne peut plus dépasser la mesure.","consequence":"Je relève la vitesse d'un bras au premier échange : il n'ira plus jamais plus vite, ni ce soir, ni dans dix ans, ni contre un autre que moi. Le relevé vaut aussi pour un souffle, une portée, une réserve.","limite":"Une seule grandeur par relevé, et le chiffre doit être lu à l'instant exact. Ce qui varie pendant que je mesure ne se laisse pas fixer : un adversaire irrégulier m'impose un plafond haut, et le plafond est définitif pour moi aussi.","inversion":"Je démesure : je retire son plafond à une chose et elle n'a plus de valeur maximale tant que personne ne la mesure à nouveau — y compris moi, y compris un mourant.","maximum":"Je mesure la mesure : je relève le plafond de mon propre relevé et je le fixe à un. Désormais un seul chiffre suffit à figer un homme entier, et je n'aurai plus jamais qu'un chiffre par homme.","archetype":"mesure"},{"id":"heure-reprise","nom":"L'Heure Reprise","enonce":"À chaque minute, mon corps refait ce qu'il faisait la veille à la même minute.","consequence":"Je bâtis mes journées comme des pièges. Hier à 14 h 03 j'ai frappé le vide ; aujourd'hui à 14 h 03 mon poing part seul, avec la force d'hier ajoutée à celle d'aujourd'hui, et celui qui se tient là n'a rien vu venir parce que moi non plus.","limite":"Je n'ai aucun choix pendant la reprise. Celui qui a pu m'observer un jour connaît le lendemain à la minute près, et il lui suffit de se placer là où mes mains seront occupées.","inversion":"Je romps la veille : j'annule ce que je faisais à cette minute-là et tout ce qui en découlait — la blessure prise hier à 14 h 03 n'a plus de cause aujourd'hui, et se referme faute d'origine.","maximum":"Je passe une journée entière à ne rien faire d'autre qu'appliquer cette loi. Le lendemain, mes vingt-quatre heures ne sont plus qu'une reprise, et je ne m'appartiens plus d'aucune minute.","archetype":"répétition"},{"id":"premiere-version","nom":"La Première Version","enonce":"La première version d'un fait dite devant moi devient le fait.","consequence":"Un homme dit « je ne l'ai pas touchée » : sa main n'a plus jamais touché personne, elle traverse les corps et ne peut plus rien saisir. Un mensonge sur une blessure la fait disparaître, avec la chair qui allait autour.","limite":"Je retiens la première version, pas la plus utile. Celui qui parle vite décide de la loi à ma place, et une phrase absurde lancée avant moi me lie pour tout le duel.","inversion":"Je rétracte : la version retenue est retirée du monde et ce qu'elle avait fixé redevient libre — la main revient, la blessure revient, et l'homme redevient coupable.","maximum":"Je dis de moi la première version : « je suis intact ». Tant que personne ne parle de moi avant moi, je le suis — et je ne pourrai plus jamais dire de moi autre chose.","archetype":"témoignage"},{"id":"fonction-unique","nom":"La Fonction Unique","enonce":"Ce qui a servi deux fois au même usage ne peut plus servir à un autre.","consequence":"Une poignée ouverte mille fois n'est plus qu'ouverture : elle ne pèse plus, ne blesse plus, ne bloque plus. J'assigne à une main le seul fait de tenir : elle ne frappe plus, ne lâche plus, et se referme sur ce qu'elle tient jusqu'à l'os.","limite":"Il faut que j'aie vu les deux usages. Celui qui change de garde à chaque échange ne fixe jamais de fonction, et une arme sans histoire ne m'offre rien à verrouiller.","inversion":"Je déverrouille : la chose perd sa fonction et devient disponible pour n'importe quelle autre — un mur cesse de séparer, un os cesse de porter, une porte cesse d'être un passage.","maximum":"J'assigne à mon corps sa fonction unique : appliquer la loi. Je ne mange plus, je ne dors plus, je ne fais plus rien d'autre — et rien ne peut plus m'en empêcher.","archetype":"métamorphose"},{"id":"chambre-commune","nom":"La Chambre Commune","enonce":"Deux êtres qui respirent le même air respirent la même chose.","consequence":"Ce qui entre dans mes poumons entre dans les siens : une gorgée d'eau, une lame de fumée, une hémorragie interne. Dans une pièce close, il me suffit de cesser de respirer pour que la pièce cesse, et je tiens quatre minutes de plus que n'importe qui.","limite":"Le partage est intégral et symétrique. Tout ce qu'il inhale, je l'inhale : un poison fait deux morts, une apnée en fait deux, et il lui suffit d'accepter de mourir pour m'emporter à la même seconde.","inversion":"Je sépare les airs : plus personne ne respire ce que je respire. J'extrais un homme d'une fumée ou d'une eau, et il respire au fond du fleuve l'air d'une chambre que j'ai quittée le matin.","maximum":"J'ouvre la chambre commune à tout ce qui respire à portée d'oreille, puis j'inspire une seule fois, lentement, de la poussière d'os.","archetype":"lien"},{"id":"retrait-d-unite","nom":"Le Retrait d'Unité","enonce":"D'un ensemble que j'ai compté en entier, je peux ôter une unité.","consequence":"J'ai compté les vingt-six vertèbres d'un examinateur pendant qu'il me dictait mon numéro de dossier ; la septième est partie sans bruit, sa tête est tombée de trois centimètres en avant et n'est jamais remontée. Poussée sur un ensemble plus large — les quatre cavités d'un cœur, les onze hommes d'une escouade — la loi ne laisse ni corps ni vide : l'ensemble se referme sur son nouveau compte comme s'il n'avait jamais eu que celui-là, et les registres s'accordent tout seuls.","limite":"Il faut que je compte l'ensemble entier, sans en manquer un, et qu'il ne change pas pendant que je compte. Un adversaire qui remue les doigts, qui avale, qui saigne, se présente comme un ensemble instable : le compte casse, et un compte cassé ne se reprend pas avant l'aube suivante.","inversion":"J'ajoute l'unité au lieu de l'ôter : le doigt manquant depuis dix ans repousse à la bonne longueur et au bon ongle, l'escouade retrouve son onzième homme — qui se souvient d'être resté dehors, et de rien d'autre.","maximum":"Je me compte moi-même, entier, os par os et heures par heures, puis je m'ôte du compte des vivants présents dans la salle. Plus rien ne m'atteint, car je ne suis plus l'un des termes ; je ne touche plus rien non plus, et il faudrait que quelqu'un me recompte pour me rendre au monde.","archetype":"soustraction"},{"id":"dime-des-gestes","nom":"La Dîme des Gestes","enonce":"Un geste sur dix accompli devant moi n'a pas lieu.","consequence":"Je compte à voix basse ; au dixième, la main s'arrête sans s'arrêter — la lame est déjà repartie, la plaie n'existe pas, la douleur non plus, seule la sueur reste. Sur six hommes qui s'entraînent une minute devant moi, cela fait quarante gestes retirés du monde : ils sortent épuisés d'un travail qu'ils n'ont pas fait, et le sol n'a pas de traces.","limite":"Le compte est public : il suffit de compter avec moi. Qui place son geste décisif en première ou en neuvième position ne perd rien, et un geste continu — une prise qu'on ne lâche pas, un étranglement — ne compte que pour un tant qu'il dure.","inversion":"Je rends le dixième au lieu de le prendre : l'homme qui a manqué neuf fois réussit à la dixième, la main qui avait lâché se referme, le pas qui n'avait pas porté porte.","maximum":"Je fais entrer mes propres battements de cœur dans le compte. Un sur dix n'a pas lieu, et rien de ce qui vit à cette cadence ne peut m'atteindre — sauf pendant ce battement-là, où je suis absolument disponible, et où n'importe qui peut me tuer d'une chiquenaude.","archetype":"soustraction"},{"id":"prix-affiche","nom":"Le Prix Affiché","enonce":"Toute chose que je désigne a un prix, et qui la touche le paie.","consequence":"J'annonce le tarif avant, dans une monnaie que l'autre possède : onze mois, quatre litres, le prénom de sa mère. La poignée de la porte du couloir C valait deux ans ; le 補助監督 hojo-kantoku qui l'a ouverte est ressorti avec le même visage et la mâchoire d'un homme de soixante ans, et il a fallu refaire sa photo d'accréditation.","limite":"Le prix doit être prononcé avant le contact et dans une unité que le payeur détient réellement. Un 呪霊 jurei n'a ni années ni sang : il traverse tous mes tarifs sans rien devoir. Et un homme qui accepte de payer paie — je ne suis pas un obstacle, je suis une caisse.","inversion":"Je rembourse : je désigne une chose et lui fais rendre ce qu'elle a coûté, dans l'ordre inverse des paiements. Les années reviennent au dernier payeur d'abord, et le sang remonte dans les corps qui sont encore là pour le recevoir.","maximum":"Je m'affiche moi-même. Me toucher coûte tout ce qu'on possède dans l'unité dont on est le plus pauvre ; mais un prix engage aussi le vendeur, et je dois livrer : celui qui a payé le plein tarif obtient ce qu'il a acheté, et ce qu'il a acheté, c'est moi.","archetype":"échange"},{"id":"chose-qui-sert","nom":"La Chose qui Sert","enonce":"Ce qui m'a servi peut souffrir à ma place, une fois.","consequence":"Le manteau que je porte depuis quatre ans reçoit le coup entier : la clavicule cède dans le tissu, l'étoffe se plie comme un os et ne sert plus jamais à rien. Un 呪具 jugu qui m'a servi encaisse une décapitation ; il tombe en deux morceaux au sol, et mon cou reste à la température du dehors.","limite":"L'objet doit m'avoir réellement servi, se trouver sur moi ou à portée de voix, et ne vaut que pour un seul événement. On me désarme en détruisant mes affaires d'abord : un adversaire méthodique passe cinq minutes sur un sac, une montre, une paire de chaussures, et ce qu'il a devant lui ensuite est un homme nu.","inversion":"Je fais servir la chose en sens inverse : ce qu'elle a subi se retire d'elle et la remet en état. Le manteau se recoud fil par fil, l'outil se ressoude à la ligne de rupture, et il redevient utilisable — une fois.","maximum":"Je déclare que ce qui m'a le plus servi est mon propre corps. Il souffre à ma place et je reste debout à côté, entier, sans une marque ; mais un corps ne sert qu'une fois de cette manière-là, et ce qui reste debout devra faire sans.","archetype":"échange"},{"id":"echange-de-vitesse","nom":"L'Échange de Vitesse","enonce":"Deux choses en mouvement devant moi peuvent échanger leur vitesse.","consequence":"La pierre qui tombe prend celle de la balle ; la balle prend celle de la pierre et se pose dans ma main, tiède. Un homme qui court reçoit la vitesse d'une porte qui claque : il s'arrête en cinq centimètres, et l'intérieur continue tout seul jusqu'au bout de la course.","limite":"Les deux termes doivent être en mouvement, visibles en même temps, et la vitesse échangée garde sa direction propre : je ne vise rien, je redistribue. Un adversaire parfaitement immobile n'a rien à échanger, et il le comprend dès la première fois qu'il m'a vu faire.","inversion":"Je rends à chacun la vitesse qu'il avait avant : la chute cesse d'avoir accumulé, et le corps arrive au sol à l'allure d'un homme qui descend un escalier, sans une fracture.","maximum":"J'échange les termes de l'échange lui-même : ce ne sont plus les vitesses qui passent d'un corps à l'autre, ce sont les corps qui passent d'une vitesse à l'autre. Tout ce qui bouge dans le secteur prend la place de ce qui bougeait à cette allure — moi compris, et je ne choisis pas où j'arrive.","archetype":"échange"},{"id":"refrain","nom":"Le Refrain","enonce":"Un geste que j'ai fait une fois et que je répète ensuite à voix basse se refait sans moi.","consequence":"J'ai frappé une fois le mur de la salle B, puis j'ai murmuré le coup ; le mur a été frappé toutes les quatre secondes pendant onze heures, jusqu'à ce que je me taise, et la poussière de plâtre est montée jusqu'aux luminaires. Sur une gorge, la cadence est la même, et le murmure la tient depuis l'autre bout du 帳 tobari.","limite":"Le murmure doit rester audible pour moi et ma bouche doit continuer : un bâillon, une main plaquée, un poumon percé arrêtent tout dans la seconde. Et je ne tiens qu'un refrain à la fois — le suivant efface le précédent, sans exception ni recours.","inversion":"Je murmure un geste de soin fait une fois : le point de suture se refait tout seul, à la même cadence, jusqu'à ce que la plaie n'ait plus rien à coudre et que l'aiguille ne trouve plus de bord.","maximum":"Je murmure le murmure lui-même. Le refrain se recopie sans que j'aie besoin de parler, et il ne s'arrêtera plus : ce que j'ai fait une fois continuera après moi, toutes les quatre secondes, dans une salle que personne ne rouvrira.","archetype":"répétition"},{"id":"echo-de-blessure","nom":"L'Écho de Blessure","enonce":"Une blessure portée deux fois au même point se refait ensuite toute seule.","consequence":"L'intervalle qui sépare mes deux coups devient la cadence : deux entailles à trois secondes d'écart, et la peau se rouvre toutes les trois secondes, à la même profondeur, jusqu'à ce qu'il n'y ait plus de quoi. Le sang ne coagule jamais ; dans une pièce fermée, l'odeur au bout d'un quart d'heure est celle du fer chaud.","limite":"Il faut le même point au millimètre et rien d'autre entre les deux coups. La profondeur du second fixe celle de toutes les suivantes : un adversaire qui se déplace d'un doigt me fait recommencer, et une 反転術式 hanten-jutsushiki appliquée une seule fois efface le point et annule la série entière.","inversion":"Je referme deux fois le même point : il se referme ensuite tout seul, à la même cadence, et l'homme guérit à intervalles réguliers de tout ce qu'on lui fait à cet endroit-là.","maximum":"Je me blesse deux fois au même point, à l'intervalle exact de mon propre pouls. Ma blessure suit mon cœur ; tant que je reste calme elle est supportable, et je mourrai de la première fois où j'aurai peur.","archetype":"répétition"},{"id":"nombre-de-pas","nom":"Le Nombre de Pas","enonce":"Je lis le nombre de pas qui reste à chaque chose, et je peux le dépenser.","consequence":"Trois mille deux cent quatre pour l'examinateur assis en face de moi ; j'en dépense huit cents pour ouvrir une porte au bout du couloir, et il prend d'un coup la fatigue de huit cents pas sans avoir quitté sa chaise, avec la sueur et l'essoufflement. À zéro on ne meurt pas : on ne se relève plus, jamais, et il faut ensuite quelqu'un pour porter.","limite":"Je ne lis que ce qui se compte en pas. Un homme porté, un homme en fauteuil, un 呪霊 jurei qui glisse au ras du sol n'ont aucun compte ouvert chez moi ; et le mien, je ne peux pas le lire.","inversion":"Je verse des pas au lieu d'en prendre : je rends à un vieillard les onze mille pas qu'il a laissés à la terre, et il se lève sans aide, sans bruit, en s'excusant.","maximum":"Je dépense d'un seul coup tout ce qui reste à tous ceux que je vois, le mien compris. Il n'y a plus un pas disponible dans le secteur ; ce qui doit s'y décider se décidera à genoux, entre gens qui ne peuvent plus partir.","archetype":"mesure"},{"id":"point-milieu","nom":"Le Point Milieu","enonce":"Entre deux choses, le milieu exact m'appartient.","consequence":"Ce qui occupe le milieu reçoit ce qui arrive aux deux extrémités : je prends pour termes la lame et la nuque, et le milieu — l'air, une chaise, un homme qui passait — encaisse la coupe pour de bon. Entre deux corps qui se font face à six mètres, le sang des deux paraît au centre, en suspension, avant qu'aucun ne soit blessé.","limite":"Il me faut deux termes que je puisse tenir pour fixes une seconde entière, et la géométrie ne pardonne pas : un demi-centimètre d'erreur et le milieu tombe dans le vide. Deux choses qui se touchent n'ont pas de milieu — un adversaire au corps à corps me retire ma loi rien qu'en avançant.","inversion":"Le milieu rend au lieu de recevoir : ce que les deux extrémités ont perdu revient par le centre, et deux blessés qui se placent correctement guérissent l'un de l'autre, à parts égales.","maximum":"Je me prends moi-même pour mes deux termes. Mon milieu exact devient l'unique endroit où quelque chose peut m'arriver : tout ce qui atteint mes extrémités s'y rassemble, et je suis invulnérable partout sauf en un point de la taille d'une pièce de monnaie, quatre centimètres derrière le sternum.","archetype":"mesure"},{"id":"fil-de-poursuite","nom":"Le Fil de Poursuite","enonce":"Celui qui m'a suivi ne peut plus s'arrêter avant moi.","consequence":"Deux pas faits dans ma direction parce que je m'éloignais suffisent : à partir de là, il marche tant que je marche, et son cœur n'a plus le droit au repos qu'après le mien. J'ai fait monter un 呪詛師 jusoshi douze étages sans me retourner, je me suis arrêté au bord du toit ; il s'est arrêté un pas après moi.","limite":"Il faut qu'il ait choisi de me suivre : un homme qui traverse le même couloir sans savoir que j'y suis n'est lié à rien. Et le fil casse dès que je m'arrête plus longtemps qu'un souffle — c'est-à-dire dès qu'on m'oblige à tenir une position, ce que sait faire n'importe quelle équipe de trois.","inversion":"Je me lie à celui que je suis : je ne peux plus m'arrêter avant lui, et je remonte son trajet à l'envers. Ce qu'il a semé en chemin — sang, chaleur, distance — je le lui rends dans l'ordre exact où il l'a perdu.","maximum":"Je me suis moi-même : je marche derrière mes propres pas et je ne peux plus m'arrêter avant moi. Rien ne m'atteint tant que j'avance, et je n'ai plus aucun moyen de m'arrêter.","archetype":"lien"},{"id":"prise-commune","nom":"La Prise Commune","enonce":"Ce que deux mains ont tenu ensemble ne cesse jamais de les tenir.","consequence":"Une civière portée à deux en 1997, une corde, une poignée de main de quatre secondes : le lien tient, et je passe dedans. J'ai fait mourir de froid, à onze kilomètres, un homme dont le seul tort était d'avoir tenu l'autre bout d'un brancard ; il est mort en intérieur, à vingt et un degrés, la peau bleue.","limite":"Il faut un contact simultané et une prise réelle — se frôler ne suffit pas, et un objet tenu chacun son tour ne vaut rien. Le fil n'a pas de sens : ce que j'y fais passer peut revenir, et qui a compris la loi n'a plus qu'à me faire tenir sa main.","inversion":"Je fais passer la réparation par la prise : celui qui tenait l'autre bout reçoit de quoi refermer, et deux hommes qui ont porté ensemble se relèvent ensemble, dans le même ordre qu'ils étaient tombés.","maximum":"Je prends à deux mains une chose que tout le monde a tenue : la rampe de l'escalier nord du 呪術高専 Jujutsu Kōsen. Tous ceux qui l'ont tenue depuis qu'elle existe sont dans ma main en même temps, morts compris — et je n'ai aucun moyen de les compter, ni de lâcher.","archetype":"lien"},{"id":"ligne-de-craie","nom":"La Ligne de Craie","enonce":"Toute ligne que je trace d'un seul trait sépare réellement.","consequence":"Rien ne passe : ni le sang, ni le son, ni la chaleur, ni un corps. Ce qui traverse quand même arrive de l'autre côté séparé de ce qui est resté — j'ai tracé au sol d'un couloir de service, et l'homme qui a franchi a laissé derrière lui tout ce qui, en lui, circulait ; il a fait encore quatre pas.","limite":"Le trait doit être continu, fait de ma main, d'un seul geste, et il ne vaut que tant qu'il est intact : une semelle, trois gouttes, un souffle de poussière l'ouvrent. Et il sépare des deux côtés — ce qui est derrière la ligne m'est fermé exactement autant qu'à eux.","inversion":"Je trace pour réunir : ce que la ligne touche cesse d'être séparé. Deux bords de plaie posés de part et d'autre se rejoignent sans couture, et un membre reposé au bon endroit reprend sa circulation en quelques secondes.","maximum":"Je trace la ligne autour de moi, d'un seul trait, sans lever la main. Rien n'entre. Rien ne sort. Rien ne circule non plus à l'intérieur : la loi ne fait pas d'exception pour mon sang.","archetype":"seuil"},{"id":"seuil-de-douleur","nom":"Le Seuil de Douleur","enonce":"Rien ne m'atteint qui ne fasse plus mal que la dernière chose qui m'a fait mal.","consequence":"Je me casse le petit doigt dans l'escalier avant d'entrer ; pendant les minutes qui suivent, tout ce qui vaut moins que ça traverse sans rien laisser — la lame entre et ressort, il n'y a pas de plaie, seulement du tissu déplacé et un peu de froid. Contre un adversaire régulier, la barre monte à chaque échange qu'il gagne : je deviens plus difficile à mesure qu'on me touche.","limite":"La barre est faite de douleur et de rien d'autre. Le froid qui endort, le poison sans morsure, l'étouffement, la coupe nette qui ne fait mal qu'après : tout cela ne se présente pas au seuil et entre à sa guise. Et la barre redescend seule — une heure sans souffrir, et je vaux ce que vaut n'importe qui.","inversion":"J'abaisse le seuil au lieu de le tenir : ce qui a fait moins mal que ma dernière douleur cesse d'avoir été fait, et les petites blessures de la journée se retirent de mon corps dans l'ordre inverse de leur arrivée.","maximum":"Je prends pour dernière douleur la plus grande que j'aie eue : celle du jour où ma loi s'est déclarée en moi. Plus rien de ce que peut faire un homme ne monte à cette hauteur ; mais il faut que je m'en souvienne exactement pendant tout le temps où je m'en sers, et un souvenir tenu à ce niveau ne laisse aucune place pour surveiller la salle.","archetype":"seuil"},{"id":"second-mensonge","nom":"Le Second Mensonge","enonce":"À ma question, le premier mensonge est permis ; le second devient vrai.","consequence":"« As-tu une arme ? » — il a dit non deux fois ; la lame n'a jamais existé, et sa main gauche s'est refermée sur l'habitude d'un objet absent. « Est-ce que tu saignes ? » — deux fois non, et il n'a plus de sang du tout : il est resté debout onze secondes, sans une goutte au sol.","limite":"Il faut une vraie question de ma part, entendue et comprise, et un mensonge su comme tel : une erreur sincère ne vaut rien, le silence non plus. Surtout, je ne choisis pas ce qui devient vrai — un adversaire averti ment deux fois sur son état et se retrouve intact, à mes frais.","inversion":"J'inverse le sens : c'est la vérité qui cède et le mensonge qui répare. À l'homme qui prétend deux fois n'avoir jamais été blessé, je rends une peau qui n'a jamais été ouverte ; il reste ce qu'il a vu, que la 反転術式 hanten-jutsushiki ne touche pas.","maximum":"Je me pose la question à moi-même et je me réponds deux fois faux. Ce que je nie de moi cesse d'être vrai : mon nom, ma peur, ma mort en cours. On ne ment pas deux fois sur soi sans que quelque chose parte avec le mensonge, et je ne saurai jamais quoi, puisque c'est parti.","archetype":"témoignage"},{"id":"compte-rendu","nom":"Le Compte Rendu","enonce":"Ce que je consigne d'un mort devient ce qu'il a été.","consequence":"Je déclare que l'homme au sol portait dans la bouche une capsule de verre ; on l'ouvre, elle y est, et elle y était depuis mardi. Un déclarant patient réécrit ainsi une lignée entière : trois morts bien consignés, et un 呪術師 jujutsushi vivant se découvre l'héritier d'une loi qu'il n'a jamais eue, avec les douleurs qui vont avec.","limite":"Un seul compte rendu par mort, et jamais contre un témoin vivant : si quelqu'un a vu autrement, sa mémoire tient et la mienne s'efface. On me neutralise donc en restant deux — le survivant d'un binôme est un homme que je ne peux pas écrire.","inversion":"Je consigne ce que le mort n'a pas été : ce qui lui a été fait se retire de son corps dans l'ordre inverse, jusqu'à la dernière minute où il était intact. Il ne se relève pas — la 反転術式 hanten-jutsushiki ne rend pas l'âme — mais il est présentable, et il est prouvé.","maximum":"Je rédige mon propre compte rendu par avance et je le fais contresigner par un 補助監督 hojo-kantoku. À la seconde où je meurs, j'ai été ce que j'ai écrit : c'est la seule manière que j'aie trouvée de gagner après.","archetype":"témoignage"},{"id":"convocation","nom":"La Convocation","enonce":"Celui dont je lis le nom dans un registre doit répondre.","consequence":"Il répond où qu'il soit, dans les quatre secondes, à voix haute, et pendant qu'il répond il ne fait rien d'autre — pas un pas, pas une garde. Lu dans un registre mortuaire, le nom obtient aussi sa réponse ; elle arrive avec l'odeur de la pièce réfrigérée où le corps a été gardé.","limite":"Le registre doit avoir été écrit d'une autre main que la mienne, et je dois entendre la réponse pour qu'elle compte : dans le bruit, je n'obtiens rien. La convocation n'oblige qu'à répondre — elle ne déplace personne, elle n'ouvre rien. Et les homonymes répondent tous ensemble : dans un registre de collège, un nom courant me remplit la bouche de quatorze voix.","inversion":"C'est moi qui réponds à leur place : je prends la convocation adressée à un autre et je m'y présente. Ce qui l'attendait m'attend, et lui n'aura jamais été appelé.","maximum":"Je lis mon propre nom dans le registre du 上層部 jōsōbu, à la ligne où il est déjà rayé. Je dois répondre. Tant que je réponds je ne fais rien d'autre, et personne ne peut radier un homme qui est en train de parler dans le registre.","archetype":"témoignage"},{"id":"retour-a-la-matiere","nom":"Le Retour à la Matière","enonce":"Ce qu'une main a fabriqué peut redevenir ce dont il est fait.","consequence":"La lame redevient trente kilos de sable ferrugineux et deux poignées de charbon, dans le même volume et à la même hauteur : ce qui la tenait reçoit tout, d'un coup. Les points de suture d'un blessé redeviennent du fil sur une bobine posée à côté de lui, et sa cage thoracique s'ouvre comme un livre qu'on n'a pas relié.","limite":"Seul ce qu'une main a assemblé m'obéit. Ce qui a poussé — un corps, un os, une pierre non taillée, un 呪霊 jurei né tout seul d'une peur — reste ce qu'il est. Un adversaire qui vient nu, sans arme, sans prothèse et sans vêtements, se présente devant moi comme un mur.","inversion":"Je remonte la fabrication : la matière reprend la forme la plus achevée qu'elle ait eue. Le sable redevient lame, la maison brûlée redevient la maison, et le fil rentre dans la peau exactement où il était, dans le même ordre de nœuds.","maximum":"Je traite ma propre loi comme un ouvrage — elle a bien été faite, à un moment, par quelqu'un — et je la rends à ce dont elle est faite : la peur d'un homme mort avant ma naissance. Pendant les quelques secondes où elle est de nouveau cette peur, tout ce que des mains ont fabriqué dans le secteur se défait en même temps ; ensuite je n'ai plus de loi.","archetype":"métamorphose"},{"id":"forme-suivante","nom":"La Forme Suivante","enonce":"Ce qui est en train de changer change jusqu'au bout.","consequence":"La rouille d'une grille finit en huit secondes et la grille tombe en poudre orange ; l'eau qui frémit passe à sec et la casserole rougit ; une plaie qui s'infecte arrive à la fièvre terminale pendant que l'homme lève encore le bras pour parer. Rien ne commence par moi : je ne fais que refuser l'arrêt.","limite":"Une chose parfaitement stable n'offre rien à pousser, et je ne choisis jamais la direction — je ne fais qu'aller au bout de celle qui est déjà prise. Un adversaire que l'on vient de soigner en 反転術式 hanten-jutsushiki est en train de guérir : le pousser le guérit complètement, et il le sait avant moi.","inversion":"Je pousse le changement vers son autre extrémité : ce qui pourrissait retourne à l'état où il ne pourrissait pas encore, et le fer revient au poli de l'atelier, avec les marques du fabricant.","maximum":"Je me pousse moi-même. Un corps humain ne change jamais que dans un seul sens ; le mien arrive au bout de ce sens-là en quelques secondes. Ce qui reste est fini, définitif, et n'a plus besoin de rien : c'est la seule forme de ma loi qui ne s'use pas.","archetype":"métamorphose"}]},"serments":{"serments":[{"id":"paupiere-cousue","nom":"Le Serment de la Paupière Cousue","clause":"Je renonce à voir ce qu'il me reste à entamer. Je le saurai fini quand mes mains ne rencontreront plus de résistance.","restriction":"La jauge et le nombre de points de vie de l'adversaire disparaissent de l'écran. Le bloc n'est pas masqué, il est retiré : il ne revient à aucun duel suivant.","gain":"Tes techniques frappent 45 % plus fort.","restriction_code":"masqueVieEnnemi=true ; suppression du nœud DOM de la jauge adverse, remplacé par des blocs U+2588 aux mêmes métriques ; état écrit en sauvegarde, réappliqué avant le premier paint","gain_code":"degatsMult ×1.45 sur toutes les techniques","danger":2},{"id":"gantelet-depose","nom":"Le Serment du Gantelet Déposé","clause":"Je n'oppose plus rien. Ce qui vient jusqu'à moi entrera entier, dans l'ordre où il a été lancé.","restriction":"Les actions Garde et Esquive te sont retirées. Leurs deux emplacements restent dans l'anneau, barrés, pour que tu les vises par réflexe pendant encore trois tours.","gain":"+2 énergie maudite au début de chaque tour.","restriction_code":"interdit=['garde','esquive'] ; boutons conservés à l'écran, rayés d'un trait 1 px, non cliquables (aria-disabled)","gain_code":"energieBonus +2 par tour","danger":3},{"id":"seuil-scelle","nom":"Le Serment du Seuil Scellé","clause":"Je ne repasserai pas la porte par laquelle je suis entré. On me sortira d'ici porté, ou on ne me sortira pas.","restriction":"Fuir devient impossible, dans ce duel et dans tous les suivants, y compris contre un fléau surclassé.","gain":"Tu encaisses 20 % de dégâts en moins et tu gagnes 10 % de points de vie maximum.","restriction_code":"interdit=['fuite'] ; l'action est retirée de l'anneau et l'abandon de duel est refusé","gain_code":"degatsRecusMult ×0.80 ; pvMaxMult ×1.10","danger":2},{"id":"tiers-rendu","nom":"Le Serment du Tiers Rendu","clause":"Je rends la part de moi qui ne servait qu'à durer. Je n'avais pas l'intention de durer.","restriction":"Tu perds 45 % de tes points de vie maximum, pour le reste de cette vie. Aucune greffe, aucun soin, aucune victoire ne les rend.","gain":"Tous tes dégâts sont multipliés par 2,1.","restriction_code":"pvMaxMult ×0.55 permanent (persisté) ; PV courants recalculés au prorata immédiatement","gain_code":"degatsMult ×2.10","danger":5},{"id":"plaie-tenue","nom":"Le Serment de la Plaie Tenue Ouverte","clause":"Rien de ce qui s'ouvre en moi ne se refermera avant la fin de la phrase. J'ai besoin qu'on voie par où ça passe.","restriction":"La technique inversée t'est retirée. Plus aucun soin, ni pendant le duel, ni entre deux dossiers.","gain":"+3 énergie au premier tour et +30 % sur les dégâts de tes coups critiques.","restriction_code":"interdit=['inverse'] ; soinMult=0 ; aucune régénération inter-duel","gain_code":"energieDepart +3 ; critMult ×1.30","danger":4},{"id":"cire-versee","nom":"Le Serment de la Cire Versée","clause":"Je ne veux plus entendre ce qui se déplace derrière moi pendant que je frappe devant.","restriction":"Le son est coupé, définitivement, et tu ne pourras pas le rallumer. Le métronome sourd qui calait les battements part avec le reste : tu perds la seule chose qui t'annonçait le tour adverse.","gain":"+18 points de chance de coup critique.","restriction_code":"coupeSon=true irréversible (persisté) ; le réglage audio est retiré du menu ; le repère sonore de fin de battement n'est plus émis","gain_code":"critBonus +0.18","danger":2},{"id":"marge-vierge","nom":"Le Serment de la Marge Vierge","clause":"Je ne demanderai pas le détail. Ce qui m'a été fait m'a été fait dans les règles, et les règles ne se relisent pas.","restriction":"Le journal de combat est vidé et ne se remplit plus : tu ne sauras plus quelle technique t'a touché, ni ce qu'elle a prélevé.","gain":"+1 énergie par tour et +20 % de dégâts.","restriction_code":"masqueJournal=true ; les lignes d'événement ne sont plus poussées dans le registre visible (les événements restent au moteur)","gain_code":"energieBonus +1 ; degatsMult ×1.20","danger":3},{"id":"sablier-retourne","nom":"Le Serment du Sablier Retourné","clause":"J'aurai fini avant le huitième battement. Au neuvième, je m'écroulerai sans qu'on ait à me pousser.","restriction":"Si un duel atteint le neuvième tour, tu meurs sur place, quelle que soit ta structure restante et quel que soit l'état de l'adversaire.","gain":"×1,55 sur tes dégâts et +2 énergie par tour.","restriction_code":"limiteTours=8 ; à l'ouverture du tour 9, PV joueur := 0, cause de mort 'échéance' inscrite à l'ossuaire","gain_code":"degatsMult ×1.55 ; energieBonus +2","danger":5},{"id":"puits-sec","nom":"Le Serment du Puits Sec","clause":"Je ne puiserai qu'au fond. Le fond a l'avantage d'être propre, et de se voir venir.","restriction":"Ta réserve maximale d'énergie maudite perd 3 points. Ton domaine devient presque impayable.","gain":"Chaque technique coûte 1 énergie de moins, sans jamais descendre sous 1.","restriction_code":"enMaxBonus −3 ; réserve courante écrêtée au nouveau maximum immédiatement","gain_code":"remise +1 sur le coût de toute action (plancher 1)","danger":3},{"id":"mains-nues","nom":"Le Serment des Mains Nues","clause":"Ma loi restera pliée dans son étui. J'ai deux mains, et personne au Bureau ne les a jamais comptées.","restriction":"Ta technique innée t'est interdite tant que tes murs ne sont pas ouverts. Tu descends les quatre premiers battements sans elle.","gain":"Tes frappes renforcées ne coûtent rien et frappent trois fois plus fort.","restriction_code":"interdit=['technique'] hors état domaineActif ; la levée est vérifiée à chaque déclaration","gain_code":"frappeMult ×3.0 ; coût de la frappe renforcée := 0","danger":4},{"id":"trace-effacee","nom":"Le Serment de la Trace Effacée","clause":"Si je tombe, qu'il ne reste ni le nom, ni le grade, ni l'heure. Le Bureau n'aura rien à classer et personne n'aura à se souvenir de la manière.","restriction":"À ta prochaine mort, l'ossuaire est détruit pour de bon : graines, lois exorcisées, greffes, durées écoulées. Il n'y aura pas de deuxième visite, et rien ne t'attendra pour te dire depuis combien de temps tu as cessé.","gain":"×1,6 sur tes dégâts et +30 % de points de vie maximum.","restriction_code":"effaceToutALaMort=true ; à l'événement mort : localStorage.removeItem sur toutes les clés du registre, dans un try/catch, avant l'écran de fin","gain_code":"degatsMult ×1.60 ; pvMaxMult ×1.30","danger":5},{"id":"formule-unique","nom":"Le Serment de la Formule Unique","clause":"Je ne referai jamais deux fois le même geste. Ce qui se répète s'apprend, et ce qui s'apprend finit par m'être rendu.","restriction":"Tu ne peux pas déclarer deux tours de suite la même action. L'emplacement se verrouille dès qu'il a servi, y compris quand c'est le seul que tu peux payer.","gain":"+35 % de dégâts et +10 points de critique.","restriction_code":"pasDeRepetition=true ; l'action égale à derniereAction est refusée à la déclaration et grisée dans l'anneau","gain_code":"degatsMult ×1.35 ; critBonus +0.10","danger":4},{"id":"territoire-unique","nom":"Le Serment du Lieu Ouvert Une Fois","clause":"J'ouvrirai mes murs une fois par corps. Un lieu qu'on rouvre n'est plus un lieu : c'est un couloir, et un couloir se traverse.","restriction":"Une seule extension du territoire par duel, et jamais deux duels de suite. Le second duel, tu le fais à découvert.","gain":"Ton domaine tient 2 battements de plus et son sûr-au-but compte double à chaque battement.","restriction_code":"domaineUnique=true ; verrou reporté au duel suivant (flag persisté entre duels)","gain_code":"domaineTours +2 ; domaineMult ×2.0 sur le sûr-au-but par battement","danger":3},{"id":"dette-rendue","nom":"Le Serment de la Dette Rendue","clause":"Je tiens le compte exact de ce qu'on me prend, et je le rends au taux dont personne ne m'a demandé s'il me convenait.","restriction":"Tu subis 45 % de dégâts en plus. Un enchaînement de trois coups adverses te tue à partir de la moitié de ta structure.","gain":"Chaque coup encaissé ajoute +30 % cumulatifs à ta prochaine attaque.","restriction_code":"degatsRecusMult ×1.45","gain_code":"rancune +0.30 : rancuneCourante += 0.30 à chaque coup subi, appliquée en multiplicateur à la prochaine attaque puis remise à 0","danger":4},{"id":"nom-saisi","nom":"Le Serment du Nom Saisi","clause":"Je n'appliquerai rien que je ne puisse écrire sans faute, à la main, pendant qu'on me frappe.","restriction":"Avant chaque technique, tu dois retaper au clavier le nom exact de ta loi, kanji exclus, en moins de quatre secondes. Une faute, une lettre en trop, un retard : le tour est perdu et l'énergie est prélevée quand même.","gain":"+40 % de dégâts de technique et +1 énergie par tour.","restriction_code":"saisieNomRequise=true : modale de saisie 4000 ms avant toute action de type technique ; comparaison stricte après normalizeSeed ; échec → action := 'passe', coût prélevé","gain_code":"degatsTechniqueMult ×1.40 ; energieBonus +1","danger":4},{"id":"tour-blanc","nom":"Le Serment du Tour Blanc","clause":"Le premier battement ne m'appartient pas. Je le laisse à celui qui a eu la politesse de se déplacer.","restriction":"Au premier tour de chaque duel, ton anneau reste fermé : tu ne déclares rien, tu encaisses, et tu regardes.","gain":"À partir du deuxième tour, +50 % de dégâts jusqu'à la fin du duel.","restriction_code":"tour===1 : toutes les actions verrouillées, action forcée 'attendre', aucune garde possible ; dégâts subis au taux normal","gain_code":"degatsMult ×1.50 appliqué à partir du tour 2","danger":3},{"id":"fenetre-etroite","nom":"Le Serment de la Fenêtre Étroite","clause":"Je réduis à un battement de cil l'instant où j'ai raison. En échange, j'aurai raison deux fois dans la même descente.","restriction":"La fenêtre du coup noir passe de 180 ms à 70 ms. Presque tous tes essais tomberont à côté, et un essai raté te coûte ta garde du tour.","gain":"Deux coups noirs autorisés par duel au lieu d'un, et +25 % sur leurs dégâts.","restriction_code":"fenetreCoupNoir=70 ms ; échec de fenêtre → gardeIndisponible pour le tour en cours","gain_code":"coupsNoirsParDuel=2 ; degatsCoupNoirMult ×1.25","danger":3},{"id":"reserve-aveugle","nom":"Le Serment de la Réserve Aveugle","clause":"Je cesse de compter ce qu'il me reste. Compter, c'est déjà choisir le battement où l'on s'arrêtera.","restriction":"Ta propre réserve d'énergie n'est plus chiffrée ni graduée : des blocs pleins, rien d'autre. Tu déclareras des techniques que tu ne peux pas payer, et elles échoueront en te prenant le tour.","gain":"+4 de réserve maximale et +1 énergie par tour.","restriction_code":"masqueEnergieJoueur=true : valeur numérique et graduation retirées du DOM ; les actions trop chères restent cliquables, échouent à la résolution et consomment le tour","gain_code":"enMaxBonus +4 ; energieBonus +1","danger":4},{"id":"usure-inscrite","nom":"Le Serment de l'Usure Inscrite","clause":"Chaque battement me retire deux lignes, et je signe pour que ces lignes ne soient jamais réécrites.","restriction":"À la fin de chaque tour, ton maximum de points de vie perd 2 points, définitivement, dans ce duel et dans tous ceux qui suivront. Un duel de seize tours te coûte trente-deux points que rien ne rendra.","gain":"+6 % de dégâts cumulatifs par tour écoulé, sans plafond jusqu'à la fin du duel.","restriction_code":"fin de tour : pvMax −2 (persisté, plancher 1) ; PV courants écrêtés au nouveau maximum","gain_code":"degatsMult ×(1 + 0.06 × toursEcoules), réinitialisé au duel suivant","danger":5},{"id":"dossier-ouvert","nom":"Le Serment du Dossier Ouvert","clause":"Je laisse lire mes annotations. Qu'on sache où je me suis trompé, puisque je saurai enfin où il se trompe.","restriction":"Tes deux failles sont affichées à l'adversaire dès le premier battement : il frappe 25 % plus fort et vise en priorité ta condition d'énonciation, qu'il coupera dès qu'il en aura les moyens.","gain":"Les quatre cases d'hypothèse sont cochées d'office : la faille rituelle et la faille arithmétique de l'adversaire s'affichent au tour 1, sans coûter un seul battement d'avance.","restriction_code":"degatsRecusMult ×1.25 ; IA adverse : priorité absolue aux actions ciblant la condition d'énonciation du joueur","gain_code":"casesHypothese := 4 résolues gratuitement ; failles adverses (rituelle + arithmétique) révélées au tour 1 ; aucun battement d'avance cédé au fléau","danger":4}]},"domaines":{"domaines":[{"id":"hyotenbo","nom_fr":"Le Relevé au Point de Congélation","nom_jp":"氷点簿","romaji":"Hyōtenbo","paysage":"Une chaufferie municipale éteinte depuis l'hiver, les tuyaux blanchis de givre jusqu'aux brides, les vannes prises. Devant chaque occupant, un thermomètre à alcool planté dans l'air, sans support, qui descend à la vitesse d'une signature.","effet_garanti":"Toute chaleur que vous avez cédée depuis votre naissance est portée au registre, additionnée, et retranchée de ce que votre corps a désormais le droit de tenir. Ce n'est pas une blessure : c'est une écriture, et rien n'efface une écriture.","effet_code":"À l'ouverture, mesure la structure maximale M de chaque occupant, imprime relevé = plancher(M × 0,45) et pose structure_max := relevé, conservé dans la sauvegarde après la fermeture. Ensuite −4 structure par battement. Entretien 11 RÉSERVE / battement.","incantation":"Relevé du jour, établi sans témoin.\nPortez au débit la chaleur donnée aux mains, aux draps, à l'air.\nLe solde figure en tête de page.\nLe solde ne se conteste pas.","faille":"Le registre n'inscrit que la chaleur cédée à l'air. Une paume à plat sur la fonte froide et c'est la fonte qui figure au relevé : on ressort avec les doigts détruits et la ligne inchangée."},{"id":"juden","nom_fr":"Le Palais des Charges Non Déclarées","nom_jp":"重殿","romaji":"Jūden","paysage":"Une consigne de gare aux casiers tous ouverts, valises éventrées, courroies pendantes. Au centre, une balance à fléau assez grande pour un homme, dont le plateau vide est déjà au plus bas.","effet_garanti":"Ici, chaque chose pèse ce qu'elle a pesé de plus lourd un jour : le bras, la tête, la faute. Nul ne se déclare plus léger que son maximum, et le maximum n'oublie pas.","effet_code":"Chaque occupant passe à une action par battement au lieu de deux ; esquive fixée à 0 tant que le poids déclaré est supérieur à zéro. Le poids monte de 1 par battement, plafond 6 ; à 6, l'occupant reste au sol un battement sur deux. Entretien 9 RÉSERVE / battement.","incantation":"Déclarez vos charges. Vous ne l'avez jamais fait.\nLa balance retient le plus lourd de vos jours et l'appelle votre poids.\nAvancez maintenant, si vous savez encore où sont vos genoux.","faille":"Le fléau pèse un corps entier ou rien. Entrer en deux masses tenues par un serment — un membre laissé dehors, une main sectionnée sur le seuil — ne présente que des moitiés, et la loi n'a pas de ligne pour la moitié d'un homme."},{"id":"seikan","nom_fr":"L'Anneau de l'Élan Confisqué","nom_jp":"勢環","romaji":"Seikan","paysage":"Un dépôt de tramways à trois heures du matin : six motrices sans conducteur tournent sur une boucle unique, toujours à la même vitesse, et le rail est poli jusqu'au miroir sur toute sa longueur.","effet_garanti":"Aucun mouvement ne peut être plus vif que celui qui l'a précédé. L'élan acquis est retenu au seuil et n'est rendu à personne, pas même à celui qui l'a produit.","effet_code":"Les dégâts et la vitesse de chaque action sont plafonnés à la valeur de l'action précédente −1, plancher 1. Chaque cran refusé verse +2 RÉSERVE au porteur du domaine. Entretien 8 RÉSERVE / battement.","incantation":"Ce qui prend de la vitesse ici la laisse au premier tour.\nL'anneau garde l'élan, l'anneau ne rend rien.\nFrappez : votre coup d'avant est déjà votre plafond.","faille":"Le plafond se calcule sur l'action précédente. Un coup porté à vide, dans l'air, ne vaut rien : la loi ne sait pas retrancher un cran à rien, et le compteur repart entier au battement suivant."},{"id":"onkoku","nom_fr":"La Geôle de Ce Qui a Déjà Été Dit","nom_jp":"音獄","romaji":"Onkoku","paysage":"Un standard téléphonique désaffecté, quarante cabines capitonnées ouvertes sur la même travée. Dans chaque combiné décroché, votre voix, avec deux secondes de retard, disant ce que vous n'avez pas encore dit.","effet_garanti":"Tout son émis ici demeure et se rejoue à chaque battement, en couches, sans s'atténuer. On ne finit jamais de payer ce qu'on a fait entendre.","effet_code":"Chaque action bruyante inscrit une trace, plafond 12. À chaque battement, tous les occupants subissent 2 × nombre de traces ; le porteur n'en subit que la moitié, arrondie au supérieur. Entretien 10 RÉSERVE / battement.","incantation":"Vous avez parlé, c'est consigné.\nLa phrase revient à l'heure, puis à l'heure d'après, en couches.\nÉcoutez-vous jusqu'à ce que cela cesse.\nCela ne cesse pas.","faille":"Le silence n'ajoute rien, mais les couches déjà écrites tuent quand même. La sortie tient à l'opposition de phase : parler exactement sur le rejeu, syllabe contre syllabe, efface une couche par battement."},{"id":"eitei","nom_fr":"Le Jardin où les Ombres Restent à leur Place","nom_jp":"影庭","romaji":"Eitei","paysage":"Une cour d'école à midi, sans enfants. Les ombres sont peintes au sol à l'endroit exact de la récréation d'hier, et le soleil, arrêté, ne les déplacera plus.","effet_garanti":"Aucune ombre ne suit son corps. Tout écart entre l'homme et l'ombre qu'il a portée s'inscrit dans les tendons, au pas près.","effet_code":"Déplacement et esquive supprimés (probabilité 0). Chaque tentative de déplacement inflige 5 + 2 par pas d'écart, cumulatif jusqu'à la fin du duel. Entretien 7 RÉSERVE / battement.","incantation":"Le soleil est arrêté, la cour est peinte.\nVotre ombre est restée où elle a joué hier.\nÉloignez-vous d'elle : ce sont vos tendons qui mesurent.","faille":"Une ombre exige une surface pour tomber. Se tenir sur une grille, un caillebotis, une arête de rail — là où l'ombre se rompt en morceaux — ne laisse plus rien à mesurer à la loi."},{"id":"ketsuden","nom_fr":"Le Salon des Transfusions Réciproques","nom_jp":"血殿","romaji":"Ketsuden","paysage":"Une salle de don du sang aux fauteuils inclinés, poches suspendues, aucune étiquette sur aucune poche. Les tubes ne descendent pas : ils remontent, doucement, vers les bras.","effet_garanti":"Le sang sorti retourne à la main qui l'a fait sortir. Chaque plaie ouverte ici alimente celui qui l'a ouverte, la vôtre comprise.","effet_code":"Chaque saignement actif draine 6 structure / battement à son porteur et en rend 4 à l'auteur de la blessure. Les blessures infligées par le porteur du domaine comptent double dans les deux sens. Entretien 12 RÉSERVE / battement.","incantation":"Le sang qui sort d'ici retourne à la main qui l'a ouvert.\nOuvrez donc. Ouvrez encore.\nVous alimentez ce qui vous vide.","faille":"La loi ne connaît que le sang sorti. Cautériser à chaud, ou frapper à l'os sans jamais rompre la peau, laisse le circuit vide : le domaine se paie alors tout seul, sur sa propre réserve."},{"id":"shokubo","nom_fr":"Le Registre de l'Usure Anticipée","nom_jp":"蝕簿","romaji":"Shokubo","paysage":"Un atelier d'horloger dont les tiroirs sont classés par degré d'usure. Sur le drap vert, des pièces de cuivre se creusent pendant qu'on les regarde, et la limaille tombe sans bruit.","effet_garanti":"Tout ce qui sert ici s'use maintenant plutôt que plus tard. Une lame, une articulation, une résolution : la loi avance leur fin et l'inscrit à sa date.","effet_code":"Chaque objet, technique et articulation employée perd 1 rang d'usure par battement ; au cinquième rang, hors service, définitif dans la sauvegarde. CONTRÔLE −0,5 par battement. Entretien 9 RÉSERVE / battement.","incantation":"Rien n'attend son usure.\nCe qui sert s'use maintenant, à la vue de tous.\nComptez les rangs : cinq, et l'outil cesse d'être un outil.\nVotre poignet est un outil.","faille":"L'usure se compte sur un geste mené à son terme. Un mouvement haché, arrêté puis repris avant l'appui final, n'accumule jamais un rang complet : on se bat mal, on se bat court, on ressort avec ses mains."},{"id":"kyokan","nom_fr":"L'Anneau du Retour Obligé","nom_jp":"距環","romaji":"Kyokan","paysage":"Une piste de cendrée sous une neige fine, une seule ligne blanche tracée en travers. C'est le départ et c'est l'arrivée, et rien sur la piste ne permet de les distinguer.","effet_garanti":"Toute distance parcourue est refaite en sens inverse à la fin du battement. On revient au point d'entrée avec la fatigue du trajet et rien d'autre.","effet_code":"En fin de battement, chaque occupant est replacé sur sa case d'entrée. FATIGUE +1 par tranche de trois pas effectués ; à 8 FATIGUE, une action sur deux échoue. Entretien 8 RÉSERVE / battement.","incantation":"La ligne blanche est le départ, la ligne blanche est l'arrivée.\nCourez : on vous rendra à votre place, la fatigue en supplément.\nIl n'y a pas d'ailleurs à gagner ici.","faille":"Le retour se calcule sur des distances distinctes. Deux occupants qui échangent leurs positions ont parcouru la même longueur en sens contraire : ex æquo, la loi ne sait plus qui rendre où et les laisse tous deux où ils sont."},{"id":"shokucho","nom_fr":"Le Registre du Dernier Contact","nom_jp":"触帳","romaji":"Shokuchō","paysage":"Le vestiaire d'un bain public à la fermeture. Sur chaque casier, l'empreinte grasse d'une main qui n'est plus là ; la buée reste collée au métal et refuse de tomber.","effet_garanti":"Tout ce que vous avez touché depuis l'aube se tient ici et vous touche en retour, en remontant l'ordre, du plus récent au premier.","effet_code":"Compte les contacts du jour, plafond 20. Dégâts par battement = contacts ÷ 2, arrondi au supérieur. +1 contact chaque fois qu'un occupant touche quoi que ce soit dans le domaine, le sol compris. Entretien 10 RÉSERVE / battement.","incantation":"Depuis l'aube, tout ce que vos mains ont pris est venu.\nLes poignées, les manches, la nuque de quelqu'un.\nElles vous touchent à leur tour, en remontant.","faille":"Un contact qu'on ne quitte pas n'est jamais un dernier contact. Rester agrippé au même barreau, sans jamais lâcher, gèle le registre à sa valeur d'entrée : il faut seulement se battre d'une seule main."},{"id":"jocho","nom_fr":"Le Rideau des Rangs d'Arrivée","nom_jp":"序帳","romaji":"Jochō","paysage":"Un bureau de tri postal la nuit : le tapis avance, chaque colis reçoit son numéro d'ordre au tampon. L'un des colis porte votre numéro et il est déjà passé sous la presse.","effet_garanti":"L'ordre d'arrivée est fixé au seuil et ne change plus. Le dernier n'agit qu'un battement sur deux, et seule une mort fait remonter la file.","effet_code":"Initiative verrouillée sur l'ordre d'entrée : le rang n ne peut agir qu'après tous les rangs inférieurs. Dernier rang : une action tous les deux battements et −25 % de dégâts. Chaque mort libère un rang, tous remontent d'un cran. Entretien 6 RÉSERVE / battement.","incantation":"Le tapis avance, les numéros sont tamponnés.\nVous êtes classé, et le classement ne se discute plus.\nLe dernier attend son tour ; le dernier attend deux tours.\nSeul un mort libère un rang.","faille":"Le registre ne classe que les vivants. Un battement complet sans action, sans souffle, cœur ralenti sous serment, vous retire de la file : on y revient au dernier rang, mais on y revient après avoir vu jouer tout le monde."},{"id":"saigoku","nom_fr":"La Geôle des Échéances","nom_jp":"債獄","romaji":"Saigoku","paysage":"Une salle des scellés, enveloppes kraft alignées par date d'ouverture, ficelées, cachetées. Chacune est gonflée par quelque chose qui n'a pas encore eu lieu et qui bouge un peu.","effet_garanti":"Rien ne se produit à l'instant où on le fait. Coup, soin, rupture : tout est mis sous enveloppe et arrive au huitième battement, intérêts compris.","effet_code":"Tous les dégâts et soins sont différés en dépôt et s'appliquent au battement 8 à 150 %. Jusque-là, structure figée. Si le domaine se referme avant l'échéance, le dépôt s'applique quand même, à 200 %, à celui qui l'a produit.","incantation":"Rien n'a lieu à l'instant où vous le faites.\nTout part sous enveloppe, datée du huitième battement.\nFrappez, soignez, rompez : on ouvrira tout ensemble.","faille":"L'échéance est datée, donc prévisible. Tenir jusqu'au septième battement sans rien déposer — ne frapper personne, ne se soigner de rien — laisse une seule enveloppe vide quand toutes s'ouvrent : la sienne."},{"id":"keiden","nom_fr":"Le Palais des Filiations Reconnues","nom_jp":"系殿","romaji":"Keiden","paysage":"Une salle de généalogie sous verrière, registres paroissiaux ouverts à la même page, tous. Sur chaque page, la même écriture, qui n'appartient à personne de vivant.","effet_garanti":"Nulle blessure ne reste sur un seul corps : elle remonte la lignée jusqu'à trouver un vivant, et à défaut redescend sur celui qui ressemble le plus au blessé.","effet_code":"40 % de tout dégât reçu est transféré au parent le plus proche présent ; à défaut au porteur du domaine, qui en garde 20 % et en renvoie 20 % à l'attaquant. Le transfert ignore les résistances et les serments défensifs. Entretien 11 RÉSERVE / battement.","incantation":"Aucune blessure ne reste sur un seul corps.\nElle remonte la ligne jusqu'au premier vivant qui vous ressemble.\nNommez celui qui paiera : vous l'avez nommé en naissant.","faille":"La remontée exige un lien reconnu. Un nom de famille renié par serment gravé, ou jamais déclaré, ne présente aucune marche à gravir : le dégât reste entier là où il est tombé, ce qui est rarement une bonne nouvelle, seulement une nouvelle exacte."},{"id":"tsutei","nom_fr":"Le Jardin des Douleurs Mises en Commun","nom_jp":"痛庭","romaji":"Tsūtei","paysage":"Un dispensaire de nuit, douze lits, une seule perfusion partagée par des tubes qui passent d'un bras à l'autre et se resserrent à mesure que le niveau descend.","effet_garanti":"Il n'y a plus qu'une douleur pour tout le monde. Elle ne diminue pas : elle se divise, et chaque corps qui tombe augmente la part de ceux qui restent debout.","effet_code":"Jauge unique partagée : tous les dégâts y sont versés. À chaque battement, la jauge se répartit à parts égales entre les occupants conscients, +3 par occupant tombé. Entretien 12 RÉSERVE / battement.","incantation":"Il n'y a qu'une douleur ici, et elle est à tout le monde.\nOn la divise par le nombre de ceux qui tiennent debout.\nChaque chute augmente la part des autres.","faille":"Le partage se fait entre conscients, et le porteur en est un. Perdre connaissance volontairement un battement retire une part au dénominateur : l'arithmétique se retourne, et c'est lui qui porte la somme entière."},{"id":"sokugoku","nom_fr":"La Geôle de l'Air Compté","nom_jp":"息獄","romaji":"Sokugoku","paysage":"Une salle de contrôle de mine, les cages arrêtées à mi-puits, les lampes alignées sur leur crochet. Sur un fil, trois cages à canaris dont les oiseaux respirent exactement en cadence avec vous.","effet_garanti":"Chacun entre avec un nombre de souffles fixé au seuil. Rien ici ne se fait sans en dépenser un, et le compte est affiché au-dessus des têtes.","effet_code":"14 souffles à l'entrée par occupant, 20 pour le porteur. Une action coûte 1, un déplacement 1, une technique 3. À 0 souffle : −8 structure par battement et CONTRÔLE divisé par deux. Entretien 9 RÉSERVE / battement.","incantation":"Vous êtes entrés avec quatorze souffles.\nChaque geste en prend un, chaque technique en prend trois.\nLe compte est affiché au-dessus de vos têtes.\nNe parlez pas pour rien.","faille":"L'air compté est l'air d'ici. Un souffle emprunté à autrui — bouche contre bouche, ou une poche scellée apportée du dehors — n'a pas de ligne au registre et ne décrémente rien."},{"id":"shocho","nom_fr":"Le Rideau des Cicatrices Rouvertes","nom_jp":"傷帳","romaji":"Shōchō","paysage":"Un cabinet de suture aux instruments encore tièdes, un bocal de fils retirés à d'autres, et sur le drap l'empreinte d'un corps qui vient à peine de se lever.","effet_garanti":"Aucune cicatrice n'est finie. Chacune redevient la plaie qu'elle a été, à la date exacte, dans l'ordre où on vous les a faites.","effet_code":"À l'ouverture, compte les cicatrices C de chaque occupant depuis la sauvegarde : perte immédiate de 3 × C structure, puis 1 × C par battement. Les soins d'énergie inversée sont plafonnés à 50 % tant que le domaine tient. Entretien 10 RÉSERVE / battement.","incantation":"Aucune cicatrice n'est finie.\nElles rouvrent dans l'ordre où on vous les a faites, à la date exacte.\nTenez la première : c'est la plus ancienne, elle saigne encore.","faille":"Une plaie ouverte n'est pas une cicatrice. Se rouvrir soi-même la plus ancienne avant le seuil la retire du compte, interrompt la série en tête, et tout le décompte glisse d'un cran vers le vide."},{"id":"kiro","nom_fr":"Le Réfectoire des Parts Non Servies","nom_jp":"飢廊","romaji":"Kirō","paysage":"Un réfectoire d'internat sans fenêtres, deux cents couverts mis au cordeau, cloches d'argent posées sur des assiettes propres. Sous chaque cloche, un bruit de mastication très régulier.","effet_garanti":"Ce qui n'est pas servi est prélevé sur celui qui a faim. Ici l'énergie maudite se consomme comme un repas, et le service ne commence jamais.","effet_code":"−9 RÉSERVE par battement pour chaque occupant, +6 RÉSERVE au porteur par occupant affamé. À RÉSERVE 0, toute technique se paie en structure au double du tarif. Entretien 8 RÉSERVE / battement.","incantation":"Le couvert est mis pour deux cents, personne ne sert.\nCe qui n'est pas mangé est prélevé sur celui qui a faim.\nLevez la cloche si vous voulez : vous entendrez mâcher.","faille":"La faim se mesure au manque réclamé. Trois battements sans appeler la moindre technique, sans rien demander à sa réserve, et l'on cesse d'être une part à servir : le service passe devant vous sans s'arrêter."},{"id":"minden","nom_fr":"Le Palais du Sommeil Dû","nom_jp":"眠殿","romaji":"Minden","paysage":"Un dortoir de caserne, lits faits au carré, couvertures rabattues à main d'homme, chaussures alignées sous les sommiers. La pendule murale n'a plus que l'aiguille des heures et elle avance.","effet_garanti":"Toute heure de sommeil que vous n'avez pas prise est réclamée ici, à l'heure, et le corps s'exécute sans consulter personne.","effet_code":"Dette D = heures d'éveil au-delà de 16, par tranche de 4. Tous les 3 battements, l'occupant perd un battement entier (aucune action, esquive 0) ; à D ≥ 6, deux battements. Le porteur est exempté tant qu'il paie l'entretien de 10 RÉSERVE / battement.","incantation":"L'heure est réclamée.\nToute nuit que vous n'avez pas dormie est due, et due maintenant.\nLe corps s'exécute sans vous demander.\nFermez les yeux ; vous les fermerez de toute façon.","faille":"La dette se solde par du sommeil, pas par de la résistance. Un micro-sommeil consenti à l'instant exact de la réclamation éteint la ligne pour un prix dérisoire : il faut seulement accepter de ne pas voir le coup qui arrive pendant ce temps."},{"id":"reikan","nom_fr":"L'Anneau des Âges Égalisés","nom_jp":"齢環","romaji":"Reikan","paysage":"Une salle de radiologie où tous les clichés punaisés montrent la même main, os pour os. En bas à droite de chaque film, des dates séparées par quarante ans.","effet_garanti":"Tous les occupants sont ramenés à l'âge moyen du domaine. L'écart, en années, est payé comptant, dans les os, sans échelonnement possible.","effet_code":"Calcule l'âge moyen A des occupants. Chaque occupant subit |âge − A| × 2 structure à l'ouverture, puis |âge − A| ÷ 2 par battement. Vitesse et régénération recalculées sur A. Entretien 9 RÉSERVE / battement.","incantation":"Nous prenons l'âge de chacun et nous faisons la moyenne.\nL'écart se paie en os, comptant, sans échelonnement.\nVous aurez tous le même âge avant le troisième battement.","faille":"La moyenne se fait sur les présents, et un cadavre récent compte encore. Faire entrer un troisième corps déplace A ; deux âges rendus identiques ne se doivent plus rien du tout."},{"id":"meibo","nom_fr":"Le Registre des Noms Entendus","nom_jp":"名簿","romaji":"Meibo","paysage":"Un bureau d'état civil, tiroirs de fiches cartonnées jusqu'au plafond, encriers bouchés. Une machine à dicter tourne à vide au bout de la table et prend note quand même.","effet_garanti":"Tout nom prononcé ici est inscrit, et l'inscrit n'a plus le droit d'être ailleurs que là où sa fiche le dit.","effet_code":"Un nom entendu inscrit son porteur : esquive 0, position publique, +30 % de dégâts subis. L'inscription tombe si le nom n'est pas répété pendant 4 battements. Le porteur peut inscrire un nom par battement. Entretien 7 RÉSERVE / battement.","incantation":"Un nom prononcé est un nom inscrit.\nL'inscrit n'a plus le droit d'être ailleurs que sur sa fiche.\nDites-le encore : la machine tourne à vide et prend note quand même.","faille":"Le registre n'accepte que le nom exact. Un surnom, une initiale, un patronyme d'emprunt gravé par serment avant le seuil, et la fiche part au rebut : plus rien ici ne sait où vous êtes."},{"id":"mukonden","nom_fr":"Le Sanctuaire Sans Personne Dedans","nom_jp":"無魂殿","romaji":"Mukonden","paysage":"Un colombarium neuf, niches ouvertes, plaques déjà gravées aux noms de gens vivants. L'une d'elles n'a pas de nom, seulement une date, et la date est celle d'aujourd'hui.","effet_garanti":"Le domaine ne blesse pas : il retranche. À chaque battement il retire à chaque occupant une chose qu'il pourrait nommer, et cette chose ne revient pas.","effet_code":"Chaque battement, perte définitive d'un élément de fiche (un serment, une greffe, une entrée d'ossuaire ou 1 point de CONTRÔLE), écrite dans la sauvegarde. Énergie inversée interdite aux deux camps pour tout le duel. Prépaiement irrécupérable de 40 RÉSERVE à l'ouverture, entretien 18 / battement.","incantation":"Nous ne blessons pas. Nous retranchons.\nDonnez le nom de ce que vous tenez : la niche est ouverte, la plaque est gravée.\nCe qui entre ici n'a pas de ligne de retour.","faille":"La loi ne prend que ce qui peut être nommé. Celui qui n'a jamais dit à voix haute ce à quoi il tient — pas une fois, à personne — présente une fiche vide : les niches restent ouvertes et le domaine se ruine à ne rien trouver."},{"id":"shigoku","nom_fr":"La Geôle Faite de Votre Propre Dossier","nom_jp":"紙獄","romaji":"Shigoku","paysage":"Quatre murs de pages collées bord à bord : c'est votre dossier, monté à l'échelle d'une pièce. Vos annotations rouges se lisent à l'envers, parfaitement, depuis l'intérieur.","effet_garanti":"Votre loi vous est appliquée, opérateur inversé, à chaque battement et sans condition d'énonciation : les murs ont vu, touché et porté l'inscription à votre place.","effet_code":"Copie la loi du joueur, remplace le verbe par son inverse, applique à quantité minimale chaque battement : dégâts = rang de coût × 3. Les serments du joueur deviennent opposables contre lui. Entretien 14 RÉSERVE / battement.","incantation":"Les murs sont votre dossier ; l'encre rouge est de vous.\nNous appliquons votre loi, verbe retourné, sans condition.\nLe papier a vu, le papier a touché, le papier a entendu.\nLisez-vous à l'envers.","faille":"Le papier récite la fiche telle qu'elle est écrite, corruptions comprises. Une greffe hors compatibilité y a imposé une condition involontaire que du papier ne peut pas exécuter : au battement où l'on refuse de l'accomplir à sa place, la ligne saute."},{"id":"jintei","nom_fr":"Le Jardin de la Poussière Rendue","nom_jp":"塵庭","romaji":"Jintei","paysage":"Un sous-sol d'archives, un rai de lumière oblique plein de particules parfaitement immobiles. Sur la table, une brosse d'orfèvre et un tas gris trié par provenance, avec des étiquettes.","effet_garanti":"Tout ce qui est tombé de vous — peau, cheveu, écaille d'ongle — est ici, et le domaine le remet en place sans savoir quelle place était la sienne.","effet_code":"Chaque battement, réintégration d'une unité : −4 structure et −1 CONTRÔLE cumulatif ; à partir du troisième battement, l'ordre des actions déclarées s'inverse une fois sur trois. Au sixième, toute action ratée frappe un allié. Entretien 10 RÉSERVE / battement.","incantation":"Tout ce qui est tombé de vous est resté.\nNous le remettons en place, sans savoir laquelle.\nTenez votre main : elle obéit avec un battement de retard.","faille":"Le tri se fait par provenance. Se couvrir de la poussière d'un autre — cendre, vêtements d'un mort, limaille d'atelier — brouille les étiquettes : la loi rend alors à chacun ce qui n'est pas à lui, c'est-à-dire rien qui tienne."}]},"bestiaire":{"fleaux":[{"id":"temoin","nom":"Le Témoin Rouge","grade":"4","origine":"La peur d'avoir laissé un appareil branché dans un appartement vide.","apparence":"Une diode rouge à hauteur de plinthe, au bout d'un cordon dont l'autre extrémité n'est reliée à rien. Le sol autour est tiède comme un fer qu'on vient de poser.","comportement":"Il s'éteint un battement sur trois : éteint, il ne peut ni frapper ni être touché. Il faut apprendre son cycle et ne porter ses coups que sur l'allumage.","pv":55,"attaque":7,"energie":1,"replique":"Tu es sorti quand même.","technique_signature":"Rémanence"},{"id":"accuse","nom":"Les Deux Traits","grade":"4","origine":"La peur d'un message lu et laissé sans réponse.","apparence":"Un adolescent au regard baissé, deux petites barres bleues incisées en travers du front, cicatrisées depuis longtemps. Ses mains sentent le plastique chaud.","comportement":"Il ne riposte jamais dans le battement : il retient ta dernière attaque et la restitue à l'identique deux battements plus tard. Placer un coup faible juste avant un coup fort trompe la restitution.","pv":62,"attaque":8,"energie":1,"replique":"J'ai vu. Je réponds plus tard.","technique_signature":"Accusé de réception"},{"id":"interphone","nom":"L'Interphone","grade":"4","origine":"La peur de la voix qui répond quand on n'a sonné chez personne.","apparence":"Une bouche en grille de haut-parleur encastrée dans le mur d'une cage d'escalier, à hauteur d'homme. Il n'y a rien derrière ce mur : on l'a ouvert pour vérifier.","comportement":"Il annonce l'étage avant de frapper, toujours un battement à l'avance. Le frapper pendant l'annonce coupe le message et annule la frappe.","pv":48,"attaque":10,"energie":2,"replique":"Troisième. C'est ouvert, montez.","technique_signature":"Ouverture"},{"id":"bonde","nom":"La Bonde","grade":"4","origine":"La peur de l'eau qui remonte au lieu de descendre.","apparence":"Un poing de cheveux mouillés, serré, gros comme un torse, qui laisse partout où il s'arrête une flaque exactement à la température du corps.","comportement":"Chaque coup encaissé le gorge : il gagne deux points d'attaque et ne les rend jamais. Deux battements sans le toucher et il sèche, perdant la moitié de sa masse.","pv":78,"attaque":6,"energie":2,"replique":"Tout ce que tu as perdu est resté là.","technique_signature":"Engorgement"},{"id":"audessus","nom":"Celui d'Au-Dessus","grade":"4","origine":"La peur des pas du voisin qui s'arrêtent juste au-dessus de la chambre.","apparence":"Un plafond bas qui suit la pièce, portant une empreinte de talon fraîche, en creux, qui se déplace à contresens de la marche.","comportement":"Il frappe l'endroit où tu seras, jamais celui où tu es : avancer te met dessous, rester immobile le fait manquer. Il ne peut pas frapper deux battements de suite au même aplomb.","pv":85,"attaque":12,"energie":2,"replique":"Il s'est arrêté juste au-dessus de toi.","technique_signature":"Aplomb"},{"id":"pli","nom":"Le Pli Non Ouvert","grade":"3","origine":"La peur des résultats d'analyse qu'on garde deux jours sans décacheter.","apparence":"Une silhouette d'homme en papier kraft cacheté, sans visage, la poitrine barrée d'une bande de fermeture intacte. Elle sent la colle et le froid des halls.","comportement":"Tant qu'il est scellé, il n'encaisse qu'un point par coup. Le déchirer le rend vulnérable pour tout le reste du duel, mais libère aussitôt sa frappe entière, une fois, sans parade possible.","pv":130,"attaque":15,"energie":3,"replique":"Vous préférez savoir plus tard.","technique_signature":"Résultat"},{"id":"kilometres","nom":"Les Vingt Kilomètres","grade":"3","origine":"La peur d'arriver chez soi sans se rappeler la route.","apparence":"Un conducteur assis dans le vide, mains à dix heures dix,
