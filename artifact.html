:"Depuis le 2 janvier, la vidéosurveillance enregistre un monospace stationné au même emplacement, portes ouvertes, coffre chargé. Le véhicule n'apparaît sur aucune image prise depuis un autre angle.","consigne":"Approchez par l'arrière. Ne comptez pas les sièges."},{"lieu":"Collège Jean-Moulin, sous-sol, ancien local de reprographie, Bruay-la-Buissière","signalement":"L'établissement signale un fonctionnement de photocopieuse en dehors des heures d'ouverture. Les feuilles retrouvées portent une liste d'élèves inscrits entre 1982 et 1987, suivie d'une colonne de dates non expliquée.","consigne":"Emportez la liste. Ne cherchez pas votre nom dessus."},{"lieu":"Chambre froide d'une boucherie en liquidation, rue Gambetta, Tergnier, Aisne","signalement":"Le mandataire judiciaire signale que la chambre froide se maintient à moins quatre degrés sans raccordement électrique depuis dix-huit mois. Le givre reproduit une écriture manuscrite lisible sur toute la paroi du fond.","consigne":"Photographiez d'abord, exorcisez ensuite. Le Bureau souhaite conserver la graphie."},{"lieu":"Foyer rural, salle du fond, Sainte-Croix-Volvestre, Ariège","signalement":"Séance du conseil municipal du 12 juin : onze personnes présentes, onze émargements attendus. Le registre en comporte douze. Aucun des onze ne reconnaît la douzième signature, quatre disent l'avoir déjà vue quelque part.","consigne":"Faites signer le registre à nouveau, devant vous, dans le même ordre. C'est ainsi qu'on le fait sortir."}],"verdicts_conseil":["Grade 4. Le Haut Conseil relève que vous n'avez encore rien coûté à personne.","Grade 3. Vous serez affecté aux secteurs où l'on n'envoie pas de témoins.","Grade 2. Votre technique a été jugée applicable. Le mot utile n'a pas été retenu.","Grade 1. Le Conseil vous accorde une autonomie de décision. Il ne vous accorde aucun recours.","Grade spécial. Le vote s'est tenu à huis clos. Le procès-verbal ne sera communiqué à personne, vous compris.","Le grade n'est pas une reconnaissance. C'est le volume de dégâts que l'institution accepte d'assumer en votre nom.","Le Conseil constate une divergence entre votre dossier et votre corps. Il tranche en faveur du dossier.","Vous êtes enregistré sous une référence et non sous un nom. Retenez la référence.","Délibération : onze minutes. Neuf ont porté sur la question de savoir qui vous récupérerait.","Décision rendue. Elle est susceptible de révision à votre décès, et pas avant."],"murmures":["Quelqu'un est dans le couloir.","Ne comptez pas les marches.","Elle attend depuis 1998.","La porte était fermée de l'intérieur.","Le froid vient du plafond.","Quelqu'un a signé pour vous.","Ça respire quand vous respirez.","Le formulaire est déjà rempli.","On a retrouvé les clés.","Personne n'a appelé les pompiers.","Tu n'as pas éteint la lumière.","Le compteur tourne encore.","Deuxième étage, chambre vingt-quatre.","Il manque une chaise.","Ils ont tous dit oui.","Ne réponds pas au téléphone.","La trace avance vers l'échelle.","Ça sentait le chlore avant.","Reste jusqu'à quatre heures dix.","On a rangé ses affaires.","Le givre écrit encore.","Quatorze voitures, personne dedans."],"exorcisme":["Né le 3 novembre 1998, vers 17 h 40 : la peur qu'une lettre soit arrivée et que personne ne l'ait ouverte.","Né le 14 mars, à 19 h 12 : la peur de ne pas retrouver sa voiture et de devoir le dire à voix haute.","Né le 12 juin, à 21 h 05 : la peur d'être le douzième dans une salle qui n'en compte que onze.","Né un dimanche de février, vers 6 h 30 : la peur d'entendre ses propres pas revenir dans un tunnel de trente-deux mètres.","Né le 2 janvier, à 11 h 20 : la peur qu'une famille reparte sans qu'on ait dit au revoir correctement.","Né le 9 septembre 1987, à 8 h 15 : la peur qu'un nom soit lu à l'appel et que personne ne réponde.","Né en août 2003, autour de 15 h : la peur qu'une chambre reste fermée trois jours.","Né un mardi, à 4 h 10 : la peur de composer un numéro qui ne sonne plus depuis 1996.","Né le 17 janvier, vers 22 h 45 : la peur d'être le dernier à quitter le bâtiment et d'avoir mal fermé.","Ce n'était que cela. Il a fallu quatre agents et un Voile. C'est ainsi presque à chaque fois.","Le fléau ne se défend pas. Il se souvient. Puis il n'y a plus rien à se souvenir."],"inverse":["Vous retournez le signe. La même énergie, prise à l'envers : elle recoud au lieu d'ouvrir.","La plaie se referme par les bords, comme un papier mouillé qui sèche. Comptez quatre secondes, pas davantage.","La température monte au-dessus de trente-huit degrés. C'est normal. La chair travaille.","L'os reprend sa place avec un bruit sourd. Vous ne l'entendrez pas, vous le sentirez dans la mâchoire.","Le sang cesse. La peur qui l'a fait couler, non : le flux inverse ne descend pas jusque-là.","Vous êtes réparé. Vous n'êtes pas soulagé. Le Bureau distingue les deux dans ses tableaux.","Recommencez. Deux fois, pas trois : au-delà, on répare ce qui n'a pas été blessé.","Vous vous relevez avec le même dossier, le même nom, et la même chose derrière les yeux."]},"jubaku":{"restrictions":[{"id":"cecite-monde-visible","nom":"Cécité au monde visible","kanji":"陽盲","romaji":"yōmō","privation":"Ses yeux ne rendent rien de ce qui n'est pas chargé : le mobilier, le pain, les visages, sa propre main n'existent pour lui qu'au toucher. Il n'a jamais vu une couleur ; il décrit une pièce comme un noir dans lequel flottent des densités.","contrepartie":"Il lit le 呪力 juryoku à quatre cents mètres, à travers le béton, et donne le grade d'un 呪霊 jurei avant que celui-ci ne se manifeste ; il distingue à l'œil nu un 術式 jutsushiki armé d'un 術式 au repos.","constat":"Ne peut pas décrire le visage de sa mère. La décrit comme « une lampe basse, très régulière, éteinte en mars ».","rarete":4},{"id":"surdite-voix-vivantes","nom":"Surdité aux voix vivantes","kanji":"声聾","romaji":"seirō","privation":"Il entend la pluie, le métal, le vent dans une cage d'escalier. Aucune voix humaine ne lui parvient : les cordes vocales d'un vivant produisent, pour lui, un silence exact. Il lit sur les lèvres depuis l'âge de trois ans et se trompe encore d'un mot sur onze.","contrepartie":"Il entend en revanche le 術式 jutsushiki lui-même : chaque technique innée possède un son propre, tenu, perceptible dès que l'opérateur la charge, soit environ une seconde et demie avant l'effet. Quatorze 呪詛師 jusoshi identifiés à l'oreille, aucun jamais vu.","constat":"Fiable en repérage, inutilisable en coordination. Ne pas l'affecter à une mission reposant sur un ordre oral : trois morts en 2019 sont imputables à cette omission.","rarete":3},{"id":"douleur-sans-relache","nom":"Douleur sans relâche","kanji":"常痛","romaji":"jōtsū","privation":"Ses terminaisons ne se taisent jamais. Au repos, allongé, sans blessure, il évalue lui-même sa douleur à quatre sur dix ; un drap posé sur la jambe la porte à six. Aucune minute indolore depuis la naissance. Les analgésiques n'ont pas de prise, la 反転術式 hanten-jutsushiki non plus, puisqu'il n'y a rien à réparer.","contrepartie":"Le 呪力 juryoku naît des émotions négatives : la sienne est produite en continu, sans effort et sans tarissement. Réserve mesurée au niveau 特級 tokkyū depuis ses onze ans. Il n'a jamais eu besoin d'apprendre à se mettre en colère.","constat":"Sujet remarquablement calme. Ne s'assoit jamais tout à fait. Rendement inchangé après quarante heures de combat continu.","rarete":5},{"id":"veille-sans-fin","nom":"Veille sans fin","kanji":"無眠","romaji":"mumin","privation":"Il n'a jamais dormi. Pas d'endormissement, pas de sommeil paradoxal, pas un rêve : trente et un ans de veille continue. La fatigue, elle, s'accumule normalement et ne se retire jamais ; il la nomme « un poids sur la nuque, constant depuis l'enfance ».","contrepartie":"Son corps a compensé en apprenant seul la 反転術式 hanten-jutsushiki avant qu'il ne sache parler : il se répare en permanence, muscle, foie, cornée. À l'examen, ses tissus ont l'âge d'un homme de dix-neuf ans.","constat":"Chair intacte. La 反転術式 ne répare pas l'âme : c'est la seule ligne de ce dossier qui compte. Réévaluation psychiatrique à échéance de dix ans.","rarete":4},{"id":"gorge-sans-parole","nom":"Gorge sans parole","kanji":"無声","romaji":"musei","privation":"Larynx présent, parfaitement formé, muet. Rien n'en sort : ni mot, ni cri, ni toux. Il n'a jamais entendu sa propre voix et n'a jamais pu prévenir personne de rien à distance.","contrepartie":"Rien de ce qui passe par la voix ne le lie : ordre, incantation, technique fondée sur la parole glissent sur lui. Ses 縛り shibari, tracés à la main, se scellent sans témoin et rendent le double d'un serment ordinaire, comme si le réel tenait pour acquis qu'un homme qui n'a jamais pu mentir ne mente pas.","constat":"Signe ses engagements en trois traits. N'en a rompu aucun. On ignore ce qu'il pense de la 呪術高専 Jujutsu Kōsen et on ne le saura pas.","rarete":4},{"id":"croissance-arretee","nom":"Croissance arrêtée","kanji":"停育","romaji":"teiiku","privation":"Cartilages soudés à sept ans. Il mesure cent dix-neuf centimètres et n'en prendra pas un de plus ; les organes, eux, ont poursuivi leur programme et vieillissent dans un volume qui ne leur suffit plus. Trente-quatre ans, une voix d'enfant, des douleurs de vieil homme.","contrepartie":"Sa masse de 呪力 juryoku est celle d'un adulte accompli, comprimée dans un tiers du volume prévu. La densité obtenue autorise une sortie que des corps deux fois plus grands ne soutiennent pas : à contact égal, il déplace davantage.","constat":"Écarter de toute infiltration en milieu scolaire. Le sujet a demandé par écrit à ne plus être confondu avec ce qu'il n'est pas.","rarete":3},{"id":"sans-inscription","nom":"Sans inscription","kanji":"無憶","romaji":"muoku","privation":"Rien ne se fixe au-delà de quarante-six minutes. Il relit chaque matin une fiche de sa propre main pour savoir son nom, son grade et qui est mort. Il a appris quatre fois qu'il était veuf.","contrepartie":"Son 生得領域 seitoku-ryōiki est vide : pas un décor, pas un souvenir à parasiter. Les techniques qui lisent, rejouent ou fabriquent du passé n'ont aucune prise sur lui, et il exécute son 術式 jutsushiki comme au premier jour, sans usure et sans le moindre réflexe de recul.","constat":"Sujet inépuisablement courageux. Ce n'est pas du courage.","rarete":5},{"id":"absence-de-faim","nom":"Absence de faim","kanji":"不飢","romaji":"fuki","privation":"Ni faim, ni satiété, ni envie. Il mange à la montre, sept fois par jour, pesé au gramme ; il a manqué mourir à neuf ans, puis à seize, deux fois pour la même raison. Le plaisir de manger lui a été décrit et il en accepte la description.","contrepartie":"À défaut d'appétit, son corps prélève le 呪力 juryoku ambiant en place de calories. En zone saturée, sous 帳 tobari, il ne décline pas : là où une équipe s'épuise en quarante minutes, il tient la nuit entière et ressort plus lourd qu'il n'est entré.","constat":"Affectation recommandée : sites résiduels de haute densité. Ne pas l'y laisser seul au-delà de soixante-douze heures. La chose finit par lui plaire.","rarete":4},{"id":"corps-temperature-ambiante","nom":"Corps à température ambiante","kanji":"常温体","romaji":"jōontai","privation":"Aucune thermorégulation, aucune perception du chaud ni du froid. Sa température interne suit celle de la pièce : 34,1 °C au bureau, 22 °C dehors en février, ce qui devrait le tuer et ne le tue pas. Il ne sait qu'il brûle qu'à l'odeur.","contrepartie":"Ce qu'un corps dépense à se tenir à 37 °C lui reste intégralement disponible en 呪力 juryoku. Il ne laisse par ailleurs aucune signature thermique : les 呪霊 jurei qui chassent à la chaleur passent contre lui sans le trouver.","constat":"Prévoir couverture chauffante en intervention hivernale. Le sujet note que personne ne le prend deux fois dans les bras.","rarete":3},{"id":"vieillesse-en-avance","nom":"Vieillesse en avance","kanji":"早老","romaji":"sōrō","privation":"Il vieillit quatre fois trop vite. À seize ans : cataracte débutante, arthrose des mains, artères d'un homme de soixante-quatre. Il perd deux centimètres par an et le sait au millimètre.","contrepartie":"Sa maîtrise mûrit à la vitesse de sa chair. 領域展開 ryōiki-tenkai stabilisée à quatorze ans, ce dont trois exorcistes vivants sont capables ; ce que les autres mettent quarante ans à comprendre lui est venu en dix.","constat":"Espérance résiduelle estimée à six ans. Le sujet demande à être employé à plein régime et n'a formulé aucune autre demande.","rarete":5},{"id":"cecite-aux-visages","nom":"Cécité aux visages","kanji":"相貌盲","romaji":"sōbōmō","privation":"Aucun visage ne se compose. Il voit un front, une bouche, un grain de peau, jamais un ensemble ; il ne s'est jamais reconnu dans une glace et se repère à une cicatrice sur son propre poignet.","contrepartie":"Il perçoit à la place la forme du 呪力 juryoku de chacun : une signature individuelle, stable de la naissance à la mort, qu'aucune transformation, aucune substitution, aucun corps d'emprunt ne modifie. Onze 呪詛師 jusoshi démasqués sous onze visages différents.","constat":"Témoin d'identification irremplaçable. Sa mère figure dans ses notes sous la mention « motif 3, tresse, tiède ».","rarete":4},{"id":"perte-de-la-verticale","nom":"Perte de la verticale","kanji":"失衡","romaji":"shikkō","privation":"Aucun appareil vestibulaire. Il tient debout par calcul visuel, image par image ; dans l'obscurité complète, il ignore s'il est debout, couché ou en train de tomber, et attend qu'on le lui dise. Nausée permanente, cotée 2 sur 10, jamais absente.","contrepartie":"N'ayant jamais eu de haut ni de bas, il ne peut être désorienté : les 領域 ryōiki qui imposent une orientation, les techniques qui retournent l'espace ou la pesanteur glissent, et il poursuit son geste dans l'axe qu'il s'est donné.","constat":"Ne jamais l'engager de nuit sans éclairage propre. Trois interventions en sous-sol, trois échecs, aucun blessé hormis lui.","rarete":3},{"id":"peau-sans-retour","nom":"Peau sans retour","kanji":"無触","romaji":"mushoku","privation":"La peau ne renvoie rien : ni pression, ni texture, ni contact. Il ne sait qu'il tient un objet qu'en le regardant, et il brise ce qu'il serre. Vingt-deux ans, pas une main jamais sentie.","contrepartie":"Le 呪力 juryoku, lui, se dépose sur lui comme de l'eau. Il cartographie une pièce les yeux fermés, sent un 帳 tobari s'abaisser à trois cents mètres au changement de pression sur les avant-bras, et suit un 呪霊 jurei à la traîne qu'il laisse contre sa nuque.","constat":"Excellent en repérage. Gants renforcés obligatoires, contrôle radiologique des mains après chaque mission : le sujet ne signale pas ses fractures parce qu'il les ignore.","rarete":3},{"id":"souffle-decide","nom":"Souffle décidé","kanji":"随意呼吸","romaji":"zui'i-kokyū","privation":"Aucune respiration automatique. Chaque inspiration, de jour comme de nuit, est une décision : environ vingt mille décisions quotidiennes. S'il cesse d'y penser, il s'arrête.","contrepartie":"Il tient donc son souffle, son pouls et sa sortie de 呪力 juryoku sur une même horloge, au millième. Le registre de la 呪術高専 Jujutsu Kōsen lui compte onze 黒閃 kokusen, second total connu chez un vivant ; interrogé, il n'explique aucun des onze. On ne provoque pas l'Éclair Noir, on le reçoit.","constat":"Ne jamais l'interrompre lorsqu'il compte. Dort sous assistance ventilatoire et n'a pas dormi seul depuis vingt-neuf ans.","rarete":5}]},"kakucho":{"extensions":[{"id":"EXT-SOU-01","nom":"Soustraction au quart","kanji":"四半退","romaji":"shihan-tai","principe":"La loi qui retire la totalité d'une chose retire, en droit, n'importe quelle part de cette chose : le tout n'est qu'une fraction parmi d'autres. Il faut seulement énoncer la fraction avant le contact, car une loi ne peut pas retirer ce qui n'a pas été nommé.","usage":"Le porteur annonce la part — un quart, un tiers, trois cinquièmes — puis touche. On retire le quart d'un mur porteur pour le faire tomber sans bruit, le tiers de la masse d'une lame pour qu'elle ne porte plus, la moitié d'un cri de 呪霊 jurei pour qu'il n'atteigne pas le secteur voisin.","cout":"La part non retirée reste attachée au porteur tant qu'il ne l'a pas reprise : chaque fraction en suspens ampute sa réserve d'autant. Il n'en tient pas plus de quatre à la fois ; à la cinquième, la loi se sert seule, et elle se sert sur lui.","archetype":"soustraction"},{"id":"EXT-SOU-02","nom":"Restitution froide","kanji":"冷返","romaji":"reihen","principe":"Ce qui est retiré n'est pas détruit : il est mis hors du réel, donc il est quelque part. Une loi capable de sortir une chose sait, par le même geste tenu à l'envers, la faire rentrer.","usage":"Rendre un avant-bras soustrait quarante secondes plus tôt. Rendre une porte au milieu d'un couloir pour couper une poursuite. Rendre à l'adversaire l'organe qu'on lui a pris, au moment choisi, pour qu'il ait de nouveau à le porter.","cout":"Ce qui revient revient froid : neuf degrés, insensible une minute pour chaque seconde d'absence. La 反転術式 hanten-jutsushiki répare cette chair mais ne la réchauffe pas — elle ne touche pas à ce qui est revenu de travers. Un membre rendu trois fois ne se plie plus.","archetype":"soustraction"},{"id":"EXT-SOU-03","nom":"Retrait de soi","kanji":"自削","romaji":"jisaku","principe":"La loi ne demande pas qui elle retire. Le porteur peut se désigner lui-même et soustraire non pas son corps, mais ce que son corps produit : le bruit, la chaleur, l'odeur, la trace de 呪力 juryoku.","usage":"Il ne devient pas invisible, il devient inintéressant. Les 呪霊 jurei de grade 4級 et 3級 cessent de s'orienter sur lui, les chiens perdent la piste, un adversaire le voit et remet à plus tard de le regarder. Les caméras, elles, continuent de l'enregistrer.","cout":"Ce qui ne laisse pas de trace ne s'enregistre pas non plus pour lui : pendant le retrait il ne sent ni ses plaies ni le froid, et découvre à la sortie des blessures vieilles de dix minutes. Deux 補助監督 hojo-kantoku ont pour consigne de le compter à voix haute toutes les trente secondes.","archetype":"soustraction"},{"id":"EXT-ECH-04","nom":"Échange à terme","kanji":"後払交換","romaji":"atobarai-kōkan","principe":"Un échange est une égalité, non une simultanéité. Si la loi admet que deux choses se valent, elle admet que l'une passe maintenant et l'autre plus tard : la dette tient lieu de contrepartie tant qu'elle est reconnue.","usage":"Prendre l'avantage d'abord — la vitesse, la solidité, la vue — et régler après la levée du 帳 tobari. Le paiement se fait en général sur le trajet du retour, dans la voiture du 補助監督 hojo-kantoku, avant la troisième sortie d'autoroute.","cout":"La dette porte intérêt : un dixième de sa valeur par minute non réglée. Elle ne se négocie pas, ne s'annule pas, ne se transfère pas. Passé quarante minutes, elle se prélève seule, sur ce qu'elle trouve, sans respecter la nature de ce qui avait été pris.","archetype":"échange"},{"id":"EXT-ECH-05","nom":"Échange par tiers","kanji":"三者取引","romaji":"sansha-torihiki","principe":"La loi exige deux termes, pas deux personnes. Rien n'interdit que ce qui est donné vienne du porteur et que ce qui est pris soit prélevé sur un tiers présent, dès lors que les valeurs restent égales de part et d'autre.","usage":"Le porteur maintient le tiers dans le rayon de contact — sept mètres, une pièce fermée suffit — et fait transiter par lui la part qu'il ne veut pas porter : la brûlure, la fracture, l'épuisement.","cout":"Le tiers doit être conscient ; un homme évanoui ne vaut rien dans un échange. La part transférée ne quitte pas le porteur, elle se divise : il en garde toujours la moitié. Employée sur un civil, cette extension est classée par le 上層部 jōsōbu dans la même colonne que le meurtre, et c'est la ligne exacte où commencent les 呪詛師 jusoshi.","archetype":"échange"},{"id":"EXT-ECH-06","nom":"Échange contre le vide","kanji":"空取引","romaji":"kara-torihiki","principe":"Si l'échange est une loi, elle vaut encore quand l'un des termes est nul. Donner une chose contre rien reste un échange régulier : simplement, rien ne revient, et ce qui est parti n'a plus de contrepartie par où revenir.","usage":"On l'emploie sur ce que l'on veut rendre définitif : la régénération d'un 呪霊 jurei, la trempe d'un 呪具 jugu, la douleur d'un blessé que l'on ne peut pas transporter. Rien de ce qui a été cédé de cette façon n'a jamais été retrouvé.","cout":"Le vide se paie : chaque échange nul rétrécit la capacité du porteur d'environ un pour cent, mesuré et définitif. La 反転術式 hanten-jutsushiki ne le rend pas. Ceux qui en ont abusé finissent par ne plus rien pouvoir échanger, ce qui, dans leur cas, revient à ne plus rien pouvoir.","archetype":"échange"},{"id":"EXT-REP-07","nom":"Second prononcé","kanji":"二度目","romaji":"nidome","principe":"La loi s'applique à un état du réel. Le résultat qu'elle produit est un état du réel comme un autre : rien n'empêche de le lui soumettre à son tour.","usage":"La deuxième application doit tomber dans la seconde qui suit la première, avant que le résultat n'ait refroidi et ne soit redevenu un fait ordinaire. Un effet appliqué à lui-même ne double pas : il se referme, il devient une chose dont on ne sort plus.","cout":"Le coût double à chaque tour, le résultat non. Une troisième application est possible et ne s'interrompt plus : elle parcourt toute la chaîne jusqu'au bout, cible comprise, porteur compris s'il est encore en contact au moment où elle passe.","archetype":"répétition"},{"id":"EXT-REP-08","nom":"Répétition à vide","kanji":"空唱","romaji":"kūshō","principe":"Une loi qui rejoue peut rejouer sans objet. Le porteur la fait tourner sur rien, non pour obtenir quelque chose, mais pour qu'elle soit déjà en cours lorsqu'elle rencontrera enfin quelque chose.","usage":"On l'entretient avant l'abaissement du 帳 tobari. La première application sur cible n'a alors plus d'amorce et tombe en six centièmes de seconde. C'est l'extension de ceux qui savent qu'ils ne frapperont pas les premiers.","cout":"Deux pour cent de réserve par minute, sans aucun résultat visible. Tant que la boucle tourne, la 反転術式 hanten-jutsushiki reste inaccessible : on n'inverse pas un opérateur déjà en train de tourner. Le porteur combat entretenu et non soignable.","archetype":"répétition"},{"id":"EXT-REP-09","nom":"Répétition imposée","kanji":"移し反復","romaji":"utsushi-hanpuku","principe":"La loi répète un événement ; elle ne demande pas de qui il vient. Ce qu'un adversaire vient d'achever est un événement, donc un objet recevable.","usage":"Le geste que l'adversaire termine se rejoue par lui, à l'identique, dans le même intervalle : le coup part deux fois, le pas se refait, la garde se rouvre au même endroit. Contre un 呪霊 jurei qui ne raisonne pas, c'est décisif. Contre un 呪術師 jujutsushi, cela fonctionne une fois.","cout":"Le porteur est le métronome : il doit refaire lui-même le geste, dans la même mesure, sans se tromper d'un temps. S'il manque la mesure, la répétition se referme sur lui et c'est son propre geste qui se rejoue — y compris s'il était en train de tomber.","archetype":"répétition"},{"id":"EXT-MES-10","nom":"Relevé à distance","kanji":"遠見計測","romaji":"tōmi-keisoku","principe":"Mesurer n'exige pas de toucher, seulement de voir assez. La loi qui évalue au contact évalue de loin, avec une marge d'erreur proportionnelle à la distance parcourue par le regard.","usage":"À douze mètres, le relevé donne le grade réel d'un 呪霊 jurei, la réserve restante d'un adversaire, l'épaisseur d'une cloison, à trois pour cent près par tranche de dix mètres. On l'exécute depuis un toit, avant descente.","cout":"La mesure s'inscrit sur le mesuré : une ligne froide, un à deux degrés sous la peau, à l'endroit exact du relevé. Tout ce qui est capable de sentir sait qu'il vient d'être compté, et sait par où l'on regardait. On ne relève jamais deux fois depuis la même position.","archetype":"mesure"},{"id":"EXT-MES-11","nom":"Désignation de l'étalon","kanji":"基準体","romaji":"kijuntai","principe":"Toute mesure suppose une unité. Si la loi mesure, elle peut choisir ce à quoi elle rapporte le reste : le porteur désigne un corps, un objet, un cadavre, et le monde entier se compte en lui.","usage":"Une lame vaut deux tiers de l'étalon, un 呪霊 jurei en vaut neuf, un mur en vaut quatre : les décisions se prennent en une demi-seconde parce que tout est déjà dans la même unité. On désigne de préférence une chose morte — un rail, une barre de fer — plutôt qu'un vivant.","cout":"L'étalon ne se mesure pas lui-même. Le porteur est aveugle à ce qu'il a désigné et à ce qui lui arrive. Changer d'étalon demande onze secondes durant lesquelles rien n'a de valeur, donc rien n'est comparable : ni la portée d'un coup, ni la distance à laquelle il arrive.","archetype":"mesure"},{"id":"EXT-MES-12","nom":"Relevé de soi","kanji":"自量","romaji":"jiryō","principe":"Le porteur est un objet mesurable comme un autre. La loi se retourne sur son propre support et rend la quantité exacte de 呪力 juryoku qui lui reste, sans arrondi ni consolation.","usage":"Il sait au dixième ce qu'il peut encore payer : combien d'applications, combien de secondes de 領域展開 ryōiki-tenkai, si la 反転術式 hanten-jutsushiki ira jusqu'à l'os ou s'arrêtera au muscle. Les décisions de repli cessent d'être des paris.","cout":"Le nombre ne s'éteint plus pendant vingt-quatre heures et occupe une part fixe de l'attention, comme une horloge dans une pièce vide. Le temps de réaction s'allonge d'un dixième de seconde environ — soit très exactement l'ordre de grandeur où se joue le 黒閃 kokusen. Aucun porteur n'en a jamais produit un pendant un relevé.","archetype":"mesure"},{"id":"EXT-LIE-13","nom":"Lien tendu","kanji":"張り綱","romaji":"harizuna","principe":"Un lien a une longueur. Une loi qui relie deux choses en fixe la distance, donc elle peut la réduire : raccourcir le lien, c'est rapprocher ce qu'il tient.","usage":"Le porteur relie l'adversaire à lui-même, puis retire du mou, trois mètres par seconde. On n'arrache presque jamais : on interdit surtout de partir. Contre ce qui fuit — un 呪霊 jurei de grade 2級 en repli, un 呪詛師 jusoshi qui a une voiture — c'est la seule chose qui compte.","cout":"Le porteur ne peut pas s'exclure du lien : il en est toujours l'une des deux extrémités. Le mou retiré l'est des deux côtés, et il parcourt la moitié de la distance, qu'il le veuille ou non, dans la ligne exacte du lien. On reconnaît ces praticiens à leurs talons, usés jusqu'au cuir intérieur.","archetype":"lien"},{"id":"EXT-LIE-14","nom":"Nœud à trois","kanji":"三結び","romaji":"mimusubi","principe":"Rien dans la loi ne dit deux. Un lien accepte un troisième terme ; mais à trois, il n'a plus de sens de circulation : ce qui arrive à l'un passe aux deux autres, également et sans délai.","usage":"On noue un allié, un adversaire et soi-même pour répartir ce qu'aucun ne peut encaisser seul. On noue deux adversaires et un mur porteur, pour que le mur reçoive ce qu'ils se font l'un à l'autre.","cout":"Le partage est aveugle et ne s'interrompt pas : il vaut aussi pour tout ce qui vient du porteur, y compris ses propres coups. Un nœud à trois ne se dénoue que lorsque l'un des trois cesse d'être un terme, c'est-à-dire meurt. Le 上層部 jōsōbu exige un formulaire signé avant tout emploi sur un collègue.","archetype":"lien"},{"id":"EXT-LIE-15","nom":"Coupure du lien","kanji":"断縁","romaji":"danen","principe":"Pour nouer, il faut voir les nœuds. Une loi qui relie reconnaît nécessairement les liens qu'elle n'a pas faits ; et ce qu'elle reconnaît, elle peut le défaire.","usage":"Couper ce qui rattache un 呪霊 jurei au lieu qui l'a produit — un palier d'immeuble, un passage souterrain, une salle d'attente — le prive de ce qui le renouvelle et le rend exorcisable en quelques minutes. On coupe aussi des liens humains : la filiation, la dette, la fidélité. Cela se voit tout de suite sur le visage.","cout":"Aucune coupure ne se recoud. La 反転術式 hanten-jutsushiki répare la chair, jamais ce qui la rattachait à quelque chose. Le porteur conserve en outre la mémoire exacte de chaque lien défait, sous forme d'absence : il en connaît le compte à tout instant, et il le tient sans le vouloir.","archetype":"lien"},{"id":"EXT-SEU-16","nom":"Abaissement du seuil","kanji":"敷居下げ","romaji":"shikii-sage","principe":"Un seuil est un nombre. La loi ne se déclenche qu'au-delà d'une certaine quantité — vitesse, poids, chaleur, intention — et ce nombre est un réglage, pas une nature.","usage":"Descendu au plus bas, le seuil rend la loi permanente autour du porteur : elle prend tout ce qui passe, un coup, une balle, un souffle, une goutte. On l'emploie encerclé, quand il n'y a plus aucune sélection à faire.","cout":"La loi cesse de distinguer. Elle prend les alliés, la pluie, la main du porteur. Le coût suit le nombre d'événements et non leur importance : en secteur habité, dix secondes vident un praticien confirmé. Le 帳 tobari doit être posé avant l'abaissement, jamais pendant.","archetype":"seuil"},{"id":"EXT-SEU-17","nom":"Seuil déplacé","kanji":"敷居移し","romaji":"shikii-utsushi","principe":"Le seuil est un lieu autant qu'une valeur : la loi agit là où quelque chose passe d'un état à l'autre. Ce lieu peut être choisi ailleurs qu'à sa place habituelle.","usage":"On le pose sur une porte, une margelle, la ligne blanche d'un quai, la lèvre d'une plaie ouverte. L'adversaire ne rencontre pas le porteur : il rencontre le passage, et il n'a pas d'autre chemin que celui-là.","cout":"Un seul seuil à la fois. Le déplacer demande quatre secondes pendant lesquelles il n'y en a aucun, ni ici ni là-bas ; le porteur les passe à attaquer à mains nues pour que cela ne se remarque pas. Un seuil posé sur un objet mobile se défait dès que l'objet change de main.","archetype":"seuil"},{"id":"EXT-SEU-18","nom":"Seuil intérieur","kanji":"内敷居","romaji":"uchi-shikii","principe":"Si le seuil peut être posé ailleurs, il peut être posé sur le porteur lui-même. Tout ce qui entre en lui franchit alors la limite et tombe sous la loi, à l'intérieur, là où l'on ne se défend pas d'ordinaire.","usage":"Se laisser mordre, avaler, transpercer : ce qui entre est traité au passage. C'est l'extension que l'on emploie contre les 呪霊 jurei de grade 特級 qui absorbent ; ils s'arrêtent au milieu du geste, et ils ne comprennent pas.","cout":"Le seuil ne trie pas ce qui entre. L'air, l'eau, la nourriture, une transfusion : tout est traité. Le porteur jeûne douze heures avant, respire selon un rythme appris — quatre secondes, huit secondes — et se voit refuser toute voie veineuse tant que le seuil est en place.","archetype":"seuil"},{"id":"EXT-TEM-19","nom":"Témoin emprunté","kanji":"借り証人","romaji":"kari-shōnin","principe":"La loi réclame un témoin, non un vivant. Il suffit qu'un regard ait été présent et que rien ne l'ait encore effacé ; un mort récent voit encore un peu ce qu'on lui met devant les yeux.","usage":"Le porteur tourne le visage du cadavre vers la scène et applique la loi devant lui. Six minutes après le décès, pas davantage : au-delà, le témoignage est refusé et l'application ne prend pas.","cout":"Un témoignage emprunté valide sans détailler. La loi s'applique alors à toute la surface vue et non à la cible choisie, ce qui en interdit l'emploi à moins de quinze mètres d'un allié. Le porteur doit fermer lui-même les yeux du témoin après usage ; ceux qui ne l'ont pas fait rapportent des difficultés dont le 呪術高専 Jujutsu Kōsen n'a pas souhaité tenir registre.","archetype":"témoignage"},{"id":"EXT-TEM-20","nom":"Déclaration publique","kanji":"公示","romaji":"kōji","principe":"Un témoignage vaut par le nombre de ceux qui l'entendent. La loi qui se satisfait d'un seul témoin se renforce de tous les autres : ce qui est déclaré devant beaucoup engage davantage le réel.","usage":"Le porteur énonce à voix haute, avant tout contact, ce que la loi va faire et sur qui. Devant douze personnes ou plus — collègues, blessés, civils retenus sous 帳 tobari — l'effet cesse d'être esquivable et devient une formalité administrative.","cout":"Une déclaration est un 縛り shibari. Ce qui est annoncé doit se produire exactement comme annoncé, sinon la sanction porte sur le porteur, à hauteur de ce qu'il avait promis. Un rapport de 1994 mentionne un praticien qui s'était déclaré incapable de mourir ce jour-là : il a tenu jusqu'à minuit passé de neuf minutes.","archetype":"témoignage"},{"id":"EXT-MET-21","nom":"Forme intermédiaire tenue","kanji":"半変固定","romaji":"hanpen-kotei","principe":"Une métamorphose est un trajet, pas un saut. Si la loi conduit une chose d'un état à un autre, elle peut s'arrêter en route et maintenir l'état intermédiaire, qui n'existe nulle part ailleurs dans le monde.","usage":"Une main arrêtée à mi-chemin de la pierre frappe comme la pierre et se plie comme une main. Un 呪霊 jurei retenu à mi-parcours n'a plus la forme qui le fait fonctionner : il reste debout, entier, et il ne fait plus rien.","cout":"Un état intermédiaire ne tient pas seul : il se paie à la seconde, au prix d'une course soutenue. Il ne se soigne pas non plus, car la 反転術式 hanten-jutsushiki ramène la chair à sa forme d'origine et défait donc le maintien. Un porteur blessé choisit : guérir, ou tenir.","archetype":"métamorphose"},{"id":"EXT-MET-22","nom":"Retour à la forme d'origine","kanji":"原形帰し","romaji":"genkei-gaeshi","principe":"Une loi qui transforme sait lire d'où une chose vient, sans quoi elle ne saurait pas où la mener. Ce qu'elle lit, elle peut le remonter : rendre à une chose la forme qu'elle avait avant d'être ce qu'elle est.","usage":"Sur un 呪具 jugu, cela restitue l'objet ordinaire qu'il était et le désarme définitivement. Sur un 呪霊 jurei, cela le ramène à ce qui l'a fait : une peur humaine, sans corps, qui n'attaque plus personne.","cout":"Une peur rendue à l'état de peur reste une peur, et elle est libre. Elle se dépose sur les vivants présents dans le 帳 tobari et recommence son travail ; on compte en moyenne huit mois avant réapparition, un grade au-dessus. Le porteur est tenu de demeurer sur zone jusqu'à dispersion et de porter lui-même la part qui ne trouve personne d'autre.","archetype":"métamorphose"}]},"kanri":{"kokusen":[{"aptitude":"Frappe neuf millièmes trop tôt, avec constance","description":"Sa faute est régulière, donc corrigible : le jour où le retard de son 呪力 juryoku rattrape exactement son poing, la fente noire s'ouvre dans l'axe de l'avant-bras, aussi longue que lui, et se referme sans un bruit. Il ne parle plus ensuite de pousser son énergie, mais d'arriver à l'heure avec elle."},{"aptitude":"Ne corrige jamais deux fois la même erreur","description":"Elle apprend en un essai, ce qui la rend imprévisible pour elle-même : la coïncidence tombe sur la reprise, jamais sur la répétition, et l'espace se fend en noir juste devant sa clavicule, à trente centimètres de la cible réelle. Après quoi son 呪力 juryoku ne se laisse plus doser : il est entier ou absent."},{"aptitude":"Aucune aptitude notable. L'a reçu deux fois","description":"Rien dans sa mécanique n'explique la coïncidence à 0,000001 seconde, et les deux fois il frappait mal, en déséquilibre, avec la mauvaise main. La fente noire s'est ouverte sous son talon plutôt que sous son poing, et depuis, son énergie répond avant qu'il n'ait décidé de frapper — ce qui, en évaluation, se lit comme un défaut."},{"aptitude":"Compte à mi-voix pendant tout l'échange","description":"Le comptage n'est pas un métronome mais une laisse : au chiffre où sa voix se casse, le coup et le 呪力 juryoku tombent ensemble et la fente noire s'ouvre horizontalement, à hauteur de bouche, comme une seconde bouche. Elle a cessé de compter depuis, et frappe désormais sur le silence qui suivait le chiffre."},{"aptitude":"Rendement nul avant la troisième frappe","description":"Les deux premières servent d'accordage, ce qu'aucun adversaire ne lui accorde ; quand on le lui accorde, la troisième multiplie par 2,5 et fend l'espace en noir sur la longueur exacte de son tibia. Il a depuis pris l'habitude de traiter ses deux premiers coups comme du matériel consommable, ce que les instructeurs jugent sain et l'infirmerie non."},{"aptitude":"Ferme les yeux au moment de l'impact","description":"Elle ne voit donc jamais sa propre fente noire, seulement le noir des paupières qui, cette fois-là, a duré une demi-seconde de trop et sentait le métal chaud. On lui a montré l'enregistrement ; elle a demandé qu'on le lui remontre onze fois, puis n'a plus jamais réussi à le refaire volontairement, ce qui est la règle."},{"aptitude":"Ne l'obtient qu'après avoir été touchée","description":"Sa coïncidence est une réponse : elle survient dans les deux secondes qui suivent une côte cassée, jamais avant, et la fente noire s'ouvre alors du côté blessé, épousant la ligne de la fracture. Son rapport au 呪力 juryoku s'est inversé — elle ne le mobilise plus pour se protéger, elle attend qu'on le lui déclenche."},{"aptitude":"Retient son souffle une seconde de trop","description":"L'apnée décale tout son minutage vers l'arrière, et c'est précisément dans ce décalage, à la limite de l'étourdissement, que le coup et l'énergie se rejoignent : l'espace se fend en noir au-dessus de son épaule, verticalement, comme une porte trop étroite. Il dit avoir entendu, à cet instant, la fente et non l'impact."},{"aptitude":"Frappe juste quand on vient de lui mentir","description":"L'observation est empirique et gênante à consigner : trois occurrences, trois mensonges vérifiés dans la minute précédente, la fente noire s'ouvrant chaque fois en biais sous le poing droit. Depuis, son 呪力 juryoku a pris une qualité que les examinateurs décrivent comme rancunière : il monte plus vite qu'avant et redescend beaucoup plus lentement."},{"aptitude":"L'a reçu une fois. Ne le cherche plus","description":"Il a vu la fente noire à dix-neuf ans, longue de quatre-vingts centimètres, et n'a plus jamais tenté de la reproduire, ce qui statistiquement lui donne les meilleures chances de la revoir. Son énergie maudite est depuis d'une régularité clinique : elle n'a plus besoin de viser, elle est simplement toujours là où le poing va finir."}],"simplifies":[{"id":"kr-01","nom":"Le Grenier de cendre","kanji":"灰倉","romaji":"Haisō","forme":"La cendre de vingt-deux bâtons d'encens brûlés la veille se soulève du sol et tient en suspension jusqu'à 2,21 mètres, sans un remous ; l'air y descend à 14 °C et sent la résine froide. Chaque grain s'arrête net à la frontière, comme contre une vitre que personne ne voit.","effet":"À la surface de la sphère, l'inscription du 領域展開 ryōiki-tenkai adverse est défaite : le territoire continue de tenir au-dehors, mais son coup au but n'a plus d'adresse à l'intérieur.","limite":"Tout ce qui possède une masse. Un poing, une lame, un 呪具 jugu lancé : la cendre s'écarte de deux centimètres et se referme derrière, intacte."},{"id":"kr-02","nom":"La Roue de givre","kanji":"霜輪","romaji":"Sōrin","forme":"Un anneau de givre se forme à hauteur de hanche et se déploie en sphère en un peu moins d'une seconde ; la température tombe à −3 °C et la glace craque six fois par seconde, régulièrement, comme un compteur. Le givre prend d'abord sur les cils de la porteuse, qui ne cligne plus.","effet":"Elle gèle à la frontière le 術式拡張 jutsushiki-kakuchō adverse : l'extension arrive au bord, s'immobilise, puis retombe en poudre. Le coup au but est annulé tant que la porteuse garde les yeux ouverts.","limite":"La voix. Un ordre, un serment prononcé, un nom crié franchissent le givre sans le faire fondre, et tout ce qui agit par la parole agit."},{"id":"kr-03","nom":"L'Intérieur de la cloche","kanji":"鐘の内","romaji":"Kane no Uchi","forme":"Une note unique de bronze, 92 hertz, tenue sans décroître ; l'air s'épaissit, monte de 2 °C, et toute parole prononcée revient à son auteur avec un quart de seconde de retard. On voit trembler la poussière au bord de la sphère.","effet":"Le coup au but du territoire adverse perd son oreille : il continue de se prononcer, mais la note le recouvre et il n'atteint plus personne à l'intérieur.","limite":"Ce qui ne résonne pas. Un poison déjà introduit dans le sang, une hémorragie commencée, une malédiction posée avant le déploiement poursuivent leur travail sans rien entendre."},{"id":"kr-04","nom":"Le Lit de sel","kanji":"塩床","romaji":"Enshō","forme":"Le sol se couvre de sel sec et craquelé sur 2,21 mètres de rayon, et la sphère assèche l'air jusqu'à ce que les lèvres se fendent en quarante secondes. Aucun bruit, sauf le crissement sous les semelles ; l'odeur est celle d'une plaie propre.","effet":"Le 呪力 juryoku adverse se dessèche à la frontière et perd sa cohésion : le coup au but arrive privé de véhicule, et le territoire ne parvient pas à s'imposer à l'intérieur.","limite":"Tout ce qui est liquide et chaud. Le sang, y compris celui du porteur, traverse le sel sans se laisser prendre ; les techniques qui l'emploient sont pleinement opérantes."},{"id":"kr-05","nom":"L'Été sans cigales","kanji":"無蝉","romaji":"Musen","forme":"Le silence tombe d'un coup : cigales, circulation, respirations d'autrui, tout cesse à la frontière, et les tympans se pressurisent comme à trois cents mètres de fond. La température ne change pas, ce qui rend la chose plus difficile à supporter encore.","effet":"Le territoire adverse ne peut plus s'annoncer : privé de sa déclaration, le coup au but ne trouve pas de prise, et l'extension s'arrête au bord comme devant un mur qu'elle ne peut pas nommer.","limite":"La lumière. Tout ce qui passe par le regard, la vue, l'éblouissement ou l'image entre sans être ralenti d'un millième de seconde."},{"id":"kr-06","nom":"L'Anneau de veilleuses","kanji":"灯環","romaji":"Tōkan","forme":"Trente et une flammes d'un centimètre se tiennent debout à hauteur de poitrine, sans mèche ni combustible, réparties sur la sphère ; elles éclairent sans projeter d'ombre et l'air sent la cire chaude. La chaleur reste locale : à dix centimètres d'une flamme, rien.","effet":"La frontière révèle et dissout : la couture du 領域展開 ryōiki-tenkai adverse devient visible comme un liseré gris, et le coup au but s'y consume avant d'entrer.","limite":"Le froid. Une lame refroidie, un corps refroidi, une technique sans chaleur traversent l'anneau sans faire vaciller une seule flamme."},{"id":"kr-07","nom":"La Salle de boue","kanji":"泥堂","romaji":"Deidō","forme":"Le sol devient boue tiède à 33 °C sur toute la sphère ; on y enfonce de quatre centimètres sans jamais y laisser d'empreinte. L'odeur est celle d'une eau stagnante et du fer, et le bruit de succion se produit toujours une demi-seconde après le pas.","effet":"Le coup au but est absorbé : il arrive, il porte, mais il porte trois centimètres sous la surface, dans la boue, et non dans ce qui s'y tient debout.","limite":"Ce qui tombe. Toute attaque strictement verticale traverse la sphère par le haut et frappe avant que la boue ait eu le temps de la recevoir."},{"id":"kr-08","nom":"Le Siège d'aiguilles","kanji":"針座","romaji":"Shinza","forme":"Deux mille aiguilles à coudre se suspendent pointe vers l'extérieur, immobiles, à une paume les unes des autres ; elles émettent un bourdonnement très fin, autour de 4 000 hertz, qui donne mal aux dents. L'acier reste à la température de la peau.","effet":"Chaque assaut de technique adverse annule le coup au but et coûte une aiguille, qui tombe et se plante dans le sol : la sphère tient exactement le nombre d'attaques qu'il lui reste d'aiguilles.","limite":"Ce qui passe entre. Gaz, chaleur, fumée, poussière franchissent les intervalles sans coûter une seule aiguille, et le porteur meurt souvent avec la défense intacte."},{"id":"kr-09","nom":"La Geôle de papier","kanji":"紙牢","romaji":"Shirō","forme":"Cent quarante et une feuilles de rapport de 補助監督 hojo-kantoku se lèvent et tournent lentement autour du porteur, à plat, sans jamais se toucher ; l'air sent l'encre fraîche et le papier neuf, et la température monte de 1 °C par minute.","effet":"La frontière consigne : le nom du 術式 jutsushiki adverse s'écrit de lui-même sur une feuille, à la main, et tant qu'il est écrit son coup au but ne s'applique plus à l'intérieur.","limite":"Ce qui n'a pas de nom. Un 呪霊 jurei de 4級 sans forme fixe, un coup improvisé, une violence sans technique : rien à consigner, donc rien à retenir."},{"id":"kr-10","nom":"La Retenue du souffle","kanji":"息止","romaji":"Sokushi","forme":"La sphère est faite de l'air que le porteur a cessé d'expirer : à l'intérieur, plus rien ne circule, la poussière reste où elle est, et la température se fige à celle du moment du déploiement, au dixième près. Personne n'y respire, le porteur compris.","effet":"Sans mouvement d'air, le territoire adverse ne peut plus s'établir : le coup au but reste suspendu à la frontière, littéralement immobile, jusqu'à la dissipation de la sphère.","limite":"Le temps. Quarante-six secondes en moyenne, moins si le porteur a couru ; ensuite il inspire, et tout ce qui attendait dehors entre en même temps que l'air."},{"id":"kr-11","nom":"Le Parapluie de rouille","kanji":"錆傘","romaji":"Sabigasa","forme":"Des écailles d'oxyde de fer montent du sol vers le haut, à contresens, et se referment en coupole ; l'air prend un goût de sang et de pièce de monnaie, et l'humidité relative monte brutalement. La rouille grésille faiblement, comme une pluie sur une tôle lointaine.","effet":"Le 呪力 juryoku adverse s'oxyde au contact de la frontière : il perd sa liaison, se ternit, et le coup au but se défait en particules avant d'avoir pu s'appliquer.","limite":"Le vivant. Griffes, dents, os, chair, tout ce qui n'est pas métal ni technique traverse la coupole sans rouiller, et beaucoup de 呪霊 jurei ne sont que cela."},{"id":"kr-12","nom":"La Pluie tiède","kanji":"温雨","romaji":"On'u","forme":"Une pluie sans source tombe à l'intérieur de la sphère, à 37,2 °C, et s'arrête à trois centimètres de la peau de chacun ; elle sent l'iode et le caoutchouc de gant. Le bruit est celui d'une averse entendue depuis une chambre fermée.","effet":"La frontière lave l'adresse : le territoire adverse conserve son coup au but mais ne sait plus à qui il s'applique, et frappe la pluie.","limite":"Ce qui est déjà mouillé. Un corps couvert de son propre sang, un vêtement trempé, un être qui vit dans l'eau ne sont pas lavés et restent parfaitement désignés."},{"id":"kr-13","nom":"Le Voile d'os moulu","kanji":"骨粉","romaji":"Koppun","forme":"Une poudre d'os blanche, moulue fin, se tient en suspension et dessine la sphère par sa seule densité ; elle sent la craie et le lait brûlé, et se dépose sur les épaules en une couche mesurable après vingt secondes. Il y fait exactement deux degrés de moins que dehors.","effet":"La poudre prend l'empreinte en négatif du 生得領域 seitoku-ryōiki adverse et le tient à distance : son coup au but s'imprime dans le voile, jamais dans le corps.","limite":"La sphère ne distingue rien. Le 術式 jutsushiki du porteur s'arrête à la même frontière et ne sort pas ; à l'intérieur du voile, il n'a que ses mains."},{"id":"kr-14","nom":"La Chambre des secondes","kanji":"秒室","romaji":"Byōshitsu","forme":"Un tic-tac de mécanisme d'horloge emplit la sphère à soixante et un battements par minute — un de trop, toujours. L'air est sec, 19 °C, et les montres portées à l'intérieur avancent de trois secondes par déploiement, définitivement.","effet":"Le coup au but adverse arrive systématiquement sur le battement en trop : il porte dans une seconde qui n'existe pas au calendrier des vivants, et n'atteint donc personne.","limite":"Ce qui n'a pas besoin de durée. Une pression, une asphyxie, un poison, un effondrement du sol : les phénomènes continus ignorent le battement supplémentaire et travaillent sans interruption."}]},"affectation":{"affectations":[{"intitule":"Secteur permanent : préfecture de Gunma, sites hospitaliers désaffectés. Recensement des 呪霊 jurei de 4級, sans binôme.","motif":"Le porteur a demandé par écrit une affectation à la mesure de sa loi. La demande a été lue."},{"intitule":"Détachement au dépôt de 呪具 jugu de Kyoto. Inventaire, graissage, remise en caisse.","motif":"On sait ce que fait un outil quand on le prend en main. De lui, on ne le sait pas."},{"intitule":"Appui aux 補助監督 hojo-kantoku pour la pose du 帳 tobari. Poste de nuit, 22h00-05h00, hors périmètre.","motif":"Compétent pour fermer un secteur, inutile à l'intérieur. Maintenir à la frontière."},{"intitule":"Escorte de dépouilles de 呪術師 jujutsushi, trois rotations hebdomadaires, ligne Tōhoku.","motif":"La loi s'applique proprement là où il ne reste plus personne à ménager."},{"intitule":"Position d'appât. Se tenir à découvert, immobile, jusqu'à manifestation de la cible.","motif":"Signature de 呪力 juryoku identifiable à trois cents mètres. On ne gaspille pas une odeur pareille."},{"intitule":"Interdiction de 領域展開 ryōiki-tenkai en zone urbaine. Contrôle trimestriel du dossier.","motif":"La dissimulation du dernier déploiement a été chiffrée à quarante et un millions de yens. Une ligne budgétaire de cette nature se reconduit une fois, pas deux."},{"intitule":"縛り shibari imposé : déclaration orale et intégrale des conditions du 術式 jutsushiki avant tout engagement.","motif":"Un porteur dont on ignore la loi est un porteur qu'on ne peut pas remplacer au bon moment."},{"intitule":"Mutation à l'annexe de Sendai. Enseignement des premières années, deux heures hebdomadaires.","motif":"Transmet correctement. N'a été retenu pour rien d'autre."},{"intitule":"Mission conjointe avec un 呪詛師 jusoshi placé sous remise de peine, durée indéterminée.","motif":"Les deux dossiers portent la même annotation en marge. Autant qu'ils s'usent l'un contre l'autre."},{"intitule":"Retrait de l'autorisation de mission en binôme, effet immédiat.","motif":"Deux rapports de coéquipiers mentionnent une hésitation d'environ trois secondes. Le troisième rapport n'a pas pu être rédigé."},{"intitule":"Relevés post-incident : photographie du site, décompte des corps, restitution des effets aux familles.","motif":"La loi du porteur est jugée plus supportable après les faits qu'au moment où ils ont lieu."},{"intitule":"Placement en réserve d'exécution. Convocable sous quarante minutes, non affecté, non rémunéré au titre des missions.","motif":"On ne laisse pas un tel dossier en activité. On ne s'en débarrasse pas non plus tant qu'il peut servir."},{"intitule":"Fouilles de la fosse de Hakone, treize jours consécutifs, sans relève.","motif":"Seul porteur dont l'immobilisation prolongée ne prive aucun secteur d'un exorciste."},{"intitule":"Examen mensuel obligatoire : prélèvement de 呪力 juryoku résiduel, relevé de température corporelle, archivage sous scellé.","motif":"En cas de décès, la loi devra pouvoir être décrite avec exactitude à celui qui viendra après."},{"intitule":"Interdiction de contact avec la famille directe pour la durée de l'affectation. Courrier centralisé, non transmis.","motif":"Les liens documentés constituent, dans le cas d'espèce, une condition d'application exploitable par un tiers."},{"intitule":"Décision d'exécution différée. Réexamen du dossier dans dix-huit mois.","motif":"Le vote est acquis. L'application reste suspendue tant que le secteur demeure sous-doté."}],"contres":["Ouvrir un 簡易領域 kan'i-ryōiki et ne plus en sortir : la sphère annule le coup au but, il devra venir le chercher à la main, à portée de vos doigts.","Le laisser déployer son 領域展開 ryōiki-tenkai, encaisser délibérément le premier passage, puis frapper la paroi à l'endroit qu'il regarde le moins : c'est toujours là qu'elle est la plus mince.","Superposer votre propre territoire au sien. Le plus raffiné des deux impose ses règles, et une loi mal bordée perd la superposition en moins de quatre secondes.","Attaquer avec ce qui ne porte aucune 呪力 juryoku : une balle, une poutre descellée, une rampe d'escalier. Beaucoup de lois ne voient que ce qui est chargé.","L'obliger à répéter. Chaque application coûte, une application conditionnelle coûte double : tenez douze échanges et comptez ses respirations, la treizième sera plus courte.","Identifier la condition et la rendre matériellement impossible : s'il lui faut voir, éteignez ; s'il lui faut nommer, brisez-lui la mâchoire.","Frapper le corps et jamais la loi : le 術式 jutsushiki ne renforce ni le fémur, ni la trachée, ni le genou d'appui.","Lui offrir un leurre à consommer : un vêtement laissé trois heures au contact de votre 呪力 juryoku sur une chaise absorbe une application entière.","Rentrer au contact et y rester. Il recule pour tenir une distance ; cette distance est la moitié de sa loi.","Proposer un 縛り shibari en plein échange, devant témoin : un avantage réel et immédiat contre l'abandon d'une clause, et tenir parole jusqu'au bout.","Emmener le combat dans un volume qu'il ne peut pas décrire — eau trouble, chute libre, obscurité complète : une loi qui a besoin d'un référentiel meurt sans référentiel.","Attendre. Noter l'heure de la première application et celle de la dernière : ces lois ont un plafond horaire, et il le connaît mieux que vous.","Blesser un tiers qu'il tient à garder vivant : la 反転術式 hanten-jutsushiki lui rendra la chair, pas la concentration qui maintenait la loi ouverte.","Employer un 呪具 jugu à charge propre : la lame porte l'attaque à votre place et ne donne à sa loi rien à mordre.","Se laisser toucher une fois, exactement une, pour lire la règle dans ce qu'elle fait à votre bras — puis ne plus jamais reprendre la même posture.","Lui refuser le 黒閃 kokusen : rompre la cadence à contretemps, frapper sur les demi-mesures, ne jamais laisser deux coups propres se suivre."],"rapports":["Arrivée sur zone à 03h12, 帳 tobari posé à 03h20. La loi avait déjà été appliquée ; il restait à déterminer lequel des quatre corps était celui du porteur, ce qui a été fait à 04h05 par la denture.","Le grade de la cible était porté au dossier comme 2級. La révision post-mission l'a établi à 特級. Le formulaire de réévaluation a été transmis onze jours après l'inhumation.","Le porteur a sollicité un délai de deux minutes pour appeler sa sœur. Le règlement ne prévoit pas ce délai. Il est entré à l'heure indiquée.","Aucun praticien de 反転術式 hanten-jutsushiki n'était disponible dans le secteur cette nuit-là. Le porteur est resté conscient jusqu'à 06h40. Les frais de nettoyage du hall figurent en annexe 3.","Le porteur a produit un 黒閃 kokusen lors de sa quatrième mission, ce qui a été consigné comme un élément favorable au dossier. Il est mort à la cinquième, onze jours plus tard.","Restitution des effets personnels : un téléphone, une clé de casier, un billet de train non composté pour le 14. La famille a signé le reçu sans le lire.","Ordre de repli émis à 21h48. Le porteur a répondu qu'il refermait son 領域展開 ryōiki-tenkai et qu'il sortait. Aucune transmission ultérieure n'a été enregistrée.","Le 帳 tobari a été maintenu quarante minutes au-delà du nécessaire, le temps que le sol refroidisse. L'odeur relevée sur place, vinaigre chaud, est mentionnée au procès-verbal sans explication.","Deuxième porteur de cette loi recensé en dix-neuf ans. Les deux dossiers sont classés sous la même cote. Le second n'a pas été informé de l'existence du premier.","Décès constaté à 05h55. Le remplaçant a été affecté au même secteur le jour même à 09h00, la mission n'ayant pas été achevée."]},"lexique":{"termes":[{"fr":"énergie maudite","kanji":"呪力","romaji":"juryoku","definition":"Résidu produit par les émotions négatives humaines, que le corps d'un exorciste capte, stocke et dépense pour imposer sa loi au réel."},{"fr":"technique innée","kanji":"生得術式","romaji":"seitoku-jutsushiki","definition":"Loi inscrite dans l'individu à la naissance, qui ne s'apprend pas, ne se choisit pas et ne se refuse pas : elle se déclare."},{"fr":"opérateur","kanji":"術式","romaji":"jutsushiki","definition":"Le mécanisme même de la technique, c'est-à-dire l'opération exacte que l'énergie maudite fait subir au réel."},{"fr":"exorciste","kanji":"呪術師","romaji":"jujutsushi","definition":"Porteur d'une technique innée enregistré, gradé et affecté à l'exorcisme des fléaux."},{"fr":"exorciste dévoyé","kanji":"呪詛師","romaji":"jusoshi","definition":"Porteur de technique qui emploie sa loi contre des humains et que le milieu poursuit au même titre qu'un fléau."},{"fr":"fléau","kanji":"呪霊","romaji":"jurei","definition":"Entité née de l'accumulation d'une peur humaine partagée, classée par grade et exorcisable seulement par l'énergie maudite."},{"fr":"collège d'exorcisme","kanji":"呪術高専","romaji":"jujutsu kōsen","definition":"L'établissement qui forme les exorcistes, tient leurs dossiers et distribue les ordres de mission."},{"fr":"instances supérieures","kanji":"上層部","romaji":"jōsōbu","definition":"Corps de décision anonyme du milieu de l'exorcisme, qui attribue les grades, ordonne les missions et prononce les sanctions sans jamais se montrer."},{"fr":"superviseur adjoint","kanji":"補助監督","romaji":"hojo-kantoku","definition":"Agent sans technique qui abaisse le Voile, encadre l'exorciste sur zone, relève les dépouilles et tient l'écriture du dossier."},{"fr":"Voile","kanji":"帳","romaji":"tobari","definition":"Rideau abaissé sur un secteur pour le soustraire aux non-exorcistes et empêcher ce qui s'y trouve d'en sortir."},{"fr":"serment contraignant","kanji":"縛り","romaji":"shibari","definition":"Contrat passé avec soi-même ou avec autrui qui achète de la puissance contre une amputation définie, et se retourne au premier manquement."},{"fr":"restriction céleste","kanji":"天与呪縛","romaji":"ten'yo-jubaku","definition":"Serment porté de naissance et jamais consenti, qui prélève un organe, un sens ou l'énergie maudite entière en échange d'un corps hors échelle."},{"fr":"révélation de technique","kanji":"術式開示","romaji":"jutsushiki-kaiji","definition":"Énoncé de sa propre loi devant témoin : le porteur perd le bénéfice du secret et gagne en retour un surcroît d'efficacité sur l'opérateur déclaré."},{"fr":"application directe","kanji":"術式順転","romaji":"jutsushiki-junten","definition":"Emploi de la technique dans son sens normal, l'énergie maudite étant dépensée telle quelle."},{"fr":"inversion de l'opérateur","kanji":"術式反転","romaji":"jutsushiki-hanten","definition":"Retournement de la loi elle-même, qui produit l'effet contraire du sens normal sans changer d'énergie."},{"fr":"technique inversée","kanji":"反転術式","romaji":"hanten-jutsushiki","definition":"Multiplication de deux énergies négatives qui donne une énergie positive : elle recoud la chair, jamais l'âme, et ne rend rien de ce qui a été juré."},{"fr":"extension de technique","kanji":"術式拡張","romaji":"jutsushiki-kakuchō","definition":"Application dérivée obtenue en poussant la même loi jusqu'à un usage second, sans jamais changer de loi."},{"fr":"sortie maximale","kanji":"術式最大出力","romaji":"jutsushiki-saidai-shutsuryoku","definition":"Emploi de la technique à pleine dépense d'énergie maudite, en un seul énoncé que le corps paie comptant."},{"fr":"extension du territoire","kanji":"領域展開","romaji":"ryōiki-tenkai","definition":"Déploiement du territoire inné en espace clos, où la technique du maître est garantie au but et ne peut être esquivée."},{"fr":"territoire inné","kanji":"生得領域","romaji":"seitoku-ryōiki","definition":"Paysage intérieur du porteur, unique et non modifiable, que l'extension retourne vers l'extérieur."},{"fr":"territoire simplifié","kanji":"簡易領域","romaji":"kan'i-ryōiki","definition":"Sphère défensive de rayon fixe, sans coup au but, qui neutralise la garantie d'un territoire adverse le temps qu'elle tient."},{"fr":"Éclair Noir","kanji":"黒閃","romaji":"kokusen","definition":"Coïncidence du coup et de l'énergie maudite à 0,000001 seconde près : les dégâts sont multipliés par 2,5 et l'espace se fend en noir ; on ne le provoque pas, on le reçoit."},{"fr":"outil maudit","kanji":"呪具","romaji":"jugu","definition":"Arme forgée ou chargée d'énergie maudite, qui permet de blesser un fléau à un porteur qui n'a rien à dépenser."},{"fr":"objet maudit","kanji":"呪物","romaji":"jubutsu","definition":"Reste scellé d'une entité maudite, conservé sous garde parce qu'il continue d'émettre longtemps après la mort."},{"fr":"pantin maudit","kanji":"呪骸","romaji":"jugai","definition":"Corps fabriqué et animé par l'énergie maudite, employé comme auxiliaire, comme leurre ou comme greffier."},{"fr":"résidu maudit","kanji":"残穢","romaji":"zan'e","definition":"Trace laissée par une technique sur les lieux, d'odeur et de température reconnaissables, qui permet de nommer l'auteur après coup."},{"fr":"grade","kanji":"等級","romaji":"tōkyū","definition":"Classement des exorcistes et des fléaux du 4e grade au grade spécial, qui décide de ce qu'on vous envoie affronter."},{"fr":"grade spécial","kanji":"特級","romaji":"tokkyū","definition":"Échelon hors barème, réservé à ce qu'aucun dispositif ordinaire ne traite et dont la seule mention modifie l'ordre de mission."},{"fr":"semi-premier grade","kanji":"準一級","romaji":"jun-ikkyū","definition":"Échelon intermédiaire attribué à qui remplit les conditions du premier grade sans en avoir encore fourni la preuve sur le terrain."},{"fr":"mission","kanji":"任務","romaji":"ninmu","definition":"Ordre d'intervention sur un secteur voilé, gradé comme la chose qu'on y a détectée."},{"fr":"rapport de mission","kanji":"報告書","romaji":"hōkokusho","definition":"Compte rendu rédigé après l'intervention, qui consigne les dégâts, les pertes civiles et le résidu relevé."},{"fr":"règlement de l'exorcisme","kanji":"呪術規定","romaji":"jujutsu kitei","definition":"Corpus de règles internes du milieu, qui prévoit notamment l'exécution des porteurs jugés inassimilables."},{"fr":"réceptacle","kanji":"器","romaji":"utsuwa","definition":"Corps jugé apte à contenir ce qu'on y met, et évalué à ce seul titre."},{"fr":"exorciser","kanji":"祓う","romaji":"harau","definition":"Détruire un fléau par l'énergie maudite, seul procédé qui l'empêche de se reformer."}],"libelles":{"institution":"Le collège d'exorcisme — 呪術高専 (jujutsu kōsen), greffe des techniques innées","examinateur":"Le superviseur adjoint — 補助監督 (hojo-kantoku)","formulaire":"Procès-verbal d'ouverture de technique — 術式開示調書 (jutsushiki-kaiji chōsho)","grade_verdict":"Les instances supérieures — 上層部 (jōsōbu)","fiche_titre":"Fiche d'enregistrement de technique innée — 生得術式登録票 (seitoku-jutsushiki tōrokuhyō)","sections":[{"cle":"loi","libelle":"La loi innée","kanji":"生得術式"},{"cle":"constat","libelle":"Constat d'énergie maudite","kanji":"呪力所見"},{"cle":"vecteur","libelle":"Vecteur — condition d'énonciation","kanji":"発動条件"},{"cle":"faille","libelle":"Défaut structurel de l'opérateur","kanji":"術式欠陥"},{"cle":"junten","libelle":"Application directe","kanji":"術式順転"},{"cle":"hanten","libelle":"Technique inversée","kanji":"反転術式"},{"cle":"maximum","libelle":"Sortie maximale","kanji":"術式最大出力"},{"cle":"kakucho","libelle":"Extension de technique","kanji":"術式拡張"},{"cle":"kanri","libelle":"Territoire simplifié","kanji":"簡易領域"},{"cle":"ryoiki","libelle":"Extension du territoire — territoire inné","kanji":"領域展開"},{"cle":"kokusen","libelle":"Aptitude à l'Éclair Noir","kanji":"黒閃"},{"cle":"jubaku","libelle":"Restriction céleste constatée","kanji":"天与呪縛"},{"cle":"grade","libelle":"Grade attribué","kanji":"術師等級"},{"cle":"affectation","libelle":"Affectation en mission","kanji":"任務配属"}]}}};
</script>

(function (root) {
  'use strict';

  /* ---- hachage de chaîne : cyrb128 ---------------------------------- */
  function cyrb128(str) {
    let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {

    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
  }

  /* ---- normalisation de la graine ------------------------------------
     « Matthias », « matthias » et « MATTHIAS  » sont la même personne.
     Le rituel ne se laisse pas berner par une majuscule.                */
  function normalizeSeed(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  /* ---- générateur : mulberry32 --------------------------------------- */
  function Rng(seed) {
    let a;
    if (typeof seed === 'number') a = seed >>> 0;
    else a = cyrb128(String(seed))[0];
    this._a = a >>> 0;
  }
  Rng.prototype.next = function () {
    let t = (this._a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };
  Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
  Rng.prototype.intRange = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.pick = function (arr) {
    if (!arr || !arr.length) return undefined;
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  Rng.prototype.sample = function (arr, n) { return this.shuffle(arr).slice(0, n); };
  /* loi normale par Box–Muller, bornée : sert aux stats et au tracé des sceaux */
  Rng.prototype.gauss = function (mu, sigma) {
    const u = Math.max(1e-9, this.next()), v = this.next();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
  };
  /* sous-générateur nommé : deux axes indépendants ne se contaminent pas */
  Rng.prototype.fork = function (tag) { return new Rng(cyrb128(tag + ':' + this._a)[0]); };

  /* ---- aléatoire non déterministe, réservé aux effets visuels -------- */
  const chaos = {
    f: function () { return Math.random(); },
    i: function (n) { return Math.floor(Math.random() * n); },
    r: function (a, b) { return a + Math.random() * (b - a); },
    pick: function (a) { return a[Math.floor(Math.random() * a.length)]; },
  };

  /* ---- utilitaires ---------------------------------------------------- */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    in: t => t * t * t,
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  };
  const now = () => (root.performance && root.performance.now ? root.performance.now() : Date.now());

  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const $$ = (sel, ctx) => Array.prototype.slice.call((ctx || document).querySelectorAll(sel));

  /* remplace {JETON} dans un gabarit */
  function fill(tpl, map) {
    return String(tpl || '').replace(/\{([A-Z_]+)\}/g, (m, k) =>
      (map[k] != null ? map[k] : m));
  }

  /* premières lettres capitales, en respectant les particules françaises */
  const PARTICULES = { de: 1, du: 1, des: 1, la: 1, le: 1, les: 1, 'l\'': 1, d: 1, au: 1, aux: 1, et: 1, en: 1, par: 1, sans: 1, sur: 1, a: 1 };
  function titre(s) {
    return String(s || '').split(' ').map((w, i) => {
      const low = w.toLowerCase();
      if (i > 0 && PARTICULES[low]) return low;
      /* « l'attente » garde son article en minuscule : « de l'Attente » */
      const ap = /^([ldjmtnscLDJMTNSC])['\u2019](.+)$/.exec(w);
      if (ap) {
        const tete = i > 0 ? ap[1].toLowerCase() : ap[1].toUpperCase();
        return tete + "'" + ap[2].charAt(0).toUpperCase() + ap[2].slice(1);
      }
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  JJK.core = { cyrb128, normalizeSeed, Rng, chaos, clamp, lerp, ease, now, el, $, $$, fill, titre, wait };

/* =========================================================================
   RITUEL — synthèse sonore
   Aucun fichier audio : tout est fabriqué à la volée. Le jeu respire.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { clamp } = JJK.core;

  let ctx = null, master = null, bus = {}, started = false, muted = false;
  let droneNodes = null, heartTimer = null, tension = 0;

  function ready() { return ctx && ctx.state === 'running' && !muted; }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;

    /* compresseur : les impacts ne doivent pas saturer le drone */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12;
    comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25;
    master.connect(comp); comp.connect(ctx.destination);

    /* réverbération par bruit décroissant : une salle en pierre */
    const rev = ctx.createConvolver();
    rev.buffer = impulse(2.6, 2.4);
    const revGain = ctx.createGain(); revGain.gain.value = 0.32;
    rev.connect(revGain); revGain.connect(master);
    bus.rev = rev;
    bus.dry = master;
  }

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function noiseBuffer(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function env(node, t0, a, d, peak, send) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g);
    g.connect(bus.dry);
    if (send && bus.rev) { const s = ctx.createGain(); s.gain.value = send; g.connect(s); s.connect(bus.rev); }
    return g;
  }

  /* ---- drone : la nappe d'énergie maudite ---------------------------- */
  function startDrone() {
    if (!ctx || droneNodes) return;
    const t = ctx.currentTime;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.10, t + 6);
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 220; filt.Q.value = 4;
    g.connect(filt); filt.connect(master);
    const send = ctx.createGain(); send.gain.value = 0.5; filt.connect(send); send.connect(bus.rev);

    const oscs = [];
    [36.71, 55.0, 73.42, 110.0, 164.81].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i < 2 ? 'sine' : 'sawtooth';
      o.frequency.value = f * (1 + (i - 2) * 0.0009);
      const og = ctx.createGain(); og.gain.value = [0.5, 0.35, 0.10, 0.07, 0.035][i];
      o.connect(og); og.connect(g); o.start(t);
      oscs.push(o);
    });
    /* souffle : du bruit très filtré, comme un couloir */
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(4); n.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 340; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0.05;
    n.connect(nf); nf.connect(ng); ng.connect(g); n.start(t);

    /* lent battement de filtre : la nappe n'est jamais immobile */
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.043;
    const lfoG = ctx.createGain(); lfoG.gain.value = 90;
    lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start(t);

    droneNodes = { g, filt, oscs, n, lfo, ng };
  }

  function stopDrone(fade) {
    if (!droneNodes) return;
    const d = droneNodes; droneNodes = null;
    const t = ctx.currentTime;
    d.g.gain.cancelScheduledValues(t);
    d.g.gain.setValueAtTime(Math.max(0.0002, d.g.gain.value), t);
    d.g.gain.exponentialRampToValueAtTime(0.0001, t + (fade || 1.5));
    setTimeout(() => {
      try { d.oscs.forEach(o => o.stop()); d.n.stop(); d.lfo.stop(); } catch (e) {}
    }, (fade || 1.5) * 1000 + 200);
  }

  /* la tension monte : le filtre s'ouvre, la nappe devient présente */
  function setTension(v) {
    tension = clamp(v, 0, 1);
    if (!droneNodes || !ctx) return;
    const t = ctx.currentTime;
    droneNodes.filt.frequency.cancelScheduledValues(t);
    droneNodes.filt.frequency.setTargetAtTime(200 + tension * 900, t, 1.2);
    droneNodes.g.gain.setTargetAtTime(0.09 + tension * 0.09, t, 1.5);
  }

  /* ---- grains ponctuels ---------------------------------------------- */
  function tick(freq, dur, vol) {
    if (!ready()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square'; o.frequency.value = freq || 1400;
    env(o, t, 0.001, dur || 0.02, (vol == null ? 0.05 : vol), 0.05);
    o.start(t); o.stop(t + (dur || 0.02) + 0.05);
  }

  function hit(power) {
    if (!ready()) return;
    const t = ctx.currentTime, p = clamp(power == null ? 0.5 : power, 0, 1.6);
    /* corps : un sinus qui plonge */
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180 + p * 120, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.16 + p * 0.1);
    env(o, t, 0.004, 0.30 + p * 0.2, 0.55 * p + 0.12, 0.25);
    o.start(t); o.stop(t + 0.7);
    /* claque : bruit passe-haut */
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.35);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900 + p * 1800;
    n.connect(f); env(f, t, 0.002, 0.11 + p * 0.08, 0.20 * p + 0.05, 0.35);
    n.start(t); n.stop(t + 0.4);
  }

  function slash() {
    if (!ready()) return;
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.5);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3.5;
    f.frequency.setValueAtTime(5200, t);
    f.frequency.exponentialRampToValueAtTime(420, t + 0.19);
    n.connect(f); env(f, t, 0.005, 0.22, 0.30, 0.4);
    n.start(t); n.stop(t + 0.5);
  }

  function heal() {
    if (!ready()) return;
    const t = ctx.currentTime;
    [392.0, 523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      env(o, t + i * 0.055, 0.02, 0.75, 0.075, 0.6);
      o.start(t + i * 0.055); o.stop(t + i * 0.055 + 0.9);
    });
  }

  /* le son du serment : deux notes qui se ferment comme une porte */
  function oath() {
    if (!ready()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(146.83, t);
    o.frequency.exponentialRampToValueAtTime(97.99, t + 0.9);
    env(o, t, 0.02, 1.4, 0.30, 0.7);
    o.start(t); o.stop(t + 1.8);
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(1.2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    n.connect(f); env(f, t + 0.55, 0.01, 0.5, 0.13, 0.5);
    n.start(t + 0.55); n.stop(t + 1.6);
  }

  /* ---- l'extension du territoire : le sol se dérobe ------------------ */
  function domain() {
    if (!ready()) return;
    const t = ctx.currentTime;
    /* montée inversée : un souffle aspiré */
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(3);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(120, t);
    f.frequency.exponentialRampToValueAtTime(7000, t + 2.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 2.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    n.connect(f); f.connect(g); g.connect(master);
    if (bus.rev) { const s = ctx.createGain(); s.gain.value = 0.6; g.connect(s); s.connect(bus.rev); }
    n.start(t); n.stop(t + 3);

    /* chute sub : le coup au but */
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(85, t + 2.05);
    o.frequency.exponentialRampToValueAtTime(23, t + 4.0);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t + 2.0);
    og.gain.exponentialRampToValueAtTime(0.72, t + 2.13);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 4.6);
    o.connect(og); og.connect(master);
    o.start(t + 2.0); o.stop(t + 4.8);

    /* cloche fêlée */
    [61.74, 92.5, 138.59, 233.08].forEach((fr, i) => {
      const b = ctx.createOscillator(); b.type = 'triangle';
      b.frequency.value = fr * (1 + i * 0.0031);
      env(b, t + 2.06, 0.006, 3.2 - i * 0.5, 0.16 / (i + 1) + 0.03, 0.85);
      b.start(t + 2.06); b.stop(t + 6);
    });
  }

  function whisper(len) {
    if (!ready()) return;
    const t = ctx.currentTime, d = len || 0.9;
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(d + 0.3);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 9;
    f.frequency.setValueAtTime(700, t);
    /* formants approximatifs : ça ne dit rien, et pourtant ça parle */
    for (let i = 0; i < 7; i++) {
      f.frequency.linearRampToValueAtTime(500 + Math.random() * 1500, t + (d * (i + 1)) / 7);
    }
    n.connect(f); env(f, t, 0.06, d, 0.075, 0.5);
    n.start(t); n.stop(t + d + 0.3);
  }

  function heartbeat(on, bpm) {
    if (heartTimer) { clearInterval(heartTimer); heartTimer = null; }
    if (!on || !ctx) return;
    const period = 60000 / (bpm || 72);
    const boom = (v) => {
      if (!ready()) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(72, t);
      o.frequency.exponentialRampToValueAtTime(31, t + 0.16);
      env(o, t, 0.006, 0.22, v, 0.12);
      o.start(t); o.stop(t + 0.45);
    };
    heartTimer = setInterval(() => { boom(0.30); setTimeout(() => boom(0.19), period * 0.22); }, period);
  }

  function toggleMute(force) {
    muted = (force == null) ? !muted : !!force;
    if (master) master.gain.setTargetAtTime(muted ? 0.0001 : 0.9, ctx.currentTime, 0.08);
    return muted;
  }
  function isMuted() { return muted; }

  function unlock() {
    if (started) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
    started = true;
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    startDrone();
  }

  JJK.audio = {
    unlock, init, startDrone, stopDrone, setTension, tick, hit, slash, heal,
    oath, domain, whisper, heartbeat, toggleMute, isMuted,
    get started() { return started; },
  };
})(window);
