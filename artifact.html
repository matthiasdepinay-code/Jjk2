/* =========================================================================
   RITUEL — effets
   Cinq calques de toile empilés. Le sang qu'on prend reste à l'écran.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { clamp, lerp, ease, now, chaos, Rng } = JJK.core;

  const L = {};           /* calques */
  let W = 0, H = 0, DPR = 1;
  let raf = 0, t0 = 0;
  let mounted = false;

  const state = {
    intensity: 0.15,      /* densité du champ d'énergie maudite */
    hue: '#b31217',
    hue2: '#f2c14e',
    shake: 0,
    domain: null,         /* territoire ouvert : { spec, born, sigilSeed, geo } */
    pulses: [],
    slashes: [],
    eclairs: [],
    reduced: false,
    dead: 0,              /* 0..1 : la vue se dégrade quand on meurt */
  };

  /* ---- bruit de valeur, haché : pas de dépendance, déterministe ------ */
  function h2(x, y) {
    let n = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(h2(xi, yi), h2(xi + 1, yi), u),
                lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v);
  }
  /* champ de vecteurs par gradient tourné : les particules tournoient */
  function flow(x, y, t) {
    const s = 0.0016;
    const a = vnoise(x * s + t * 0.05, y * s) * 6.283185307179586 * 2;
    return a;
  }

  /* ---- montage -------------------------------------------------------- */
  function layer(id, z, cls) {
    let c = document.getElementById(id);
    if (!c) {
      c = document.createElement('canvas');
      c.id = id;
      c.className = 'fx-layer ' + (cls || '');
      c.style.zIndex = String(z);
      document.body.appendChild(c);
    }
    return { c, x: c.getContext('2d') };
  }

  function resize() {
    DPR = Math.min(2, root.devicePixelRatio || 1);
    W = root.innerWidth; H = root.innerHeight;
    ['veil', 'ink', 'dom', 'over'].forEach(k => {
      if (!L[k]) return;
      const keep = (k === 'ink') ? L.ink.c.toDataURL() : null;
      L[k].c.width = Math.floor(W * DPR);
      L[k].c.height = Math.floor(H * DPR);
      L[k].c.style.width = W + 'px';
      L[k].c.style.height = H + 'px';
      L[k].x.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (keep) { const im = new Image(); im.onload = () => L.ink.x.drawImage(im, 0, 0, W, H); im.src = keep; }
    });
    seedParticles();
  }

  let P = [];
  function seedParticles() {
    const target = state.reduced ? 60 : clamp(Math.floor((W * H) / 5200), 90, 420);
    P = [];
    for (let i = 0; i < target; i++) {
      P.push({
        x: chaos.r(0, W), y: chaos.r(0, H),
        v: chaos.r(0.12, 0.85), life: chaos.r(0, 1),
        s: chaos.r(0.4, 2.4), a: chaos.r(0.05, 0.5),
        k: chaos.f() < 0.14 ? 1 : 0,     /* braises dorées */
      });
    }
  }

  function mount() {
    if (mounted) return;
    mounted = true;
    state.reduced = !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
    L.veil = layer('fx-veil', 0);
    L.ink = layer('fx-ink', 3);
    L.dom = layer('fx-dom', 60, 'is-hidden');
    L.over = layer('fx-over', 78);
    resize();
    root.addEventListener('resize', resize);
    t0 = now();
    loop();
  }

  /* ---- boucle --------------------------------------------------------- */
  function loop() {
    raf = requestAnimationFrame(loop);
    const t = (now() - t0) / 1000;
    drawVeil(t);
    drawOver(t);
    if (state.domain) drawDomain(t);
    applyShake();
  }

  function drawVeil(t) {
    const x = L.veil.x;
    x.clearRect(0, 0, W, H);

    /* halo : une respiration lente au centre */
    const br = 0.5 + 0.5 * Math.sin(t * 0.42);
    const g = x.createRadialGradient(W * 0.5, H * 0.52, 0, W * 0.5, H * 0.52, Math.max(W, H) * 0.72);
    g.addColorStop(0, hexA(state.hue, 0.05 + state.intensity * 0.13 + br * 0.025));
    g.addColorStop(0.45, hexA(state.hue, 0.018 + state.intensity * 0.04));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    /* particules d'énergie maudite : elles suivent le champ */
    const spd = 0.5 + state.intensity * 2.4;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const a = flow(p.x, p.y, t);
      p.x += Math.cos(a) * p.v * spd;
      p.y += Math.sin(a) * p.v * spd - 0.16 * spd;
      p.life -= 0.0022 * (0.5 + state.intensity);
      if (p.life <= 0 || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) {
        p.x = chaos.r(0, W); p.y = H + chaos.r(0, 60); p.life = 1;
      }
      const al = p.a * p.life * (0.35 + state.intensity * 1.25);
      x.fillStyle = hexA(p.k ? state.hue2 : state.hue, clamp(al, 0, 0.9));
      const s = p.s * (0.6 + state.intensity);
      x.fillRect(p.x, p.y, s, s * (1 + state.intensity * 2.2));
    }

    /* ondes de choc */
    for (let i = state.pulses.length - 1; i >= 0; i--) {
      const pu = state.pulses[i];
      const k = (t - pu.t) / pu.dur;
      if (k >= 1) { state.pulses.splice(i, 1); continue; }
      const r = ease.out(k) * pu.r;
      x.strokeStyle = hexA(pu.col, (1 - k) * 0.75);
      x.lineWidth = clamp((1 - k) * 5 * pu.w, 0.4, 14);
      x.beginPath(); x.arc(pu.x, pu.y, r, 0, 6.283185307179586); x.stroke();
      if (pu.w > 1) {
        x.strokeStyle = hexA('#ffffff', (1 - k) * 0.28);
        x.lineWidth = clamp((1 - k) * 1.6, 0.2, 3);
        x.beginPath(); x.arc(pu.x, pu.y, r * 0.94, 0, 6.283185307179586); x.stroke();
      }
    }
  }

  function drawOver(t) {
    const x = L.over.x;
    x.clearRect(0, 0, W, H);

    /* entailles : traits blancs qui traversent l'écran */
    for (let i = state.slashes.length - 1; i >= 0; i--) {
      const s = state.slashes[i];
      const k = (t - s.t) / s.dur;
      if (k >= 1) { state.slashes.splice(i, 1); continue; }
      const grow = ease.out(clamp(k * 2.4, 0, 1));
      const fade = k < 0.35 ? 1 : 1 - (k - 0.35) / 0.65;
      const cx = W * 0.5, cy = H * 0.5;
      const dx = Math.cos(s.a), dy = Math.sin(s.a);
      const len = Math.max(W, H) * 1.25 * grow;
      x.save();
      x.globalCompositeOperation = 'lighter';
      x.strokeStyle = hexA(s.col, fade * 0.95);
      x.lineWidth = s.w * (1 - k * 0.6);
      x.beginPath();
      x.moveTo(cx - dx * len + s.o * -dy, cy - dy * len + s.o * dx);
      x.lineTo(cx + dx * len + s.o * -dy, cy + dy * len + s.o * dx);
      x.stroke();
      x.restore();
    }

    drawEclairs(x, t);

    /* la mort salit l'objectif */
    if (state.dead > 0) {
      const g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * (0.42 - state.dead * 0.3),
                                       W / 2, H / 2, Math.max(W, H) * 0.78);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,' + (0.55 + state.dead * 0.45) + ')');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    }
  }

  function hexA(hex, a) {
    const h = String(hex || '#b31217').replace('#', '');
    const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    const n = parseInt(v, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + clamp(a, 0, 1) + ')';
  }

  /* ---- secousse ------------------------------------------------------- */
  function applyShake() {
    const s = state.shake;
    const stage = document.getElementById('stage');
    if (!stage) return;
    if (s <= 0.01) { stage.style.transform = ''; state.shake = 0; return; }
    const a = s * 14;
    stage.style.transform = 'translate(' + chaos.r(-a, a).toFixed(2) + 'px,' + chaos.r(-a, a).toFixed(2) + 'px) rotate(' + chaos.r(-a * 0.09, a * 0.09).toFixed(3) + 'deg)';
    state.shake *= 0.88;
  }
  /* Qui a demandé moins de mouvement ne doit pas se faire secouer l'écran :
     la puissance passe alors par la couleur, l'encre et le son. */
  function shake(p) {
    if (state.reduced) return;
    state.shake = Math.max(state.shake, clamp(p, 0, 1.6));
  }
  function reduit() { return state.reduced; }

  function pulse(x, y, r, col, w) {
    state.pulses.push({ x: x == null ? W / 2 : x, y: y == null ? H / 2 : y,
      r: r || Math.max(W, H) * 0.5, col: col || state.hue, w: w || 1,
      t: (now() - t0) / 1000, dur: 0.75 + Math.random() * 0.3 });
  }
  function slash(col, n) {
    const t = (now() - t0) / 1000;
    for (let i = 0; i < (n || 1); i++) {
      state.slashes.push({ a: chaos.r(-0.9, 0.9) + (i ? 1.6 : 0), o: chaos.r(-H * 0.22, H * 0.22),
        w: chaos.r(1.5, 5), col: col || '#fff6ee', t: t + i * 0.045, dur: 0.55 });
    }
  }

  /* ---- encre : ce qui coule ne s'efface pas -------------------------- */
  function ink(px, py, amount, col) {
    const x = L.ink.x;
    const cx = px == null ? W * chaos.r(0.2, 0.8) : px;
    const cy = py == null ? H * chaos.r(0.2, 0.8) : py;
    const n = Math.floor(4 + amount * 22);
    for (let i = 0; i < n; i++) {
      const a = chaos.r(0, 6.2832), d = Math.pow(chaos.f(), 1.7) * (30 + amount * 260);
      const r = chaos.r(1, 4 + amount * 16) * (1 - d / (40 + amount * 300));
      if (r <= 0.2) continue;
      x.fillStyle = hexA(col || state.hue, chaos.r(0.05, 0.30) * (0.4 + amount));
      x.beginPath();
      x.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, r * chaos.r(0.6, 1.6), a, 0, 6.2832);
      x.fill();
    }
    /* coulures */
    for (let i = 0; i < Math.floor(amount * 6); i++) {
      const sx = cx + chaos.r(-60, 60), sy = cy + chaos.r(-20, 20);
      const len = chaos.r(20, 60 + amount * 220), w = chaos.r(0.8, 3.2);
      const g = x.createLinearGradient(sx, sy, sx, sy + len);
      g.addColorStop(0, hexA(col || state.hue, 0.28));
      g.addColorStop(1, hexA(col || state.hue, 0));
      x.fillStyle = g; x.fillRect(sx, sy, w, len);
    }
  }
  function inkFade(a) {
    const x = L.ink.x;
    x.save(); x.globalCompositeOperation = 'destination-out';
    x.fillStyle = 'rgba(0,0,0,' + clamp(a, 0, 1) + ')'; x.fillRect(0, 0, W, H); x.restore();
  }
  function inkClear() { L.ink.x.clearRect(0, 0, W, H); }

  /* ---- inversion : le monde se retourne ------------------------------ */
  function invert(ms) {
    if (state.reduced) return;
    document.documentElement.classList.add('is-inverted');
    setTimeout(() => document.documentElement.classList.remove('is-inverted'), ms || 120);
  }
  function flash(col, ms) {
    let f = document.getElementById('fx-flash');
    if (!f) { f = document.createElement('div'); f.id = 'fx-flash'; document.body.appendChild(f); }
    f.style.background = col || '#fff';
    f.style.transition = 'none'; f.style.opacity = '1';
    requestAnimationFrame(() => {
      f.style.transition = 'opacity ' + (ms || 400) + 'ms cubic-bezier(.2,.7,.3,1)';
      f.style.opacity = '0';
    });
  }

  /* ---- le sceau : ta géométrie, et celle de personne d'autre ---------- */
  function sigil(canvas, seed, opts) {
    const o = opts || {};
    const dpr = Math.min(2, root.devicePixelRatio || 1);
    const size = o.size || Math.min(canvas.clientWidth || 320, canvas.clientHeight || 320) || 320;
    canvas.width = Math.floor(size * dpr); canvas.height = Math.floor(size * dpr);
    const x = canvas.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, size, size);
    const R = new Rng('sceau:' + seed);
    const cx = size / 2, cy = size / 2, r = size * 0.44;
    const ink1 = o.ink || '#e9e2d4', ink2 = o.accent || '#b31217';
    x.lineCap = 'round'; x.lineJoin = 'round';

    /* un fond : sans lui, les traits fins flottent sans se tenir */
    const fond = x.createRadialGradient(cx, cy, 0, cx, cy, r * 1.15);
    fond.addColorStop(0, hexA(ink2, 0.14));
    fond.addColorStop(0.62, hexA(ink2, 0.05));
    fond.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = fond; x.beginPath(); x.arc(cx, cy, r * 1.15, 0, 6.2832); x.fill();

    /* trait tremblé : trois passes légèrement décalées, comme un pinceau */
    function stroke(path, col, w, alpha, passes) {
      for (let p = 0; p < (passes || 3); p++) {
        x.save();
        x.translate(R.range(-0.7, 0.7), R.range(-0.7, 0.7));
        x.strokeStyle = hexA(col, (alpha || 0.9) / (p + 1.15));
        x.lineWidth = w * (1 - p * 0.16);
        x.beginPath(); path(x); x.stroke();
        x.restore();
      }
    }

    /* anneaux */
    const rings = R.intRange(2, 4);
    for (let i = 0; i < rings; i++) {
      const rr = r * (1 - i * R.range(0.09, 0.17));
      const broken = R.chance(0.45);
      stroke(c => {
        if (broken) {
          const seg = R.intRange(3, 9);
          for (let s = 0; s < seg; s++) {
            const a0 = (s / seg) * 6.2832 + R.range(0, 0.3);
            const a1 = a0 + (6.2832 / seg) * R.range(0.35, 0.85);
            c.moveTo(cx + Math.cos(a0) * rr, cy + Math.sin(a0) * rr);
            c.arc(cx, cy, rr, a0, a1);
          }
        } else { c.arc(cx, cy, rr, 0, 6.2832); }
      }, i === 0 ? ink1 : (R.chance(0.5) ? ink2 : ink1), R.range(1.1, 3.0), 0.95);
    }

    /* graduations : l'instrument de mesure d'une loi */
    const ticks = R.intRange(18, 72);
    x.save();
    for (let i = 0; i < ticks; i++) {
      const a = (i / ticks) * 6.2832;
      const long = i % R.intRange(3, 7) === 0;
      const r0 = r * 1.005, r1 = r * (long ? 1.075 : 1.035);
      x.strokeStyle = hexA(long ? ink2 : ink1, long ? 0.8 : 0.35);
      x.lineWidth = long ? 1.6 : 0.8;
      x.beginPath();
      x.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      x.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      x.stroke();
    }
    x.restore();

    /* polygone étoilé : le cœur de la figure */
    const n = R.intRange(5, 13);
    const step = R.intRange(2, Math.max(2, Math.floor(n / 2)));
    const pr = r * R.range(0.62, 0.86);
    const pts = [];
    const rot = R.range(0, 6.2832);
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * 6.2832;
      pts.push([cx + Math.cos(a) * pr, cy + Math.sin(a) * pr]);
    }
    stroke(c => {
      let i = 0;
      c.moveTo(pts[0][0], pts[0][1]);
      for (let k = 0; k < n; k++) { i = (i + step) % n; c.lineTo(pts[i][0], pts[i][1]); }
      c.closePath();
    }, ink1, R.range(1.7, 3.4), 1.0);

    /* cordes secondaires */
    const chords = R.intRange(4, 12);
    for (let i = 0; i < chords; i++) {
      const a = R.pick(pts), b = R.pick(pts);
      stroke(c => { c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }, ink2, R.range(0.8, 2.0), 0.62, 2);
    }

    /* nœuds */
    pts.forEach(p => {
      if (!R.chance(0.7)) return;
      x.fillStyle = hexA(R.chance(0.35) ? ink2 : ink1, 0.85);
      x.beginPath(); x.arc(p[0], p[1], R.range(2.0, 4.8), 0, 6.2832); x.fill();
    });

    /* glyphe central : traits sur une grille, à la manière d'un caractère */
    const gs = size * R.range(0.16, 0.26);
    const gx = cx - gs / 2, gy = cy - gs / 2;
    const cells = R.intRange(3, 5);
    const strokes = R.intRange(7, 13);
    for (let i = 0; i < strokes; i++) {
      const hz = R.chance(0.55);
      const a0 = R.int(cells), b0 = R.int(cells), b1 = R.int(cells);
      const x0 = gx + (hz ? (b0 / (cells - 1)) * gs : (a0 / (cells - 1)) * gs);
      const y0 = gy + (hz ? (a0 / (cells - 1)) * gs : (b0 / (cells - 1)) * gs);
      const x1 = gx + (hz ? (b1 / (cells - 1)) * gs : (a0 / (cells - 1)) * gs);
      const y1 = gy + (hz ? (a0 / (cells - 1)) * gs : (b1 / (cells - 1)) * gs);
      stroke(c => {
        c.moveTo(x0, y0);
        c.quadraticCurveTo((x0 + x1) / 2 + R.range(-4, 4), (y0 + y1) / 2 + R.range(-4, 4), x1, y1);
      }, i === 0 ? ink2 : ink1, R.range(2.6, 6.4), 1.0, 2);
    }

    /* arcs isolés en marge */
    for (let i = 0; i < R.intRange(1, 5); i++) {
      const rr = r * R.range(0.9, 1.12), a0 = R.range(0, 6.2832), a1 = a0 + R.range(0.2, 1.3);
      stroke(c => c.arc(cx, cy, rr, a0, a1), ink2, R.range(0.8, 2.6), 0.6, 2);
    }
    return canvas;
  }

  /* ---- extension du territoire --------------------------------------- */
  function domainGeo(seed) {
    const R = new Rng('territoire:' + seed);
    const pillars = [];
    for (let i = 0; i < R.intRange(7, 16); i++) {
      pillars.push({ x: R.next(), w: R.range(0.01, 0.06), h: R.range(0.25, 0.95), d: R.range(0.15, 1) });
    }
    const rings = [];
    for (let i = 0; i < R.intRange(3, 8); i++) {
      rings.push({ x: R.range(0.05, 0.95), y: R.range(0.05, 0.7), r: R.range(0.03, 0.22), s: R.range(-1, 1), t: R.range(0, 6.28) });
    }
    return { pillars, rings, horizon: R.range(0.55, 0.78), grid: R.intRange(8, 22), tilt: R.range(-0.06, 0.06) };
  }

  function drawDomain(t) {
    const D = state.domain, x = L.dom.x;
    const age = t - D.born;
    const open = clamp(age / 1.6, 0, 1);
    x.clearRect(0, 0, W, H);

    /* fond : le territoire est un intérieur, il n'a pas de ciel */
    x.fillStyle = D.invert ? '#e9e2d4' : '#050506';
    x.globalAlpha = open;
    x.fillRect(0, 0, W, H);
    x.globalAlpha = 1;
    if (open < 1) return;

    const line = D.invert ? '#0a0a0c' : '#e9e2d4';
    const acc = D.accent || '#b31217';
    const g = D.geo, hy = H * g.horizon;

    /* sol en fuite */
    x.strokeStyle = hexA(line, 0.42); x.lineWidth = 1;
    for (let i = 0; i <= g.grid; i++) {
      const k = i / g.grid;
      const y = hy + Math.pow(k, 2.1) * (H - hy) * 1.3;
      x.globalAlpha = 0.85 - k * 0.45;
      x.beginPath(); x.moveTo(-W * 0.2, y); x.lineTo(W * 1.2, y + g.tilt * W); x.stroke();
    }
    for (let i = -6; i <= g.grid + 6; i++) {
      const k = i / g.grid;
      x.globalAlpha = 0.5;
      x.beginPath(); x.moveTo(W * 0.5 + (k - 0.5) * W * 0.35, hy);
      x.lineTo(W * 0.5 + (k - 0.5) * W * 3.2, H * 1.25); x.stroke();
    }
    x.globalAlpha = 1;

    /* l'horizon brûle : c'est la seule source de lumière du lieu */
    const hg = x.createLinearGradient(0, hy - H * 0.16, 0, hy + H * 0.05);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(1, hexA(acc, D.invert ? 0.14 : 0.24));
    x.fillStyle = hg; x.fillRect(0, hy - H * 0.16, W, H * 0.21);
    x.strokeStyle = hexA(line, 0.85); x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(0, hy); x.lineTo(W, hy + g.tilt * W); x.stroke();

    /* piliers : des colonnes sans toit */
    g.pillars.forEach((p, i) => {
      const px = p.x * W, pw = p.w * W * (0.4 + p.d);
      const ph = p.h * hy * (0.5 + p.d * 0.7);
      const drift = Math.sin(t * 0.12 + i) * 4 * p.d;
      x.fillStyle = D.invert ? 'rgba(233,226,212,.55)' : 'rgba(5,5,6,.72)';
      x.fillRect(px - pw / 2 + drift, hy - ph, pw, ph);
      x.strokeStyle = hexA(line, 0.22 + p.d * 0.55);
      x.lineWidth = 1.2;
      x.strokeRect(px - pw / 2 + drift, hy - ph, pw, ph);
      x.strokeStyle = hexA(acc, 0.28 * p.d);
      x.beginPath(); x.moveTo(px + drift, hy - ph); x.lineTo(px + drift, hy); x.stroke();
    });

    /* anneaux suspendus */
    g.rings.forEach((rg, i) => {
      const rr = rg.r * Math.min(W, H);
      const a = rg.t + t * rg.s * 0.22;
      x.save();
      x.translate(rg.x * W, rg.y * H + Math.sin(t * 0.3 + i) * 6);
      x.rotate(a);
      x.strokeStyle = hexA(i % 3 === 0 ? acc : line, 0.35);
      x.lineWidth = 1.2;
      x.beginPath(); x.ellipse(0, 0, rr, rr * (0.18 + 0.5 * Math.abs(Math.sin(a))), 0, 0, 6.2832); x.stroke();
      x.restore();
    });

    /* le sceau, immense, au fond */
    if (D.sigilCanvas) {
      const s = Math.min(W, H) * 0.86;
      x.save();
      x.globalAlpha = 0.20 + 0.07 * Math.sin(t * 0.5);
      x.translate(W / 2, hy * 0.72);
      x.rotate(t * 0.035);
      x.drawImage(D.sigilCanvas, -s / 2, -s / 2, s, s);
      x.restore();
    }

    /* vignettage : on ne sort pas d'ici par les bords */
    const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, D.invert ? 'rgba(233,226,212,0.78)' : 'rgba(0,0,0,0.80)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);
  }

  function domainOpen(spec) {
    const t = (now() - t0) / 1000;
    state.domain = {
      born: t, geo: domainGeo(spec.seed || 'x'),
      accent: spec.accent || state.hue,
      invert: !!spec.invert,
      sigilCanvas: spec.sigilCanvas || null,
    };
    L.dom.c.classList.remove('is-hidden');
    document.body.classList.add('in-domain');
  }
  function domainClose() {
    state.domain = null;
    L.dom.c.classList.add('is-hidden');
    L.dom.x.clearRect(0, 0, W, H);
    document.body.classList.remove('in-domain');
  }

  /* ---- 黒閃 : l'espace se fend ----------------------------------------
     Ce n'est pas une lueur, c'est une fracture. Le trait est NOIR, cerné
     d'un liseré blanc, et il fait un trou dans l'image.                  */
  function eclair() {
    const t = (now() - t0) / 1000;
    const cx = W * chaos.r(0.35, 0.65), cy = H * chaos.r(0.35, 0.65);
    /* une fracture, pas un éclair : des segments courts, très anguleux,
       qui repartent dans tous les sens depuis un seul point d'impact */
    const branches = [];
    for (let b = 0; b < 5; b++) {
      const pts = [[cx, cy]];
      let a = (b / 5) * 6.2832 + chaos.r(-0.5, 0.5), x = cx, y = cy;
      const seg = 12 + chaos.i(7);
      for (let i = 0; i < seg; i++) {
        a += chaos.r(-1.25, 1.25);
        const l = chaos.r(18, 62);
        x += Math.cos(a) * l; y += Math.sin(a) * l;
        pts.push([x, y]);
        /* éclats latéraux : la fissure essaime */
        if (chaos.f() < 0.22) {
          const a2 = a + chaos.r(-2, 2), l2 = chaos.r(14, 44);
          branches.push([[x, y], [x + Math.cos(a2) * l2, y + Math.sin(a2) * l2]]);
        }
      }
      branches.push(pts);
    }
    state.eclairs.push({ branches, t, dur: 0.85, x: cx, y: cy });
    if (!state.reduced) { state.shake = Math.max(state.shake, 1.5); }
    /* le filtre porte sur BODY : appliqué à <html>, Chromium ne le peint pas */
    document.body.classList.add('en-kokusen');
    setTimeout(() => document.body.classList.remove('en-kokusen'), 560);
  }

  function drawEclairs(x, t) {
    for (let i = state.eclairs.length - 1; i >= 0; i--) {
      const e = state.eclairs[i];
      const k = (t - e.t) / e.dur;
      if (k >= 1) { state.eclairs.splice(i, 1); continue; }
      const ouvre = ease.out(clamp(k * 3, 0, 1));
      const fade = k < 0.45 ? 1 : 1 - (k - 0.45) / 0.55;
      /* halo blanc : le bord de la fracture */
      x.save();
      x.lineCap = 'round'; x.lineJoin = 'round';
      e.branches.forEach(pts => {
        const n2 = Math.max(2, Math.floor(pts.length * ouvre));
        x.strokeStyle = 'rgba(255,255,255,' + (fade * 0.95) + ')';
        x.lineWidth = 19;
        x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
        for (let j = 1; j < n2; j++) x.lineTo(pts[j][0], pts[j][1]);
        x.stroke();
        x.strokeStyle = 'rgba(0,0,0,' + fade + ')';
        x.lineWidth = 13;
        x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
        for (let j = 1; j < n2; j++) x.lineTo(pts[j][0], pts[j][1]);
        x.stroke();
      });
      /* le point d'impact : un disque noir cerné de blanc */
      const r = 34 * ouvre * (1 + k * 0.9);
      x.strokeStyle = 'rgba(255,255,255,' + (fade * 0.9) + ')';
      x.lineWidth = 9;
      x.beginPath(); x.arc(e.x, e.y, r, 0, 6.2832); x.stroke();
      x.fillStyle = 'rgba(0,0,0,' + (fade * 0.92) + ')';
      x.beginPath(); x.arc(e.x, e.y, r * 0.82, 0, 6.2832); x.fill();
      x.restore();
    }
  }

  /* ---- le Voile (帳) --------------------------------------------------
     Avant d'intervenir, on abaisse un rideau sur le secteur. Personne, au
     dehors, ne verra rien. C'est le seul geste que tous les exorcistes
     partagent, et c'est aussi une transition d'écran.                    */
  function voile(opts) {
    const o = opts || {};
    let n = document.getElementById('fx-voile');
    if (!n) {
      n = document.createElement('div');
      n.id = 'fx-voile';
      n.innerHTML = '<i class="couture"></i><div class="dit"></div><div class="kanji">帳</div>';
      document.body.appendChild(n);
    }
    const dit = n.querySelector('.dit');
    dit.textContent = o.texte || '';
    n.classList.remove('leve');
    n.classList.add('tombe');
    if (JJK.audio) { JJK.audio.slash(); setTimeout(() => JJK.audio.hit(0.9), 260); }
    shake(0.4);
    return new Promise(res => {
      setTimeout(() => {
        if (o.pendant) { try { o.pendant(); } catch (e) {} }

          n.classList.remove('tombe');
          n.classList.add('leve');

  function type(node, text, opts) {

    const speed = o.speed || 26;
    node.textContent = '';
    node.classList.add('typing');
    let i = 0, stop = false;
    const p = new Promise(res => {
      function step() {
        if (stop) return res();
        if (i >= text.length) { node.classList.remove('typing'); return res(); }

     et ce tirage porte un numéro. Deux porteurs peuvent déclarer la même
     chose et ne pas porter la même loi : ils n'ont pas le même 生得術式.  */

      archetype: corps.archetype, variante: isFinite(v) ? codeVariante(v) : 0,

  const PREPO = /^(de |du |des |d'|à |au |aux |en |sans |sous |sur |par |contre |pour |avant |après )/i;
  function accorder(mot, genre, pluriel) {

    if (/^[a-z]/.test(m) && / /.test(m)) return m;  /* locution : on n'y touche pas */
    const fem = (genre === 'f') || (genre === 'e' && false);

  const MOT_OUTIL = /^(?:de|du|des|la|le|les|un|une|à|au|aux|en|sans|sous|sur|par|et|contre|dans|pour|avant|après|depuis|entre|chez|vers|selon)$|^(?:d|l|qu|jusqu|puisqu|lorsqu)['\u2019]$|^(?:jusqu|qu)['\u2019](?:\u00e0|au|aux)$/i;

    if (!m || INVARIABLE.test(m)) return m;
    if (/[sxz]$/.test(m)) return m;
    if (/(au|eau|eu)$/.test(m)) return m + 'x';
    if (/al$/.test(m)) return m.replace(/al$/, 'aux');
    if (/ail$/.test(m)) return m;
    return m + 's';
  }
  /* « lait tourné » → « laits tournés ». Dès qu'une préposition apparaît,
     la suite est un complément : on n'y touche plus. « peau de tambour »
     donne « peaux de tambour », jamais « peaux de tambours ».            */
  function plurielDe(mot) {
    const m = String(mot || '').trim();
    if (!m) return m;
    const mots = m.split(' ');
    let stop = false;
    return mots.map(w => {
      if (stop) return w;
      if (INVARIABLE.test(w) && !/^(la|le)$/i.test(w)) { stop = true; return w; }
      return plurielMot(w);
    }).join(' ');
  }

  /* « La Rouille » → { nu: 'Rouille', genre: 'f', art: 'la' } */
  function decoupe(nom) {
    const s = String(nom || '').trim();
    let m = /^(Les|Le|La|L['’]|Des|Du|De la|De l['’]|De)\s*/i.exec(s);
    if (!m) return { nu: s, genre: 'm', art: 'le', pluriel: false };
    const a = m[1].toLowerCase().replace('’', "'");
    const nu = s.slice(m[0].length).trim() || s;
    const pluriel = a === 'les' || a === 'des';
    const genre = pluriel ? 'p' : (a === 'la' || a === 'de la' ? 'f' : (a === "l'" || a === "de l'" ? (VOY.test(nu[0]) ? 'e' : 'm') : 'm'));
    const art = pluriel ? 'les' : (genre === 'f' ? 'la' : (genre === 'e' ? "l'" : 'le'));
    return { nu, genre, art, pluriel };
  }
  /* « L'Attente » ne dit pas son genre. Le registre le sait : sans cette
     table, on écrirait « Attente Confidentiel ».                        */
  const GENRE_ESSENCE = {
    echo: 'm', attente: 'f', inventaire: 'm', anesthesie: 'f',
    'eau-dormante': 'f', ankylose: 'f', anonymat: 'm',
  };
  function genreEssence(essence, decoupee) {
    const g = GENRE_ESSENCE[essence && essence.id];
    if (g) return g;
    if (decoupee.pluriel) return 'p';
    if (decoupee.genre === 'e') return /(tion|sion|ance|ence|ure|ité|esse|ie|ée|elle)$/i.test(decoupee.nu) ? 'f' : 'm';
    return decoupee.genre;
  }

  function avecArticle(nom) {
    const d = decoupe(nom);
    return fr(d.art + (d.art === "l'" ? '' : ' ') + d.nu);
  }

  /* ---- composition japonaise ----------------------------------------- */
  const KANJI_SUF = [
    { k: '術', r: 'jutsu' }, { k: '呪法', r: 'juhō' }, { k: '縛', r: 'baku' },
    { k: '律', r: 'ritsu' }, { k: '蝕', r: 'shoku' }, { k: '帳', r: 'chō' },
    { k: '環', r: 'kan' }, { k: '秤', r: 'hakari' }, { k: '骸', r: 'mukuro' },
    { k: '灯', r: 'tō' }, { k: '簿', r: 'bo' }, { k: '轍', r: 'wadachi' },
  ];
  const KANJI_PRE = [
    { k: '', r: '' }, { k: '', r: '' }, { k: '逆', r: 'gyaku' }, { k: '真', r: 'shin' },
    { k: '黒', r: 'koku' }, { k: '無', r: 'mu' }, { k: '深', r: 'shin' }, { k: '虚', r: 'kyo' },
  ];

  /* ---- accès tolérant au corpus --------------------------------------- */
  function C() { return JJK.CORPUS || {}; }
  function liste(k, fallback) {
    const c = C();
    const v = c[k];
    if (Array.isArray(v) && v.length) return v;
    if (v && typeof v === 'object') {
      for (const key in v) if (Array.isArray(v[key]) && v[key].length) return v[key];
    }
    return fallback || [];
  }

  /* affinité stable entre deux entrées : ni hasard, ni arbitraire */
  function affinite(a, b) { return cyrb128('lien:' + a + '::' + b)[1] % 1000; }
  function meilleur(pool, ref, R, top) {
    if (!pool.length) return null;
    const notes = pool.map(o => ({ o, n: affinite(ref, o.id || o.nom || '') }));
    notes.sort((x, y) => y.n - x.n);
    const court = notes.slice(0, Math.max(1, Math.min(top || 4, notes.length)));
    return R.pick(court).o;
  }

  /* ---- noms de technique ---------------------------------------------- */
  /* Chaque patron est répété selon le poids qu'on veut lui donner : les
     tournures pauvres en entropie (la loi seule) doivent rester rares,
     sinon deux graines sur dix portent le même nom.                      */
  const PATRONS = [
    [1, p => fr(p.LOI)],
    [3, p => fr(p.LOI + ' de ' + p.ESSENCE_ART)],
    [2, p => fr('Technique de ' + p.ESSENCE_ART)],
    [3, p => fr(p.NOMBRE_MATIERE)],
    [3, p => fr(p.ESSENCE_NU + ' ' + accorder(p.SUFFIXE, p.GENRE))],
    [3, p => fr(p.PREFIXE + ' de ' + p.ESSENCE_ART)],
    [3, p => fr(p.MATIERE + ' de ' + p.ESSENCE_ART)],
    [3, p => fr(p.LOI + ' : ' + p.NOMBRE_MATIERE)],
    [3, p => fr(p.ESSENCE_ART + ' ' + accorder(p.SUFFIXE, p.GENRE))],
    [2, p => fr(p.PREFIXE + ' ' + accorder(p.SUFFIXE, 'm'))],
    [2, p => fr('Doctrine de ' + p.ESSENCE_ART)],
    [3, p => fr(p.ORGANE + ' de ' + p.ESSENCE_ART)],
    [3, p => fr(p.ESSENCE_ART + ' de ' + p.MATIERE)],
    [3, p => fr(p.PREFIXE + ' de ' + p.MATIERE)],
    [2, p => fr(p.MATIERE + ', ' + accorder(p.SUFFIXE, 'm'))],
    [2, p => fr(p.ORGANE + ' de ' + p.MATIERE)],
  ].reduce((acc, [n, f]) => { for (let i = 0; i < n; i++) acc.push(f); return acc; }, []);

  /* ---- la forge --------------------------------------------------------
     Une technique n'est plus lue dans un nom : elle est DÉCLARÉE. Les dix
     rubriques du formulaire restreignent le corpus et fixent la mécanique ;
     ce qui reste de latitude est tiré du code de dossier, donc reproductible.
     Deux porteurs qui déclarent la même chose portent la même loi. C'est
     le principe même d'un registre.                                      */

  function T() { return JJK.taxo; }

  /* Une entrée appartient à une famille soit parce que la taxonomie le dit,
     soit parce qu'elle porte elle-même le champ. Ainsi, ajouter une essence
     au corpus avec sa famille suffit : rien à recâbler ici.              */
  function parFamille(entrees, ids, famille) {
    const set = {};
    (ids || []).forEach(i => { set[i] = 1; });
    const gardes = entrees.filter(e => set[e.id] || (famille && e.famille === famille));
    return gardes.length ? gardes : entrees;
  }

  /* classement stable : la famille d'abord, l'affinité ensuite */
  function choisir(pool, ref, R, top) {
    if (!pool.length) return null;
    const notes = pool.map(o => ({ o, n: affinite(ref, o.id || o.nom || '') }));
    notes.sort((a, b) => b.n - a.n);
    return R.pick(notes.slice(0, Math.max(1, Math.min(top || 3, notes.length)))).o;
  }

  /* accès à une sous-liste nommée du corpus, sans supposer sa présence */
  function sousListe(cle, sous) {
    const bloc = (C() || {})[cle];
    if (!bloc) return [];
    const v = bloc[sous];
    return Array.isArray(v) ? v : [];
  }

  /* ---- 天与呪縛 : cinq formes mécaniques, habillées par le corpus ------
     Une restriction céleste n'est pas signée : on naît avec. Elle prive
     réellement, et ce qu'elle rend ne compense jamais tout à fait.       */
  const FORMES_JUBAKU = [
    { id: 'sansEnergie', mots: /énergie maudite|呪力|sans 呪力|réserve|aucun flux/i,
      perte: 'Réserve de 呪力 réduite de moitié.', gain: 'Le corps compense : frappes trois fois plus lourdes.',
      eff: { enMaxDelta: -5, frappeMult: 3.0, degatsMult: 0.85 } },
    { id: 'sansVue', mots: /vue|yeux|voir|aveugle|regard|visage/i,
      perte: 'Les points de vie adverses ne te seront jamais montrés.', gain: 'Tu lis le flux : +30 % de critique.',
      eff: { masqueVieEnnemi: true, critBonus: 0.30 } },
    { id: 'sansDouleur', mots: /douleur|souffrance|sentir|nerf|insensib/i,
      perte: '−25 % de points de vie maximum : rien ne t\'avertit.', gain: 'Fracture et Saignée n\'ont pas de prise sur toi.',
      eff: { pvMaxMult: 0.75, immunise: ['fracture', 'saignee'] } },
    { id: 'sansSommeil', mots: /sommeil|dormir|nuit|repos|fatigue/i,
      perte: '−15 % de points de vie maximum. Le corps ne se répare jamais tout à fait.', gain: '+2 呪力 par battement.',
      eff: { pvMaxMult: 0.85, energieBonus: 2 } },
    { id: 'sansAge', mots: /âge|vieilli|croissance|grandir|enfant|temps qui/i,
      perte: '−20 % de dégâts : rien ne se durcit, jamais.', gain: '+30 % de points de vie maximum.',
      eff: { degatsMult: 0.80, pvMaxMult: 1.30 } },
  ];

  function tirerJubaku(code, R) {
    /* elle est rare : environ un porteur sur cinq en porte une */
    if ((cyrb128('jubaku:' + code)[3] % 100) >= 22) return null;
    const src = sousListe('jubaku', 'restrictions');
    const forme = FORMES_JUBAKU[cyrb128('forme:' + code)[1] % FORMES_JUBAKU.length];
    let choisi = null;
    src.forEach(x => {
      if (choisi) return;
      const texte = [x.privation, x.nom, x.contrepartie].join(' ');
      if (forme.mots.test(texte)) choisi = x;
    });
    if (!choisi && src.length) choisi = R.pick(src);
    return {
      id: forme.id,
      nom: (choisi && choisi.nom) || 'Restriction céleste',
      kanji: (choisi && choisi.kanji) || '天与呪縛', romaji: (choisi && choisi.romaji) || "ten'yo-jubaku",
      privation: (choisi && choisi.privation) || forme.perte,
      contrepartie: (choisi && choisi.contrepartie) || forme.gain,
      constat: (choisi && choisi.constat) || '',
      rarete: (choisi && choisi.rarete) || 3,
      perte: forme.perte, gain: forme.gain, eff: forme.eff,
    };
  }

  function forgeDepuisDeclaration(decl, variante) {
    const tx = T();
    const codeBase = tx.codeDeclaration(decl);
    const v = tx.codeVariante(variante || 0);
    const code = codeBase + (v ? '/' + v : '');
    const R = new Rng('technique:' + code);

    const essences = liste('essences'), vecteurs = liste('vecteurs'), lois = liste('lois');
    const domaines = liste('domaines'), matieres = (C().matieres || {});
    const nomen = C().nomenclature || {};

    /* 1. le substrat choisit la famille d'essences */
    const essence = choisir(parFamille(essences, tx.ESSENCES[decl.substrat], decl.substrat), 'e:' + code, R.fork('essence'), 4)
      || { id: 'x', nom: 'La Cendre', kanji: '灰', romaji: 'hai', concept: '', sensoriel: '', couleur: '#b31217', emotion_source: '' };

    /* 2. l'opérateur restreint les archétypes de loi */
    const archs = tx.ARCHETYPES[decl.operateur] || [];
    const loisOk = lois.filter(l => archs.indexOf(l.archetype) >= 0);
    const loi = choisir(loisOk.length ? loisOk : lois, essence.id + ':' + code, R.fork('loi'), 3)
      || { id: 'y', nom: 'Loi muette', enonce: '', archetype: 'seuil' };

    /* 3. la condition et la portée notent les vecteurs ; on ne filtre pas
          durement, sinon certaines combinaisons ne trouveraient rien */
    const idsCond = tx.CONDITIONS[decl.condition] || [];
    const porteesOk = tx.PORTEES[decl.portee] || [];
    const notesVec = vecteurs.map(v => ({
      v, n: (idsCond.indexOf(v.id) >= 0 ? 1000 : 0)
         + (porteesOk.indexOf(v.portee) >= 0 ? 600 : 0)
         + affinite(loi.id + code, v.id),
    })).sort((a, b) => b.n - a.n);
    const vecteur = (R.fork('vecteur').pick(notesVec.slice(0, 3)) || { v: null }).v
      || { id: 'z', nom: 'Par le contact', condition: '', portee: 'contact' };
    /* Le Bureau ne relève une incompatibilité que si l'écart est réel :
       le corpus n'offre pas un vecteur pour chaque croisement, et une
       rubrique voisine (courte au lieu de moyenne) reste tenue.          */
    const ECHELLE = { 'contact': 0, 'courte': 1, 'moyenne': 2, 'longue': 3, 'illimitée conditionnelle': 3 };
    const DECLAREE = { contact: 0, courte: 1, moyenne: 2, lointaine: 3 };
    const ecart = Math.abs((ECHELLE[vecteur.portee] == null ? 2 : ECHELLE[vecteur.portee]) - (DECLAREE[decl.portee] == null ? 2 : DECLAREE[decl.portee]));
    const tenu = {
      condition: idsCond.indexOf(vecteur.id) >= 0,
      portee: porteesOk.indexOf(vecteur.portee) >= 0 || ecart <= 1,
      ecart,
    };

    /* 4. le territoire déclaré choisit la famille d'extensions */
    const domaine = choisir(parFamille(domaines, tx.TERRITOIRES[decl.territoire], decl.territoire), loi.id + ':' + code, R.fork('domaine'), 3) || null;

    /* 5. le siège choisit l'organe */
    const re = tx.SIEGES[decl.siege];
    const organesOk = (matieres.organes || []).filter(o => re && re.test(o));
    const organeBrut = R.fork('organe').pick(organesOk.length ? organesOk : (matieres.organes || ['la moelle']));

    const matiere = raccourcir(R.pick(matieres.matieres || ['cendre']), 3);
    const nombres = (matieres.nombres || ['Neuf'])
      .filter(x => !/^(un|une|un demi|une demie|zéro)$/i.test(String(x).trim()));
    const nombre = R.pick(nombres.length ? nombres : ['Neuf']);
    const lieu = R.pick(matieres.lieux || ['une salle sans porte']);
    const organe = raccourcir(String(organeBrut)
      .replace(/^(les|le|la|l[\u2019\']|des|du|de\s+l[\u2019\']|de\s+la|de)\s*/i, ''), 3);
    const prefixe = R.pick(nomen.prefixes || ['Rite']);
    const suffixe = R.pick(nomen.suffixes || ['Perpétuel']);

    const d = decoupe(essence.nom);
    const matiereN = titre(plurielDe(matiere));
    const jetons = {
      ESSENCE: essence.nom, ESSENCE_NU: d.nu, ESSENCE_ART: avecArticle(essence.nom),
      GENRE: genreEssence(essence, d),
      LOI: loi.nom, VECTEUR: vecteur.nom, NOMBRE: nombre,
      MATIERE: titre(matiere), NOMBRE_MATIERE: nombre + ' ' + matiereN,
      PREFIXE: prefixe, SUFFIXE: suffixe, ORGANE: titre(organe),
    };
    const nom = titre(sansJointFinal(PATRONS[R.int(PATRONS.length)](jetons))).replace(/\s+/g, ' ').trim();

    const kp = R.pick(KANJI_PRE), ks = R.pick(KANJI_SUF);
    const nomJp = (kp.k || '') + (essence.kanji || '呪') + ks.k;
    const romaji = ((kp.r ? kp.r + '-' : '') + (essence.romaji || 'ju') + '-' + ks.r).replace(/--+/g, '-');
    const couleur = essence.couleur && /^#[0-9a-f]{3,8}$/i.test(essence.couleur) ? essence.couleur : '#b31217';

    /* 術式拡張 : la même loi, prise sous un autre angle. On l'apparie par
       archétype pour qu'elle découle vraiment de la loi du porteur. */
    const kExt = sousListe('kakucho', 'extensions');
    const kOk = kExt.filter(x => x.archetype === (loi.archetype || 'seuil'));
    const kakucho = choisir(kOk.length ? kOk : kExt, 'k:' + code, R.fork('kakucho'), 3) || null;

    /* 簡易領域 : une frontière, pas un paysage. Pas de coup au but. */
    const kanri = R.fork('kanri').pick(sousListe('kanri', 'simplifies')) || null;
    /* 黒閃 : on ne le provoque pas, on le reçoit. */
    const kokusen = R.fork('kokusen').pick(sousListe('kanri', 'kokusen')) || null;
    /* ce à quoi les 上層部 affectent ce porteur, et comment on le neutralise */
    const affectation = R.fork('affectation').pick(sousListe('affectation', 'affectations')) || null;
    const contre = R.fork('contre').pick(sousListe('affectation', 'contres')) || '';
    const jubaku = tirerJubaku(code, R.fork('jubaku'));

    return {
      declaration: decl, code, codeBase, variante: v,
      nom, nomJp, romaji, couleur,
      essence, vecteur, loi, domaine,
      matiere, nombre, lieu, organe,
      sigil: 'sceau:' + code,
      archetype: loi.archetype || 'seuil',
      junten: loi.consequence || '',
      hanten: loi.inversion || '',
      revers: loi.inversion || '',
      maximum: loi.maximum || '',
      kakucho, kanri, kokusen, affectation, contre, jubaku,
      tenu,
    };
  }

  /* ---- ce que la déclaration fait à la mécanique ----------------------- */
  function profilDeclaration(decl) {
    const tx = T();
    const lean = { vigueur: 1, flux: 1, tranchant: 1, lucidite: 1, inversion: 1 };
    const mod = {};
    const notes = [];
    tx.AXES.forEach(a => {
      const e = tx.effet(a.id, decl[a.id]);
      AXES.forEach(k => { if (e.lean[k]) lean[k] *= e.lean[k]; });
      for (const k in e.mod) {
        const v = e.mod[k];
        if (typeof v === 'number') {
          /* les multiplicatifs se multiplient, les additifs s'additionnent */
          if (/Mult$/.test(k)) mod[k] = (mod[k] == null ? 1 : mod[k]) * v;
          else mod[k] = (mod[k] || 0) + v;
        } else mod[k] = v;
      }
      if (e.note) notes.push({ axe: a.id, tag: decl[a.id], note: e.note });
    });
    return { lean, mod, notes };
  }

  /* ---- le réceptacle ---------------------------------------------------
     La déclaration incline le corps ; l'examen le décide. Les deux comptent,
     et le budget reste fixe : on ne peut pas être bon partout.           */
  const AXES = ['vigueur', 'flux', 'tranchant', 'lucidite', 'inversion'];

  function forgeReceptacle(decl, poidsExamen, jubaku) {
    const tx = T();
    const prof = profilDeclaration(decl);
    /* la restriction céleste n'a pas été signée : elle s'applique quand même */
    if (jubaku && jubaku.eff) {
      for (const k in jubaku.eff) {
        const val = jubaku.eff[k];
        if (typeof val === 'number') {
          if (/Mult$/.test(k)) prof.mod[k] = (prof.mod[k] == null ? 1 : prof.mod[k]) * val;
          else prof.mod[k] = (prof.mod[k] || 0) + val;
        } else prof.mod[k] = val;
      }
      prof.notes.push({ axe: 'restriction', note: jubaku.perte + ' ' + jubaku.gain });
    }
    const poids = poidsExamen || {};
    const code = tx.codeDeclaration(decl);
    const R = new Rng('corps:' + code + ':' + AXES.map(k => poids[k] || 0).join(''));

    const brut = {};
    let somme = 0;
    AXES.forEach(k => {
      /* La racine comprime les extrêmes : une déclaration et un examen qui
         poussent tous deux dans le même sens doivent spécialiser, pas
         produire un corps à un seul membre.                              */
      const b = Math.pow(prof.lean[k] * (1 + 0.38 * (poids[k] || 0)), 0.68);
      brut[k] = Math.max(0.2, b * R.range(0.93, 1.07));
      somme += brut[k];
    });
    const BUDGET = 100;
    const stats = {};
    AXES.forEach(k => { stats[k] = Math.max(6, Math.round((brut[k] / somme) * BUDGET)); });

    const dominante = AXES.slice().sort((a, b) => stats[b] - stats[a])[0];
    const m = prof.mod;
    const pvMax = 90 + (stats.vigueur * 3.4 | 0);
    const enMax = 8 + Math.round(stats.flux / 9) + (m.enMaxDelta || 0);

    return {
      stats, dominante, profil: prof,
      pvMax, enMax: Math.max(5, enMax),
      attaque: 13 + Math.round(stats.tranchant * 0.80),
      crit: clamp(0.05 + stats.lucidite * 0.006, 0.05, 0.42),
      soin: 0.35 + stats.inversion * 0.022,
      puissance: Math.round(stats.tranchant * 1.5 + stats.vigueur * 1.1 + stats.flux * 1.2 + stats.lucidite * 1.0 + stats.inversion * 0.9),
    };
  }

  /* ---- grade : la hiérarchie n'est pas une opinion --------------------- */
  function grade(puissance, sermentsSignes) {
    const grades = liste('grades', []).length ? liste('grades') : (C().nomenclature || {}).grades || [];
    const p = puissance + (sermentsSignes || 0) * 22;
    const tri = grades.slice().sort((a, b) => (a.seuil || 0) - (b.seuil || 0));
    let g = tri[0] || { grade: '4', nom: 'Quatrième grade', description: '' };
    tri.forEach(x => { if (p >= (x.seuil || 0)) g = x; });
    return g;
  }

  /* ---- prose du dossier ------------------------------------------------ */
  function dossier(tech) {
    const e = tech.essence || {}, v = tech.vecteur || {}, l = tech.loi || {};
    const phrases = [];
    /* le constat décrit le 呪力 du porteur, pas ce que la loi en fait :
       la conséquence a désormais sa propre rubrique (術式順転), et la
       répéter ici faisait lire deux fois la même phrase.                  */
    if (e.concept) phrases.push(e.concept.replace(/\.$/, '') + '.');
    if (e.sensoriel) phrases.push(e.sensoriel.replace(/\.$/, '') + '.');
    return phrases.join(' ');
  }
  function minuscule(s) { const t = String(s || ''); return t.charAt(0).toLowerCase() + t.slice(1); }

  JJK.forge = {
    forgeDepuisDeclaration, profilDeclaration, forgeReceptacle, grade, dossier,
    fr, decoupe, avecArticle, genreEssence, accorder, plurielDe, raccourcir, sansJointFinal,
    sousListe, FORMES_JUBAKU,
    AXES, affinite, liste,
  };
})(window);


/* ==== 40-serments.js ==== */
/* =========================================================================
   RITUEL — serments contraignants
   Un serment n'est pas un bonus. C'est une amputation payée d'avance.
   La mécanique est écrite ici, en dur : le jeu doit VRAIMENT te retirer
   ce qu'il prétend te retirer.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { Rng, cyrb128 } = JJK.core;

  /* Chaque emplacement retire une capacité réelle du jeu ou de l'interface. */
  const EMPLACEMENTS = [
    {
      id: 'aveugle', mots: /masqu|cach|invisibl|ne verra|sans voir|à l['’ ]aveugle|information|affich/i,

  function catalogue(seed) {

    const pris = {};
    const out = EMPLACEMENTS.map(e => {
      let choisi = null, note = -1;
      src.forEach(s => {
        if (pris[s.id]) return;
        const texte = [s.restriction_code, s.restriction, s.nom, s.clause].join(' ');
        let n = e.mots.test(texte) ? 100 : 0;
        n += (cyrb128(e.id + '|' + (s.id || s.nom))[2] % 40) / 100;
        if (n > note) { note = n; choisi = s; }
      });
      if (choisi && note >= 100) pris[choisi.id || choisi.nom] = 1; else choisi = null;
      return {
        id: e.id,
        nom: (choisi && choisi.nom) || e.nom,
        clause: (choisi && choisi.clause) || e.clause,
        perte: e.perte,
        gain: e.gain,
        pertePoetique: (choisi && choisi.restriction) || e.perte,
        gainPoetique: (choisi && choisi.gain) || e.gain,
        danger: (choisi && choisi.danger) || e.danger,
        eff: e.eff,
      };
    });
    /* le rituel ne propose jamais tout : il propose ce qu'il a jugé bon */
    const R = new Rng('serments:' + seed);
    return R.shuffle(out);
  }

  /* Agrège la déclaration ET les serments en un modificateur unique.

  function agreger(signes, base) {
    const m = {
      degatsMult: 1, degatsRecusMult: 1, pvMaxMult: 1, soinMult: 1,
      critBonus: 0, critMult: 1, energieBonus: 0, energieDepart: 0, enMaxBonus: 0,

      pasDeRepetition: false, domaineUnique: false, effaceToutALaMort: false,
      limiteTours: 0,
      coutChair: 0, journalTrouble: false, differe: false, saigneeSystematique: false,
      elanParTour: 0, statutDouble: false, bonusMarque: 0, rate: 0, epuisement: 0,
      retour: 0, lisible: 0,
    };
    /* chaque serment signé affine le territoire : c'est ce qui décide
       d'un affrontement d'extensions, et c'est ce qu'on a payé pour */
    m.raffinementBonus = (signes || []).length * 22;
    /* on part de ce que le formulaire a déclaré */
    if (base) {
      for (const k in base) {
        const v = base[k];
        if (typeof v === 'number') {
          if (/Mult$/.test(k)) m[k] = (m[k] == null ? 1 : m[k]) * v;
          else m[k] = (m[k] || 0) + v;
        } else if (typeof v === 'boolean') { if (v) m[k] = true; }
        else m[k] = v;
      }
      if (base.enMaxDelta) m.enMaxBonus = (m.enMaxBonus || 0) + base.enMaxDelta;
    }
    (signes || []).forEach(s => {
      const e = s.eff || {};
      if (e.degatsMult) m.degatsMult *= e.degatsMult;
      if (e.degatsRecusMult) m.degatsRecusMult *= e.degatsRecusMult;
      if (e.pvMaxMult) m.pvMaxMult *= e.pvMaxMult;
      if (e.soinMult) m.soinMult *= e.soinMult;
      if (e.critBonus) m.critBonus += e.critBonus;
      if (e.critMult) m.critMult *= e.critMult;
      if (e.energieBonus) m.energieBonus += e.energieBonus;
      if (e.energieDepart) m.energieDepart += e.energieDepart;
      if (e.enMaxBonus) m.enMaxBonus += e.enMaxBonus;
      if (e.remise) m.remise += e.remise;
      if (e.frappeMult) m.frappeMult *= e.frappeMult;
      if (e.domaineMult) m.domaineMult *= e.domaineMult;
      if (e.domaineTours) m.domaineTours += e.domaineTours;
      if (e.rancune) m.rancune += e.rancune;
      if (e.limiteTours) m.limiteTours = m.limiteTours ? Math.min(m.limiteTours, e.limiteTours) : e.limiteTours;
      (e.interdit || []).forEach(k => { m.interdit[k] = true; });
      ['masqueVieEnnemi', 'masqueJournal', 'coupeSon', 'pasDeRepetition', 'domaineUnique', 'effaceToutALaMort']
        .forEach(k => { if (e[k]) m[k] = true; });
    });
    /* Plafond souple : au-delà d'un certain point, empiler des serments
       cesse de payer. Le réel se lasse d'être négocié.                   */
    if (m.degatsMult > 3.0) m.degatsMult = 3.0 + (m.degatsMult - 3.0) * 0.40;
    if (m.pvMaxMult < 0.30) m.pvMaxMult = 0.30;
    return m;
  }

  JJK.serments = { EMPLACEMENTS, catalogue, agreger };
})(window);

      exec(D, a, d, R) {
        const ev = [];
        if (R.chance(0.55 + a.crit)) { ev.push({ t: 'fuite', qui: a.cle, reussie: true }); D.fini = true; D.vainqueur = 'fuite'; }
        else { ev.push({ t: 'fuite', qui: a.cle, reussie: false }); }
        return ev;
      },
    },
  ];

  const parId = {};
  ACTIONS.forEach(a => { parId[a.id] = a; });

  /* ---- construction d'un combattant ------------------------------------ */
  function combattantJoueur(tech, corps, mods, nomJoueur) {
    const pvMax = Math.max(24, Math.round(corps.pvMax * mods.pvMaxMult));
    return {
      cle: 'joueur', nom: nomJoueur || 'Toi', sousTitre: tech.nom,
      pv: pvMax, pvMax,
      enMax: Math.max(4, corps.enMax + (mods.enMaxBonus || 0)), en: 0,
      attaque: corps.attaque, crit: corps.crit + mods.critBonus, soin: corps.soin,
      archetype: tech.archetype, domaine: tech.domaine, technique: tech,
      statuts: [], tension: 0, domaineTours: 0, domaineUtilise: false,
      sermentPris: false, rancune: 0, derniereAction: null, mods,
      raffinement: corps.puissance + (mods.raffinementBonus || 0), intention: null, humain: true,
    };
  }

  /* Calibrage : le contenu écrit la couleur, le code écrit la difficulté.
     On vise une durée de duel, pas des chiffres arbitraires. Ainsi un fléau
     reste dangereux quel que soit le réceptacle qui lui fait face.        */
  const CADENCE = {
    '4':             { tours: 4.0,  survie: 13.0 },
    '3':             { tours: 5.5,  survie: 11.0 },
    '2':             { tours: 7.5,  survie: 10.0 },
    '1':             { tours: 10.0, survie: 9.5 },
    'semi-spécial':  { tours: 11.0, survie: 9.5 },
    'spécial':       { tours: 12.5, survie: 9.5 },
  };
  /* Rendement réel d'un tour de joueur : la technique innée vaut 2,3 fois
     l'attaque, mais elle pose « Marqué » (+30 %) et les critiques ajoutent
     encore. Mesuré en simulation, pas supposé — c'est 3,4, pas 1,9.       */
  const REGLAGE = {
    /* Dégâts moyens d'un tour de joueur, en multiples d'attaque. Mesuré,
       pas supposé : 3,4 pour la mécanique de base, multiplié par le gain
       moyen d'une déclaration (×1,56 relevé sur 3000 formulaires tirés).
       On calibre sur la déclaration MOYENNE : un bon formulaire doit payer,
       un mauvais doit se sentir.                                         */
    rendementJoueur: 5.0,
    rendementFleau: 1.9,    /* idem côté fléau */
    expoAttaque: 0.40,      /* la courbe pèse à plein sur les PV du fléau, à peine sur sa frappe :
                               une descente doit s'allonger, pas se raccourcir brutalement */
  };

  function combattantFleau(f, ref, R, courbe) {
    const g = String(f.grade || '4');
    const c = CADENCE[g] || CADENCE['2'];
    const rng = R || new Rng('fleau:' + (f.id || f.nom));
    const k = courbe || 1;

    /* IMPORTANT : on calibre sur le RÉCEPTACLE NU — sans serment, sans
       maturation. Sinon progresser ne servirait à rien : le monde grandirait
       exactement à la vitesse du joueur, et le joueur ne sentirait rien.
       Ici, le fléau ignore ce que tu as signé. C'est à toi d'en profiter.  */
    const dpsRef = Math.max(6, ref.attaque * REGLAGE.rendementJoueur);
    /* variance de caractère : deux fléaux de même grade ne se ressemblent pas */
    const vPv = rng.range(0.86, 1.16), vAtt = rng.range(0.86, 1.16);

    const pvMax = Math.max(40, Math.round(dpsRef * c.tours * vPv * k));
    const attaque = Math.max(6, Math.round((ref.pvMax / c.survie / REGLAGE.rendementFleau) * vAtt * Math.pow(k, REGLAGE.expoAttaque)));

    return {
      cle: 'ennemi', nom: f.nom, sousTitre: '呪霊 · fléau de grade ' + g,
      pv: pvMax, pvMax,
      enMax: 10, en: 2,
      attaque, crit: 0.08 + (g === 'spécial' ? 0.10 : g === 'semi-spécial' ? 0.06 : 0), soin: 0.5,
      archetype: f.archetype || 'seuil', domaine: f.domaine || null, fleau: f,
      statuts: [], tension: 0, domaineTours: 0, domaineUtilise: false,
      sermentPris: false, rancune: 0, derniereAction: null,
      mods: MODS_NEUTRES(),
      /* Le raffinement décide qui l'emporte quand deux territoires se
         touchent. On le veut comparable à la puissance du joueur, pas
         indexé sur des PV : sinon un grade spécial gagne toujours. */
      raffinement: ({ '4': 70, '3': 110, '2': 150, '1': 200, 'semi-spécial': 235, 'spécial': 290 }[g] || 150),
      intention: null, humain: false,
      profil: profilDe(g),
      grade: g,
      temperament: temperamentsDe(f),
      patience: 0,
    };
  }

  function MODS_NEUTRES() {
    return { degatsMult: 1, degatsRecusMult: 1, pvMaxMult: 1, soinMult: 1, critBonus: 0, critMult: 1,
      energieBonus: 0, energieDepart: 0, enMaxBonus: 0, enMaxDelta: 0, remise: 0, coutDelta: 0,
      frappeMult: 1, domaineMult: 1, domaineTours: 0, domaineCout: 0, rancune: 0, raffinementBonus: 0,
      interdit: {}, masqueVieEnnemi: false, masqueJournal: false,
      coupeSon: false, pasDeRepetition: false, domaineUnique: false, effaceToutALaMort: false, limiteTours: 0,
      /* déclarés au formulaire, pas signés : ce sont les conséquences des
         dix rubriques, et elles pèsent autant que les serments */
      coutChair: 0, journalTrouble: false, differe: false, saigneeSystematique: false,
      elanParTour: 0, statutDouble: false, bonusMarque: 0, rate: 0, epuisement: 0,
      retour: 0, lisible: 0 };
  }

  /* ------------------------------------------------------------------
     Tempéraments. Le bestiaire décrit des comportements précis :
     « il attend », « il rejoue une de tes actions », « il frappe deux
     fois de suite ». Sans lecture, ce serait de la littérature posée
     sur une IA générique. On lit donc le texte, et on le tient.
     ------------------------------------------------------------------ */
  const TEMPERAMENTS = [
    { id: 'patient',    re: /attend|n['’]engage rien|patiente|immobile|sans bouger|ne bouge|reste au fond|laisse venir/i },
    { id: 'imitateur',  re: /rejoue|recopie|répète|imite|copie|reproduit|renvoie ton|ton propre geste/i },
    { id: 'double',     re: /deux fois de suite|frappe deux fois|double|coup double|enchaîne deux/i },
    { id: 'horloge',    re: /\bau (?:cinquième|sixième|septième|huitième|neuvième|dixième|\d+)(?:e|ème)?\b/i },
    { id: 'soigneur',   re: /se referme|se recoud|se répare|régénère|se soigne|repousse|cicatrise/i },
    { id: 'vorace',     re: /dévore|absorbe|aspire|se nourrit|draine|vide|siphonne/i },
    { id: 'fuyant',     re: /disparaît|s['’]efface|n['’]existe que|invisible|ne se laisse pas|hors de portée/i },
  ];
  const MOTS_TOUR = { cinquième: 5, sixième: 6, septième: 7, huitième: 8, neuvième: 9, dixième: 10 };

  function temperamentsDe(f) {
    const texte = [f.comportement, f.apparence, f.technique_signature].join(' ');
    const t = {};
    TEMPERAMENTS.forEach(x => { if (x.re.test(texte)) t[x.id] = true; });
    if (t.horloge) {
      const m = /\bau (cinquième|sixième|septième|huitième|neuvième|dixième|\d+)/i.exec(texte);
      const v = m ? (MOTS_TOUR[String(m[1]).toLowerCase()] || parseInt(m[1], 10)) : 7;
      t.tourCle = Math.max(3, Math.min(12, v || 7));
    }
    return t;
  }

  function profilDe(grade) {
    switch (String(grade)) {
      case '4': return { agressif: 0.75, technique: 0.10, garde: 0.15, soin: 0, domaine: false, seuilTension: 999 };
      case '3': return { agressif: 0.65, technique: 0.20, garde: 0.15, soin: 0.05, domaine: false, seuilTension: 999 };
      case '2': return { agressif: 0.52, technique: 0.30, garde: 0.12, soin: 0.10, domaine: false, seuilTension: 999 };
      case '1': return { agressif: 0.45, technique: 0.35, garde: 0.10, soin: 0.14, domaine: false, seuilTension: 999 };
      case 'semi-spécial': return { agressif: 0.40, technique: 0.38, garde: 0.10, soin: 0.16, domaine: true, seuilTension: 130 };
      default: return { agressif: 0.36, technique: 0.42, garde: 0.08, soin: 0.18, domaine: true, seuilTension: 100 };
    }
  }

  /* ---- le duel ---------------------------------------------------------- */
  function creer(opts) {
    const R = new Rng('duel:' + opts.seed + ':' + (opts.ennemi.id || 'x') + ':' + (opts.numero || 0));
    const D = {
      R, tour: 1, fini: false, vainqueur: null, journal: [],
      joueur: opts.joueur, ennemi: opts.ennemi,
      mods: opts.joueur.mods,
      numero: opts.numero || 0,
    };
    D.joueur.en = Math.min(D.joueur.enMax, 3 + (D.mods.energieDepart || 0));
    D.ennemi.intention = choisirIntention(D, D.ennemi, D.joueur);

    /* ---- calcul des dégâts : une seule porte d'entrée ---------------- */
    D.degats = function (ev, a, d, mult, o) {
      o = o || {};
      let base = a.attaque * mult;
      if (statut(a, 'fracture')) base *= 0.70;
      const el = statut(a, 'elan'); if (el) base *= 1 + (el.val || 0);
      base *= a.mods.degatsMult || 1;
      base *= 1 + (a.rancune || 0);
      if (a.domaineTours > 0) base *= 1.35;

      const lec = statut(a, 'lecture');
      const lisait = !!lec;
      const chanceCrit = clamp((a.crit || 0.1) + (lec ? 0.55 : 0) + (d.mods.lisible || 0), 0, 0.95);
      const crit = R.chance(chanceCrit);
      /* 黒閃 kokusen : le coup et le 呪力 coïncident à 0,000001 seconde près.
         On ne le provoque pas. Il faut déjà un critique, de la tension, et
         de la chance ; l'avoir touché une fois change le rapport du porteur
         à son énergie maudite pour le reste du duel.                      */
      let kokusen = false;
      if (crit && o.technique !== false && a.tension >= 25) {
        const p = clamp(0.06 + (a.crit || 0) * 0.30 + (a.kokusenVus || 0) * 0.05, 0, 0.34);
        kokusen = R.chance(p);
      }
      if (kokusen) {
        base *= 2.5 * (a.mods.critMult || 1);
        a.kokusenVus = (a.kokusenVus || 0) + 1;
        a.crit = Math.min(0.6, (a.crit || 0.1) + 0.08);
        a.tension = Math.min(200, a.tension + 25);
      } else if (crit) base *= 1.85 * (a.mods.critMult || 1);
      if (lec) { retirer(a, 'lecture'); }

      base *= R.range(0.90, 1.12);

      const g = statut(d, 'garde');
      /* 簡易領域 : sa frontière neutralise la garantie d'un territoire adverse.
         C'est la seule parade régulière opposable à un coup au but, et c'est
         pour cela qu'elle traverse même ce qui « ne se refuse pas ».       */
      if (g && o.surAuBut) {
        base *= 0.45; retirer(d, 'garde');
        ev.push({ t: 'kanri', qui: d.cle });
      } else if (g && !o.ignoreGarde) { base *= 1 - (g.val || 0.5); retirer(d, 'garde'); }
      /* Ce qui n'existe que hors du regard encaisse mal les coups portés
         à l'aveugle. Le fixer — Lire l'adversaire — le rend solide, et
         c'est exactement ce que sa fiche annonce. */
      if (d.temperament && d.temperament.fuyant && !lisait && !statut(d, 'marque') && !o.surAuBut) base *= 0.68;
      if (statut(d, 'marque')) base *= 1.30 + (a.mods.bonusMarque || 0);
      base *= d.mods.degatsRecusMult || 1;
      if (d.domaineTours > 0 && !o.surAuBut) base *= 0.70;

      let q = Math.max(1, Math.round(base));
      if (d.pv - q <= 0 && statut(d, 'sursis')) {
        retirer(d, 'sursis'); q = Math.max(0, d.pv - 1);
        ev.push({ t: 'sursis', qui: d.cle });
      }
      d.pv -= q;
      a.rancune = 0;
      a.tension = Math.min(200, a.tension + Math.round(q * 0.18) + 4);
      d.tension = Math.min(200, d.tension + Math.round(q * 0.35) + 3);
      d.rancune = Math.min(1.5, (d.rancune || 0) + (d.mods.rancune || 0));

      const ec = statut(d, 'echo');
      ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q, crit, kokusen, verbe: o.verbe || 'frappe', gros: !!o.gros || kokusen, surAuBut: !!o.surAuBut });
      /* faille déclarée « retour » : la loi ne distingue pas son porteur */
      if (o.technique && a.mods.retour) {
        const r = Math.max(1, Math.round(q * a.mods.retour));
        a.pv -= r;
        ev.push({ t: 'retour', qui: a.cle, montant: r });
      }
      if (ec) {
        const q2 = Math.max(1, Math.round(q * 0.45));
        d.pv -= q2; ec.tours -= 1;
        ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q2, echo: true, verbe: 'se répète' });
        if (ec.tours <= 0) retirer(d, 'echo');
      }
      return q;
    };

    /* ---- actions disponibles ------------------------------------------ */
    D.actions = function () {
      const a = D.joueur;
      return ACTIONS.map(act => {
        const cout = coutReel(act, a);
        let ok = true, raison = '';
        if (a.mods.interdit[act.id]) { ok = false; raison = 'Interdit par un serment.'; }
        else if (a.en < cout) { ok = false; raison = 'Énergie insuffisante.'; }
        else if (act.req && !act.req(D, a, D.ennemi)) { ok = false; raison = act.raison || 'Impossible.'; }
        else if (a.mods.pasDeRepetition && a.derniereAction === act.id) { ok = false; raison = 'Serment : jamais deux fois le même geste.'; }
        return {
          id: act.id, nom: act.id === 'technique' ? (a.technique ? a.technique.nom : act.nom) : act.nom,
          sous: act.id === 'technique' ? 'Technique innée' : (act.id === 'maximum' && a.technique && a.technique.maximum ? 'Technique maximale' : ''),
          desc: act.desc, cout, ok, raison, ultime: !!act.ultime,
          interdit: !!a.mods.interdit[act.id],
        };
      });
    };

    const TECHNIQUES = { technique: 1, maximum: 1 };
    function coutReel(act, a) {
      if (!act.cout) return 0;
      let c = act.cout - (a.mods.remise || 0);
      if (TECHNIQUES[act.id]) c += (a.mods.coutDelta || 0);
      if (act.id === 'domaine') c += (a.mods.domaineCout || 0);
      return Math.max(1, Math.round(c));
    }

    /* ---- un tour complet ----------------------------------------------- */
    D.jouer = function (id) {
      if (D.fini) return [];
      const act = parId[id];
      const a = D.joueur, d = D.ennemi;
      if (!act) return [];
      const cout = coutReel(act, a);
      if (a.en < cout || a.mods.interdit[id] || (act.req && !act.req(D, a, d))) return [];

      const ev = [];
      a.en -= cout;
      a.derniereAction = id;
      ev.push({ t: 'acte', qui: 'joueur', nom: id === 'technique' && a.technique ? a.technique.nom : act.nom, id });
      /* prélèvement déclaré sur la chair : il se paie à l'énoncé, pas après */
      if (TECHNIQUES[id] && a.mods.coutChair) {
        const prix = Math.max(1, Math.round(a.pvMax * a.mods.coutChair));
        a.pv -= prix;
        ev.push({ t: 'chair', qui: a.cle, montant: prix });
        if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      }
      Array.prototype.push.apply(ev, act.exec(D, a, d, R) || []);

      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }
      if (D.fini) return ev;

      /* riposte */
      Array.prototype.push.apply(ev, tourEnnemi(D, ev));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      /* fin de tour */
      Array.prototype.push.apply(ev, finDeTour(D));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      D.tour++;
      if (a.mods.limiteTours && D.tour > a.mods.limiteTours) {
        ev.push({ t: 'sablier', limite: a.mods.limiteTours });
        a.pv = 0; finir(ev, 'ennemi'); return ev;
      }
      d.intention = choisirIntention(D, d, a);
      ev.push({ t: 'tour', n: D.tour });
      return ev;
    };

    function finir(ev, qui) {
      D.fini = true; D.vainqueur = qui;
      ev.push({ t: 'fin', vainqueur: qui });
    }

    function finDeTour(D) {
      const ev = [];
      [D.joueur, D.ennemi].forEach(c => {
        /* la loi différée tombe maintenant */
        const df = statut(c, 'differe');
        if (df && df.val) {
          const q = Math.max(1, Math.round(df.val * (c.mods.degatsRecusMult || 1)));
          c.pv -= q;
          ev.push({ t: 'degats', par: df.par || 'differe', cible: c.cle, montant: q, verbe: 'rattrape', gros: true });
          retirer(c, 'differe');
        }
        const sg = statut(c, 'saignee');
        if (sg) {
          const q = Math.max(1, sg.val || 3);
          c.pv -= q;
          ev.push({ t: 'degats', par: 'saignee', cible: c.cle, montant: q, verbe: 'saigne', dot: true });
        }
        if (statut(c, 'corrosion')) c.en = Math.max(0, c.en - 1);
        /* +3 par tour : une technique innée (3) est ainsi soutenable,
           et mettre de côté les 6 d'une extension reste un vrai choix. */
        let gain = 3 + (c.mods.energieBonus || 0);
        if (c.dette) { gain -= c.dette; c.dette = 0; }
        c.en = Math.max(0, Math.min(c.enMax, c.en + gain));
        /* cadence cumulative : l'élan monte tant qu'on ne se protège pas */
        if (c.mods.elanParTour) {
          if (c.derniereAction === 'garde') { retirer(c, 'elan'); }
          else {
            const el = poser(c, 'elan', 99, 0);
            el.val = Math.min(0.75, (el.val || 0) + c.mods.elanParTour);
          }
        }
        c.tension = Math.min(200, c.tension + 6);
        if (c.domaineTours > 0) {
          c.domaineTours--;
          const cible = c === D.joueur ? D.ennemi : D.joueur;
          const q = Math.max(2, Math.round(cible.pvMax * 0.06 * (c.mods.domaineMult || 1)));
          cible.pv -= q;
          ev.push({ t: 'degats', par: c.cle, cible: cible.cle, montant: q, verbe: 'ronge', domaine: true });
          if (c.domaineTours === 0) ev.push({ t: 'domaineFerme', qui: c.cle });
        }
        for (let i = c.statuts.length - 1; i >= 0; i--) {
          const s = c.statuts[i];
          if (s.id === 'garde' || s.id === 'elan') continue;
          s.tours--;
          if (s.tours <= 0) { c.statuts.splice(i, 1); ev.push({ t: 'statutFin', qui: c.cle, id: s.id }); }
        }
      });
      return ev;
    }

    /* ---- l'adversaire n'improvise pas : il a un tempérament ------------ */
    function choisirIntention(D, e, cible) {
      if (!e.profil) e.profil = profilDe((e.fleau || {}).grade || '2');
      const p = e.profil, t = e.temperament || {};
      const bas = e.pv / e.pvMax < 0.35;

      /* l'heure dite : ce qu'annonce sa fiche arrive au tour annoncé */
      if (t.tourCle && D.tour === t.tourCle && !statut(e, 'scelle')) {
        if (p.domaine && e.en >= 6 && e.domaineTours === 0) return 'domaine';
        if (e.en >= 6) return 'maximum';
      }
      if (p.domaine && e.tension >= p.seuilTension && e.en >= 6 && !statut(e, 'scelle') && e.domaineTours === 0) return 'domaine';
      if (e.tension >= 70 && e.en >= 5 && R.chance(0.55)) return 'maximum';
      if (bas && (p.soin > 0 || t.soigneur) && e.en >= 3 && R.chance(t.soigneur ? 0.75 : 0.55)) return 'inverse';

      /* celui qui attend : il se garde, et chaque attente le charge */
      if (t.patient && e.patience < 3 && R.chance(0.45)) return 'garde';
      /* celui qui rejoue : il te renvoie ton dernier geste */
      if (t.imitateur && cible.derniereAction && R.chance(0.55)) {
        const a = parId[cible.derniereAction];
        if (a && a.id !== 'fuite' && a.id !== 'serment' && a.id !== 'domaine' && e.en >= (a.cout || 0)) return a.id;
      }
      const r = R.next();
      if (r < p.agressif) return e.en >= 2 && R.chance(0.6) ? 'decharge' : 'frappe';
      if (r < p.agressif + p.technique) return e.en >= 3 ? 'technique' : 'frappe';
      if (r < p.agressif + p.technique + p.garde) return 'garde';
      return 'frappe';
    }

    function agirEnnemi(D, id) {
      const e = D.ennemi, j = D.joueur;
      const act = parId[id];
      const cout = act ? (act.cout || 0) : 0;
      if (!act || e.en < cout || (act.req && !act.req(D, e, j))) id = 'frappe';
      const a2 = parId[id];
      e.en -= (a2.cout || 0);
      e.derniereAction = id;
      const ev = [{ t: 'acte', qui: 'ennemi', nom: id === 'technique' && e.fleau ? (e.fleau.technique_signature || a2.nom) : a2.nom, id }];
      Array.prototype.push.apply(ev, a2.exec(D, e, j, R) || []);
      return ev;
    }

    function tourEnnemi(D) {
      const e = D.ennemi, j = D.joueur;
      const t = e.temperament || {};
      const id = e.intention || 'frappe';
      const ev = agirEnnemi(D, id);

      /* l'attente se paie en avance prise */
      if (t.patient) {
        if (e.derniereAction === 'garde') {
          e.patience++;
          const el2 = poser(e, 'elan', 99, 0);
          el2.val = Math.min(0.42, (el2.val || 0) + 0.11);
          ev.push({ t: 'statut', qui: e.cle, id: 'elan' });
        } else e.patience = 0;
      }
      /* le second coup, quand sa fiche le promet */
      if (t.double && j.pv > 0 && !D.fini && R.chance(0.26)) {
        ev.push({ t: 'second', qui: e.cle });
        Array.prototype.push.apply(ev, agirEnnemi(D, e.en >= 2 ? 'decharge' : 'frappe'));
      }
      /* ce qui se nourrit prend aussi la réserve */
      if (t.vorace && j.pv > 0 && j.en > 0 && R.chance(0.45)) {
        const q = Math.min(j.en, 2);
        j.en -= q; e.en = Math.min(e.enMax, e.en + q);
        ev.push({ t: 'ponction', qui: e.cle, montant: q });
      }
      return ev;
    }

    return D;
  }

  JJK.combat = { creer, combattantJoueur, combattantFleau, ACTIONS, STATUTS, MODS_NEUTRES, statut, profilDe, temperamentsDe, CADENCE, REGLAGE };
})(window);

/* =========================================================================
   RITUEL — mémoire
   Le jeu tient un registre. Il n'oublie ni les noms, ni les manières de
   mourir. Un serment peut détruire ce registre ; rien ne peut le corriger.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  const CLE = 'rituel.registre.v1';
  const VIDE = {
    version: 1,
    graine: null, reponses: [], maturation: 0,
    descentes: 0, victoires: 0, fuites: 0, morts: 0,
    serments: [], sonCoupe: false,
    epitaphes: [],           /* ceux qui sont tombés ici, sous n'importe quel nom */
    fiches: [],              /* toute 生得術式 consignée, même jamais employée */
    titres: [], vus: [],
    premiereVisite: null, derniereVisite: null,
    domainesOuverts: 0, sermentsPretes: 0, degatsSubis: 0, degatsInfliges: 0,
  };

  function dispo() {
    try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  const OK = dispo();
  let cache = null;

  function lire() {
    if (cache) return cache;
    if (!OK) return (cache = JSON.parse(JSON.stringify(VIDE)));
    try {
      const brut = localStorage.getItem(CLE);
      cache = brut ? Object.assign(JSON.parse(JSON.stringify(VIDE)), JSON.parse(brut)) : JSON.parse(JSON.stringify(VIDE));
    } catch (e) { cache = JSON.parse(JSON.stringify(VIDE)); }
    return cache;
  }
  function ecrire(patch) {
    const r = lire();
    if (patch) Object.assign(r, patch);
    r.derniereVisite = Date.now();
    if (!r.premiereVisite) r.premiereVisite = r.derniereVisite;
    if (OK) { try { localStorage.setItem(CLE, JSON.stringify(r)); } catch (e) {} }
    return r;
  }
  function effacer() {
    cache = null;
    if (OK) { try { localStorage.removeItem(CLE); } catch (e) {} }
    return lire();
  }

  /* ---- archive : le registre garde chaque fiche produite ---------------
     C'est d'abord un registre de techniques. Les morts n'en sont qu'une
     rubrique parmi d'autres.                                              */
  function archiver(fiche) {
    if (!fiche || !fiche.code) return;
    const r = lire();
    const i = r.fiches.findIndex(x => x.code === fiche.code);
    if (i >= 0) r.fiches.splice(i, 1);
    r.fiches.unshift({ code: fiche.code, nom: fiche.nom, nomJp: fiche.nomJp,
      grade: fiche.grade, jubaku: !!fiche.jubaku, date: Date.now() });
    r.fiches = r.fiches.slice(0, 40);
    ecrire();
  }

  /* ---- épitaphes : ce que le registre garde d'un mort ------------------ */
  function inhumer(fiche) {
    const r = lire();
    r.epitaphes.unshift({
      graine: fiche.graine, dossier: fiche.dossier, declaration: fiche.declaration, poids: fiche.poids,
      nom: fiche.nom, technique: fiche.technique, nomJp: fiche.nomJp,
      tueur: fiche.tueur, tour: fiche.tour, grade: fiche.grade,
      serments: fiche.serments || [], date: Date.now(),
      derniersMots: fiche.derniersMots || '',
      archetype: fiche.archetype || 'seuil',
    });
    r.epitaphes = r.epitaphes.slice(0, 12);
    r.morts++;
    ecrire();
    return r.epitaphes[0];
  }

  /* Le revenant : ton cadavre revient te chercher, avec ta propre loi.
     C'est la seule créature du jeu que tu as toi-même fabriquée.        */
  function revenant() {
    const r = lire();
    const e = r.epitaphes[0];
    if (!e) return null;
    return {
      id: 'revenant:' + (e.dossier || e.graine) + ':' + e.date,
      nom: e.nom ? ('Ce qui reste de ' + e.nom) : 'Ce qui reste de toi',
      grade: r.morts >= 4 ? 'spécial' : (r.morts >= 2 ? 'semi-spécial' : '1'),
      origine: "La peur, très ordinaire, de retrouver sa propre écriture dans une lettre qu'on n'a pas écrite.",
      apparence: "Ta silhouette, à la hauteur exacte de tes yeux, portant ton visage comme on porte un vêtement mal boutonné.",
      comportement: "Il connaît ta loi. Il l'a portée. Il sait à quel tour tu ouvres ton territoire.",
      replique: e.derniersMots || "Tu as recommencé. Moi, je n'ai pas pu.",
      technique_signature: e.technique || 'Ta technique',
      revenant: true, epitaphe: e, archetype: e.archetype || 'seuil',
    };
  }

  function marquerVu(id) {
    const r = lire();
    if (r.vus.indexOf(id) < 0) { r.vus.push(id); ecrire(); }
  }
  function aVu(id) { return lire().vus.indexOf(id) >= 0; }

  function accorderTitre(t) {
    const r = lire();
    if (r.titres.indexOf(t) < 0) { r.titres.push(t); ecrire(); return true; }
    return false;
  }

  function estUnRetour() {
    const r = lire();
    return !!(r.premiereVisite && (r.morts > 0 || r.descentes > 0));
  }

  /* Le registre reconnaît un revenant qui change de nom. */
  function connaitAutreNom(graineActuelle) {
    const r = lire();
    const noms = {};
    r.epitaphes.forEach(e => { if (e.graine && e.graine !== graineActuelle) noms[e.graine] = 1; });
    if (r.graine && r.graine !== graineActuelle) noms[r.graine] = 1;
    return Object.keys(noms);
  }

  JJK.memoire = {
    lire, ecrire, effacer, archiver, inhumer, revenant, marquerVu, aVu,
    accorderTitre, estUnRetour, connaitAutreNom, disponible: OK, CLE,
  };
})(window);
