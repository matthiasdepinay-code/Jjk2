<style>

/* =========================================================================
   RITUEL — feuille de style
   Un dossier d'autopsie qu'on aurait laissé trop longtemps dans le noir.
   ========================================================================= */

:root {
  --nuit:      #07070a;
  --nuit-2:    #0c0c11;
  --nuit-3:    #131319;
  --os:        #e9e2d4;
  --os-faible: #9d968a;
  --os-mort:   #5d574e;
  --sang:      #b31217;
  --sang-vif:  #ff2d1a;
  --or:        #f2c14e;
  --inverse:   #7fe3ff;
  --vert-mal:  #6f8f5a;

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --hair: 1px solid rgba(233, 226, 212, 0.14);
  --hair-fort: 1px solid rgba(233, 226, 212, 0.32);
  --ease: cubic-bezier(.16,.84,.28,1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--nuit);
  color: var(--os);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { position: relative; overflow-y: auto; }

html.is-inverted { filter: invert(1) hue-rotate(180deg); }
html.is-inverted #fx-flash { filter: invert(1); }

::selection { background: var(--sang); color: var(--os); }

/* ---- calques d'effets ---------------------------------------------- */
.fx-layer {
  position: fixed; inset: 0; pointer-events: none;
  width: 100%; height: 100%;
}
#fx-ink { z-index: 76; mix-blend-mode: screen; opacity: .62; }
#fx-dom.is-hidden { display: none; }
#fx-flash {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; background: #fff; mix-blend-mode: screen;
}

/* grain : un vieux capteur qui chauffe */
body::after {
  content: ""; position: fixed; inset: -50%; z-index: 80; pointer-events: none;
  opacity: .045; will-change: transform;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation: grain 1.1s steps(4) infinite;
}
@keyframes grain {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-3%, 2%); }
  50%  { transform: translate(2%, -3%); }
  75%  { transform: translate(-2%, -2%); }
  100% { transform: translate(3%, 1%); }
}
/* lignes de balayage */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 79; pointer-events: none;
  opacity: .25;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px);
}

/* ---- scène ----------------------------------------------------------- */
#stage {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px) 120px;
  will-change: transform;
}
.ecran { width: 100%; max-width: 1120px; display: none; animation: fadeUp .8s var(--ease) both; }
.ecran.actif { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---- typographie ----------------------------------------------------- */
.etiquette {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: .34em; text-transform: uppercase;
  color: var(--os-mort);
}
.etiquette.rouge { color: var(--sang); }
.titre-rituel {
  font-family: var(--serif); font-weight: 300;
  font-size: clamp(2.1rem, 7vw, 4.6rem); line-height: 1.02;
  letter-spacing: -.02em; margin: .1em 0 .2em;
}
.titre-rituel em { font-style: italic; color: var(--sang); }
.jp { font-family: var(--jp); letter-spacing: .18em; }
.mono { font-family: var(--mono); }
.faible { color: var(--os-faible); }
.mort { color: var(--os-mort); }
.sang { color: var(--sang); }
.or { color: var(--or); }
.serif-italique { font-style: italic; font-weight: 300; }

hr.trait { border: 0; border-top: var(--hair); margin: 28px 0; }
hr.trait.fort { border-top: var(--hair-fort); }

.typing::after {
  content: "▌"; margin-left: 2px; color: var(--sang);
  animation: blink .7s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---- boutons --------------------------------------------------------- */
.btn {
  appearance: none; -webkit-appearance: none;
  background: transparent; color: var(--os);
  border: var(--hair-fort); border-radius: 0;
  padding: 13px 26px; cursor: pointer;
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  letter-spacing: .26em; text-transform: uppercase;
  position: relative; overflow: hidden;
  transition: color .25s var(--ease), border-color .25s var(--ease), letter-spacing .35s var(--ease);
}
.btn::before {
  content: ""; position: absolute; inset: 0;
  background: var(--os); transform: scaleY(0); transform-origin: bottom;
  transition: transform .34s var(--ease); z-index: -1;
}
.btn:hover:not(:disabled) { color: var(--nuit); border-color: var(--os); letter-spacing: .32em; }
.btn:hover:not(:disabled)::before { transform: scaleY(1); }
.btn:disabled { opacity: .28; cursor: not-allowed; }
.btn.rouge { border-color: rgba(179,18,23,.6); color: var(--sang-vif); }
.btn.rouge::before { background: var(--sang); }
.btn.rouge:hover:not(:disabled) { color: #fff; border-color: var(--sang); }
.btn.fantome { border-color: transparent; color: var(--os-mort); padding-left: 0; padding-right: 0; margin-right: 24px; }

.btn.large { display: block; width: 100%; padding: 18px 26px; }

.btn-rangee { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

/* ---- champ de saisie -------------------------------------------------- */
.champ {

}

/* ---- rituel ---------------------------------------------------------- */

.jauge-rituel { display: flex; gap: 6px; margin: 34px 0 0; }

  transition: background .5s var(--ease);
}
.jauge-rituel i.pleine { background: var(--sang); }

/* ---- dossier de technique ------------------------------------------- */
.dossier {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  gap: clamp(20px, 4vw, 56px); align-items: start;
}
@media (max-width: 860px) { .dossier { grid-template-columns: 1fr; } }

.nom-technique {

}

.echange { display: flex; flex-wrap: wrap; gap: 10px 26px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }

.fiche.frappe { animation: frappe .32s var(--ease); }
@keyframes frappe {

}

.barre { height: 8px; background: rgba(233,226,212,.09); margin-top: 14px; position: relative; overflow: hidden; }

}
.barre.energie { height: 4px; }

.chiffres { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--os-mort); margin-top: 6px; }

.statuts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 20px; }
.puce {

}
.puce.mauvais { border-color: rgba(179,18,23,.5); color: var(--sang-vif); }

.mutilated { position: relative; filter: grayscale(1) brightness(.5); min-height: 42px; }
.mutilated > * { opacity: .18; }
.mutilated::before {
  content: ""; position: absolute; left: -4%; right: -4%; top: 50%; height: 2px;

}

.journal {

.journal .etiquette { display: block; margin-bottom: 10px; }

/* =========================================================================
   RITUEL — noyau
   Détermnisme absolu : une graine = un destin. Aucun Math.random ici.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  /* ---- hachage de chaîne : cyrb128 ---------------------------------- */
  function cyrb128(str) {
    let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (let i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
  }

  /* ---- normalisation de la graine ------------------------------------
     « Matthias », « matthias » et « MATTHIAS  » sont la même personne.
     Le rituel ne se laisse pas berner par une majuscule.                */
  function normalizeSeed(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  /* ---- générateur : mulberry32 --------------------------------------- */
  function Rng(seed) {
    let a;
    if (typeof seed === 'number') a = seed >>> 0;
    else a = cyrb128(String(seed))[0];
    this._a = a >>> 0;
  }
  Rng.prototype.next = function () {
    let t = (this._a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };
  Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
  Rng.prototype.intRange = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.pick = function (arr) {
    if (!arr || !arr.length) return undefined;
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  Rng.prototype.sample = function (arr, n) { return this.shuffle(arr).slice(0, n); };
  /* loi normale par Box–Muller, bornée : sert aux stats et au tracé des sceaux */
  Rng.prototype.gauss = function (mu, sigma) {
    const u = Math.max(1e-9, this.next()), v = this.next();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
  };
  /* sous-générateur nommé : deux axes indépendants ne se contaminent pas */
  Rng.prototype.fork = function (tag) { return new Rng(cyrb128(tag + ':' + this._a)[0]); };

  /* ---- aléatoire non déterministe, réservé aux effets visuels -------- */
  const chaos = {
    f: function () { return Math.random(); },
    i: function (n) { return Math.floor(Math.random() * n); },
    r: function (a, b) { return a + Math.random() * (b - a); },
    pick: function (a) { return a[Math.floor(Math.random() * a.length)]; },
  };

  /* ---- utilitaires ---------------------------------------------------- */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    in: t => t * t * t,
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    back: t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  };
  const now = () => (root.performance && root.performance.now ? root.performance.now() : Date.now());

  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const $$ = (sel, ctx) => Array.prototype.slice.call((ctx || document).querySelectorAll(sel));

  /* remplace {JETON} dans un gabarit */
  function fill(tpl, map) {
    return String(tpl || '').replace(/\{([A-Z_]+)\}/g, (m, k) =>
      (map[k] != null ? map[k] : m));
  }

  /* premières lettres capitales, en respectant les particules françaises */
  const PARTICULES = { de: 1, du: 1, des: 1, la: 1, le: 1, les: 1, 'l\'': 1, d: 1, au: 1, aux: 1, et: 1, en: 1, par: 1, sans: 1, sur: 1, a: 1 };
  function titre(s) {
    return String(s || '').split(' ').map((w, i) => {
      const low = w.toLowerCase();
      if (i > 0 && PARTICULES[low]) return low;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  JJK.core = { cyrb128, normalizeSeed, Rng, chaos, clamp, lerp, ease, now, el, $, $$, fill, titre, wait };

/* =========================================================================
   RITUEL — synthèse sonore
   Aucun fichier audio : tout est fabriqué à la volée. Le jeu respire.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { clamp } = JJK.core;

  let ctx = null, master = null, bus = {}, started = false, muted = false;
  let droneNodes = null, heartTimer = null, tension = 0;

  function ready() { return ctx && ctx.state === 'running' && !muted; }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;

    /* compresseur : les impacts ne doivent pas saturer le drone */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12;
    comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25;
    master.connect(comp); comp.connect(ctx.destination);

    /* réverbération par bruit décroissant : une salle en pierre */
    const rev = ctx.createConvolver();
    rev.buffer = impulse(2.6, 2.4);
    const revGain = ctx.createGain(); revGain.gain.value = 0.32;
    rev.connect(revGain); revGain.connect(master);
    bus.rev = rev;
    bus.dry = master;
  }

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function noiseBuffer(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function env(node, t0, a, d, peak, send) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g);
    g.connect(bus.dry);
    if (send && bus.rev) { const s = ctx.createGain(); s.gain.value = send; g.connect(s); s.connect(bus.rev); }
    return g;
  }

  /* ---- drone : la nappe d'énergie maudite ---------------------------- */
  function startDrone() {
    if (!ctx || droneNodes) return;
    const t = ctx.currentTime;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.10, t + 6);
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 220; filt.Q.value = 4;
    g.connect(filt); filt.connect(master);
    const send = ctx.createGain(); send.gain.value = 0.5; filt.connect(send); send.connect(bus.rev);

    const oscs = [];
    [36.71, 55.0, 73.42, 110.0, 164.81].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i < 2 ? 'sine' : 'sawtooth';
      o.frequency.value = f * (1 + (i - 2) * 0.0009);
      const og = ctx.createGain(); og.gain.value = [0.5, 0.35, 0.10, 0.07, 0.035][i];
      o.connect(og); og.connect(g); o.start(t);
      oscs.push(o);
    });
    /* souffle : du bruit très filtré, comme un couloir */
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(4); n.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 340; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0.05;
    n.connect(nf); nf.connect(ng); ng.connect(g); n.start(t);

    /* lent battement de filtre : la nappe n'est jamais immobile */
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.043;
    const lfoG = ctx.createGain(); lfoG.gain.value = 90;
    lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start(t);

    droneNodes = { g, filt, oscs, n, lfo, ng };
  }

  function stopDrone(fade) {
    if (!droneNodes) return;
    const d = droneNodes; droneNodes = null;
    const t = ctx.currentTime;
    d.g.gain.cancelScheduledValues(t);
    d.g.gain.setValueAtTime(Math.max(0.0002, d.g.gain.value), t);
    d.g.gain.exponentialRampToValueAtTime(0.0001, t + (fade || 1.5));
    setTimeout(() => {
      try { d.oscs.forEach(o => o.stop()); d.n.stop(); d.lfo.stop(); } catch (e) {}
    }, (fade || 1.5) * 1000 + 200);
  }

  /* la tension monte : le filtre s'ouvre, la nappe devient présente */
  function setTension(v) {
    tension = clamp(v, 0, 1);
    if (!droneNodes || !ctx) return;
    const t = ctx.currentTime;
    droneNodes.filt.frequency.cancelScheduledValues(t);
    droneNodes.filt.frequency.setTargetAtTime(200 + tension * 900, t, 1.2);
    droneNodes.g.gain.setTargetAtTime(0.09 + tension * 0.09, t, 1.5);
  }

  /* ---- grains ponctuels ---------------------------------------------- */
  function tick(freq, dur, vol) {
    if (!ready()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'square'; o.frequency.value = freq || 1400;
    env(o, t, 0.001, dur || 0.02, (vol == null ? 0.05 : vol), 0.05);
    o.start(t); o.stop(t + (dur || 0.02) + 0.05);
  }

  function hit(power) {
    if (!ready()) return;
    const t = ctx.currentTime, p = clamp(power == null ? 0.5 : power, 0, 1.6);
    /* corps : un sinus qui plonge */
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180 + p * 120, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.16 + p * 0.1);
    env(o, t, 0.004, 0.30 + p * 0.2, 0.55 * p + 0.12, 0.25);
    o.start(t); o.stop(t + 0.7);
    /* claque : bruit passe-haut */
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.35);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900 + p * 1800;
    n.connect(f); env(f, t, 0.002, 0.11 + p * 0.08, 0.20 * p + 0.05, 0.35);
    n.start(t); n.stop(t + 0.4);
  }

  function slash() {
    if (!ready()) return;
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.5);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3.5;
    f.frequency.setValueAtTime(5200, t);
    f.frequency.exponentialRampToValueAtTime(420, t + 0.19);
    n.connect(f); env(f, t, 0.005, 0.22, 0.30, 0.4);
    n.start(t); n.stop(t + 0.5);
  }

  function heal() {
    if (!ready()) return;
    const t = ctx.currentTime;
    [392.0, 523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      env(o, t + i * 0.055, 0.02, 0.75, 0.075, 0.6);
      o.start(t + i * 0.055); o.stop(t + i * 0.055 + 0.9);
    });
  }

  /* le son du serment : deux notes qui se ferment comme une porte */
  function oath() {
    if (!ready()) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(146.83, t);
    o.frequency.exponentialRampToValueAtTime(97.99, t + 0.9);
    env(o, t, 0.02, 1.4, 0.30, 0.7);
    o.start(t); o.stop(t + 1.8);
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(1.2);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    n.connect(f); env(f, t + 0.55, 0.01, 0.5, 0.13, 0.5);
    n.start(t + 0.55); n.stop(t + 1.6);
  }

    for (let i = 0; i < R.intRange(1, 5); i++) {
      const rr = r * R.range(0.9, 1.12), a0 = R.range(0, 6.2832), a1 = a0 + R.range(0.2, 1.3);
      stroke(c => c.arc(cx, cy, rr, a0, a1), ink2, R.range(0.8, 2.6), 0.6, 2);
    }
    return canvas;
  }

  /* ---- extension du territoire --------------------------------------- */
  function domainGeo(seed) {
    const R = new Rng('territoire:' + seed);
    const pillars = [];
    for (let i = 0; i < R.intRange(7, 16); i++) {
      pillars.push({ x: R.next(), w: R.range(0.01, 0.06), h: R.range(0.25, 0.95), d: R.range(0.15, 1) });
    }
    const rings = [];
    for (let i = 0; i < R.intRange(3, 8); i++) {
      rings.push({ x: R.range(0.05, 0.95), y: R.range(0.05, 0.7), r: R.range(0.03, 0.22), s: R.range(-1, 1), t: R.range(0, 6.28) });
    }
    return { pillars, rings, horizon: R.range(0.55, 0.78), grid: R.intRange(8, 22), tilt: R.range(-0.06, 0.06) };
  }

  function drawDomain(t) {
    const D = state.domain, x = L.dom.x;
    const age = t - D.born;
    const open = clamp(age / 1.6, 0, 1);
    x.clearRect(0, 0, W, H);

    /* fond : le territoire est un intérieur, il n'a pas de ciel */
    x.fillStyle = D.invert ? '#e9e2d4' : '#050506';
    x.globalAlpha = open;
    x.fillRect(0, 0, W, H);
    x.globalAlpha = 1;
    if (open < 1) return;

    const line = D.invert ? '#0a0a0c' : '#e9e2d4';
    const acc = D.accent || '#b31217';
    const g = D.geo, hy = H * g.horizon;

    /* sol en fuite */
    x.strokeStyle = hexA(line, 0.42); x.lineWidth = 1;
    for (let i = 0; i <= g.grid; i++) {
      const k = i / g.grid;
      const y = hy + Math.pow(k, 2.1) * (H - hy) * 1.3;
      x.globalAlpha = 0.85 - k * 0.45;
      x.beginPath(); x.moveTo(-W * 0.2, y); x.lineTo(W * 1.2, y + g.tilt * W); x.stroke();
    }
    for (let i = -6; i <= g.grid + 6; i++) {
      const k = i / g.grid;
      x.globalAlpha = 0.5;
      x.beginPath(); x.moveTo(W * 0.5 + (k - 0.5) * W * 0.35, hy);
      x.lineTo(W * 0.5 + (k - 0.5) * W * 3.2, H * 1.25); x.stroke();
    }
    x.globalAlpha = 1;

    /* l'horizon brûle : c'est la seule source de lumière du lieu */
    const hg = x.createLinearGradient(0, hy - H * 0.16, 0, hy + H * 0.05);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(1, hexA(acc, D.invert ? 0.14 : 0.24));
    x.fillStyle = hg; x.fillRect(0, hy - H * 0.16, W, H * 0.21);
    x.strokeStyle = hexA(line, 0.85); x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(0, hy); x.lineTo(W, hy + g.tilt * W); x.stroke();

    /* piliers : des colonnes sans toit */
    g.pillars.forEach((p, i) => {
      const px = p.x * W, pw = p.w * W * (0.4 + p.d);
      const ph = p.h * hy * (0.5 + p.d * 0.7);
      const drift = Math.sin(t * 0.12 + i) * 4 * p.d;
      x.fillStyle = D.invert ? 'rgba(233,226,212,.55)' : 'rgba(5,5,6,.72)';
      x.fillRect(px - pw / 2 + drift, hy - ph, pw, ph);
      x.strokeStyle = hexA(line, 0.22 + p.d * 0.55);
      x.lineWidth = 1.2;
      x.strokeRect(px - pw / 2 + drift, hy - ph, pw, ph);
      x.strokeStyle = hexA(acc, 0.28 * p.d);
      x.beginPath(); x.moveTo(px + drift, hy - ph); x.lineTo(px + drift, hy); x.stroke();
    });

    /* anneaux suspendus */
    g.rings.forEach((rg, i) => {
      const rr = rg.r * Math.min(W, H);
      const a = rg.t + t * rg.s * 0.22;
      x.save();
      x.translate(rg.x * W, rg.y * H + Math.sin(t * 0.3 + i) * 6);
      x.rotate(a);
      x.strokeStyle = hexA(i % 3 === 0 ? acc : line, 0.35);
      x.lineWidth = 1.2;
      x.beginPath(); x.ellipse(0, 0, rr, rr * (0.18 + 0.5 * Math.abs(Math.sin(a))), 0, 0, 6.2832); x.stroke();
      x.restore();
    });

    /* le sceau, immense, au fond */
    if (D.sigilCanvas) {
      const s = Math.min(W, H) * 0.86;
      x.save();
      x.globalAlpha = 0.20 + 0.07 * Math.sin(t * 0.5);
      x.translate(W / 2, hy * 0.72);
      x.rotate(t * 0.035);
      x.drawImage(D.sigilCanvas, -s / 2, -s / 2, s, s);
      x.restore();
    }

    /* vignettage : on ne sort pas d'ici par les bords */
    const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, D.invert ? 'rgba(233,226,212,0.78)' : 'rgba(0,0,0,0.80)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);
  }

  function domainOpen(spec) {
    const t = (now() - t0) / 1000;
    state.domain = {
      born: t, geo: domainGeo(spec.seed || 'x'),
      accent: spec.accent || state.hue,
      invert: !!spec.invert,
      sigilCanvas: spec.sigilCanvas || null,
    };
    L.dom.c.classList.remove('is-hidden');
    document.body.classList.add('in-domain');
  }
  function domainClose() {
    state.domain = null;
    L.dom.c.classList.add('is-hidden');
    L.dom.x.clearRect(0, 0, W, H);
    document.body.classList.remove('in-domain');
  }

  /* ---- machine à écrire ---------------------------------------------- */
  function type(node, text, opts) {
    const o = opts || {};
    const speed = o.speed || 26;
    node.textContent = '';
    node.classList.add('typing');
    let i = 0, stop = false;
    const p = new Promise(res => {
      function step() {
        if (stop) return res();
        if (i >= text.length) { node.classList.remove('typing'); return res(); }
        const ch = text.charAt(i++);
        node.textContent += ch;
        if (o.sound !== false && ch !== ' ' && i % 2 === 0 && JJK.audio) JJK.audio.tick(chaos.r(900, 2200), 0.012, 0.018);
        const pause = /[.,;:!?…—]/.test(ch) ? speed * 9 : (ch === ' ' ? speed * 0.6 : speed);
        setTimeout(step, pause * chaos.r(0.6, 1.5));
      }
      step();
    });
    p.skip = () => { stop = true; node.textContent = text; node.classList.remove('typing'); };
    return p;
  }

  /* ---- l'interface se mutile ------------------------------------------ */
  function mutilate(node, label) {
    if (!node) return;
    node.classList.add('mutilated');
    if (label) node.setAttribute('data-scar', label);
    slash('#b31217', 1);
    if (JJK.audio) JJK.audio.slash();
  }

  function setIntensity(v) { state.intensity = clamp(v, 0, 1); }
  function setHue(a, b) { if (a) state.hue = a; if (b) state.hue2 = b; }
  function setDead(v) { state.dead = clamp(v, 0, 1); }

  JJK.fx = {
    mount, resize, shake, pulse, slash, ink, inkFade, inkClear, invert, flash,
    sigil, domainOpen, domainClose, type, mutilate, setIntensity, setHue, setDead,
    hexA, state,
    get size() { return { W, H }; },
  };
})(window);


/* ==== 30-forge.js ==== */
/* =========================================================================
   RITUEL — la forge
   Une technique innée ne se choisit pas. Elle se constate.
   Même graine, même destin, sur n'importe quelle machine, pour toujours.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { Rng, cyrb128, normalizeSeed, clamp, titre } = JJK.core;

  /* ---- grammaire française : on ne livre pas « de Le Sang » ---------- */
  const VOY = /[aeiouyàâäéèêëîïôöûüh]/i;
  function fr(s) {
    let t = ' ' + String(s || '').replace(/\s+/g, ' ').trim() + ' ';
    t = t.replace(/\bde Les\b/gi, 'des').replace(/\bde Le\b/gi, 'du')
         .replace(/\bde La\b/g, 'de la').replace(/\bde L'/gi, "de l'")
         .replace(/\bà Les\b/gi, 'aux').replace(/\bà Le\b/gi, 'au')
         .replace(/\bà La\b/g, 'à la').replace(/\bà L'/gi, "à l'")
         .replace(/\bde ([AEIOUYÉÈÊÎÔÛaeiouyéèêîôû])/g, "d'$1")
         .replace(/\bDe ([AEIOUYÉÈÊÎÔÛaeiouyéèêîôû])/g, "D'$1")
         .replace(/\ble ([AEIOUYÉÈÊÎÔÛaeiouyéèêîôû])/g, "l'$1")
         .replace(/\bla ([AEIOUYÉÈÊÎÔÛaeiouyéèêîôû])/g, "l'$1")
         .replace(/'\s+/g, "'");
    return t.trim();
  }
  /* « La Rouille » → { nu: 'Rouille', genre: 'f', art: 'la' } */
  function decoupe(nom) {
    const s = String(nom || '').trim();
    let m = /^(Les|Le|La|L['’]|Des|Du|De la|De l['’]|De)\s*/i.exec(s);
    if (!m) return { nu: s, genre: 'm', art: 'le', pluriel: false };
    const a = m[1].toLowerCase().replace('’', "'");
    const nu = s.slice(m[0].length).trim() || s;
    const pluriel = a === 'les' || a === 'des';
    const genre = pluriel ? 'p' : (a === 'la' || a === 'de la' ? 'f' : (a === "l'" || a === "de l'" ? (VOY.test(nu[0]) ? 'e' : 'm') : 'm'));
    const art = pluriel ? 'les' : (genre === 'f' ? 'la' : (genre === 'e' ? "l'" : 'le'));
    return { nu, genre, art, pluriel };
  }
  function avecArticle(nom) {
    const d = decoupe(nom);
    return fr(d.art + (d.art === "l'" ? '' : ' ') + d.nu);
  }

  /* ---- composition japonaise ----------------------------------------- */
  const KANJI_SUF = [
    { k: '術', r: 'jutsu' }, { k: '呪法', r: 'juhō' }, { k: '縛', r: 'baku' },
    { k: '律', r: 'ritsu' }, { k: '蝕', r: 'shoku' }, { k: '帳', r: 'chō' },
    { k: '環', r: 'kan' }, { k: '秤', r: 'hakari' }, { k: '骸', r: 'mukuro' },
    { k: '灯', r: 'tō' }, { k: '簿', r: 'bo' }, { k: '轍', r: 'wadachi' },
  ];
  const KANJI_PRE = [
    { k: '', r: '' }, { k: '', r: '' }, { k: '逆', r: 'gyaku' }, { k: '真', r: 'shin' },
    { k: '黒', r: 'koku' }, { k: '無', r: 'mu' }, { k: '深', r: 'shin' }, { k: '虚', r: 'kyo' },
  ];

  /* ---- accès tolérant au corpus --------------------------------------- */
  function C() { return JJK.CORPUS || {}; }
  function liste(k, fallback) {
    const c = C();
    const v = c[k];
    if (Array.isArray(v) && v.length) return v;
    if (v && typeof v === 'object') {
      for (const key in v) if (Array.isArray(v[key]) && v[key].length) return v[key];
    }
    return fallback || [];
  }

  /* affinité stable entre deux entrées : ni hasard, ni arbitraire */
  function affinite(a, b) { return cyrb128('lien:' + a + '::' + b)[1] % 1000; }
  function meilleur(pool, ref, R, top) {
    if (!pool.length) return null;
    const notes = pool.map(o => ({ o, n: affinite(ref, o.id || o.nom || '') }));
    notes.sort((x, y) => y.n - x.n);
    const court = notes.slice(0, Math.max(1, Math.min(top || 4, notes.length)));
    return R.pick(court).o;
  }

  /* ---- noms de technique ---------------------------------------------- */
  const PATRONS = [
    p => fr(p.LOI),
    p => fr(p.LOI + ' de ' + p.ESSENCE_ART),
    p => fr('Technique de ' + p.ESSENCE_ART),
    p => fr(p.NOMBRE + ' ' + p.MATIERE),
    p => fr(p.ESSENCE_NU + ' ' + p.SUFFIXE),
    p => fr(p.PREFIXE + ' ' + p.ESSENCE_NU),
    p => fr(p.MATIERE + ' de ' + p.ESSENCE_ART),
    p => fr(p.LOI + ' : ' + p.NOMBRE + ' ' + p.MATIERE),
    p => fr(p.ESSENCE_ART + ' ' + p.SUFFIXE),
    p => fr(p.PREFIXE + ' de ' + p.ESSENCE_ART),
    p => fr(p.ESSENCE_NU + ' ' + p.NOMBRE),
    p => fr('Doctrine de ' + p.ESSENCE_ART),
    p => fr(p.ORGANE + ' de ' + p.ESSENCE_ART),
    p => fr(p.LOI + ' ' + p.SUFFIXE),
  ];

  /* ---- la forge --------------------------------------------------------
     Tout ce qui suit ne dépend que de la graine. Rien d'autre.           */
  function forgeTechnique(rawSeed) {
    const seed = normalizeSeed(rawSeed) || 'sans nom';
    const R = new Rng('technique:' + seed);

    const essences = liste('essences'), vecteurs = liste('vecteurs'), lois = liste('lois');
    const domaines = liste('domaines'), matieres = (C().matieres || {});
    const nomen = C().nomenclature || {};

    const essence = R.pick(essences) || { id: 'x', nom: 'La Cendre', kanji: '灰', romaji: 'hai', concept: '', sensoriel: '', couleur: '#b31217', emotion_source: '' };
    const loi = meilleur(lois, essence.id || essence.nom, R.fork('loi'), 5) || { id: 'y', nom: 'Loi muette', enonce: '', archetype: 'seuil' };
    const vecteur = meilleur(vecteurs, (loi.id || '') + (essence.id || ''), R.fork('vecteur'), 5) || { id: 'z', nom: 'Par le contact', condition: '', portee: 'contact' };
    const domaine = meilleur(domaines, (loi.id || '') + ':' + (essence.id || ''), R.fork('domaine'), 4) || null;

    const matiere = R.pick(matieres.matieres || ['cendre']);
    const nombre = R.pick(matieres.nombres || ['Neuf']);
    const lieu = R.pick(matieres.lieux || ['une salle sans porte']);
    const organe = R.pick(matieres.organes || ['la moelle']);
    const prefixe = R.pick(nomen.prefixes || ['Rite']);
    const suffixe = R.pick(nomen.suffixes || ['Perpétuel']);

    const d = decoupe(essence.nom);
    const jetons = {
      ESSENCE: essence.nom, ESSENCE_NU: d.nu, ESSENCE_ART: avecArticle(essence.nom),
      LOI: loi.nom, VECTEUR: vecteur.nom, NOMBRE: nombre, MATIERE: titre(matiere),
      PREFIXE: prefixe, SUFFIXE: suffixe, ORGANE: titre(String(organe).replace(/^(la|le|les|l')\s*/i, '')),
    };
    let nom = titre(PATRONS[R.int(PATRONS.length)](jetons));
    /* deux techniques de même nom, c'est une insulte au registre */
    nom = nom.replace(/\s+/g, ' ').trim();

    const kp = R.pick(KANJI_PRE), ks = R.pick(KANJI_SUF);
    const nomJp = (kp.k || '') + (essence.kanji || '呪') + ks.k;
    const romaji = ((kp.r ? kp.r + '-' : '') + (essence.romaji || 'ju') + '-' + ks.r).replace(/--+/g, '-');

    const couleur = essence.couleur && /^#[0-9a-f]{3,8}$/i.test(essence.couleur) ? essence.couleur : '#b31217';

    return {
      seed, graineBrute: String(rawSeed || ''),
      nom, nomJp, romaji, couleur,
      essence, vecteur, loi, domaine,
      matiere, nombre, lieu, organe,
      sigil: 'sceau:' + seed,
      archetype: loi.archetype || 'seuil',
      revers: loi.inversion || '',
      maximum: loi.maximum || '',
    };
  }

  /* ---- le réceptacle : ce que le corps fait de la technique ------------
     Les réponses au rituel ne changent PAS la technique.
     Elles changent seulement la manière dont le corps la supporte.      */
  const AXES = ['vigueur', 'flux', 'tranchant', 'lucidite', 'inversion'];
  const POIDS_ARCHETYPE = {
    soustraction: { tranchant: 2.0, lucidite: 1.2, vigueur: 0.6, flux: 1.0, inversion: 0.7 },
    'échange':    { flux: 2.0, inversion: 1.5, lucidite: 1.0, vigueur: 0.8, tranchant: 0.8 },
    'répétition': { flux: 1.7, vigueur: 1.4, tranchant: 1.1, lucidite: 0.8, inversion: 1.0 },
    mesure:       { lucidite: 2.1, tranchant: 1.2, flux: 1.0, vigueur: 0.8, inversion: 0.9 },
    lien:         { inversion: 1.9, vigueur: 1.5, flux: 1.1, lucidite: 1.0, tranchant: 0.6 },
    seuil:        { vigueur: 2.0, tranchant: 1.3, inversion: 1.0, flux: 0.9, lucidite: 0.8 },
    'témoignage': { lucidite: 1.8, flux: 1.4, inversion: 1.2, tranchant: 0.8, vigueur: 0.9 },
    'métamorphose': { tranchant: 1.6, flux: 1.4, vigueur: 1.2, inversion: 1.1, lucidite: 0.8 },
  };

  function forgeReceptacle(rawSeed, reponses) {
    const seed = normalizeSeed(rawSeed) || 'sans nom';
    const R = new Rng('corps:' + seed + ':' + (reponses || []).join(','));
    const poids = { vigueur: 1, flux: 1, tranchant: 1, lucidite: 1, inversion: 1 };
    (reponses || []).forEach(a => {
      const p = POIDS_ARCHETYPE[a];
      if (!p) return;
      AXES.forEach(k => { poids[k] += (p[k] || 1) * 0.55; });
    });
    /* répartition à budget fixe : on ne peut pas être bon partout */
    const brut = {};
    let somme = 0;
    AXES.forEach(k => { brut[k] = Math.max(0.15, poids[k] * R.range(0.72, 1.34)); somme += brut[k]; });
    const BUDGET = 100;
    const stats = {};
    AXES.forEach(k => { stats[k] = Math.max(6, Math.round((brut[k] / somme) * BUDGET)); });

    const dominante = AXES.slice().sort((a, b) => stats[b] - stats[a])[0];
    const pvMax = 90 + stats.vigueur * 3.4 | 0;
    const enMax = 5 + Math.round(stats.flux / 14);
    const enTour = 2 + (stats.flux >= 26 ? 1 : 0) + (stats.flux >= 40 ? 1 : 0);

    return {
      stats, dominante,
      pvMax, enMax, enTour,
      attaque: 13 + Math.round(stats.tranchant * 0.80),
      crit: clamp(0.05 + stats.lucidite * 0.006, 0.05, 0.42),
      soin: 0.35 + stats.inversion * 0.022,
      puissance: Math.round(stats.tranchant * 1.5 + stats.vigueur * 1.1 + stats.flux * 1.2 + stats.lucidite * 1.0 + stats.inversion * 0.9),
    };
  }

  /* ---- grade : la hiérarchie n'est pas une opinion --------------------- */
  function grade(puissance, sermentsSignes) {
    const grades = liste('grades', []).length ? liste('grades') : (C().nomenclature || {}).grades || [];
    const p = puissance + (sermentsSignes || 0) * 22;
    const tri = grades.slice().sort((a, b) => (a.seuil || 0) - (b.seuil || 0));
    let g = tri[0] || { grade: '4', nom: 'Quatrième grade', description: '' };
    tri.forEach(x => { if (p >= (x.seuil || 0)) g = x; });
    return g;
  }

  /* ---- prose du dossier ------------------------------------------------ */
  function dossier(tech) {
    const e = tech.essence || {}, v = tech.vecteur || {}, l = tech.loi || {};
    const phrases = [];
    if (e.concept) phrases.push(e.concept.replace(/\.$/, '') + '.');
    if (e.sensoriel) phrases.push(e.sensoriel.replace(/\.$/, '') + '.');
    if (l.consequence) phrases.push(l.consequence.replace(/\.$/, '') + '.');
    return phrases.join(' ');
  }
  function minuscule(s) { const t = String(s || ''); return t.charAt(0).toLowerCase() + t.slice(1); }

  JJK.forge = { forgeTechnique, forgeReceptacle, grade, dossier, fr, decoupe, avecArticle, AXES, affinite, liste };
})(window);

  /* On accroche la prose du corpus sur les emplacements mécaniques.

  function catalogue(seed) {
    const src = ((JJK.CORPUS || {}).serments || {}).serments || [];
    const pris = {};
    const out = EMPLACEMENTS.map(e => {
      let choisi = null, note = -1;
      src.forEach(s => {
        if (pris[s.id]) return;
        const texte = [s.restriction_code, s.restriction, s.nom, s.clause].join(' ');
        let n = e.mots.test(texte) ? 100 : 0;
        n += (cyrb128(e.id + '|' + (s.id || s.nom))[2] % 40) / 100;
        if (n > note) { note = n; choisi = s; }
      });
      if (choisi && note >= 100) pris[choisi.id || choisi.nom] = 1; else choisi = null;
      return {
        id: e.id,
        nom: (choisi && choisi.nom) || e.nom,
        clause: (choisi && choisi.clause) || e.clause,
        perte: e.perte,
        gain: e.gain,
        pertePoetique: (choisi && choisi.restriction) || e.perte,
        gainPoetique: (choisi && choisi.gain) || e.gain,
        danger: (choisi && choisi.danger) || e.danger,
        eff: e.eff,
      };
    });
    /* le rituel ne propose jamais tout : il propose ce qu'il a jugé bon */
    const R = new Rng('serments:' + seed);
    return R.shuffle(out);
  }

  /* Agrège les effets des serments signés en un modificateur unique. */
  function agreger(signes) {
    const m = {
      degatsMult: 1, degatsRecusMult: 1, pvMaxMult: 1, soinMult: 1,
      critBonus: 0, critMult: 1, energieBonus: 0, energieDepart: 0, enMaxBonus: 0,
      remise: 0, frappeMult: 1, domaineMult: 1, domaineTours: 0, rancune: 0,
      interdit: {}, masqueVieEnnemi: false, masqueJournal: false, coupeSon: false,
      pasDeRepetition: false, domaineUnique: false, effaceToutALaMort: false,
      limiteTours: 0,
    };
    (signes || []).forEach(s => {
      const e = s.eff || {};
      if (e.degatsMult) m.degatsMult *= e.degatsMult;
      if (e.degatsRecusMult) m.degatsRecusMult *= e.degatsRecusMult;
      if (e.pvMaxMult) m.pvMaxMult *= e.pvMaxMult;
      if (e.soinMult) m.soinMult *= e.soinMult;
      if (e.critBonus) m.critBonus += e.critBonus;
      if (e.critMult) m.critMult *= e.critMult;
      if (e.energieBonus) m.energieBonus += e.energieBonus;
      if (e.energieDepart) m.energieDepart += e.energieDepart;
      if (e.enMaxBonus) m.enMaxBonus += e.enMaxBonus;
      if (e.remise) m.remise += e.remise;
      if (e.frappeMult) m.frappeMult *= e.frappeMult;
      if (e.domaineMult) m.domaineMult *= e.domaineMult;
      if (e.domaineTours) m.domaineTours += e.domaineTours;
      if (e.rancune) m.rancune += e.rancune;
      if (e.limiteTours) m.limiteTours = m.limiteTours ? Math.min(m.limiteTours, e.limiteTours) : e.limiteTours;
      (e.interdit || []).forEach(k => { m.interdit[k] = true; });
      ['masqueVieEnnemi', 'masqueJournal', 'coupeSon', 'pasDeRepetition', 'domaineUnique', 'effaceToutALaMort']
        .forEach(k => { if (e[k]) m[k] = true; });
    });
    /* Plafond souple : au-delà d'un certain point, empiler des serments
       cesse de payer. Le réel se lasse d'être négocié.                   */
    if (m.degatsMult > 3.0) m.degatsMult = 3.0 + (m.degatsMult - 3.0) * 0.40;
    if (m.pvMaxMult < 0.30) m.pvMaxMult = 0.30;
    return m;
  }

  function statut(c, id) { return c.statuts.find(s => s.id === id); }
  function poser(c, id, tours, val) {
    const ex = statut(c, id);
    if (ex) { ex.tours = Math.max(ex.tours, tours); ex.val = Math.max(ex.val || 0, val || 0); return ex; }
    const s = { id, tours, val: val || 0, nom: (STATUTS[id] || {}).nom || id, type: (STATUTS[id] || {}).type || 'mauvais' };
    c.statuts.push(s);

  }
  function retirer(c, id) { const i = c.statuts.findIndex(s => s.id === id); if (i >= 0) c.statuts.splice(i, 1); }

  const ACTIONS = [

  /* ---- construction d'un combattant ------------------------------------ */
  function combattantJoueur(tech, corps, mods, nomJoueur) {

    return {
      cle: 'joueur', nom: nomJoueur || 'Toi', sousTitre: tech.nom,

  /* Calibrage : le contenu écrit la couleur, le code écrit la difficulté.

  const CADENCE = {
    '4':             { tours: 3.0, survie: 10.0 },
    '3':             { tours: 4.2, survie: 8.5 },
    '2':             { tours: 5.6, survie: 7.2 },

  function combattantFleau(f, ref, R, courbe) {
    const g = String(f.grade || '4');

       exactement à la vitesse du joueur, et le joueur ne sentirait rien.
       Ici, le fléau ignore ce que tu as signé. C'est à toi d'en profiter.  */
    const dpsRef = Math.max(6, ref.attaque * 1.9);
    /* variance de caractère : deux fléaux de même grade ne se ressemblent pas */
    const vPv = rng.range(0.86, 1.16), vAtt = rng.range(0.86, 1.16);

      archetype: f.archetype || 'seuil', domaine: f.domaine || null, fleau: f,

      mods: MODS_NEUTRES(),
      raffinement: Math.round(pvMax / 5 + attaque * 2.2),
      intention: null, humain: false,
      profil: profilDe(g),
      grade: g,

      case '1': return { agressif: 0.45, technique: 0.35, garde: 0.10, soin: 0.14, domaine: false, seuilTension: 999 };
      case 'semi-spécial': return { agressif: 0.40, technique: 0.38, garde: 0.10, soin: 0.16, domaine: true, seuilTension: 130 };
      default: return { agressif: 0.36, technique: 0.42, garde: 0.08, soin: 0.18, domaine: true, seuilTension: 100 };
    }
  }

  /* ---- le duel ---------------------------------------------------------- */
  function creer(opts) {
    const R = new Rng('duel:' + opts.seed + ':' + (opts.ennemi.id || 'x') + ':' + (opts.numero || 0));
    const D = {
      R, tour: 1, fini: false, vainqueur: null, journal: [],
      joueur: opts.joueur, ennemi: opts.ennemi,
      mods: opts.joueur.mods,
      numero: opts.numero || 0,
    };
    D.joueur.en = Math.min(D.joueur.enMax, 3 + (D.mods.energieDepart || 0));
    D.ennemi.intention = choisirIntention(D, D.ennemi, D.joueur);

    /* ---- calcul des dégâts : une seule porte d'entrée ---------------- */
    D.degats = function (ev, a, d, mult, o) {
      o = o || {};
      let base = a.attaque * mult;
      if (statut(a, 'fracture')) base *= 0.70;
      const el = statut(a, 'elan'); if (el) base *= 1 + (el.val || 0);
      base *= a.mods.degatsMult || 1;
      base *= 1 + (a.rancune || 0);
      if (a.domaineTours > 0) base *= 1.35;

      const lec = statut(a, 'lecture');
      const chanceCrit = clamp((a.crit || 0.1) + (lec ? 0.55 : 0), 0, 0.95);
      const crit = R.chance(chanceCrit);
      if (crit) base *= 1.85 * (a.mods.critMult || 1);
      if (lec) { retirer(a, 'lecture'); }

      base *= R.range(0.90, 1.12);

      const g = statut(d, 'garde');
      if (g && !o.ignoreGarde) { base *= 1 - (g.val || 0.5); retirer(d, 'garde'); }
      if (statut(d, 'marque')) base *= 1.30;
      base *= d.mods.degatsRecusMult || 1;
      if (d.domaineTours > 0 && !o.surAuBut) base *= 0.70;

      let q = Math.max(1, Math.round(base));
      if (d.pv - q <= 0 && statut(d, 'sursis')) {
        retirer(d, 'sursis'); q = Math.max(0, d.pv - 1);
        ev.push({ t: 'sursis', qui: d.cle });
      }
      d.pv -= q;
      a.rancune = 0;
      a.tension = Math.min(200, a.tension + Math.round(q * 0.30) + 6);
      d.tension = Math.min(200, d.tension + Math.round(q * 0.55) + 4);
      d.rancune = Math.min(1.5, (d.rancune || 0) + (d.mods.rancune || 0));

      const ec = statut(d, 'echo');
      ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q, crit, verbe: o.verbe || 'frappe', gros: !!o.gros, surAuBut: !!o.surAuBut });
      if (ec) {
        const q2 = Math.max(1, Math.round(q * 0.45));
        d.pv -= q2; ec.tours -= 1;
        ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q2, echo: true, verbe: 'se répète' });
        if (ec.tours <= 0) retirer(d, 'echo');
      }
      return q;
    };

    /* ---- actions disponibles ------------------------------------------ */
    D.actions = function () {
      const a = D.joueur;
      return ACTIONS.map(act => {
        const cout = coutReel(act, a);
        let ok = true, raison = '';
        if (a.mods.interdit[act.id]) { ok = false; raison = 'Interdit par un serment.'; }
        else if (a.en < cout) { ok = false; raison = 'Énergie insuffisante.'; }
        else if (act.req && !act.req(D, a, D.ennemi)) { ok = false; raison = act.raison || 'Impossible.'; }
        else if (a.mods.pasDeRepetition && a.derniereAction === act.id) { ok = false; raison = 'Serment : jamais deux fois le même geste.'; }
        return {
          id: act.id, nom: act.id === 'technique' ? (a.technique ? a.technique.nom : act.nom) : act.nom,
          sous: act.id === 'technique' ? 'Technique innée' : (act.id === 'maximum' && a.technique && a.technique.maximum ? 'Technique maximale' : ''),
          desc: act.desc, cout, ok, raison, ultime: !!act.ultime,
          interdit: !!a.mods.interdit[act.id],
        };
      });
    };

    function coutReel(act, a) {
      if (!act.cout) return 0;
      return Math.max(1, act.cout - (a.mods.remise || 0));
    }

    /* ---- un tour complet ----------------------------------------------- */
    D.jouer = function (id) {
      if (D.fini) return [];
      const act = parId[id];
      const a = D.joueur, d = D.ennemi;
      if (!act) return [];
      const cout = coutReel(act, a);
      if (a.en < cout || a.mods.interdit[id] || (act.req && !act.req(D, a, d))) return [];

      const ev = [];
      a.en -= cout;
      a.derniereAction = id;
      ev.push({ t: 'acte', qui: 'joueur', nom: id === 'technique' && a.technique ? a.technique.nom : act.nom, id });
      Array.prototype.push.apply(ev, act.exec(D, a, d, R) || []);

      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }
      if (D.fini) return ev;

      /* riposte */
      Array.prototype.push.apply(ev, tourEnnemi(D, ev));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      /* fin de tour */
      Array.prototype.push.apply(ev, finDeTour(D));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      D.tour++;
      if (a.mods.limiteTours && D.tour > a.mods.limiteTours) {
        ev.push({ t: 'sablier', limite: a.mods.limiteTours });
        a.pv = 0; finir(ev, 'ennemi'); return ev;
      }
      d.intention = choisirIntention(D, d, a);
      ev.push({ t: 'tour', n: D.tour });
      return ev;
    };

    function finir(ev, qui) {
      D.fini = true; D.vainqueur = qui;
      ev.push({ t: 'fin', vainqueur: qui });
    }

    function finDeTour(D) {
      const ev = [];
      [D.joueur, D.ennemi].forEach(c => {
        const sg = statut(c, 'saignee');
        if (sg) {
          const q = Math.max(1, sg.val || 3);
          c.pv -= q;
          ev.push({ t: 'degats', par: 'saignee', cible: c.cle, montant: q, verbe: 'saigne', dot: true });
        }
        if (statut(c, 'corrosion')) c.en = Math.max(0, c.en - 1);
        c.en = Math.min(c.enMax, c.en + 2 + (c.mods.energieBonus || 0) + (c.humain ? 0 : 1));
        c.tension = Math.min(200, c.tension + 8);
        if (c.domaineTours > 0) {
          c.domaineTours--;
          const cible = c === D.joueur ? D.ennemi : D.joueur;
          const q = Math.max(2, Math.round(cible.pvMax * 0.06 * (c.mods.domaineMult || 1)));
          cible.pv -= q;
          ev.push({ t: 'degats', par: c.cle, cible: cible.cle, montant: q, verbe: 'ronge', domaine: true });
          if (c.domaineTours === 0) ev.push({ t: 'domaineFerme', qui: c.cle });
        }
        for (let i = c.statuts.length - 1; i >= 0; i--) {
          const s = c.statuts[i];
          if (s.id === 'garde' || s.id === 'elan') continue;
          s.tours--;
          if (s.tours <= 0) { c.statuts.splice(i, 1); ev.push({ t: 'statutFin', qui: c.cle, id: s.id }); }
        }
      });
      return ev;
    }

    /* ---- l'adversaire n'improvise pas : il a un tempérament ------------ */
    function choisirIntention(D, e, cible) {
      if (!e.profil) e.profil = profilDe((e.fleau || {}).grade || '2');
      const p = e.profil;
      const bas = e.pv / e.pvMax < 0.35;
      if (p.domaine && e.tension >= p.seuilTension && e.en >= 6 && !statut(e, 'scelle') && e.domaineTours === 0) return 'domaine';
      if (e.tension >= 70 && e.en >= 5 && R.chance(0.55)) return 'maximum';
      if (bas && p.soin > 0 && e.en >= 3 && R.chance(0.55)) return 'inverse';
      const r = R.next();
      if (r < p.agressif) return e.en >= 2 && R.chance(0.6) ? 'decharge' : 'frappe';
      if (r < p.agressif + p.technique) return e.en >= 3 ? 'technique' : 'frappe';
      if (r < p.agressif + p.technique + p.garde) return 'garde';
      return 'frappe';
    }

    function tourEnnemi(D) {
      const e = D.ennemi, j = D.joueur;
      let id = e.intention || 'frappe';
      const act = parId[id];
      const cout = act ? (act.cout || 0) : 0;
      if (!act || e.en < cout || (act.req && !act.req(D, e, j))) { id = 'frappe'; }
      const a2 = parId[id];
      e.en -= (a2.cout || 0);
      e.derniereAction = id;
      const ev = [{ t: 'acte', qui: 'ennemi', nom: id === 'technique' && e.fleau ? (e.fleau.technique_signature || a2.nom) : a2.nom, id }];
      Array.prototype.push.apply(ev, a2.exec(D, e, j, R) || []);
      return ev;
    }

    return D;
  }

  JJK.combat = { creer, combattantJoueur, combattantFleau, ACTIONS, STATUTS, MODS_NEUTRES, statut, profilDe };
})(window);

/* =========================================================================
   RITUEL — mémoire
   Le jeu tient un registre. Il n'oublie ni les noms, ni les manières de
   mourir. Un serment peut détruire ce registre ; rien ne peut le corriger.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  const CLE = 'rituel.registre.v1';
  const VIDE = {
    version: 1,
    graine: null, reponses: [], maturation: 0,
    descentes: 0, victoires: 0, fuites: 0, morts: 0,
    serments: [], sonCoupe: false,
    epitaphes: [],           /* ceux qui sont tombés ici, sous n'importe quel nom */
    titres: [], vus: [],
    premiereVisite: null, derniereVisite: null,
    domainesOuverts: 0, sermentsPretes: 0, degatsSubis: 0, degatsInfliges: 0,
  };

  function dispo() {
    try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  const OK = dispo();
  let cache = null;

  function lire() {
    if (cache) return cache;
    if (!OK) return (cache = JSON.parse(JSON.stringify(VIDE)));
    try {
      const brut = localStorage.getItem(CLE);
      cache = brut ? Object.assign(JSON.parse(JSON.stringify(VIDE)), JSON.parse(brut)) : JSON.parse(JSON.stringify(VIDE));
    } catch (e) { cache = JSON.parse(JSON.stringify(VIDE)); }
    return cache;
  }
  function ecrire(patch) {
    const r = lire();
    if (patch) Object.assign(r, patch);
    r.derniereVisite = Date.now();
    if (!r.premiereVisite) r.premiereVisite = r.derniereVisite;
    if (OK) { try { localStorage.setItem(CLE, JSON.stringify(r)); } catch (e) {} }
    return r;
  }
  function effacer() {
    cache = null;
    if (OK) { try { localStorage.removeItem(CLE); } catch (e) {} }
    return lire();
  }

  /* ---- épitaphes : ce que le registre garde d'un mort ------------------ */
  function inhumer(fiche) {
    const r = lire();
    r.epitaphes.unshift({
      graine: fiche.graine, nom: fiche.nom, technique: fiche.technique, nomJp: fiche.nomJp,
      tueur: fiche.tueur, tour: fiche.tour, grade: fiche.grade,
      serments: fiche.serments || [], date: Date.now(),
      derniersMots: fiche.derniersMots || '',
      archetype: fiche.archetype || 'seuil',
    });
    r.epitaphes = r.epitaphes.slice(0, 12);
    r.morts++;
    ecrire();
    return r.epitaphes[0];
  }

  /* Le revenant : ton cadavre revient te chercher, avec ta propre loi.
     C'est la seule créature du jeu que tu as toi-même fabriquée.        */
  function revenant() {
    const r = lire();
    const e = r.epitaphes[0];
    if (!e) return null;
    return {
      id: 'revenant:' + e.graine + ':' + e.date,
      nom: e.nom ? ('Ce qui reste de ' + e.nom) : 'Ce qui reste de toi',
      grade: r.morts >= 4 ? 'spécial' : (r.morts >= 2 ? 'semi-spécial' : '1'),
      origine: "La peur, très ordinaire, de retrouver sa propre écriture dans une lettre qu'on n'a pas écrite.",
      apparence: "Ta silhouette, à la hauteur exacte de tes yeux, portant ton visage comme on porte un vêtement mal boutonné.",
      comportement: "Il connaît ta loi. Il l'a portée. Il sait à quel tour tu ouvres ton territoire.",
      replique: e.derniersMots || "Tu as recommencé. Moi, je n'ai pas pu.",
      technique_signature: e.technique || 'Ta technique',
      revenant: true, epitaphe: e, archetype: e.archetype || 'seuil',
    };
  }

  function marquerVu(id) {
    const r = lire();
    if (r.vus.indexOf(id) < 0) { r.vus.push(id); ecrire(); }
  }
  function aVu(id) { return lire().vus.indexOf(id) >= 0; }

  function accorderTitre(t) {
    const r = lire();
    if (r.titres.indexOf(t) < 0) { r.titres.push(t); ecrire(); return true; }
    return false;
  }

  function estUnRetour() {
    const r = lire();
    return !!(r.premiereVisite && (r.morts > 0 || r.descentes > 0));
  }

  /* Le registre reconnaît un revenant qui change de nom. */
  function connaitAutreNom(graineActuelle) {
    const r = lire();
    const noms = {};
    r.epitaphes.forEach(e => { if (e.graine && e.graine !== graineActuelle) noms[e.graine] = 1; });
    if (r.graine && r.graine !== graineActuelle) noms[r.graine] = 1;
    return Object.keys(noms);
  }

  JJK.memoire = {
    lire, ecrire, effacer, inhumer, revenant, marquerVu, aVu,
    accorderTitre, estUnRetour, connaitAutreNom, disponible: OK, CLE,
  };
})(window);

    if ((e.key === ' ' || e.key === 'Enter') && UI._enCours && UI._enCours.skip) UI._enCours.skip();

  function murmures(on) {

    murmureTimer = setInterval(() => {
      if (document.hidden) return;
      const v = ((JJK.CORPUS || {}).voix || {}).murmures || [];

      const n = el('div', 'murmure-flottant', v[Math.floor(Math.random() * v.length)]);

      n.style.left = chaos.r(45, 92) + 'vw';
      document.body.appendChild(n);
      if (JJK.audio && Math.random() < 0.35) JJK.audio.whisper(chaos.r(0.5, 1.1));
      setTimeout(() => n.remove(), 13500);
    }, 9000);

  /* ---- le titre de l'onglet parle aussi -------------------------------- */

  function titreOnglet(t) { document.title = t || TITRE_BASE; }

    son.addEventListener('click', () => {
      if (UI.etat && UI.etat.mods && UI.etat.mods.coupeSon) return;

    });
    const reg = bouton('REGISTRE', 'fantome', () => { if (JJK.ecrans) JJK.ecrans.registre(); });
    reg.style.cssText = 'border:0;padding:4px 0;font-size:10px;letter-spacing:.2em;margin:0;color:inherit';
    b.appendChild(son); b.appendChild(reg);

    if (o.grade != null) document.getElementById('be-grade').textContent = o.grade ? ('GRADE ' + String(o.grade).toUpperCase()) : '';
    if (o.registre != null) document.getElementById('be-registre').textContent = o.registre;

        await U.dire(flux, 'Le registre a gardé ' + (mort.nom || 'quelqu\'un') + ', porteur de « ' + (mort.technique || 'rien') + ' », tombé au tour ' + (mort.tour || '?') + ' devant ' + (mort.tueur || 'quelque chose') + '.', { apres: 400 });

      }
    } else {
      for (let i = 0; i < ouverture.length; i++) {
        await U.dire(flux, ouverture[i], { forte: i === ouverture.length - 1, apres: i === 0 ? 500 : 260 });
      }
    }

    /* saisie */
    const boite = el('div');
    boite.style.marginTop = '34px';
    boite.appendChild(el('span', 'etiquette', 'Nom porté par le réceptacle'));
    const champ = el('input', 'champ');
    champ.type = 'text'; champ.maxLength = 40;
    champ.placeholder = 'écris-le';
    champ.autocomplete = 'off'; champ.spellcheck = false;
    boite.appendChild(champ);
    const avert = el('p', 'discret');
    avert.style.marginTop = '14px';
    avert.textContent = "Le même nom donnera toujours exactement la même technique. Sur cette machine, sur une autre, dans dix ans. Ce n'est pas un tirage : c'est une lecture.";
    boite.appendChild(avert);
    n.appendChild(boite);

    const r = U.rangee();
    const go = U.bouton('Ouvrir le registre', 'rouge', () => valider());
    go.disabled = true;
    r.appendChild(go);
    if (reg.epitaphes.length) r.appendChild(U.bouton('Consulter les morts', 'fantome', registre));
    n.appendChild(r);

    const alerte = el('p', 'discret sang');
    alerte.style.cssText = 'margin-top:10px;min-height:1.4em;font-style:italic';
    boite.appendChild(alerte);

    champ.addEventListener('input', () => {
      go.disabled = champ.value.trim().length < 1;
      if (champ.value.length && Math.random() < 0.25 && JJK.audio) JJK.audio.tick(chaos.r(600, 1800), 0.014, 0.02);
      /* Le registre relit par-dessus ton épaule pendant que tu tapes. */
      const g2 = JJK.core.normalizeSeed(champ.value);
      const dejaMort = reg.epitaphes.filter(e => e.graine === g2);
      if (g2 && dejaMort.length) {
        alerte.textContent = 'Ce nom est déjà tombé ici' + (dejaMort.length > 1 ? ' ' + dejaMort.length + ' fois' : '') +
          ' — porteur de « ' + dejaMort[0].technique + ' », au tour ' + dejaMort[0].tour + '.';
        JJK.fx.shake(0.08);
      } else alerte.textContent = '';
    });
    champ.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) valider(); });
    setTimeout(() => champ.focus(), 300);

    async function valider() {
      const v = champ.value.trim();
      if (!v) return;
      JJK.audio.unlock();
      G.graine = v;
      G.tech = JJK.forge.forgeTechnique(v);
      go.disabled = true; champ.disabled = true;

      /* ---- l'image subliminale -------------------------------------
         Le nom de la technique passe à l'écran pendant 130 ms, une
         seule fois, sans annonce. Presque personne ne le lit. Presque.  */
      const sub = el('div');
      sub.style.cssText = 'position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;' +
        'font-family:var(--serif);font-weight:300;font-size:clamp(2rem,8vw,6rem);color:#e9e2d4;background:#07070a;' +
        'text-align:center;padding:20px;letter-spacing:-.02em';
      sub.textContent = G.tech.nom;
      document.body.appendChild(sub);
      JJK.audio.tick(90, 0.05, 0.10);
      await wait(130);
      sub.remove();
      G.subliminalMontre = true;

      JJK.fx.pulse(null, null, null, '#b31217', 1.4);
      JJK.fx.shake(0.25);
      await wait(450);
      M().ecrire({ graine: JJK.core.normalizeSeed(v) });
      U.majBarre({ graine: JJK.core.normalizeSeed(v) });
      rituel();
    }
  }

  /* =====================================================================
     2. LE RITUEL
     ===================================================================== */
  const QUESTIONS_SECOURS = [
    { question: "Quand on t'a fait du tort, qu'as-tu gardé ?", reponses: [
      { texte: "La date exacte.", archetype: 'mesure', note: 'Tu tiens des comptes.' },
      { texte: "Rien. J'ai rendu le soir même.", archetype: 'échange', note: 'Tu ne portes pas de dettes.' },
      { texte: "Le silence de la pièce juste après.", archetype: 'témoignage', note: 'Tu enregistres.' }] },
    { question: "Qu'est-ce qui, chez toi, ne guérit pas ?", reponses: [
      { texte: "Une phrase que j'ai dite.", archetype: 'répétition', note: 'Elle se rejoue.' },
      { texte: "Un nom que je ne prononce plus.", archetype: 'soustraction', note: 'Tu retranches.' },
      { texte: "Une porte que j'ai passée.", archetype: 'seuil', note: 'Tu franchis.' }] },
    { question: "On te propose de tout recommencer, sans personne. Tu réponds ?", reponses: [
      { texte: "Sans personne, non.", archetype: 'lien', note: 'Tu attaches.' },
      { texte: "Immédiatement.", archetype: 'métamorphose', note: 'Tu mues.' },
      { texte: "Je demande d'abord le prix.", archetype: 'échange', note: 'Tu négocies.' }] },
  ];

  async function rituel() {
    const n = U.montrer('ecran-rituel');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.28);
    U.murmures(true);

    const src = ((C().rituel || {}).questions || []).slice();
    const qs = (src.length >= 3 ? src : QUESTIONS_SECOURS).slice();
    /* mélange léger : on n'interroge pas deux fois dans le même ordre */
    for (let i = qs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = qs[i]; qs[i] = qs[j]; qs[j] = t; }
    const choisies = qs.slice(0, Math.min(6, qs.length));
    G.reponses = [];

    const tete = el('div');
    tete.appendChild(el('span', 'etiquette rouge', 'Examen du réceptacle'));
    n.appendChild(tete);
    const zone = el('div', 'question-bloc');
    n.appendChild(zone);
    const jauge = el('div', 'jauge-rituel');
    choisies.forEach(() => jauge.appendChild(el('i')));
    n.appendChild(jauge);

    const transitions = (C().rituel || {}).transitions || ['Noté.', 'Le registre te suit.', 'Continue.'];

    for (let i = 0; i < choisies.length; i++) {
      const q = choisies[i];
      zone.innerHTML = '';
      const h = el('h2', 'question-texte');
      zone.appendChild(h);
      await JJK.fx.type(h, q.question, { speed: 20 });
      const liste = el('div', 'reponses');
      zone.appendChild(liste);
      const choix = await new Promise(res => {
        (q.reponses || []).forEach(rep => {
          const b = el('button', 'reponse');
          b.appendChild(document.createTextNode(rep.texte));
          if (rep.note) b.appendChild(el('span', 'murmure', rep.note));
          b.addEventListener('click', () => {
            JJK.audio.tick(700, 0.03, 0.06);
            JJK.fx.pulse(chaos.r(0, JJK.fx.size.W), chaos.r(0, JJK.fx.size.H), 160, '#b31217', 0.6);
            res(rep);
          });
          liste.appendChild(b);
        });
      });
      G.reponses.push(choix.archetype || 'seuil');
      jauge.children[i].classList.add('pleine');
      JJK.fx.setIntensity(0.28 + (i / choisies.length) * 0.35);
      if (i < choisies.length - 1) {
        zone.innerHTML = '';
        const t = el('p', 'rituel-ligne forte');
        zone.appendChild(t);
        await JJK.fx.type(t, transitions[i % transitions.length], { speed: 22 });
        await wait(420);
      }
    }

    G.ref = JJK.forge.forgeReceptacle(G.graine, G.reponses);
    G.corps = appliquerMaturation(G.ref, G.maturation);
    revelation();
  }

  function appliquerMaturation(ref, m) {
    const c = JSON.parse(JSON.stringify(ref));
    c.attaque = Math.round(c.attaque * (1 + 0.09 * m));
    c.pvMax = Math.round(c.pvMax * (1 + 0.07 * m));
    c.enMax = c.enMax + Math.floor(m / 3);
    c.puissance = Math.round(c.puissance * (1 + 0.08 * m));
    c.crit = Math.min(0.45, c.crit + 0.008 * m);
    return c;
  }

  /* =====================================================================

    droite.appendChild(leg);

    n.appendChild(dossier);
    requestAnimationFrame(() => JJK.fx.sigil(cvs, t.seed, { size: cvs.clientWidth || 320, accent: t.couleur }));

    /* Le lien : la technique d'un nom est vérifiable par n'importe qui,
       depuis n'importe quelle machine. C'est tout l'intérêt d'une lecture. */
    const part = el('div', 'bloc');
    part.appendChild(el('span', 'etiquette', 'Faire vérifier ce nom par quelqu\'un d\'autre'));
    const lien = el('p', 'mono discret');
    lien.style.cssText = 'word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--os-faible)';
    lien.textContent = lienDe(t.seed);
    part.appendChild(lien);
    const cp = U.bouton('Copier le lien', 'fantome', () => {
      const url = lienDe(t.seed);
      const fini = () => { cp.textContent = 'Lien copié'; setTimeout(() => { cp.textContent = 'Copier le lien'; }, 2200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(fini, () => selectionner(lien));
      else selectionner(lien);
    });

    const r = U.rangee();
    r.appendChild(U.bouton('Prêter serment', 'rouge', serments));

    n.appendChild(r);
  }

  function lienDe(graine) {
    const base = location.href.split('#')[0];
    return base + '#g=' + encodeURIComponent(graine);
  }
  function selectionner(node) {
    try {
      const r = document.createRange(); r.selectNodeContents(node);
      const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r);
    } catch (e) {}
  }

  function escape2(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  /* =====================================================================

  async function serments() {
    const n = U.montrer('ecran-serments');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.4);
    G.catalogue = G.catalogue.length ? G.catalogue : JJK.serments.catalogue(G.tech.seed);
    G.serments = G.serments || [];

    n.appendChild(el('span', 'etiquette rouge', 'Serments contraignants'));
    n.appendChild(el('h1', 'titre-rituel', 'Ce que tu <em>rends</em>'));
    const p = el('p');
    p.style.cssText = 'max-width:62ch;font-weight:300;color:var(--os-faible)';
    p.textContent = "Un serment n'est pas une amélioration. C'est une amputation payée d'avance : tu perds vraiment ce qui est écrit, dans ce jeu, tout de suite. En échange, le réel te doit quelque chose. Tu peux en signer trois.";
    n.appendChild(p);

    const compteur = el('p', 'etiquette');
    compteur.style.marginTop = '18px';
    n.appendChild(compteur);

    const liste = el('div');
    liste.style.marginTop = '18px';
    n.appendChild(liste);

    const r = U.rangee();
    const suite = U.bouton('Descendre', 'rouge', () => {
      G.mods = JJK.serments.agreger(G.serments);
      if (G.mods.coupeSon) JJK.audio.toggleMute(true);
      M().ecrire({ serments: G.serments.map(s => s.id) });
      descente();
    });
    r.appendChild(suite);
    n.appendChild(r);

    function maj() {
      const reste = 3 - G.serments.length;
      compteur.textContent = reste > 0 ? (reste + ' serment' + (reste > 1 ? 's' : '') + ' encore possible' + (reste > 1 ? 's' : '')) : 'Le contrat est plein.';
      liste.innerHTML = '';
      G.catalogue.forEach(s => {
        const signe = G.serments.indexOf(s) >= 0;
        const c = el('div', 'contrat' + (signe ? ' signe' : ''));
        c.appendChild(el('h4', '', s.nom));
        c.appendChild(el('p', 'clause', '« ' + s.clause + ' »'));
        const e = el('div', 'echange');
        e.appendChild(el('span', 'perte', s.perte));
        e.appendChild(el('span', 'gain', s.gain));
        e.appendChild(U.pointsDanger(s.danger));
        c.appendChild(e);
        c.addEventListener('click', () => {
          if (signe) {
            G.serments.splice(G.serments.indexOf(s), 1);
            JJK.audio.tick(300, 0.08, 0.06);
            maj();
            return;
          }
          if (G.serments.length >= 3) { JJK.fx.shake(0.15); return; }
          G.serments.push(s);
          JJK.audio.oath();
          JJK.fx.invert(140);
          JJK.fx.flash('#b31217', 700);
          JJK.fx.shake(0.5);
          JJK.fx.slash('#b31217', 1);
          JJK.fx.ink(null, null, 0.5, '#b31217');
          U.titreFurtif('SIGNÉ — ' + s.nom, 4500);
          maj();
        });
        liste.appendChild(c);
      });
      suite.textContent = G.serments.length ? 'Descendre avec ' + G.serments.length + ' serment' + (G.serments.length > 1 ? 's' : '') : 'Descendre les mains libres';
    }
    maj();
  }

  /* =====================================================================
     5. LA DESCENTE
     ===================================================================== */
  const ORDRE = ['4', '4', '3', '3', '2', '2', '1', '1', 'semi-spécial', 'semi-spécial', 'spécial'];

  function gradeCible(i) { return ORDRE[Math.min(i, ORDRE.length - 1)]; }
  function courbe(i) { return 1 + i * 0.11; }

  function descente() {
    const n = U.montrer('ecran-descente');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.35);
    if (!G.mods) G.mods = JJK.serments.agreger(G.serments);
    G.corps = appliquerMaturation(G.ref, G.maturation);
    const g = JJK.forge.grade(G.corps.puissance, G.serments.length);
    G.grade = g;
    U.majBarre({ grade: g.grade, registre: 'DESCENTE ' + (G.descente + 1) + ' · ' + M().lire().morts + ' MORT(S)' });

    n.appendChild(el('span', 'etiquette rouge', 'Descente ' + (G.descente + 1)));
    n.appendChild(el('h1', 'titre-rituel', 'Choisis ce qui <em>t\'ouvrira</em>'));

    const info = el('p', 'discret');
    info.style.maxWidth = '64ch';
    info.textContent = 'Porteur de « ' + G.tech.nom + ' ». ' + G.corps.pvMax + ' points de vie, ' +
      G.corps.attaque + ' d\'attaque, ' + G.serments.length + ' serment(s) signé(s). Maturation ' + G.maturation + '.';
    n.appendChild(info);

    function carteFleau(f, estRevenant) {

  }
