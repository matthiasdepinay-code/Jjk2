<title>RITUEL — 呪法帳</title>
<meta name="description" content="Générateur déterministe de techniques maudites et duel occulte dans l'univers de Jujutsu Kaisen.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@400;700&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@400;700&display=swap"></noscript>
<style>
/* =========================================================================
   RITUEL — feuille de style
   Un dossier d'autopsie qu'on aurait laissé trop longtemps dans le noir.
   ========================================================================= */

:root {
  --nuit:      #07070a;
  --nuit-2:    #0c0c11;
  --nuit-3:    #131319;
  --os:        #e9e2d4;
  --os-faible: #9d968a;
  --os-mort:   #5d574e;
  --sang:      #b31217;
  --sang-vif:  #ff2d1a;
  --or:        #f2c14e;
  --inverse:   #7fe3ff;
  --vert-mal:  #6f8f5a;

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --hair: 1px solid rgba(233, 226, 212, 0.14);
  --hair-fort: 1px solid rgba(233, 226, 212, 0.32);
  --ease: cubic-bezier(.16,.84,.28,1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--nuit);
  color: var(--os);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { position: relative; overflow-y: auto; }

html.is-inverted { filter: invert(1) hue-rotate(180deg); }
html.is-inverted #fx-flash { filter: invert(1); }

::selection { background: var(--sang); color: var(--os); }

/* Le clavier doit voir où il est : personne ne joue à l'aveugle sans
   l'avoir signé. */
:focus-visible {
  outline: 2px solid var(--sang-vif);
  outline-offset: 3px;
}
.reponse:focus-visible, .contrat:focus-visible, .acte:focus-visible {
  outline-offset: -2px;
  color: var(--os);
}

/* ---- calques d'effets ---------------------------------------------- */
.fx-layer {
  position: fixed; inset: 0; pointer-events: none;
  width: 100%; height: 100%;
}
#fx-ink { z-index: 76; mix-blend-mode: screen; opacity: .62; }
#fx-dom.is-hidden { display: none; }
#fx-flash {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; background: #fff; mix-blend-mode: screen;
}

/* grain : un vieux capteur qui chauffe */
body::after {
  content: ""; position: fixed; inset: -50%; z-index: 80; pointer-events: none;
  opacity: .045; will-change: transform;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation: grain 1.1s steps(4) infinite;
}
@keyframes grain {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-3%, 2%); }
  50%  { transform: translate(2%, -3%); }
  75%  { transform: translate(-2%, -2%); }
  100% { transform: translate(3%, 1%); }
}
/* lignes de balayage */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 79; pointer-events: none;
  opacity: .25;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px);
}

/* ---- scène ----------------------------------------------------------- */
#stage {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px) 120px;
  will-change: transform;
}
.ecran { width: 100%; max-width: 1120px; display: none; animation: fadeUp .8s var(--ease) both; }
.ecran.actif { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---- typographie ----------------------------------------------------- */
.etiquette {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: .34em; text-transform: uppercase;
  color: var(--os-mort);
}
.etiquette.rouge { color: var(--sang); }
.titre-rituel {
  font-family: var(--serif); font-weight: 300; text-wrap: balance;
  font-size: clamp(2.1rem, 7vw, 4.6rem); line-height: 1.02;
  letter-spacing: -.02em; margin: .1em 0 .2em;
}
.titre-rituel em { font-style: italic; color: var(--sang); }
.jp { font-family: var(--jp); letter-spacing: .18em; }
.mono { font-family: var(--mono); }
.faible { color: var(--os-faible); }
.mort { color: var(--os-mort); }
.sang { color: var(--sang); }
.or { color: var(--or); }
.serif-italique { font-style: italic; font-weight: 300; }

hr.trait { border: 0; border-top: var(--hair); margin: 28px 0; }
hr.trait.fort { border-top: var(--hair-fort); }

.typing::after {
  content: "▌"; margin-left: 2px; color: var(--sang);
  animation: blink .7s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---- boutons --------------------------------------------------------- */
.btn {
  appearance: none; -webkit-appearance: none;
  background: transparent; color: var(--os);
  border: var(--hair-fort); border-radius: 0;
  padding: 13px 26px; cursor: pointer;
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  letter-spacing: .26em; text-transform: uppercase;
  position: relative; overflow: hidden;
  transition: color .25s var(--ease), border-color .25s var(--ease), letter-spacing .35s var(--ease);
}
.btn::before {
  content: ""; position: absolute; inset: 0;
  background: var(--os); transform: scaleY(0); transform-origin: bottom;
  transition: transform .34s var(--ease); z-index: -1;
}
.btn:hover:not(:disabled) { color: var(--nuit); border-color: var(--os); letter-spacing: .32em; }
.btn:hover:not(:disabled)::before { transform: scaleY(1); }
.btn:disabled { opacity: .28; cursor: not-allowed; }
.btn.rouge { border-color: rgba(179,18,23,.6); color: var(--sang-vif); }
.btn.rouge::before { background: var(--sang); }
.btn.rouge:hover:not(:disabled) { color: #fff; border-color: var(--sang); }
.btn.fantome { border-color: transparent; color: var(--os-mort); padding-left: 0; padding-right: 0; margin-right: 24px; }
.btn.fantome:hover:not(:disabled) { color: var(--os); letter-spacing: .3em; }
.btn.fantome::before { display: none; }
.btn.large { display: block; width: 100%; padding: 18px 26px; }

.btn-rangee { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

/* ---- champ de saisie -------------------------------------------------- */
.champ {
  width: 100%; background: transparent; border: 0;
  border-bottom: var(--hair-fort);
  color: var(--os); font-family: var(--serif); font-weight: 300;
  font-size: clamp(1.6rem, 5vw, 2.8rem); padding: 10px 2px 12px;
  outline: none; letter-spacing: .02em;
  transition: border-color .3s var(--ease);
}
.champ::placeholder { color: rgba(233,226,212,.16); font-style: italic; }
.champ:focus { border-color: var(--sang); }

/* ---- rituel ---------------------------------------------------------- */
.rituel-ligne {
  font-size: clamp(1.05rem, 2.6vw, 1.5rem); font-weight: 300;
  min-height: 1.6em; margin: 0 0 .55em; color: var(--os-faible);
}
.rituel-ligne.forte { color: var(--os); font-style: italic; }

.question-bloc { margin-top: 40px; }
.question-texte {
  font-size: clamp(1.25rem, 3vw, 1.85rem); font-weight: 300; text-wrap: pretty;
  line-height: 1.3; margin: 0 0 22px; max-width: 46ch;
}
.reponses { display: grid; gap: 10px; max-width: 780px; }
.reponse {
  text-align: left; background: transparent; cursor: pointer;
  border: 0; border-left: 2px solid rgba(233,226,212,.14);
  padding: 14px 20px; color: var(--os-faible);
  font-family: var(--serif); font-size: 1.05rem; font-weight: 300; line-height: 1.4;
  transition: all .3s var(--ease);
}
.reponse:hover {
  border-left-color: var(--sang); color: var(--os);
  background: linear-gradient(90deg, rgba(179,18,23,.10), transparent 70%);
  padding-left: 30px;
}
.reponse .murmure {
  display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--os-mort); margin-top: 8px;
  opacity: 0; transform: translateY(-4px); transition: all .3s var(--ease);
}
.reponse:hover .murmure { opacity: 1; transform: none; color: var(--sang); }

.jauge-rituel { display: flex; gap: 6px; margin: 34px 0 0; }
.jauge-rituel i {
  flex: 1; height: 2px; background: rgba(233,226,212,.12);
  transition: background .5s var(--ease);
}
.jauge-rituel i.pleine { background: var(--sang); }

/* ---- dossier de technique ------------------------------------------- */
.dossier {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  gap: clamp(20px, 4vw, 56px); align-items: start;
}
@media (max-width: 860px) { .dossier { grid-template-columns: 1fr; } }

.nom-technique {
  font-size: clamp(2rem, 6.4vw, 4.2rem); font-weight: 300; line-height: 1.03; text-wrap: balance;
  letter-spacing: -.025em; margin: 6px 0 10px;
}
.nom-jp { font-family: var(--jp); font-size: clamp(.95rem, 2.2vw, 1.3rem); color: var(--sang); letter-spacing: .3em; }

.bloc { margin: 26px 0; }
.bloc > .etiquette { display: block; margin-bottom: 9px; }
.bloc p { margin: 0; font-weight: 300; font-size: 1.08rem; }
.bloc .enonce {
  font-size: clamp(1.15rem, 2.8vw, 1.55rem); font-style: italic; font-weight: 300;
  border-left: 2px solid var(--sang); padding-left: 18px; margin-left: 0;
}

.grille-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1px; background: rgba(233,226,212,.12); border: var(--hair); margin: 26px 0;
}
.stat { background: var(--nuit); padding: 14px 16px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.45rem; font-weight: 400; color: var(--os); }
.stat span { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--os-mort); margin-top: 4px; }

.sceau-boite { position: relative; }
.sceau-boite canvas { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 24px rgba(179,18,23,.28)); }
.sceau-rot { animation: rot 90s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.sceau-legende { text-align: center; margin-top: 14px; }

.tampon {
  display: inline-block; border: 2px solid var(--sang); color: var(--sang);
  font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  padding: 7px 14px; transform: rotate(-3.5deg); opacity: .9;
}

/* ---- serments -------------------------------------------------------- */
.contrat {
  border: var(--hair); padding: 22px 24px; margin-bottom: 14px;
  background: linear-gradient(180deg, rgba(233,226,212,.02), transparent);
  cursor: pointer; transition: all .3s var(--ease); position: relative;
}
.contrat:hover { border-color: rgba(179,18,23,.55); background: linear-gradient(180deg, rgba(179,18,23,.07), transparent); }
.contrat.signe { border-color: var(--sang); }
.contrat.signe::after {
  content: "SIGNÉ"; position: absolute; top: 14px; right: 16px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .3em; color: var(--sang);
  border: 1px solid var(--sang); padding: 3px 8px; transform: rotate(-6deg);
}
.contrat h4 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 400; }
.contrat .clause { font-style: italic; color: var(--os-faible); font-weight: 300; margin: 0 0 14px; max-width: 62ch; }
.echange { display: flex; flex-wrap: wrap; gap: 10px 26px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }
.echange .perte { color: var(--sang-vif); }
.echange .gain { color: var(--or); }
.echange .perte::before { content: "− "; }
.echange .gain::before { content: "+ "; }
.danger { display: inline-flex; gap: 3px; margin-left: auto; }
.danger i { width: 6px; height: 6px; background: var(--os-mort); border-radius: 50%; }
.danger i.on { background: var(--sang); }

/* ---- combat ---------------------------------------------------------- */
.arene { display: grid; gap: 22px; }
.combattants { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
@media (max-width: 720px) { .combattants { grid-template-columns: 1fr; } .versus { display: none; } }
.versus { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--os-mort); }

.fiche { border: var(--hair); padding: 18px 20px; position: relative; overflow: hidden; }
.fiche.ennemi { border-color: rgba(179,18,23,.35); }
.fiche .nom { font-size: 1.5rem; font-weight: 300; line-height: 1.1; margin-bottom: 2px; }
.fiche .sous { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--os-mort); }
.fiche.frappe { animation: frappe .32s var(--ease); }
@keyframes frappe {
  0%,100% { transform: none; }
  25% { transform: translateX(-9px) skewX(3deg); }
  60% { transform: translateX(6px); }
}

.barre { height: 8px; background: rgba(233,226,212,.09); margin-top: 14px; position: relative; overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--os); transition: width .5s var(--ease); }
.barre.pv i { background: linear-gradient(90deg, var(--sang), var(--sang-vif)); }
.barre.pv .fantomatique {
  position: absolute; top: 0; left: 0; height: 100%;
  background: rgba(255,45,26,.28); transition: width 1.1s .25s var(--ease);
}
.barre.energie { height: 4px; }
.barre.energie i { background: var(--inverse); }
.chiffres { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--os-mort); margin-top: 6px; }

.statuts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 20px; }
.puce {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  border: 1px solid rgba(233,226,212,.25); padding: 2px 7px; color: var(--os-faible);
}
.puce.mauvais { border-color: rgba(179,18,23,.5); color: var(--sang-vif); }
.puce.bon { border-color: rgba(242,193,78,.5); color: var(--or); }

/* Le filtre porte sur les enfants, pas sur l'élément : sinon il s'applique
   aussi aux pseudo-éléments et la cicatrice devient illisible. */
.mutilated { position: relative; min-height: 42px; }
.mutilated > * { opacity: .16; filter: grayscale(1) brightness(.5); }
.mutilated::before {
  content: ""; position: absolute; left: -4%; right: -4%; top: 50%; height: 2px;
  background: var(--sang-vif); transform: rotate(-2.4deg); z-index: 2;
  box-shadow: 0 0 12px rgba(255,45,26,.8);
}
.mutilated::after {
  content: attr(data-scar); position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--mono); font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: #ff6f5e; background: rgba(30,4,6,.86); z-index: 3; filter: none;
}

.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.acte {
  text-align: left; background: transparent; border: var(--hair);
  padding: 12px 14px; cursor: pointer; color: var(--os-faible);
  font-family: var(--serif); transition: all .22s var(--ease);
}
.acte:hover:not(:disabled) { border-color: var(--os); color: var(--os); transform: translateY(-2px); }
.acte:disabled { opacity: .26; cursor: not-allowed; }
.acte b { display: block; font-size: 1.08rem; font-weight: 400; }
.acte small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--os-mort); }
.acte .cout { float: right; font-family: var(--mono); font-size: 10px; color: var(--inverse); letter-spacing: .1em; }
.acte.ultime { border-color: rgba(179,18,23,.55); }
.acte.ultime b { color: var(--sang-vif); }
.acte.ultime:hover:not(:disabled) { border-color: var(--sang-vif); box-shadow: inset 0 0 40px rgba(179,18,23,.18); }

.duel-bas { display: grid; grid-template-columns: minmax(0,1fr) minmax(280px, 34%); gap: 22px; align-items: start; }
@media (max-width: 900px) { .duel-bas { grid-template-columns: 1fr; } }
.journal {
  border-top: var(--hair); padding-top: 14px; max-height: 340px; overflow-y: auto;
  font-size: 1rem; font-weight: 300;
}
.journal .etiquette { display: block; margin-bottom: 10px; }
.fiche .replique { font-style: italic; font-weight: 300; color: var(--os-mort); margin-top: 12px; font-size: .96rem; }
.journal p { margin: 0 0 7px; color: var(--os-faible); animation: fadeUp .4s var(--ease) both; }
.journal p.important { color: var(--os); font-style: italic; }
.journal p.mal { color: var(--sang-vif); }
.journal p.bien { color: var(--or); }
.journal p .n { font-family: var(--mono); font-size: .92em; }
.journal::-webkit-scrollbar { width: 3px; }
.journal::-webkit-scrollbar-thumb { background: rgba(179,18,23,.5); }

/* ---- territoire ------------------------------------------------------ */
#territoire {
  position: fixed; inset: 0; z-index: 65; display: none;
  align-items: center; justify-content: center; flex-direction: column;
  text-align: center; padding: 24px; pointer-events: none;
}
#territoire.actif { display: flex; }
#territoire .incantation {
  font-family: var(--jp); font-size: clamp(.95rem, 2.4vw, 1.35rem);
  color: var(--sang-vif); letter-spacing: .34em; margin-bottom: 26px; opacity: .9;
}
#territoire .nom-dom {
  font-size: clamp(2.2rem, 9vw, 6.4rem); font-weight: 300; line-height: .98; text-wrap: balance;
  letter-spacing: -.03em; max-width: 16ch; margin: 0 auto;
  text-shadow: 0 0 60px rgba(179,18,23,.6);
}
#territoire .vers { margin-top: 30px; max-width: 44ch; }
#territoire .vers p { margin: .18em 0; font-style: italic; font-weight: 300; color: var(--os-faible); }
#territoire .sur { margin-top: 34px; }
body.in-domain #stage { filter: blur(3px) brightness(.35); }

/* ---- épitaphe / mémoire ---------------------------------------------- */
.tombe {
  border: var(--hair); border-left: 2px solid var(--sang);
  padding: 16px 20px; margin-bottom: 12px;
  background: linear-gradient(90deg, rgba(179,18,23,.06), transparent 60%);
}
.tombe .nom { font-size: 1.25rem; font-weight: 300; }
.tombe .det { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--os-mort); }

/* ---- barre d'état ---------------------------------------------------- */
#barre-etat {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 9px clamp(14px, 4vw, 40px);
  background: linear-gradient(180deg, rgba(7,7,10,0), rgba(7,7,10,.94) 40%);
  font-family: var(--mono); font-size: 10px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--os-mort);
}
#barre-etat .sep { flex: 1; }
#barre-etat button {
  background: none; border: 0; color: var(--os-mort); cursor: pointer;
  font: inherit; letter-spacing: .2em; padding: 4px 0;
}
#barre-etat button:hover { color: var(--sang); }

/* ---- murmures -------------------------------------------------------- */
.murmure-flottant {
  position: fixed; z-index: 50; pointer-events: none;
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: clamp(1rem, 2.4vw, 1.5rem); color: rgba(233,226,212,.32);
  white-space: nowrap;
  animation: derive 13s linear forwards;
}
@keyframes derive {
  0% { opacity: 0; transform: translateX(0) scale(1); }
  12% { opacity: 1; }
  85% { opacity: .5; }
  100% { opacity: 0; transform: translateX(-16vw) scale(1.06); }
}

/* ---- divers ---------------------------------------------------------- */
.deux-colonnes { columns: 2; column-gap: 40px; }
@media (max-width: 700px) { .deux-colonnes { columns: 1; } }
.centre { text-align: center; }
.plein { width: 100%; }
.pile > * + * { margin-top: 12px; }
.discret { font-size: .92rem; color: var(--os-mort); }

@media (prefers-reduced-motion: reduce) {
  body::after, .sceau-rot, .murmure-flottant { animation: none !important; }
  * { transition-duration: .01ms !important; }
}

/* ---- lisibilité pendant que le territoire est déployé ---------------- */
/* Le territoire déployé recouvre la scène (calque 60). Tant qu'il dure,
   la scène doit repasser au-dessus, sinon on joue sans voir ses boutons. */
body.domaine-calme #stage { filter: none; position: relative; z-index: 62; }
body.domaine-calme .fiche,
body.domaine-calme .acte,
body.domaine-calme .journal {
  background: rgba(7, 7, 10, .74);
  backdrop-filter: blur(2px);
}
body.domaine-calme .fiche { border-color: rgba(233, 226, 212, .3); }
.etiquette.or { color: var(--or); }
#territoire .etiquette { color: inherit; opacity: .7; }

/* le titre de la page ne doit jamais dépasser sur mobile */
@media (max-width: 520px) {
  .btn { padding: 12px 18px; letter-spacing: .18em; }
  .btn.fantome { margin-right: 14px; }
  #barre-etat { font-size: 9px; gap: 10px; letter-spacing: .12em; }
  #stage { padding-bottom: 96px; }
}

/* ---- téléphone : l'écran est petit, le rituel reste lisible ---------- */
#barre-etat > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 620px) {
  #be-registre, #be-grade { display: none; }
  #barre-etat { gap: 12px; padding: 8px 14px; }
  #stage { padding-bottom: 84px; }
  .fiche { padding: 12px 14px; }
  .fiche .nom { font-size: 1.2rem; }
  .fiche .replique { font-size: .88rem; margin-top: 8px; }
  .statuts { min-height: 0; }
  .combattants { gap: 10px; }
  .acte { padding: 10px 12px; }
  .acte b { font-size: 1rem; }
  .titre-rituel { font-size: clamp(1.9rem, 11vw, 3rem); }
  .contrat { padding: 16px 16px; }
  .grille-stats { grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
  .stat { padding: 10px 12px; }
  .stat b { font-size: 1.15rem; }
}
/* les murmures ne doivent jamais recouvrir une action */
@media (max-width: 860px) { .murmure-flottant { display: none; } }

/* ---- le Voile (帳) ----------------------------------------------------
   Un rideau qu'on abaisse sur le secteur. Dehors, personne ne verra rien. */
#fx-voile {
  position: fixed; inset: 0; z-index: 88; pointer-events: none;
  background: #040406;
  transform: translateY(-101%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  will-change: transform;
}
#fx-voile.tombe {
  transform: translateY(0);
  transition: transform .78s cubic-bezier(.7,.02,.3,1);
}
#fx-voile.leve {
  transform: translateY(101%);
  transition: transform .62s cubic-bezier(.6,.02,.3,1);
}
#fx-voile .couture {
  position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--sang-vif), var(--sang), var(--sang-vif), transparent);
  box-shadow: 0 0 26px rgba(255, 45, 26, .85);
}
#fx-voile .kanji {
  font-family: var(--jp); font-size: clamp(6rem, 26vw, 18rem);
  color: rgba(233, 226, 212, .045); line-height: 1;
  position: absolute; user-select: none;
}
#fx-voile .dit {
  position: relative; z-index: 2; max-width: 34ch; text-align: center;
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: clamp(1.05rem, 3vw, 1.6rem); color: var(--os-faible);
  padding: 0 24px; text-wrap: balance;
}
@media (prefers-reduced-motion: reduce) {
  #fx-voile.tombe, #fx-voile.leve { transition-duration: .2s !important; }
}

/* ---- le formulaire de déclaration -------------------------------------
   À gauche on interroge, à droite le dossier se remplit tout seul. */
.formulaire {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
  gap: clamp(20px, 4vw, 52px); align-items: start; margin-top: 26px;
}
@media (max-width: 900px) { .formulaire { grid-template-columns: 1fr; } }

.feuille {
  border: var(--hair); padding: 20px 22px;
  background: linear-gradient(180deg, rgba(233,226,212,.025), transparent 60%);
  position: sticky; top: 24px;
}
@media (max-width: 900px) { .feuille { position: static; order: -1; } }

.lignes-dossier { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
.ligne-dossier { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px dotted rgba(233,226,212,.12); }
.ligne-dossier b {
  font-family: var(--mono); font-size: 9px; font-weight: 400;
  letter-spacing: .24em; text-transform: uppercase; color: var(--os-mort);
}
.ligne-dossier .valeur { font-weight: 300; font-size: .98rem; color: rgba(233,226,212,.2); font-style: italic; }
.ligne-dossier .valeur.inscrite {
  color: var(--os); font-style: normal;
  animation: inscrire .5s var(--ease) both;
}
@keyframes inscrire {
  from { opacity: 0; transform: translateX(-6px); filter: blur(2px); }
  to { opacity: 1; transform: none; filter: none; }
}
.code-dossier {
  margin-top: 18px; font-family: var(--mono); font-size: 1.05rem;
  letter-spacing: .3em; color: var(--or); text-align: center;
  border-top: var(--hair); padding-top: 14px;
}

.precision {
  font-style: italic; font-weight: 300; color: var(--os-mort);
  max-width: 52ch; margin: -14px 0 22px; font-size: 1rem;
}
.consequence-inscrite {
  margin-top: 20px; font-family: var(--mono); font-size: 11px;
  letter-spacing: .1em; color: var(--sang-vif); max-width: 60ch; line-height: 1.7;
}

/* ---- conséquences de la déclaration, affichées sans euphémisme -------- */
.notes-formulaire { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.note-formulaire {
  display: grid; grid-template-columns: 106px 1fr; gap: 14px; align-items: baseline;
  padding-bottom: 8px; border-bottom: 1px dotted rgba(233,226,212,.1);
}
.note-formulaire b {
  font-family: var(--mono); font-size: 9px; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--os-mort);
}
.note-formulaire span { font-weight: 300; font-size: .98rem; color: var(--os-faible); }
@media (max-width: 560px) { .note-formulaire { grid-template-columns: 1fr; gap: 2px; } }

/* ---- ordre de mission -------------------------------------------------- */
.ordre-mission {
  border-left: 2px solid var(--sang); padding: 4px 0 4px 20px; margin: 22px 0 26px;
  max-width: 68ch;
}
.lieu-mission { font-size: 1.45rem; font-weight: 300; margin: 6px 0 8px; }
.signalement { font-weight: 300; color: var(--os-faible); margin: 0 0 10px; }
.consigne { font-style: italic; color: var(--sang-vif); margin: 0; font-weight: 300; }

.journal p.troue { color: var(--os-mort); letter-spacing: .5em; }

/* une réponse cochée ferme la rubrique : le reste s'efface, le choix reste */
.reponse.retenue {
  border-left-color: var(--sang); color: var(--os);
  background: linear-gradient(90deg, rgba(179,18,23,.14), transparent 70%);
  padding-left: 30px; opacity: 1;
}
.reponse.retenue .murmure { opacity: 1; color: var(--sang); transform: none; }
.reponse.ecartee { opacity: .14; }
/* la note d'une option écartée ne doit plus réserver sa place */
.reponse.ecartee .murmure { display: none; }
.reponse:disabled { cursor: default; }
.reponse.ecartee:hover { border-left-color: rgba(233,226,212,.14); background: none; padding-left: 20px; color: var(--os-faible); }

/* ---- ce dont le fléau était fait ------------------------------------- */
.exorcisme {
  border-left: 2px solid var(--or); padding: 6px 0 6px 20px;
  margin: 24px 0 26px; max-width: 66ch;
}
.ligne-exorcisme {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: clamp(1.05rem, 2.4vw, 1.35rem); color: var(--or); margin: 8px 0 0;
}
.ligne-exorcisme.faible { color: var(--os-faible); font-size: 1rem; }

/* Sur téléphone, la feuille passe SOUS la question et ne montre que ce qui
   est déjà inscrit : dix rubriques vides repoussaient la question hors de
   l'écran, et c'est la question qu'on est venu lire. */
@media (max-width: 900px) {
  .feuille { position: static; order: 1; padding: 16px 18px; }
  .formulaire > div:first-child { order: 0; }
  .ligne-dossier:not(.remplie) { display: none; }
  .feuille .lignes-dossier:empty + .code-dossier { margin-top: 10px; }
  .code-dossier { margin-top: 14px; padding-top: 12px; font-size: .95rem; }
}

/* Sans souris, il n'y a pas de survol : la conséquence d'une réponse doit
   être lisible d'emblée, sinon elle réserve sa place sans jamais s'afficher. */
@media (hover: none) {
  .reponse .murmure { opacity: .75; transform: none; color: var(--sang); }
  .reponse { padding: 12px 16px; }
}

/* ---- la fiche : c'est le produit -------------------------------------- */
.bandeau-section {
  display: flex; align-items: baseline; gap: 12px;
  border-bottom: 1px dotted rgba(233, 226, 212, .14);
  padding-bottom: 6px; margin-bottom: 10px;
}
.kanji-section {
  margin-left: auto; font-size: 12px; letter-spacing: .3em;
  color: var(--os-mort); opacity: .8;
}
.sous-nom { font-size: 1.3rem; font-weight: 300; margin: 0 0 2px; }
.sous-nom.grand { font-size: 1.55rem; }
.sous-nom.or { color: var(--or); }
/* Le monospace convient à une mention de coût, pas à un paragraphe : ces
   lignes-là sont parfois longues et devenaient des pavés illisibles. */
.cout-ligne {
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: 1rem; color: var(--sang-vif); margin-top: 12px;
  line-height: 1.55; max-width: 62ch;
}
.incantation-fiche {
  margin-top: 14px; padding-left: 16px; border-left: 1px solid rgba(179, 18, 23, .4);
}
.incantation-fiche p {
  margin: .1em 0; font-style: italic; font-weight: 300;
  color: var(--os-faible); font-size: 1.02rem;
}
.jubaku { border-left: 2px solid var(--or); padding-left: 18px; }
.jubaku .privation { margin-top: 12px; color: var(--sang-vif); font-weight: 300; }
.jubaku .contrepartie { margin-top: 6px; color: var(--or); font-weight: 300; }
.code-fiche {
  font-size: 1.3rem; letter-spacing: .16em; color: var(--or);
  -webkit-user-select: all; user-select: all; word-break: break-all;
}

/* ---- commandes du générateur ------------------------------------------ */
.outils-generateur {
  margin-top: 30px; border: var(--hair); padding: 18px 18px 20px;
  background: linear-gradient(180deg, rgba(233, 226, 212, .025), transparent 70%);
}
.outils-generateur .btn { margin-top: 10px; }
.outils-generateur > .discret { margin: 10px 0 4px; }

/* ---- galerie de variantes --------------------------------------------- */
.galerie {
  display: grid; gap: 14px; margin-top: 26px;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
.carte-variante {
  border: var(--hair); padding: 18px 18px 16px; cursor: pointer;
  transition: all .28s var(--ease); display: flex; flex-direction: column;
}
.carte-variante:hover { border-color: rgba(179, 18, 23, .6); transform: translateY(-3px); }
.carte-variante.actuelle { border-color: var(--sang); }
.carte-variante h4 { margin: 12px 0 3px; font-size: 1.15rem; font-weight: 400; line-height: 1.2; }
.carte-variante .clause {
  font-style: italic; font-weight: 300; color: var(--os-faible);
  margin: 12px 0 0; font-size: .98rem; flex: 1;
}
.sceau-mini { width: 100%; max-width: 150px; height: auto; align-self: center; opacity: .9; }
.meta-variante {
  display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--os-mort);
}
.meta-variante .or { color: var(--or); }
.meta-variante .sang { color: var(--sang); }

/* ---- correction d'une rubrique ---------------------------------------- */
.liste-rubriques { margin-top: 24px; display: flex; flex-direction: column; gap: 2px; }
.rubrique-ligne {
  display: grid; grid-template-columns: 190px 1fr; gap: 18px; align-items: baseline;
  text-align: left; background: transparent; border: 0;
  border-bottom: 1px dotted rgba(233, 226, 212, .12);
  padding: 14px 8px; cursor: pointer; color: var(--os-faible);
  font-family: var(--serif); transition: all .24s var(--ease);
}
.rubrique-ligne:hover { background: rgba(179, 18, 23, .07); color: var(--os); padding-left: 18px; }
.rubrique-ligne b {
  font-family: var(--mono); font-size: 9px; font-weight: 400;
  letter-spacing: .22em; text-transform: uppercase; color: var(--os-mort);
}
.rubrique-ligne .valeur { font-weight: 300; font-size: 1.02rem; }
.rubrique-ligne .effet {
  grid-column: 2; font-family: var(--mono); font-size: 10px;
  letter-spacing: .08em; color: var(--sang); opacity: .75; line-height: 1.6;
}
@media (max-width: 700px) {
  .rubrique-ligne { grid-template-columns: 1fr; gap: 4px; }
  .rubrique-ligne .effet { grid-column: 1; }
}

/* 黒閃 — pendant la fracture, l'image perd sa couleur et se durcit.
   Le filtre porte sur body : sur <html>, Chromium calcule la règle mais
   ne la peint pas. */
body.en-kokusen #stage,
body.en-kokusen #fx-veil,
body.en-kokusen #fx-ink {
  filter: grayscale(1) contrast(2.2) brightness(1.2);
}
@media (prefers-reduced-motion: reduce) {
  body.en-kokusen #stage { filter: grayscale(1) contrast(1.3); }
}
.journal .kokusen {
  color: #fff; background: #000; padding: 1px 7px;
  border: 1px solid var(--os); letter-spacing: .18em;
}

/* ---- archive des fiches ------------------------------------------------ */
.liste-fiches { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.fiche-archivee {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
  text-align: left; background: transparent; border: 0;
  border-bottom: 1px dotted rgba(233, 226, 212, .12);
  padding: 11px 8px; cursor: pointer; color: var(--os-faible);
  font-family: var(--serif); transition: all .22s var(--ease);
}
.fiche-archivee:hover { background: rgba(179, 18, 23, .07); color: var(--os); padding-left: 16px; }
.fiche-archivee b { font-size: 1.05rem; font-weight: 400; }
.fiche-archivee .det {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--os-mort);
}
.marque-jubaku {
  font-family: var(--jp); font-size: 10px; letter-spacing: .2em;
  color: var(--or); border: 1px solid rgba(242, 193, 78, .4); padding: 1px 6px;
}

/* ---- impression : la fiche est un document ---------------------------- */
@media print {
  body::before, body::after, .fx-layer, #fx-flash, #fx-voile,
  #barre-etat, .btn-rangee, .outils-generateur, .murmure-flottant { display: none !important; }
  html, body { background: #fff !important; color: #111 !important; }
  #stage { padding: 0; display: block; transform: none !important; filter: none !important; }
  .ecran { display: none !important; }
  .ecran.actif { display: block !important; }
  .dossier { grid-template-columns: 1fr; }
  .sceau-boite canvas { max-width: 210px; filter: none !important; }
  .etiquette, .etiquette.rouge { color: #666 !important; }
  .nom-technique, .titre-rituel { color: #111 !important; }
  .bloc .enonce { border-left-color: #b31217 !important; color: #111 !important; }
  .bloc p, .note-formulaire span, .discret { color: #222 !important; }
  .cout-ligne, .jubaku .privation { color: #8a1010 !important; }
  .jubaku .contrepartie { color: #8a6a10 !important; }
  .kanji-section, .nom-jp, .jp { color: #444 !important; }
  a[href]::after { content: ""; }
}

imposé à un autre corps qui devra le traverser entier.","sensoriel":"Les aiguilles ne bougent plus mais tout le monde a soif ; la chaise sous vous est tiède comme si quelqu'un venait de la quitter.","couleur":"#9A9384","emotion_source":"l'angoisse de celui à qui l'on n'a jamais dit à quelle heure"},{"id":"cicatrice","nom":"La Cicatrice","kanji":"傷痕","romaji":"Shōkon","concept":"La chair guérie conserve la géométrie exacte de la blessure ; la loi relit ce dessin et exige qu'il soit refait à l'identique.","sensoriel":"Une démangeaison précise le long d'une ancienne suture, et le fil, retiré depuis des années, tire de nouveau.","couleur":"#B9857A","emotion_source":"la rancune tenue longtemps, entretenue comme un pansement qu'on refuse de décoller"},{"id":"inventaire","nom":"L'Inventaire","kanji":"棚卸","romaji":"Tanaoroshi","concept":"N'existe que ce qui a été compté : à la clôture de l'inventaire, ce qui manque à la liste cesse simplement d'être disponible.","sensoriel":"Un claquement de compteur mécanique, puis un objet quotidien manque à sa place et personne ne parvient à retrouver son nom.","couleur":"#7C7A46","emotion_source":"l'avarice de qui a connu le manque et compte encore ses réserves chaque soir"},{"id":"maree-basse","nom":"La Marée Basse","kanji":"干潟","romaji":"Higata","concept":"Le retrait pris comme opérateur : la loi fait refluer ce qui recouvrait et met à découvert ce qui n'a jamais été prévu pour la lumière.","sensoriel":"L'air se charge d'iode et de vase ; sous les pas, des choses molles se rétractent au bruit.","couleur":"#55605A","emotion_source":"le chagrin sans forme de qui découvre ce qu'il y avait sous une habitude"},{"id":"anesthesie","nom":"L'Anesthésie","kanji":"麻酔","romaji":"Masui","concept":"La douleur n'est pas supprimée mais ajournée : elle est mise en réserve, capitalisée, puis rendue en une seule fois à l'échéance.","sensoriel":"Les doigts obéissent encore mais ne renvoient plus rien ; on s'aperçoit qu'on saigne en regardant sa manche.","couleur":"#9FB6B2","emotion_source":"le dégoût de sentir, chez celui qui a décidé un jour de ne plus rien sentir du tout"},{"id":"proces-verbal","nom":"Le Procès-Verbal","kanji":"調書","romaji":"Chōsho","concept":"Ce qui est consigné devient ce qui s'est passé ; la loi n'agit pas sur les corps mais sur la version officielle, et les corps suivent.","sensoriel":"Une machine à écrire frappe deux lignes quelque part, et ensuite votre souvenir de la scène ne vous convainc plus vous-même.","couleur":"#3F4550","emotion_source":"le sentiment de n'avoir pas été cru le jour où l'on disait la vérité"},{"id":"prescription","nom":"La Prescription","kanji":"時効","romaji":"Jikō","concept":"Passé un délai, un fait cesse d'être opposable ; la loi étend cette clémence aux plaies, aux appuis et aux promesses, qui cessent alors de tenir.","sensoriel":"Un coup de tampon sec, très loin, puis une articulation qu'on croyait solide accepte d'aller trop loin, sans douleur.","couleur":"#7E7466","emotion_source":"l'injustice restée impunie jusqu'à ce que plus personne n'ait le droit d'en parler"},{"id":"quarantaine","nom":"La Quarantaine","kanji":"隔離","romaji":"Kakuri","concept":"Le contact ouvre une créance de contagion : tout ce qui a touché la même chose est réuni en une catégorie unique et traité ensemble.","sensoriel":"Une odeur d'alcool évaporé, et une ligne de craie se dessine au sol autour de tout ce qui s'est frôlé depuis l'aube.","couleur":"#B8A24E","emotion_source":"le dégoût du contact, la certitude d'être sali par la peau des autres"},{"id":"reste","nom":"Le Reste","kanji":"剰余","romaji":"Jōyo","concept":"Toute répartition laisse un reste ; la loi désigne ce reste et lui retire le droit de participer à ce qui vient d'être partagé.","sensoriel":"On compte par deux à voix basse, et le dernier de la file cesse d'être regardé : sa chaleur part la première.","couleur":"#4E4A44","emotion_source":"le sentiment d'être en trop, chez qui n'a jamais été choisi dans un partage"},{"id":"vacance","nom":"La Vacance","kanji":"欠員","romaji":"Ketsuin","concept":"Une place vide est une force : elle appelle un occupant et attire vers elle le corps le plus conforme à sa description.","sensoriel":"Un uniforme plié sur une chaise, exactement à votre taille ; le formulaire porte déjà votre écriture, mais pas votre nom.","couleur":"#DAD5C7","emotion_source":"la peur d'être remplaçable, d'avoir été une fonction plutôt qu'une personne"},{"id":"bornage","nom":"Le Bornage","kanji":"境界","romaji":"Kyōkai","concept":"Une limite déclarée devient matérielle : la ligne tracée entre deux propriétés cesse d'être une convention et se met à refuser le passage.","sensoriel":"Un fil de chaux au sol, et un froid net qui coupe le corps en deux à la hauteur exacte où l'on tente de l'enjamber.","couleur":"#7B6A50","emotion_source":"la haine froide du voisin, pour quelques centimètres empiétés il y a vingt ans"},{"id":"delestage","nom":"Le Délestage","kanji":"停電","romaji":"Teiden","concept":"Il n'y en a jamais assez pour tous : la loi choisit qui reste alimenté et coupe le reste, sans rien détruire, en se contentant d'éteindre.","sensoriel":"Un déclic de disjoncteur, un rang de lampes qui tient, et un autre rang de gens dont les mains deviennent froides.","couleur":"#2E3338","emotion_source":"la culpabilité de celui qui a survécu à un tri qu'il n'a pas décidé"},{"id":"condensation","nom":"La Condensation","kanji":"結露","romaji":"Ketsuro","concept":"Le souffle trahit : tout ce qui respire dépose sur le monde une pellicule qui garde la trace de son passage et peut être relevée.","sensoriel":"Les vitres se couvrent de buée par l'intérieur, et sur chacune apparaît la marque d'une paume qui n'y a jamais été posée.","couleur":"#AEC0C6","emotion_source":"la honte d'être là, de laisser une trace rien qu'en existant"},{"id":"legs","nom":"Le Legs","kanji":"遺贈","romaji":"Izō","concept":"Ce que les morts n'ont pas réglé se répartit entre les vivants ; la loi désigne l'héritier et lui transfère le passif, sans acceptation possible.","sensoriel":"Un tiroir de bureau s'ouvre seul sur des papiers pliés en quatre, et vos mains prennent une posture qui n'est pas la vôtre.","couleur":"#5B4636","emotion_source":"le ressentiment envers une filiation qu'on n'a pas choisie et qu'on n'a pas su refuser"},{"id":"claudication","nom":"La Claudication","kanji":"跛行","romaji":"Hakō","concept":"Un déséquilibre se propage : la loi impose à toute démarche une asymétrie que le corps compense, jusqu'à user l'appui qui restait.","sensoriel":"Un pas plus court que l'autre dans le couloir, chez tout le monde en même temps, et le rythme finit par s'installer.","couleur":"#8B6E63","emotion_source":"la honte du corps qui trahit son propriétaire devant témoin"},{"id":"date-anniversaire","nom":"La Date Anniversaire","kanji":"命日","romaji":"Meinichi","concept":"Certaines dates gardent la faculté d'agir : la loi ramène un événement à son heure exacte et exige qu'il soit revécu par quelqu'un d'autre.","sensoriel":"Une odeur d'encens froid, une horloge domestique qui sonne un chiffre qu'elle ne possède pas, et tout le monde se tait à la même seconde.","couleur":"#5A4B52","emotion_source":"le deuil qui revient chaque année à la même heure sans avoir rien appris"},{"id":"eau-dormante","nom":"L'Eau Dormante","kanji":"死水","romaji":"Shisui","concept":"Ce qui ne circule plus se corrompt : la loi arrête la circulation d'une chose — le sang, la parole, la monnaie — et laisse la stagnation faire le travail.","sensoriel":"Un film irisé à la surface d'un verre, une douceur écœurante dans l'air, et les phrases prononcées restent à hauteur de bouche.","couleur":"#3E4A42","emotion_source":"l'aigreur d'une rancune qu'on n'a jamais formulée devant l'intéressé"},{"id":"creux-du-seuil","nom":"Le Creux du Seuil","kanji":"敷居","romaji":"Shikii","concept":"La répétition creuse la pierre : la loi comptabilise les passages d'un être et convertit ce compte en usure, sur lui plutôt que sous ses pieds.","sensoriel":"Le bruit de la semelle change de note au franchissement d'une porte, et la marche paraît chaque fois un peu plus basse.","couleur":"#8D7F6A","emotion_source":"la lassitude de qui refait le même trajet depuis vingt ans sans l'avoir jamais choisi"},{"id":"ankylose","nom":"L'Ankylose","kanji":"拘縮","romaji":"Kōshuku","concept":"Ce qu'on immobilise pour le soigner ne se remet plus à bouger : la loi accorde la protection, puis la rend définitive.","sensoriel":"Une chaleur d'attelle sous les vêtements, un craquement sec quand un doigt refuse de se déplier, et rien ne fait mal.","couleur":"#9B9EA3","emotion_source":"la peur du mouvement chez celui qui, blessé une fois, a préféré ne plus jamais s'exposer"},{"id":"anonymat","nom":"L'Anonymat","kanji":"匿名","romaji":"Tokumei","concept":"Ce qui n'a pas de nom ne peut être ni convoqué ni facturé ; la loi retire son nom à une chose et la met hors d'atteinte, donc hors de secours.","sensoriel":"Les étiquettes se vident une à une, et la personne en face vous appelle deux fois sans parvenir à dire quoi.","couleur":"#A8A29B","emotion_source":"la honte de son propre nom, chez qui a passé sa vie à ne pas vouloir être appelé"},{"id":"delavage","nom":"Le Délavage","kanji":"褪色","romaji":"taishoku","concept":"La couleur d'une chose est la quantité d'attention qu'on lui porte encore ; le porteur retire l'attention et le pigment part avec elle. L'objet garde sa forme exacte et perd son nom.","sensoriel":"Les tissus rendent une eau claire, sans mousse et sans odeur. Les encres remontent en surface comme du sel, les photographies blanchissent d'abord aux visages, et le regard glisse sur ce qui a pâli sans trouver où s'accrocher.","couleur":"#8FA3AE","emotion_source":"L'indifférence installée dans un foyer, l'affection qui s'éteint sans dispute ni rupture.","famille":"usure"},{"id":"tassement","nom":"Le Tassement","kanji":"沈下","romaji":"chinka","concept":"Toute charge supportée trop longtemps finit par descendre ; le porteur ne fait qu'accorder au sol la permission de céder maintenant. Rien n'est frappé, tout s'enfonce.","sensoriel":"Un craquement sourd sous les semelles, à hauteur de cheville. Des fissures en escalier montent dans le crépi, les portes ne ferment plus, et une bulle de niveau posée au sol dérive d'un demi-degré par minute.","couleur":"#6B6257","emotion_source":"La résignation d'une vie passée à porter ce qu'on n'a jamais accepté de porter.","famille":"usure"},{"id":"rancissement","nom":"Le Rancissement","kanji":"酸敗","romaji":"sanpai","concept":"Ce qui a nourri se retourne toujours contre celui qu'il a nourri. Le porteur accélère cette bascule dans toute matière grasse, et par extension dans tout lien qui a servi à entretenir quelqu'un.","sensoriel":"Une odeur de beurre oublié derrière un radiateur, tenace, qui s'attrape aux vêtements pour la journée. Goût savonneux au fond de la gorge, gouttelettes jaunes qui perlent sur les surfaces froides.","couleur":"#C2A85C","emotion_source":"La rancune domestique, entretenue à table pendant des années sans jamais être nommée.","famille":"usure"},{"id":"effilochage","nom":"L'Effilochage","kanji":"綻び","romaji":"hokorobi","concept":"Tout assemblage ne tient que par un fil, et ce fil se souvient de sa longueur d'origine. Le porteur trouve le point de couture — d'un vêtement, d'un cordage, d'un tendon, d'une chaîne de commandement — et lui rend sa liberté.","sensoriel":"Un chuintement continu, comme une couture qui lâche derrière l'épaule. Les bords se hérissent, un seul fil court trois mètres tout seul sur le sol, et ce qui était un ensemble se met à pendre.","couleur":"#A89078","emotion_source":"La négligence : savoir qu'une chose se défait et remettre la réparation à plus tard, chaque jour.","famille":"usure"},{"id":"filigrane","nom":"Le Filigrane","kanji":"透かし","romaji":"sukashi","concept":"Une marque logée dans l'épaisseur ne s'efface pas, parce qu'elle ne se trouve nulle part en surface. Le porteur inscrit une provenance dans la matière même : le papier, le verre, la chair.","sensoriel":"Rien sous le doigt, rien sous la lampe. Levée à contre-jour, la paume laisse lire un numéro et une date en caractères clairs, plus pâles que la peau, orientés pour être lus par quelqu'un d'autre.","couleur":"#DCE0DA","emotion_source":"La honte d'une origine qu'on n'a pas choisie et qu'aucune réussite ne rature.","famille":"compte"},{"id":"bareme","nom":"Le Barème","kanji":"査定","romaji":"satei","concept":"Toute chose reçoit une note, selon des critères que le porteur seul détient et n'expose jamais. Ce qui est mal noté perd réellement la valeur qu'on lui refuse : masse, dureté, prix, crédit.","sensoriel":"Un crissement de crayon gras dans le dos. Un chiffre à deux décimales apparaît dans l'angle inférieur droit des objets, comme au dos des meubles en salle des ventes, et la chose notée devient plus légère et plus froide à mesure.","couleur":"#8C3B3B","emotion_source":"L'humiliation d'être évalué par quelqu'un qui ne dira jamais sur quoi il vous évalue.","famille":"compte"},{"id":"obliteration","nom":"L'Oblitération","kanji":"消印","romaji":"keshiin","concept":"Valider, c'est dépenser. Ce que le porteur marque a servi une fois et ne servira plus : un mot, un itinéraire, un geste, une autorisation. La chose reste entière, elle est simplement usagée.","sensoriel":"Un coup sec de tampon entendu à l'intérieur du crâne, un dixième de seconde avant la marque. Une encre violette et grasse, qui porte la date et l'heure à la minute, et une odeur d'encrier de guichet.","couleur":"#2E2A33","emotion_source":"Le regret des choses envoyées, dites ou signées, qu'on ne peut plus rappeler.","famille":"compte"},{"id":"main-courante","nom":"La Main Courante","kanji":"日誌","romaji":"nisshi","concept":"Consigné, jamais instruit. Tout fait déclaré au porteur est noté avec exactitude et n'obtient aucune suite ; l'inscription elle-même retire à l'événement sa capacité d'avoir des conséquences.","sensoriel":"Un stylo bille qui gratte le papier quadrillé, un néon de guichet qui bat à deux mètres. Sous chaque ligne, la même mention à l'encre bleue : « Déclarant entendu. Aucune suite donnée. »","couleur":"#4C5A63","emotion_source":"Le désespoir tranquille d'avoir été écouté avec attention par quelqu'un qui n'interviendra pas.","famille":"compte"},{"id":"point-aveugle","nom":"Le Point Aveugle","kanji":"盲点","romaji":"mōten","concept":"À l'endroit où le nerf entre dans l'œil, il n'y a rien à voir, et l'esprit rebouche le trou sans prévenir personne. Le porteur déplace ce trou et le pose où il veut.","sensoriel":"Aucun noir, aucun flou, aucune gêne. Le mur continue, la conversation continue, le décompte des personnes présentes tombe juste — et il manque quelqu'un dans la pièce depuis onze minutes.","couleur":"#101014","emotion_source":"Le refus de voir : ce qu'une famille, un service ou un conseil décide de ne pas constater.","famille":"absence"},{"id":"membre-fantome","nom":"Le Membre Fantôme","kanji":"幻肢","romaji":"genshi","concept":"Ce qui a été retranché continue d'occuper sa place et de faire mal, plus précisément que de son vivant. Le porteur donne à une absence la consistance, l'encombrement et la douleur d'un membre.","sensoriel":"Une démangeaison à un endroit qu'aucune main n'atteint. On sent des doigts se refermer là où il n'y a plus d'avant-bras, et la douleur arrive toujours avec deux secondes de retard sur ce qui l'a causée.","couleur":"#A9899B","emotion_source":"Le déni du deuil : continuer à mettre le couvert pour quelqu'un qu'on a enterré.","famille":"absence"},{"id":"manque","nom":"Le Manque","kanji":"禁断","romaji":"kindan","concept":"Le vide qui réclame. Le porteur ouvre dans un organisme un besoin sans objet : le corps exige, avec toute la violence du sevrage, une chose qu'il n'a jamais connue et qu'aucun geste ne peut lui fournir.","sensoriel":"Bâillements en rafale, sueur froide à la nuque, tremblement des mains à 6 hertz. Goût de pièce de monnaie sous la langue, et une certitude d'une netteté absolue : ça va s'arrêter si l'on obtient — quoi, on ne sait pas.","couleur":"#4B3A5A","emotion_source":"L'avidité inassouvie de ceux qui ont tout obtenu et n'ont jamais su ce qu'ils voulaient.","famille":"absence"},{"id":"aphonie","nom":"L'Aphonie","kanji":"失声","romaji":"shissei","concept":"Le souffle passe, la voix ne suit pas. Le porteur ne supprime pas le son : il retire au corps la capacité de faire porter un nom au-dehors, y compris son propre nom.","sensoriel":"Un long chuintement d'air tiède, la gorge qui chauffe et se serre. On entend distinctement la langue claquer et la salive descendre ; l'appel radio ne rapporte qu'un frottement, et le nom prononcé n'atteint personne.","couleur":"#93989B","emotion_source":"Ce qui n'a pas été dit à temps, et la peur de découvrir qu'on n'aurait pas été cru.","famille":"absence"},{"id":"adherence","nom":"L'Adhérence","kanji":"癒着","romaji":"yuchaku","concept":"Après une plaie, les tissus qui devaient rester distincts se soudent entre eux et gênent tout mouvement. Le porteur rend définitif tout contact maintenu : au-delà de quatre secondes, deux choses ne se séparent plus sans arracher.","sensoriel":"Une chaleur ponctuelle au point de contact, puis un tiraillement à chaque tentative de retrait. La peau blanchit sur le pourtour, et le bruit du décollement, quand il a lieu, est celui d'une bande adhésive tirée lentement.","couleur":"#9E5B52","emotion_source":"La promiscuité subie : les liens qu'on n'a pas choisis et qu'on ne peut plus défaire sans se blesser.","famille":"contact"},{"id":"escarre","nom":"L'Escarre","kanji":"褥瘡","romaji":"jokusō","concept":"Ce n'est pas le coup qui tue, c'est l'appui qu'on ne déplace jamais. Là où un poids reste immobile sur un corps, la chair meurt de l'intérieur vers la surface, et la surface est prévenue en dernier.","sensoriel":"Un point brûlant au sacrum et aux talons, sous une peau restée blanche. Douze minutes plus tard, la marque tourne au rouge sombre puis au noir, et il monte une odeur douce, presque sucrée, de linge propre.","couleur":"#6E2F33","emotion_source":"L'abandon des corps immobiles : la négligence patiente de ceux qui étaient chargés de les retourner.","famille":"contact"},{"id":"tiedeur","nom":"La Tiédeur","kanji":"残温","romaji":"zan'on","concept":"La chaleur qu'un corps laisse sur une chaise après s'être levé est encore ce corps, pour un moment. Le porteur récolte ces restes, les lit, les rend — ou y maintient quelqu'un qui a déjà quitté la place.","sensoriel":"34,2 °C sur l'assise, sur le drap, sur la poignée. La trace tient onze minutes et décroît régulièrement ; posée dessus, la paume perçoit le poids, la posture et le pouls de celui qui vient de partir.","couleur":"#C9926F","emotion_source":"Le chagrin des départs récents, celui qui tient dans l'intervalle entre la porte et le bruit de la porte.","famille":"contact"},{"id":"decalque","nom":"Le Décalque","kanji":"転写","romaji":"tensha","concept":"Toute pression laisse son image sur ce qu'elle presse. Le porteur relève cette image et la reporte sur un autre support, où elle reste solidaire de l'original tant que l'encre n'a pas séché.","sensoriel":"Un papier humide, tiède, qui sent le solvant. Les lignes d'une paume apparaissent à l'envers sur le bois de la table, en bleu de stylo, et chaque appui du doigt sur ce dessin provoque un picotement à trente mètres de là.","couleur":"#3F5B8C","emotion_source":"La possessivité : le besoin de garder une trace de quelqu'un qui n'a rien accepté de donner.","famille":"contact"}]},"vecteurs":{"vecteurs":[{"id":"VEC-01","nom":"Par le nom prononcé en entier","condition":"Le porteur énonce à voix audible le nom d'état civil complet de la cible — patronyme et prénom, dans l'ordre du registre — d'un seul tenant, dans un air que les deux corps partagent. Une syllabe reprise, un bégaiement, une inversion, et l'énoncé est nul : il faut recommencer du premier son.","portee":"moyenne","verbe":"Prononcer","faille":"Cesser d'être nommable. Un changement d'état civil déposé, un prénom d'usage porté depuis assez longtemps pour que l'ancien ne soit plus su, et la loi énonce quelqu'un qui n'existe pas. À défaut : tousser sur la deuxième syllabe. L'adversaire qui interrompt l'énoncé une fois par battement ne sera jamais atteint, et il le sait dès qu'il a entendu le porteur reprendre."},{"id":"VEC-02","nom":"Par le sang bu","condition":"Le porteur avale au moins une gorgée du sang de la cible, sorti depuis moins de douze battements, encore au-dessus de la température de sa propre bouche, non mêlé d'eau, de salive étrangère ou de terre. La gorgée doit descendre : gardée sous la langue, elle ne compte pas.","portee":"illimitée conditionnelle","verbe":"Ingérer","faille":"Refroidir ou diluer avant que la main n'arrive. Saigner dans la neige, dans un seau, sous la pluie. Cautériser au fer une plaie qui coule. Les vieux exorcistes portent une lame passée dans un sel qui prend le sang en quatre secondes : ce qu'ils cèdent au sol est déjà mort et le porteur boit de la pierre."},{"id":"VEC-03","nom":"Par le regard soutenu","condition":"Ligne de vue réciproque, sans verre teinté ni fumée, tenue trois secondes pleines, le porteur ne clignant pas. Un reflet ne vaut rien : il faut l'œil, pas son image. Le compte repart à zéro à la première paupière.","portee":"longue","verbe":"Soutenir","faille":"Rompre par le bas. Baisser les yeux au deuxième temps coûte une demi-seconde et annule trois. Une poignée de cendre lancée en cloche, une vitre passée au noir de fumée, une paupière recousue. Un borgne qui se tient du côté mort ne peut jamais être compté : la loi exige la réciprocité, et il n'a rien à rendre."},{"id":"VEC-04","nom":"Par le sol partagé","condition":"Les deux corps posent leur poids sur une même surface continue — une dalle, un plancher, une veine de roche — sans joint de dilatation ni vide entre eux. La continuité se vérifie à l'oreille : un talon frappé par le porteur doit s'entendre sous le pied de la cible.","portee":"moyenne","verbe":"Fouler","faille":"S'élever ou se désolidariser. Deux centimètres suffisent : une caisse retournée, une marche isolée, un tapis épais, une flaque. Sauter au battement d'application est la parade des débutants et elle fonctionne. Un adversaire qui repère les joints du carrelage combat en restant du mauvais côté de la ligne et ne fait plus rien d'autre."},{"id":"VEC-05","nom":"Par la respiration comptée","condition":"Le porteur compte à voix basse sept expirations de la cible dans un volume d'air clos et commun. Le compte se dit en continu ; toute reprise, toute expiration manquée par le porteur lui-même, remet le nombre à un.","portee":"courte","verbe":"Compter","faille":"Fausser le débit. Apnée sur quatre temps, expiration par le nez puis par la bouche, souffles hachés qui empêchent de trancher où finit l'un et commence l'autre. Plus simple encore : ouvrir une fenêtre. Le volume cesse d'être commun, et le porteur compte l'air de la rue."},{"id":"VEC-06","nom":"Par l'objet touché deux fois","condition":"Un objet inerte de moins de trois kilos reçoit la paume nue du porteur, puis, dans le même quart d'heure et sans intermédiaire, la paume nue de la cible. L'ordre est fixe : le porteur d'abord. Une tasse rendue, une poignée de porte, une pièce de monnaie dans le creux de la main.","portee":"illimitée conditionnelle","verbe":"Repasser","faille":"Un gant, une manche tirée sur les doigts, un mouchoir. Ou l'ordre inverse, que rien n'interdit à l'adversaire d'imposer : prendre l'objet le premier, puis le tendre. La chaîne ne se ferme pas. Laver la chose ne sert à rien ; la casser, oui — l'objet doit rester d'une seule pièce."},{"id":"VEC-07","nom":"Par l'ombre franchie","condition":"L'ombre portée du porteur, projetée par une source lumineuse unique, recouvre à un instant donné le pied ou la tête de la cible. Le recouvrement doit être franc : une frange grise ne compte pas.","portee":"moyenne","verbe":"Recouvrir","faille":"Multiplier les sources. Deux lampes font deux ombres, et aucune n'est celle du porteur. Le zénith ne donne rien à franchir, l'obscurité pleine non plus. Un adversaire qui allume une seconde lanterne et se tient dans l'ombre d'un tiers a désarmé la loi sans lever la main."},{"id":"VEC-08","nom":"Par la signature contrefaite","condition":"Le porteur trace de sa propre main le nom de la cible en imitant son graphisme, sur un support qui boit l'encre — papier, bois tendre, peau. L'application doit intervenir tant que le tracé est humide.","portee":"illimitée conditionnelle","verbe":"Contresigner","faille":"Changer de main. Une nouvelle boucle apprise en une semaine, une signature à la croix, une écriture de la gauche : la contrefaçon ne trouve plus quoi contrefaire. À défaut, souffler dessus. Une signature sèche est une signature morte, et un support verni ne prend jamais."},{"id":"VEC-09","nom":"Par la dette reconnue","condition":"La cible reconnaît à voix haute, en présence d'un tiers vivant, devoir au porteur une chose chiffrée : une somme, une heure, un nombre de services. Le chiffre doit être dit par elle, pas par lui.","portee":"longue","verbe":"Créditer","faille":"Ne jamais dire le nombre. « Je te dois quelque chose » ne donne aucune prise : la loi cherche une quantité et n'en trouve pas. Payer sur-le-champ referme aussi. Le plus élégant reste le surpaiement : celui qui rend le double crée une dette inverse et le porteur se retrouve du mauvais côté de son propre registre."},{"id":"VEC-10","nom":"Par l'écho rendu","condition":"Un son émis par la cible revient à l'oreille du porteur après réflexion sur une surface dure, avec un retard perceptible d'au moins un dixième de seconde. Le porteur doit pouvoir désigner le mur qui l'a renvoyé.","portee":"moyenne","verbe":"Renvoyer","faille":"Tuer la réverbération. Combattre dans la neige, dans un couloir tendu de tissu, au milieu d'une foule. Ou réduire la distance : sous dix-sept mètres, l'écho ne se sépare plus du son et le porteur n'a plus qu'une voix, la sienne. Se taire fonctionne, mais peu d'adversaires tiennent quatre minutes sans un cri."},{"id":"VEC-11","nom":"Par le pas compté","condition":"Le porteur énonce le nombre de pas parcourus par la cible depuis le lever du jour, à moins de cent près, et le dit entier, sans arrondi. Le chiffre annoncé est vérifié à l'énoncé même : faux, il ferme la loi pour le reste du battement.","portee":"longue","verbe":"Énumérer","faille":"Rendre le compte insoluble ou nul. Tourner en rond sur douze mètres carrés, se faire porter, dormir jusqu'à midi. Zéro pas est l'exception écrite dans la loi elle-même : celui qui n'a pas bougé depuis l'aube ne peut pas être dénombré, et l'adversaire qui l'a compris commence ses journées assis."},{"id":"VEC-12","nom":"Par le sel versé","condition":"Une ligne continue de matière sèche — sel, cendre, chaux — versée par le porteur sur un sol dur, et franchie par la cible en la foulant. La ligne doit être ininterrompue d'un bord à l'autre du passage au moment du franchissement.","portee":"courte","verbe":"Répandre","faille":"Rompre avant de passer. Un coup de talon, un souffle, une semelle traînée : la continuité est ce qu'il y a de plus fragile au monde. Enjamber suffit également, puisque la loi exige que la ligne soit foulée, non traversée. Un courant d'air fait le travail sans que personne ait à s'en occuper."},{"id":"VEC-13","nom":"Par le vêtement porté","condition":"Le porteur tient contre sa peau nue une pièce de tissu ayant passé une nuit entière contre la peau de la cible, non lavée depuis. Un vêtement porté une heure ne vaut rien ; il faut le sommeil.","portee":"illimitée conditionnelle","verbe":"Revêtir","faille":"L'eau bouillante annule tout en quatre minutes. Dormir la peau nue ne cède rien du tout. Les maisons qui savent changent le linge chaque matin et brûlent l'ancien devant témoin — la dépense est ridicule au regard de ce qu'elle empêche, et c'est pour cela que si peu de gens la font."},{"id":"VEC-14","nom":"Par le tiers témoin","condition":"Un troisième vivant, ni porteur ni cible, voit les deux au même instant et peut les nommer tous les deux. Un animal fait l'affaire s'il porte un nom donné par un humain.","portee":"moyenne","verbe":"Convoquer","faille":"S'isoler, ou se rendre innommable au témoin. Se présenter sous un faux nom à celui qui regarde suffit : il voit deux corps et n'en connaît qu'un, l'énoncé reste ouvert. Aveugler le témoin fonctionne, le tuer aussi, et c'est précisément ce que la loi finit par exiger de son porteur — on la reconnaît aux pièces vides qu'elle laisse derrière elle."},{"id":"VEC-15","nom":"Par la mesure prise","condition":"Le porteur relève une dimension du corps de la cible avec un instrument gradué — corde nouée, mètre, empan calibré — et l'annonce à l'unité près : tour de poignet, envergure, longueur de l'avant-bras.","portee":"courte","verbe":"Toiser","faille":"Produire l'ex æquo. Deux corps de même mesure dans la même pièce, et la loi ne sait plus lequel elle désigne ; les frères se battent en paire pour cette raison. Autrement, fausser la dimension : un bandage sous la manche, une inspiration tenue, un poignet gonflé par le garrot déplacent le relevé d'une unité, et une unité suffit."},{"id":"VEC-16","nom":"Par le seuil franchi ensemble","condition":"Porteur et cible traversent la même ouverture — porte, portique, arche, brèche — dans le même battement et dans le même sens. Le cadre doit être matériel : une limite peinte au sol n'est pas un seuil.","portee":"contact","verbe":"Franchir","faille":"Céder le passage. Un temps d'attente d'une seconde, une main tendue vers la poignée qu'on laisse retomber, et rien ne se ferme. Entrer quand l'autre sort n'ouvre rien : le sens fait partie de la condition. Contre ce vecteur, on se bat par la fenêtre, et les couloirs deviennent des lieux de politesse extrême."},{"id":"VEC-17","nom":"Par le registre tenu","condition":"Le porteur inscrit sur un registre paginé la date, l'heure et l'acte de la cible, sur une ligne numérotée qui suit immédiatement la précédente. Aucun saut de numéro, aucune rature : la série doit être intègre du premier feuillet à la ligne du jour.","portee":"longue","verbe":"Inscrire","faille":"Corrompre la série. Faire écrire deux fois la même heure, provoquer une rature, arracher un feuillet — l'adversaire qui atteint le cahier n'a même pas besoin de le détruire, il lui suffit d'y ajouter une ligne fausse. Une goutte d'eau sur le numéro et la loi n'a plus de rang où s'accrocher."},{"id":"VEC-18","nom":"Par l'aiguille laissée","condition":"Un objet métallique du porteur, gravé de son nom ou trempé de son sang, demeure à moins d'un empan du corps de la cible pendant douze battements consécutifs : dans une doublure, une semelle, une plaie, un ourlet.","portee":"illimitée conditionnelle","verbe":"Ficher","faille":"Se fouiller. Un aimant passé sur les coutures, un déshabillage complet, une plaie ouverte au couteau plutôt que sondée. La parade la plus dure à supporter est la plus simple : retrouver l'aiguille et la rendre au porteur, dans sa main, en le regardant. L'objet revenu rompt la chaîne, et il doit tout recommencer à zéro empan."},{"id":"VEC-19","nom":"Par le repas partagé","condition":"Porteur et cible prélèvent leur part d'un même plat, cuit dans le même récipient, au même repas, et avalent. Deux portions de la même recette cuites séparément ne valent rien : la loi lit le récipient, pas le goût.","portee":"moyenne","verbe":"Rompre","faille":"Ne pas avaler. Garder en bouche, recracher dans la serviette, se servir dans un second plat identique mais sorti d'une autre marmite. Les banquets de trêve prévoient deux fonds de cuisson pour cette raison, et les convives qui savent regardent l'ustensile plutôt que l'assiette."},{"id":"VEC-20","nom":"Par la chaleur cédée","condition":"Peau nue contre peau nue, maintenues jusqu'à ce que les deux surfaces atteignent la même température : la vérification est sensorielle, la frontière entre les deux peaux cesse d'être perceptible. En moyenne quarante secondes, davantage sur un blessé.","portee":"contact","verbe":"Égaliser","faille":"Tenir l'écart ouvert. Une pièce de monnaie froide serrée dans le poing, une main plongée dans l'eau avant l'engagement, la fièvre. Rompre le contact à trente secondes annule tout et ne coûte rien. Contre ce vecteur, on ne meurt que si l'on est déjà trop faible pour retirer son bras — ce qui est exactement le cas visé."},{"id":"VEC-21","nom":"Par le mensonge accepté","condition":"Le porteur énonce sur la cible une phrase fausse et vérifiable, et la cible l'accepte : un mot, un hochement de tête, ou un silence tenu plus de trois secondes. L'acceptation doit être unique et pleine.","portee":"moyenne","verbe":"Faire acquiescer","faille":"Contredire, même mal, même à côté. Ou l'état à moitié, qui est la faille propre de toute condition binaire : acquiescer et nier dans la même phrase laisse la loi suspendue entre deux valeurs, et elle ne s'applique pas. Il existe enfin la parade rare — rendre la phrase vraie, et se transformer en ce dont on est accusé."},{"id":"VEC-22","nom":"Par la cicatrice nommée","condition":"Le porteur désigne une cicatrice visible sur la cible et en énonce l'origine exacte : l'objet, l'année, la main qui l'a faite. Les trois éléments, sans erreur, à voix haute, devant la marque découverte.","portee":"courte","verbe":"Nommer","faille":"Couvrir la marque : la loi exige qu'elle soit vue. Mentir sur son histoire n'aide en rien, la loi lit le fait et non le récit. Reste la solution des vétérans, qui est une mutilation : rouvrir la peau au même endroit. La nouvelle cicatrice recouvre l'ancienne, son origine est d'un jour, et personne ne la connaît encore."},{"id":"VEC-23","nom":"Par l'ordre d'arrivée","condition":"Porteur et cible sont entrés dans le lieu par la même issue, et le porteur peut établir sans erreur lequel des deux est entré le premier — par un registre d'entrée, un ticket numéroté, ou le témoignage d'un portier.","portee":"moyenne","verbe":"Classer","faille":"L'ex æquo, faille écrite de toute mesure ordinale : franchir la porte épaule contre épaule, ou entrer par deux issues différentes, et il n'y a plus de rang à établir. Un adversaire qui déchire son ticket et en tire un second brouille sa place dans la série. Les portiers achetés le sont d'abord pour cela."},{"id":"VEC-24","nom":"Par le silence tenu","condition":"Quatre secondes pendant lesquelles aucun son ne part du corps de la cible — ni voix, ni pas, ni frottement d'étoffe, ni déglutition — dans un lieu où le porteur entend tout ce qui s'y produit.","portee":"courte","verbe":"Guetter","faille":"Ne jamais se taire. Parler pour ne rien dire, traîner un pied, faire tinter une boucle de ceinture à chaque temps : le combat lui-même annule ce vecteur, qui ne mord que sur l'immobile. C'est sa cruauté propre — il ne prend jamais un adversaire debout, seulement celui qui s'est arrêté derrière une porte pour retenir son souffle."}]},"lois":{"lois":[{"id":"solde-thermique","nom":"Le Solde Thermique","enonce":"La chaleur qu'un corps a laissée derrière lui reste portée à mon compte.","consequence":"Onze heures de tiédeur dans un lit sont un capital : je les restitue en une seconde et l'air prend feu à hauteur de hanche. Poussée sur une salle chauffée depuis novembre, la loi rend en un souffle un hiver entier, et le verre coule avant de casser.","limite":"Un corps qui n'a jamais eu chaud ne me doit rien : l'adversaire qui s'immerge dans l'eau froide avant de venir se présente à mon registre avec un solde nul, et je n'ai rien à réclamer sur lui.","inversion":"Je rends la chaleur à qui l'a perdue : la brûlure remonte son propre trajet et la peau redevient de la peau, à la température exacte d'avant le contact.","maximum":"Je porte à mon compte toute la chaleur que j'ai moi-même cédée depuis ma naissance, et je la restitue en un seul point : celui où je me tiens.","archetype":"mesure"},{"id":"troisieme-fois","nom":"La Troisième Fois","enonce":"Ce qui se produit trois fois devant moi ne sait plus s'arrêter.","consequence":"Un homme qui tousse trois fois tousse jusqu'à ce que ses côtes cèdent. Un cœur dont j'ai compté trois battements n'a plus de pause pour se remplir : il bat à vide, et la mort arrive par manque de silence.","limite":"Il me faut trois occurrences identiques et je dois les voir. Un adversaire qui varie — un pas long, un pas court, un pas sauté — ne me fournit jamais la troisième, et la série retombe à zéro dès qu'une différence s'y glisse.","inversion":"Je casse la série : ce qui s'était produit trois fois cesse entièrement, y compris la première fois — l'hémorragie n'a pas commencé, le compte à rebours n'a pas été lancé.","maximum":"Je laisse la loi elle-même s'appliquer trois fois de suite : elle ne sait plus s'arrêter, et tout ce que je regarde entre dans la série dès sa première occurrence.","archetype":"répétition"},{"id":"main-restee","nom":"La Main Restée","enonce":"Le dernier qui m'a touché reste sur moi jusqu'à ce qu'un autre le remplace.","consequence":"Je répartis mes blessures sur lui à la distance que je veux. Poussée, la loi fait mourir à trois kilomètres l'infirmier qui m'a bandé le matin, de ce qu'on me fait ici, dans l'ordre exact où on me le fait.","limite":"Un seul remplaçant suffit à couper le fil. L'adversaire qui m'effleure volontairement au premier échange devient mon unique attache, et je n'ai plus personne d'autre sur qui poser ce que je reçois.","inversion":"Je remonte le fil au lieu de le descendre : ce qu'on lui a fait revient sur moi, et la plaie qu'il porte se referme exactement à mesure qu'elle s'ouvre sur ma peau.","maximum":"Je me touche moi-même en dernier. La loi se boucle : chaque coup que je porte à un autre m'est aussi porté, et je peux donc me tuer d'un geste destiné à quelqu'un.","archetype":"lien"},{"id":"porte-refermee","nom":"La Porte Refermée","enonce":"Aucune ouverture que j'ai refermée derrière moi ne fonctionne dans les deux sens.","consequence":"Tout encadrement devient à sens unique : une fenêtre, une mâchoire, une cage thoracique. Ce qui est entré reste, ce qui est sorti ne rentre pas, et un poumon qui vient d'expirer ne reprend plus rien.","limite":"Il faut que ce soit ma main qui referme. On me combat portes ouvertes, on entre par ce qui n'a pas de battant, et on me pousse vers les espaces sans seuil où la loi ne trouve rien à verrouiller.","inversion":"J'ouvre dans le sens interdit : ce qui était sorti rentre, le sang retourne dans la plaie par le trajet dont il est parti, la balle ressort du mur.","maximum":"Je referme derrière moi le seuil de ma propre bouche : plus rien de ce que j'ai dit ne peut être repris par personne, moi compris, et chaque phrase que je prononce est ma dernière fois de la prononcer.","archetype":"seuil"},{"id":"temoin-unique","nom":"Le Témoin Unique","enonce":"Ce dont je suis le seul témoin n'a pas eu lieu.","consequence":"J'isole un homme dans un couloir vide et je le démonte pièce par pièce. À la sortie il est intact, il n'a rien subi, et le couloir n'en garde pas la trace parce que l'événement n'a jamais été inscrit nulle part.","limite":"Un second regard annule tout : une caméra, un enfant à une fenêtre, un chien qui tourne la tête. Contre moi on n'apporte pas d'arme, on apporte du monde, et un seul suffit.","inversion":"J'atteste au lieu d'effacer : ce dont je suis le seul témoin devient irrévocablement arrivé, y compris ce que j'ai seulement cru voir — et personne ne peut plus le défaire, moi le premier.","maximum":"Je deviens le seul témoin de moi-même. Je n'ai pas eu lieu ; rien de ce qui m'atteint ne trouve de lieu où atteindre, et rien de ce que je fais n'a jamais été fait.","archetype":"témoignage"},{"id":"poids-declare","nom":"Le Poids Déclaré","enonce":"Rien ne pèse plus que le chiffre que j'ai annoncé pour lui.","consequence":"J'annonce quatre cents kilos pour une lame de cent grammes : elle traverse le sol jusqu'au niveau inférieur. J'annonce zéro pour un homme en pleine course et il continue, sans rien pour l'arrêter ni pour le poser.","limite":"L'annonce doit être un nombre entier, dit avant le contact, et je ne peux pas répéter deux fois le même chiffre dans la journée. Ce qui n'a pas de masse — une flamme, un cri, une ombre — reste hors du registre.","inversion":"Je démesure : la chose reprend d'un coup tout le poids que je lui avais retiré depuis l'aube, et le porteur d'un objet allégé toute la matinée s'effondre sous ce qu'il portait déjà.","maximum":"Je m'annonce moi-même à zéro. Rien de ce qui me frappe ne trouve de masse à déplacer, rien ne me retient au sol, et je continue de m'éloigner sans jamais me reposer nulle part.","archetype":"mesure"},{"id":"homonymie","nom":"L'Homonymie","enonce":"Ce qui porte le même nom occupe la même place.","consequence":"Je donne à la lame le nom de la main qui la tient et l'entaille apparaît dans la paume. Poussée, j'apprends le prénom entier d'un homme, je le donne à un clou, et il faut le voir marcher jusqu'au mur.","limite":"L'orthographe fait foi, l'homophonie ne suffit pas. Une seule syllabe fausse rend la substitution nulle, et celui qui refuse son nom, qu'on n'appelle plus, sort du monde de la loi.","inversion":"Je fixe au lieu de substituer : deux choses de même nom cessent de pouvoir se remplacer, et l'homme cloué dans sa propre place n'en est plus tiré ni par un déplacement ni par un domaine.","maximum":"Je donne mon nom à la loi. Elle occupe ma place et j'occupe la sienne : je ne suis plus quelqu'un qui l'applique, je suis ce qui s'applique, et on ne me tue plus qu'en la réfutant.","archetype":"échange"},{"id":"ordre-de-passage","nom":"L'Ordre de Passage","enonce":"Rien ne m'atteint avant d'avoir atteint tout ce qui est arrivé avant moi.","consequence":"J'entre le dernier dans une salle de quarante personnes et je suis intouchable jusqu'à ce que les trente-neuf autres soient tombés, dans l'ordre où ils ont franchi la porte. Le coup destiné à moi les traverse tous, et il arrive épuisé.","limite":"La file ne compte que ceux qui sont entrés. Seul avec moi, l'adversaire n'a qu'un nom devant lui, et c'est le mien : la loi ne me protège plus d'un seul battement.","inversion":"Je rends l'ordre : je passe volontairement en tête et j'encaisse à la place de tous ceux qui sont entrés après moi, leurs blessures déjà reçues comprises.","maximum":"Je m'inscris deux fois dans la file, en tête et en queue. Rien ne peut m'atteindre avant de m'avoir atteint, et la loi tourne sur elle-même jusqu'à ce que quelqu'un sorte de la pièce.","archetype":"mesure"},{"id":"prelevement-usure","nom":"Le Prélèvement d'Usure","enonce":"L'usure d'une chose m'appartient et je décide du jour où elle est due.","consequence":"Je diffère l'usure d'une lame pendant six ans, puis je la lui rends : elle tombe en limaille dans la main qui la serre. Sur un homme, l'usure d'une vie entière tient dans la durée d'un souffle.","limite":"Ce qui n'a jamais servi ne s'use pas. Une arme sortie de l'atelier, une main d'enfant, un os qui n'a rien porté ne me donnent aucun prélèvement, et l'on m'affronte avec du neuf.","inversion":"Je restitue l'usure retenue : le fer redevient droit, la corde neuve, la dent refaite — mais ce qui a été rendu sort définitivement de mon registre et ne pourra plus jamais être prélevé.","maximum":"Je prélève l'usure du prélèvement lui-même : la loi cesse de vieillir et devient permanente, et tout ce que j'avais différé depuis toujours échoit au même instant.","archetype":"soustraction"},{"id":"dette-de-sommeil","nom":"La Dette de Sommeil","enonce":"Les heures de sommeil que je ne prends pas, un autre les doit.","consequence":"Après quatre nuits blanches, l'homme en face s'effondre debout, paupières collées ; son corps entre en sommeil profond pendant que je lui ouvre la gorge, et les heures qu'il paie s'ajoutent aux miennes.","limite":"Le compte doit être réel, donc je veille vraiment. Un adversaire qui tient le duel court affronte un corps privé de sommeil depuis quatre-vingts heures,
