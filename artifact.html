phalanges blanches, les yeux ouverts et parfaitement secs.","comportement":"Il joue par séquences de trois battements, puis rejoue exactement les trois mêmes. Noter l'ordre une fois revient à connaître tous ses coups suivants.","pv":165,"attaque":18,"energie":3,"replique":"Je ne me souviens pas d'avoir freiné.","technique_signature":"Trajet"},{"id":"cinq","nom":"Cinq Secondes","grade":"3","origine":"La peur de lâcher la main d'un enfant dans une allée de supermarché.","apparence":"Une main d'adulte seule, ouverte à hauteur de hanche, qui se referme sur du vide avec un bruit sec, à intervalle régulier.","comportement":"Elle compte à voix haute. Sur cinq, elle est déjà dans ton dos et la frappe part avant que tu te retournes. Agir sur quatre casse le compte et la ramène à un.","pv":145,"attaque":20,"energie":4,"replique":"Un. Deux. Tu ne regardais pas.","technique_signature":"Perte de vue"},{"id":"cabine","nom":"L'Entre-Deux-Étages","grade":"3","origine":"La peur de la cabine qui s'immobilise entre deux paliers.","apparence":"Une cabine sans porte, parois de miroir piqué, où l'on ne voit pas son propre reflet mais le sien, penché, un peu trop près.","comportement":"Toute attaque lancée à distance se perd contre les parois. Au contact il rend la moitié de ce qu'il reçoit : on ne le tue qu'en acceptant de payer chaque coup deux fois.","pv":190,"attaque":14,"energie":4,"replique":"On va rester ensemble un moment.","technique_signature":"Immobilisation"},{"id":"table","nom":"Le Silence Après La Phrase","grade":"2","origine":"La peur d'avoir dit en réunion quelque chose qu'on ne pourra pas reprendre.","apparence":"Une table de conférence de six mètres portée par des jambes humaines nues, entourée de chaises toutes tournées vers toi. Le bois est tiède aux endroits où l'on s'est appuyé.","comportement":"Chaque fois que tu répètes une action déjà employée, il ajoute une chaise, et chaque chaise ajoute une frappe au battement. Ne jamais se répéter le maintient à une seule.","pv":260,"attaque":25,"energie":5,"replique":"Personne n'a répondu. Continuez.","technique_signature":"Tour de table"},{"id":"videmaison","nom":"Le Vide-Maison","grade":"2","origine":"La peur d'avoir un jour à vider l'appartement d'un mort.","apparence":"Un empilement d'affaires à hauteur d'homme — manteaux, cadres, sacs de linge — qui tient debout et respire par le fond des cartons.","comportement":"À chaque battement il te tend un objet, et refuser n'est pas prévu : chaque objet reçu ferme une de tes actions. Chaque coup encaissé lui arrache un objet, et l'objet qui tombe rouvre l'action correspondante ; au septième, il s'effondre.","pv":340,"attaque":24,"energie":5,"replique":"Prends ça, ça se garde.","technique_signature":"Succession"},{"id":"rediffusion","nom":"L'Enregistrement","grade":"2","origine":"La peur d'une vidéo de soi qu'on n'a jamais tournée.","apparence":"Un corps grenu qui amorce chaque geste une fraction avant de le faire, vêtu de ce que tu portais hier.","comportement":"Il rejoue ton action du battement précédent à soixante pour cent de sa force. Il ne connaît que ce qu'il a vu : deux battements sans rien tenter le laissent sans répertoire, et il se blesse en cherchant.","pv":295,"attaque":30,"energie":6,"replique":"On t'a vu faire ça.","technique_signature":"Rediffusion"},{"id":"sonnerie","nom":"La Sonnerie de Quatre Heures","grade":"2","origine":"La peur du téléphone qui sonne à quatre heures du matin.","apparence":"Un combiné de plastique jauni greffé dans une orbite, le fil descendant dans la gorge ; le visage est celui d'un proche, mal tendu sur l'os.","comportement":"Il sonne trois fois avant chaque frappe. Décrocher annule la frappe mais lui cède un point d'énergie ; laisser sonner coûte une frappe pleine et l'épuise d'autant.","pv":270,"attaque":34,"energie":6,"replique":"Décroche. C'est pour toi.","technique_signature":"Annonce"},{"id":"champ","nom":"Le Patient Attentif","grade":"1","origine":"La peur de se réveiller pendant l'opération sans pouvoir le dire.","apparence":"Un corps sous un champ opératoire vert, immobile, un seul doigt battant la mesure. Sous le tissu, la respiration va deux fois trop vite.","comportement":"Il ne se déplace pas du duel. Il ne frappe que les battements où tu te soignes, recharges ou prépares : il punit le repos et rien d'autre. On ne le tue qu'en ne reprenant jamais son souffle.","pv":410,"attaque":46,"energie":7,"replique":"Je sens tout. Je ne peux rien dire.","technique_signature":"封痛 Fūtsū — le scellement de la douleur"},{"id":"interpellation","nom":"L'Appel Par Le Prénom","grade":"1","origine":"La peur d'entendre son prénom dans la rue, prononcé par quelqu'un qu'on ne connaît pas.","apparence":"Un homme de dos à trente mètres, dont la nuque pivote seule quand les épaules restent de face.","comportement":"Chaque syllabe de ton nom qu'il prononce lui donne huit points d'attaque et un pas d'approche. Le nom entier prononcé le fixe : il perd toute portée pendant deux battements, et c'est la seule fenêtre du duel.","pv":455,"attaque":41,"energie":7,"replique":"Tu t'es retourné. C'était bien toi.","technique_signature":"索名 Sakumei — l'indexation du nom entendu"},{"id":"poussee","nom":"La Poussée","grade":"1","origine":"La peur d'une foule qui se met à courir dans le même sens.","apparence":"Un mur de dos et d'épaules à hauteur d'homme, sans un seul visage, avançant au pas d'une marche lente et ne s'arrêtant pas aux obstacles.","comportement":"Il n'avance que d'un pas par battement et ne recule jamais ; l'espace derrière toi se réduit d'autant. Il ne sait pas tourner : se ranger de flanc contre une paroi le laisse passer et découvre son côté pendant trois battements.","pv":480,"attaque":44,"energie":8,"replique":"Personne ne peut plus s'arrêter.","technique_signature":"積勢 Sekisei — la sommation de l'élan acquis"},{"id":"visite","nom":"L'Étrangère du Dimanche","grade":"semi-spécial","origine":"La peur que sa mère demande un jour à quel titre on vient la voir.","apparence":"Une femme assise au bord d'un lit fait au carré, très propre, qui sourit du sourire réservé aux visiteurs. Ses mains ont trente ans de moins que son visage.","comportement":"À chaque battement elle oublie une de tes actions, et l'action oubliée cesse d'exister jusqu'à la fin du duel. Elle oublie aussi sa propre frappe la plus forte au quatrième battement : tenir jusque-là avec deux actions suffit à survivre.","pv":520,"attaque":50,"energie":8,"replique":"Vous êtes le fils de qui, déjà ?","technique_signature":"断系 Dankei — la séparation de la filiation"},{"id":"tirage","nom":"La Cage d'Escalier Unique","grade":"semi-spécial","origine":"La peur de l'incendie dans une tour qui n'a qu'un escalier.","apparence":"Une colonne de fumée tiède qui monte dans un corps d'immeuble, portant à l'intérieur des empreintes de mains propres, à hauteur d'épaule, toutes tournées vers le haut.","comportement":"Il occupe la sortie et retire un cran d'air par battement : ta réserve plafonne, puis se rétracte. Il ne sait que monter — se tenir plus bas que lui le rend inoffensif, au prix de rester enfermé avec lui.","pv":560,"attaque":56,"energie":9,"replique":"L'air est meilleur en bas. Descends.","technique_signature":"移息 Isoku — le transfert du souffle"},{"id":"archive","nom":"Ce Qui A Été Sauvegardé","grade":"spécial","origine":"La peur que tout ce qu'on a écrit à seize ans existe encore quelque part.","apparence":"Un corps cousu de feuillets montrant le même homme à tous ses âges, mis à plat et superposés. Il ne prononce que des phrases que tu as réellement dites.","comportement":"Chaque battement il rejoue une de tes actions passées, y compris celles des duels précédents. Il ne peut citer que ce qui est consigné : une action jamais employée le laisse sans réponse un battement entier. Au septième, il ouvre son registre et inscrit ta structure maximale.","pv":780,"attaque":74,"energie":11,"replique":"Rien n'a été supprimé. Rien ne le sera.","technique_signature":"保名 Homei — la conservation de ce qui a été nommé"},{"id":"sediment","nom":"Celui Qu'on Retrouve En Août","grade":"spécial","origine":"La peur de mourir chez soi et d'être découvert par l'odeur.","apparence":"Un fauteuil, un téléviseur d'information resté muet, et derrière, sur le mur, la silhouette jaunie de quelqu'un qui est resté assis très longtemps. Le fléau est le mur.","comportement":"Il n'engage rien : il attend, et chaque battement où tu ne commets aucune erreur lui rapporte deux points d'attaque. Il n'existe que pendant les battements où on ne le regarde pas ; le fixer deux battements de suite le rend solide et frappable, et coûte une frappe pleine à chaque fois.","pv":860,"attaque":86,"energie":12,"replique":"Personne n'est venu depuis quatre mois.","technique_signature":"積齢 Sekirei — la sommation de l'âge"}]},"voix":{"mort":["Le porteur a cessé à 4 h 09. Le dossier reste ouvert.","On a retrouvé la loi intacte. C'est le corps qui manquait.","Vous avez arrêté de payer l'entretien. Le reste a suivi tout seul.","La dernière chose énoncée n'était pas votre nom.","Votre exception ne vous couvrait pas : vous n'avez jamais valu zéro.","L'énergie inversée répare la chair. Il n'en restait pas assez pour l'appliquer.","Il a fallu quatre secondes pour que vos mains rejoignent la température du sol.","Vous avez tenu onze battements. La moyenne est de neuf. Ce n'est pas une consolation, c'est une statistique.","Le fléau n'a pas terminé son geste. Il n'en a pas eu l'usage.","Votre sang est sorti dans l'ordre où il était compté.","Personne n'a prononcé votre nom en entier. Vous êtes tombé comme une quantité.","Le métronome continue. Il ne vous comptait pas.","Classé. Le tampon est sec avant que vous ne le soyez."],"victoire":["Le fléau se défait dans l'ordre inverse de son assemblage.","La loi adverse est éteinte. Vous en gardez un axe, et l'axe vous garde.","Il n'a plus de condition à remplir. Dans les rapports, on appelle cela la paix.","Vous avez payé jusqu'au dernier battement. Il a manqué le sien.","Ce qui restait de lui tient dans une ligne de registre, sans marge.","Sa faille était rituelle : il lui fallait la peau nue. Vous aviez des gants.","Le vermillon retombe. L'encre sèche plus vite que le sang.","Le dossier se referme sur un nom complet. Le vôtre est encore lisible.","Fin de relevé. Vous ressortez avec une articulation de moins et une loi de plus.","Il a cessé d'être une exception. Il redevient une adresse, une date, une peur."],"serment_accepte":["Gravé. La laque ne s'écaille pas.","Vous avez signé sans relire. Le Bureau le note en marge.","Un serment avec soi-même ne se trahit pas : il se subit.","Ce que vous venez de céder ne figure plus dans vos options. Cherchez-le, il n'y est plus.","La restriction est réelle. C'est exactement pour cela qu'elle paie.","L'encre a mordu jusque sous le sceau, des deux côtés de la feuille.","Vous êtes plus fort de tout ce que vous ne ferez plus jamais.","Le tiroir se referme sur votre clause. Il n'a pas de poignée à l'intérieur.","Contresigné par personne. C'est la seule forme qui tienne."],"serment_rompu":["Vous avez fait ce que vous aviez juré de ne pas faire. Le gain se retire d'abord, la dette ensuite.","La clause vous relit.","Rupture consignée. Le vermillon vire à la laque.","Ce n'est pas une sanction, c'est une restitution.","L'énergie avancée est reprise à la source. La source, c'est vous.","Le pacte n'est pas annulé. Il a changé de bénéficiaire.","Vous respirez ce que vous vous étiez interdit. Chaque inspiration est facturée."],"domaine_ouvert":["La marge se referme. Il n'y a plus de dehors à atteindre.","Les murs touchent, voient et portent l'inscription. La condition n'a plus lieu d'être.","Ici, énoncer devient inutile : le lieu énonce.","Le registre s'ouvre à la page où vous êtes déjà inscrit.","La barrière se pose comme un couvercle sur un bocal, sans bruit d'air.","Le sûr-au-but s'imprime en haut, comme une ligne de comptabilité.","Vous êtes à l'intérieur d'une phrase, et la phrase est déjà terminée.","À chaque battement, la loi vous est appliquée à la quantité minimale, sans faute et sans hâte.","L'entretien court. Regardez votre réserve, pas votre adversaire.","Le sol a pris la température de la loi."],"domaine_brise":["La résille cède par le bord. Le dehors revient d'un coup, plus froid que prévu.","Barrière rompue : la condition d'énonciation redevient exigible.","Vous avez cessé de pouvoir payer. Le lieu vous a rendu au monde.","Le relevé s'interrompt en milieu de ligne. Il compte quand même.","Les murs retombent en pages. Certaines portent votre écriture.","L'entretien n'a pas été honoré au douzième battement. Le douzième battement s'en souvient.","La marge se rouvre. Il manque trois pas au monde, et personne ne les remettra."],"inversion":["L'encre remonte le long du trait qui vous a ouvert.","La plaie se referme en reprenant sa cause à l'envers.","Cyan sur vermillon. Ne les regardez pas longtemps ensemble.","Le verbe tourne : ce que vous preniez, vous le rendez, et cela coûte deux fois.","Huit pour cent de structure. La fatigue, elle, ne s'inverse pas.","Vous réparez la chair. L'âme n'est pas dans le périmètre.","Le sens du flux change sans que le débit baisse. Comptez avant de recommencer."],"retour":["Le porteur a cessé il y a 3 jours, 4 heures et 11 minutes. Le dossier n'a pas été rouvert depuis.","Vous revenez. Le bouton, lui, n'est pas revenu avec vous.","Nous avons gardé votre loi au chaud. Elle vous attend de l'autre côté de la table.","Votre nom figure deux fois au registre : une fois comme porteur, une fois comme cause.","Ce qui a été caviardé la dernière fois l'est encore. Ne cherchez pas la ligne, vous l'avez payée.","L'adversaire du jour a votre grade, votre substrat et vos rayures aux poignets.","Vous ne reverrez pas l'interface intacte. Elle n'existe plus dans ce dossier.","Le Bureau ne demande pas comment vous êtes revenu. Il note l'heure.","La première fois, vous êtes tombé au onzième tour. Nous avons laissé le compteur là où il s'est arrêté.","Vous connaissez déjà votre faille. C'est la seule chose que vous ayez emportée."],"murmures":["quelque chose compte à voix basse","le café a la température du sol","n'écris pas ton nom en entier","il manque un battement quelque part","la grille n'est plus droite","on t'a déjà mesuré","garde tes gants","le tiroir du bas ne s'ouvre plus","une main d'inconnu, un train bondé","ce qui vaut zéro passe au travers","respire moins fort, ça se facture","la dette court, même à l'arrêt","il y a une page de trop dans ton dossier","tu as signé avant de lire","le métronome ne t'attend pas","quelqu'un relit ta loi à l'envers","la cicatrice se souvient de l'ordre","l'encre sèche du bord vers le centre","Quelqu'un est dans le couloir.","Ne comptez pas les marches.","Elle attend depuis 1998.","La porte était fermée de l'intérieur.","Le froid vient du plafond.","Quelqu'un a signé pour vous.","Ça respire quand vous respirez.","Le formulaire est déjà rempli.","On a retrouvé les clés.","Personne n'a appelé les pompiers.","Tu n'as pas éteint la lumière.","Le compteur tourne encore.","Deuxième étage, chambre vingt-quatre.","Il manque une chaise.","Ils ont tous dit oui.","Ne réponds pas au téléphone.","La trace avance vers l'échelle.","Ça sentait le chlore avant.","Reste jusqu'à quatre heures dix.","On a rangé ses affaires.","Le givre écrit encore.","Quatorze voitures, personne dedans."]},"nomenclature":{"grades":[{"grade":"4","nom":"Exorciste de quatrième grade · 四級呪術師","description":"On te confie des couloirs après fermeture, des cages d'escalier, des choses qui n'ont jamais eu de nom. Le Bureau ne prévient personne : il n'y a rien à annoncer.","seuil":0},{"grade":"3","nom":"Exorciste de troisième grade · 三級呪術師","description":"Un étage entier, un fléau qui a déjà mangé au moins une fois, un rapport à rendre avant six heures. Les frais de nettoyage sont retenus sur ta solde.","seuil":104},{"grade":"2","nom":"Exorciste de deuxième grade · 二級呪術師","description":"On te confie des vivants. À partir d'ici, l'erreur a un nom, une adresse et un âge, et c'est toi qui écris les trois de ta main.","seuil":122},{"grade":"1","nom":"Exorciste de premier grade · 一級呪術師","description":"On ne te confie plus rien : on te prévient. Ta fiche est recopiée en double, et le second exemplaire part au service chargé d'exorciser les porteurs.","seuil":142},{"grade":"semi-spécial","nom":"Exorciste semi-premier grade · 準一級呪術師","description":"Ton nom circule avant ton corps. L'évacuation du quartier commence quand tu montes dans le train, et personne ne te l'a jamais dit en face.","seuil":168},{"grade":"spécial","nom":"Exorciste de grade spécial · 特級呪術師","description":"Le barème s'arrête un cran plus bas que toi. On ne t'envoie pas : on te lâche, on note l'heure, et on attend que le bruit cesse.","seuil":196}],"patrons":["{LOI} de {ESSENCE}","{LOI} : {NOMBRE} {MATIERE}","{ESSENCE} rendue en {MATIERE}","{NOMBRE} {MATIERE} pour {ESSENCE}","Article {NOMBRE} — {LOI}","{MATIERE} de {ESSENCE}","{LOI}, {VECTEUR}","{VECTEUR} : {ESSENCE}","{LOI} au prix de {MATIERE}","{ESSENCE} sous {MATIERE}","{NOMBRE} fois {LOI}","Ce que {ESSENCE} doit à {MATIERE}","{LOI} de {ESSENCE}, {VECTEUR}","Relevé de {ESSENCE} en {NOMBRE} lignes","{MATIERE} recomptée {NOMBRE} fois","{ESSENCE} divisée en {NOMBRE} parts","{VECTEUR}, et rien d'autre : {LOI}","{LOI} tenue par {NOMBRE} {MATIERE}"],"prefixes":["Rite","Protocole","Article","Office","Registre","Constat","Relevé","Décret","Codicille","Procès-Verbal","Barème","Extrait","Feuillet","Scellé","Inventaire","Mandat","Arrêté","Précis","Cadastre","Bordereau","Répertoire","Recensement","Legs","Ordinaire","Formulaire","Verdict"],"suffixes":["Perpétuel","Exécutoire","Second","Irrévocable","Rétroactif","Nominatif","Opposable","Contradictoire","Immédiat","Différé","Insolvable","Muet","Confidentiel","Définitif","Grégorien","de Nuit","sans Recours","sous Scellé","à Jeun","en Défaut","par Défaut","au Comptant","sans Témoin","de la Main Gauche","à Terme Échu","en Souffrance","sans Provision","à Découvert","de Second Rang","sous Astreinte","en Instance","sans Date"],"titres_joueur":[{"titre":"Première Radiation","condition":"Exorciser un fléau : une victoire enregistrée."},{"titre":"Cinq Dossiers Clos","condition":"Cinq victoires au registre."},{"titre":"Trois Fois Lié","condition":"Porter trois serments gravés en même temps."},{"titre":"Ouvreur de Barrière","condition":"Déployer un territoire au moins une fois."},{"titre":"Inscrit à l'Ossuaire","condition":"Mourir une fois : la fiche reste, l'amputation aussi."},{"titre":"Mauvais Payeur","condition":"Improviser trois serments en plein duel."},{"titre":"Loi Mûre","condition":"Atteindre la maturation 8."},{"titre":"Fonctionnaire de la Descente","condition":"Dix victoires au registre."},{"titre":"Les Quatre Cases","condition":"Valider verbe, substrat, métrique et condition sans une seule annotation rouge."},{"titre":"Engagé à Zéro Case","condition":"Gagner un duel sans avoir validé une seule hypothèse."},{"titre":"Le Blanc","condition":"Faire éclater les deux barrières au même battement : |ΔRAFF| ≤ 2."},{"titre":"Coup Noir","condition":"Toucher dans la fenêtre de 180 ms sur trois duels différents."},{"titre":"L'Œil Fermé","condition":"Achever une descente sous le serment de l'Œil Fermé, jauge adverse amputée."},{"titre":"Greffe Corrompue","condition":"Greffer trois axes hors compatibilité et survivre à la condition involontaire."},{"titre":"Rendu à l'Envers","condition":"Réussir neuf inversées dans une même session, fatigue cumulée comprise."},{"titre":"Sans Trace","condition":"Signer le Serment de la Trace Effacée et détruire le registre pour de bon."},{"titre":"Reçu à l'Examen","condition":"Battre sa propre loi, opérateur inversé, par la faille que ses greffes lui ont fabriquée."},{"titre":"Meilleur Payeur","condition":"Remporter une attrition de territoires en tenant l'entretien deux battements de plus que l'adversaire."}]},"matieres":{"matieres":["cendre de registre  portent le même nom","un escalier de secours enroulé sur lui-même, sans palier d'arrivée","la salle des machines d'un ascenseur, câbles tendus, cabine absente","la cour intérieure d'un immeuble où le linge ne sèche jamais","une salle de tri postal aux casiers vides et aux sacs pleins","un vestiaire d'usine, une seule serrure fermée","une chapelle ardente municipale, quatre chaises, un ventilateur","le parloir d'une maison d'arrêt, hygiaphone rayé au niveau de la bouche","une piscine municipale vidangée, la ligne d'eau encore marquée","un standard téléphonique désaffecté, fiches enfoncées, cordons croisés","une salle des coffres aux portes ouvertes et aux serrures intactes","un couloir d'hôpital avec les chaises alignées face au mur","une salle de classe le jour des résultats, tables numérotées","un grenier à sel où le sol boit les pas","la cabine d'un poste d'aiguillage, tous les leviers en position basse"],"organes":["la fourchette sternale","le sinus carotidien","la moelle du fémur","la septième vertèbre cervicale","le nerf ulnaire, au passage du coude","le plexus cœliaque","la face antérieure du poignet, entre les deux tendons","l'isthme de la thyroïde","le labyrinthe de l'oreille interne","l'arche plantaire","l'os hyoïde, seul os qui ne touche aucun autre","la rate","la coupole gauche du diaphragme","la chaîne ganglionnaire axillaire","la papille optique, là où la rétine ne voit pas","le tendon calcanéen","le tympan droit","la crête iliaque","le nerf phrénique","la voûte palatine","le canal lacrymal","la fosse cubitale","la fontanelle refermée","le maxillaire, à l'implantation des dents de sagesse"]},"formulaire":{"questions":[{"axe":"substrat","numero":1,"intitule":"Substrat déclaré","question":"L'encre de ce registre sèche plus vite du côté où vous êtes assis : dites-moi sur quelle matière du monde votre loi a déjà prise.","precision":"Nous ne demandons pas ce que vous faites. Nous demandons ce qui vous répond en premier, et qui vous a été donné avant que vous sachiez lire.","reponses":[{"tag":"usure","texte":"Ce qui a déjà commencé à céder : la rouille des rampes, les genoux.","consequence":"Aucune prise sur le neuf. Vous serez affecté à des lieux déjà perdus, et vous y resterez longtemps."},{"tag":"compte","texte":"Ce qui est inscrit quelque part : dettes, inventaires, bornages, procès-verbaux.","consequence":"Votre loi ne mord que sur le déclaré. Un anonyme vous résiste entièrement ; un registre faux vous rendra faux."},{"tag":"absence","texte":"Ce qui manque : les sièges vides, les délais échus, les noms qu'on ne dit plus.","consequence":"Nous notons que dans une pièce pleine, vous ne servez à rien. Affectation aux secteurs désertés."},{"tag":"contact","texte":"Ce qui touche, ou vient tout juste de cesser de toucher : l'eau dormante, les seuils.","consequence":"La distance vous désarme. Prévenez vos proches par écrit : on ne vous approche plus sans éveiller la loi."}]},{"axe":"operateur","numero":2,"intitule":"Opération constatée","question":"Quand votre loi s'applique, que fait-elle au réel : en quel verbe la résumeriez-vous devant le greffier ?","precision":"Un verbe suffit. Une technique innée n'obéit pas à son porteur, elle obéit à son énoncé, et c'est l'énoncé que nous enregistrons.","reponses":[{"tag":"retrancher","texte":"Elle ôte. Ce qui passait ne passe plus, et je ne sais pas rouvrir.","consequence":"Verbe soustractif. Aucun porteur de cette famille n'a jamais su rouvrir. On ne vous confiera pas de sauvetage."},{"tag":"echanger","texte":"Elle troque. Ce qui est à l'un passe à l'autre, sans que je choisisse toujours.","consequence":"Un transfert ignore le sens. La loi ignore de quel côté vous vous tenez : vous êtes aussi une destination."},{"tag":"repeter","texte":"Elle recommence. Ce qu'elle a fait une fois, elle le refait en plus grand.","consequence":"Clause d'évacuation préventive du secteur jointe au dossier. Ces lois s'arrêtent rarement à l'heure que le porteur avait prévue."},{"tag":"constater","texte":"Elle mesure. Elle dit ce qui est vrai, et le vrai devient obligatoire.","consequence":"Elle ne crée rien : elle rend irréversible. Vous serez cité comme témoin, votre témoignage tuera, et il sera recevable."}]},{"axe":"portee","numero":3,"intitule":"Portée mesurée","question":"À quelle distance de votre peau le monde cesse-t-il de vous appartenir ?","precision":"Approchez la main de la vitre du guichet ; je note à quel centimètre la buée change de forme. La plupart l'apprennent à l'instant où il leur manque un mètre.","reponses":[{"tag":"contact","texte":"Elle s'arrête à ma peau. Il faut que je touche ; le tissu ne compte pas.","consequence":"Portée nulle. Rien ne se dilue en route, et vous mourrez à l'endroit exact où vous aurez gagné."},{"tag":"courte","texte":"Deux pas. La longueur d'un bras tendu, et un peu de l'air d'après.","consequence":"Deux mètres. Suffisant pour une salle d'interrogatoire, jamais pour une rue. Vous verrez toujours le visage."},{"tag":"moyenne","texte":"Une pièce entière, jusqu'au mur du fond, jamais au-delà de la porte.","consequence":"Douze mètres. Vous restez visible pendant toute l'application, et il y aura des civils dans le champ."},{"tag":"lointaine","texte":"Aussi loin que je vois, à condition que rien ne bouge entre nous.","consequence":"À cette distance la loi arrive fatiguée. Vous frapperez avant de savoir si c'était la bonne personne."}]},{"axe":"condition","numero":4,"intitule":"Clause d'application","question":"Que faut-il, chaque fois, sans exception, pour que votre loi consente à s'appliquer ?","precision":"Toute loi innée possède une serrure ; celles qui n'en ont pas dévorent leur porteur avant ses vingt ans. Ne minimisez pas la vôtre : elle figurera dans notre dossier avant de figurer dans le leur.","reponses":[{"tag":"parole","texte":"Un mot prononcé, entendu, ou seulement reconnu par celui d'en face.","consequence":"Condition orale. On vous bâillonnera d'abord : c'est la première chose qu'ils apprennent, et ils l'apprennent vite."},{"tag":"corps","texte":"Du mien : trois gouttes de sang, un souffle chaud, un repas partagé.","consequence":"Votre corps est un consommable. Nous ouvrons une ligne de ravitaillement à votre nom ; les repas ne sont pas remboursés."},{"tag":"lieu","texte":"Que nous soyons entrés par la même porte, et que je sois entré second.","consequence":"Condition topographique. Clause ajoutée au dossier : vous n'ouvrez jamais les portes vous-même."},{"tag":"trace","texte":"Un objet qui lui a appartenu, une signature, une mesure prise devant témoin.","consequence":"Vous dépendrez des archives, donc de ce bureau, donc de moi. Faites l'inventaire de vos pièces chaque soir."}]},{"axe":"cout","numero":5,"intitule":"Ponction par emploi","question":"Vous portez trois marques anciennes au même avant-bras : dites-moi ce que chaque application vous retire.","precision":"Le Bureau ne juge pas le prix, il l'inscrit, afin de calculer la date de votre remplacement.","reponses":[{"tag":"energie","texte":"De l'énergie maudite, simplement. Ma réserve est large et je récupère vite.","consequence":"Prélèvement banal, réserve large. Vous durerez des années sans jamais surprendre personne. Beaucoup y survivent."},{"tag":"chair","texte":"Peu d'énergie. C'est le corps qui règle : une dent, une phalange froide.","consequence":"Bon marché en énergie. Nous relevons vos empreintes maintenant, tant qu'il vous reste des doigts à relever."},{"tag":"memoire","texte":"Peu d'énergie, mais après coup j'ignore ce que je viens de faire.","consequence":"Économique. Vos rapports seront rédigés par un tiers et signés en blanc. Personne ne vous contredira."},{"tag":"temps","texte":"Plus d'énergie et plus lent. En échange, la loi tombe entière.","consequence":"Il vous faut un temps de préparation, et quelqu'un devra vous l'acheter. Affectation en seconde ligne."}]},{"axe":"cadence","numero":6,"intitule":"Délai d'obéissance","question":"Combien de battements séparent l'énoncé de votre loi de l'obéissance du réel ?","precision":"Je garde deux doigts sur votre poignet pendant que vous répondez : c'est la rubrique où figurent nos morts par impatience.","reponses":[{"tag":"instantane","texte":"Aucun délai. C'est déjà fait quand l'autre comprend que j'ai commencé.","consequence":"Effet sec, amplitude faible. Vous gagnerez souvent, et un peu, sans jamais avoir le temps de vérifier la cible."},{"tag":"differe","texte":"Un battement de retard, et alors bien au-delà.","consequence":"Différé d'une seconde, chronométré à seize reprises. Une seconde suffit pour qu'on vous atteigne d'abord."},{"tag":"continu","texte":"Un peu, sans arrêt, jusqu'à ce que quelque chose cède.","consequence":"Votre travail est une érosion. Missions de plusieurs jours : vous resterez debout pendant que la chose se défait."},{"tag":"cumulatif","texte":"Ça monte. De plus en plus fort, tant que personne ne se protège.","consequence":"Redoutable au troisième palier. Un adversaire informé vous laissera monter, puis coupera : ils lisent nos dossiers aussi."}]},{"axe":"cible","numero":7,"intitule":"Assiette de la cible","question":"Sur qui, ou sur quoi, votre loi porte-t-elle lorsque vous ne choisissez pas ?","precision":"Nous demandons l'assiette, pas l'intention : une loi ne connaît pas son porteur, et aucune intention n'a jamais servi à identifier un corps.","reponses":[{"tag":"unique","texte":"Une seule chose à la fois, mais entièrement, jusqu'à l'intérieur.","consequence":"Cible unique. Le second adversaire vous tuera pendant que vous finissez le premier. Mention portée en marge."},{"tag":"zone","texte":"Tout ce qui se trouve dans la même pièce que moi, sans distinction.","consequence":"Effet de salle. Nous retirons du dossier toute mention d'appui allié rapproché. Vous travaillerez seul jusqu'à la fin."},{"tag":"nomme","texte":"Uniquement ce que j'ai désigné avant, à voix basse, par son nom exact.","consequence":"Une erreur de nom vaut décharge : la loi ira ailleurs, et elle ira quelque part. Nos listes sont parfois fausses."},{"tag":"soi","texte":"Sur moi d'abord. Le reste l'attrape par contagion, s'il est resté près.","consequence":"Vous êtes le foyer, donc le premier corps du périmètre. Celui qui vous portera blessé sera atteint."}]},{"axe":"siege","numero":8,"intitule":"Siège anatomique","question":"À quel endroit faudrait-il vous ouvrir pour trouver votre technique lorsque vous ne l'employez pas ?","precision":"La question n'est pas rhétorique : nos rapports d'autopsie exigent une localisation avant l'incident, jamais après.","reponses":[{"tag":"gorge","texte":"Le larynx, la glotte. L'os hyoïde chauffe avant que je parle.","consequence":"Siège cervical. Une main sur la gorge vous coupe la loi, pas seulement l'air. Enseigné dès la première année."},{"tag":"sang","texte":"Les artères, la moelle, la plèvre qui tire quand il pleut.","consequence":"Vous logez votre loi dans ce que vous perdez le plus vite. Toute plaie ouverte est une fuite."},{"tag":"nerf","texte":"Les nerfs, le plexus, l'oreille interne, un sifflement fixe à gauche.","consequence":"Un bourdonnement prolongé vous rend inexploitable. Aucune affectation en gare, en chantier, ni en manifestation."},{"tag":"os","texte":"Les vertèbres, le fémur, la mâchoire qui craque au réveil.","consequence":"Lente à monter, difficile à éteindre : on devra vous briser. La technique inversée met trois semaines à y revenir."}]},{"axe":"faille","numero":9,"intitule":"Faille déclarée","question":"Par où faudra-t-il vous détruire, le jour où le Bureau devra le faire ?","precision":"Rubrique obligatoire, remplie de votre main : celle que vous déclarez vous est payée, celle que vous cachez sera trouvée par quelqu'un d'autre, et gratuitement.","reponses":[{"tag":"condition_stricte","texte":"Elle refuse parfois, sans prévenir, sans raison. Quand elle accepte, elle emporte tout.","consequence":"Refus intermittent, puissance majorée. Le jour où elle refusera, personne ne le saura avant vous."},{"tag":"epuisement","texte":"Elle me laisse vide au battement suivant. En échange, elle coûte peu.","consequence":"Coût abaissé. Après emploi vous êtes un civil ; vos coéquipiers apprendront à compter ce battement."},{"tag":"retour","texte":"Elle me blesse aussi, à proportion exacte de ce qu'elle inflige.","consequence":"Réciprocité déclarée, puissance rehaussée d'un cran plein. Il suffira de vous laisser gagner."},{"tag":"lisibilite","texte":"Elle se lit. Trois applications suffisent à un adversaire attentif. Mais elle est nette.","consequence":"Vitesse et précision majorées. Mention au dossier : ne pas réengager sur la même affaire. Certains vous ont déjà étudié."}]},{"axe":"territoire","numero":10,"intitule":"Extension déclarée","question":"Si l'on vous poussait ce soir jusqu'à l'extension du territoire, dans quel lieu serions-nous enfermés avec vous ?","precision":"Décrivez le sol, la lumière, l'odeur. Le coup au but ne se décrit pas, il se subit ; nous voulons d'abord le lieu qui le conclut.","reponses":[{"tag":"administration","texte":"Une salle de guichets fermés, des numéros appelés dans le vide, jamais le mien.","consequence":"Votre loi y devient un règlement. On ne discute pas un règlement : vos morts attendront leur tour avant de tomber."},{"tag":"domestique","texte":"Un appartement encore chaud, la table mise pour deux, quelqu'un vient de sortir.","consequence":"L'intrus y sera traité en invité jusqu'au bout. Ceux qui entrent se déchaussent avant de mourir."},{"tag":"transit","texte":"Un parking souterrain, niveau moins trois, une rampe qui ne remonte jamais tout à fait.","consequence":"Les issues existent et se déplacent. Aucune évacuation n'y a jamais été enregistrée."},{"tag":"clinique","texte":"Une salle de conservation à quatre degrés, draps pliés, une civière restée libre.","consequence":"Tout ce qui entre y est mesuré, étiqueté, puis rangé. Votre civière est déjà attribuée."}]}],"titre_formulaire":"Formulaire R-9 : consignation de loi innée avant attribution de grade"},"examen":{"questions":[{"question":"Décrivez la dernière nuit que vous avez passée sans dormir sans que personne ne l'apprenne. Quelle heure indiquait la dernière chose que vous avez regardée, et qu'ont fait vos mains jusqu'au matin ?","precision":"Nous ne consignons pas l'insomnie : elle n'ouvre aucun droit. Nous consignons l'occupation. Six heures de mains inoccupées constituent à elles seules un renseignement.","reponses":[{"texte":"3h40. J'ai repassé des chemises que plus personne ne porterait.","archetype":"répétition","axe":"flux","note":"Repasse le vide. Endurance sans objet."},{"texte":"4h12. J'ai gratté le joint de la douche jusqu'à l'ongle fendu.","archetype":"soustraction","axe":"inversion","note":"Joint propre, ongle fendu. Ordre payé en peau."},{"texte":"5h. J'ai marché huit kilomètres pour être fatigué à l'heure dite.","archetype":"échange","axe":"vigueur","note":"Achète son sommeil au kilomètre."},{"texte":"2h. J'ai relu ses messages jusqu'à en connaître la ponctuation.","archetype":"mesure","axe":"lucidite","note":"Apprend un mort par cœur, virgules comprises."}]},{"question":"Nommez la dernière blessure que vous avez soignée seul plutôt que de la montrer. Quel jour, quel produit, et combien de temps avant que quelqu'un s'en aperçoive ?","precision":"La plaie ne nous intéresse pas, elle se referme. Nous mesurons le délai entre le sang et l'aveu. La technique inversée répare la chair ; ce délai, lui, reste inscrit.","reponses":[{"texte":"Onze jours. Alcool à 70, manches longues en plein mois d'août.","archetype":"seuil","axe":"tranchant","note":"Août, manches longues. La chaleur plutôt que le regard."},{"texte":"Trois heures. Recousu moi-même, fil de cuisine, sans miroir.","archetype":"métamorphose","axe":"inversion","note":"Fil de cuisine. Se répare comme un vêtement."},{"texte":"Personne ne l'a vue. La cicatrice a parlé à ma place, l'été suivant.","archetype":"témoignage","axe":"vigueur","note":"Délègue ses aveux à sa peau."},{"texte":"Deux jours, puis j'ai menti sur la porte du placard.","archetype":"lien","axe":"lucidite","note":"Alibi prêt avant la question."}]},{"question":"Quel geste avez-vous répété plus de mille fois ? Donnez la position exacte de vos doigts, l'endroit précis où cela use, et ce qui se produit le jour où l'on vous en empêche.","precision":"Mille est un seuil administratif. En dessous, nous inscrivons une habitude ; au-dessus, une déformation. Une technique innée hérite toujours de la main qui l'a portée.","reponses":[{"texte":"Serrer une vis. Index corné, la peau morte au bout. Sans chantier, la main cherche.","archetype":"répétition","axe":"vigueur","note":"L'outil a fini par choisir la main."},{"texte":"Trancher, poignet bas, coude collé. J'use l'épaule pour épargner la lame.","archetype":"échange","axe":"tranchant","note":"Épargne l'acier, dépense l'articulation."},{"texte":"Border un lit vide. Ma sœur m'a vu une fois, depuis le couloir.","archetype":"lien","axe":"inversion","note":"Un témoin, aucune question. Le geste continue."},{"texte":"Compter la caisse. Mes doigts comptent encore pendant que je dors.","archetype":"métamorphose","axe":"flux","note":"Compte jusque dans le sommeil. Aucune pause."}]},{"question":"Quelle est la température la plus basse que vous ayez supportée volontairement ? Combien de temps, et que portiez-vous exactement ?","precision":"Volontairement : nous écartons les pannes de chauffage et les nuits d'accident. Un serment ne vaut que par la restriction réellement tenue. Nous vérifions que vous savez tenir.","reponses":[{"texte":"Douches froides depuis l'hiver dernier. Cent quatre-vingts jours, aucune exception.","archetype":"répétition","axe":"vigueur","note":"Aucune exception déclarée. Aucun jour faible."},{"texte":"Moins quatre, deux heures, blouson de toile. J'attendais qu'il sorte.","archetype":"échange","axe":"flux","note":"Deux heures payées en froid. Attente non négociée."},{"texte":"Je dors fenêtre ouverte tout l'hiver. Le froid m'empêche de rêver d'elle.","archetype":"soustraction","axe":"inversion","note":"Retire le rêve. Accepte la facture."},{"texte":"La température exacte où je cesse de sentir mes mains. Je l'ai relevée.","archetype":"métamorphose","axe":"tranchant","note":"Connaît son seuil. L'a franchi seul."}]},{"question":"Quelle somme exacte vous doit-on, que vous n'avez jamais réclamée ? À qui, et depuis quelle année ?","precision":"Vous avez le chiffre. Ceux qui ont oublié le chiffre ne sont pas convoqués jusqu'à ce bureau.","reponses":[{"texte":"Quatre-vingt-dix euros. Mon frère. Je connais encore la date exacte.","archetype":"mesure","axe":"lucidite","note":"Comptabilité intacte. Douze ans sans relance."},{"texte":"Rien en argent. Trois mois de mon temps, donnés deux fois.","archetype":"échange","axe":"flux","note":"Donne, puis facture en silence."},{"texte":"Deux cent quarante euros. Je les ai effacés pour ne plus lui parler.","archetype":"soustraction","axe":"tranchant","note":"Solde les gens comme des lignes."},{"texte":"On ne me doit rien. J'ai payé d'avance pour qu'on ne me demande rien.","archetype":"seuil","axe":"inversion","note":"Achète la paix. Prix jamais négocié."}]},{"question":"Le dernier corps que vous avez vu de près : combien de temps avez-vous tenu la main, et que regardiez-vous pendant ce temps ?","precision":"Nous enregistrons la durée. Le sentiment ne s'enregistre pas ; le formulaire ne comporte aucune case pour lui.","reponses":[{"texte":"Onze minutes. Je regardais la molette du perfuseur, pas son visage.","archetype":"mesure","axe":"lucidite","note":"Regarde le dispositif, jamais la personne."},{"texte":"Je n'ai pas touché. Je suis resté à un mètre, contre le radiateur.","archetype":"seuil","axe":"flux","note":"Se tient à un mètre. Depuis toujours."},{"texte":"Jusqu'à ce que la main refroidisse. Je voulais savoir combien de temps cela prend.","archetype":"témoignage","axe":"vigueur","note":"A obtenu le chiffre. Ne le donne pas."},{"texte":"J'ai parlé fort, sans arrêt, pour couvrir le b éjà le mot."}]},{"question":"Quel mensonge avez-vous dit à un enfant en sachant qu'il le croirait des années ?","precision":"Donnez l'âge de l'enfant. À défaut, nous remplissons la case selon notre estimation, et notre estimation est basse.","reponses":[{"texte":"Que sa mère rentrerait pour son anniversaire. Il avait six ans.","archetype":"lien","axe":"flux","note":"A acheté du temps avec une date."},{"texte":"Que cela ne faisait pas mal. Il m'a cru : je ne tremblais pas.","archetype":"témoignage","axe":"vigueur","note":"Contrôle ses mains avant sa voix."},{"texte":"Que j'avais tout arrangé. J'ai passé l'année à rendre cela vrai.","archetype":"échange","axe":"inversion","note":"Rembourse ses mensonges en travail."},{"texte":"Aucun. Je lui ai tout dit, à sept ans. Il a cessé de dormir.","archetype":"soustraction","axe":"tranchant","note":"Exactitude sans anesthésie. Enfant : sept ans."}]},{"question":"Quelle odeur vous fait reculer d'un pas ? Où l'avez-vous sentie la première fois, et à quel âge ?","precision":"Nommez-la clairement. Une odeur que l'on refuse de nommer revient plus souvent, et plus près.","reponses":[{"texte":"La javel chaude. Un couloir d'hôpital, en août, à onze ans.","archetype":"témoignage","axe":"lucidite","note":"Date, mois, âge. Rien n'a bougé."},{"texte":"Le tabac froid sur un manteau. Je change de trottoir sans y penser.","archetype":"répétition","axe":"flux","note":"Change de trottoir depuis vingt ans."},{"texte":"La mienne, après trois nuits sans sommeil. J'ai appris à la reconnaître.","archetype":"mesure","axe":"vigueur","note":"Se surveille au nez. Persiste quand même."},{"texte":"Le sang. Je ne recule pas ; c'est précisément le problème.","archetype":"métamorphose","axe":"tranchant","note":"Ne recule pas. Consigné comme tel."}]},{"question":"Qui vous a vu faire une chose que vous n'avez expliquée à personne ? Donnez son prénom ou sa fonction, et ce qu'il vous a dit le lendemain.","precision":"Un seul témoin suffit à rendre un fait administratif. En son absence, nous ne pouvons rien inscrire, et l'entretien s'allonge.","reponses":[{"texte":"Une voisine, madame Renaud. Le lendemain, elle m'a dit bonjour comme d'habitude.","archetype":"témoignage","axe":"lucidite","note":"Le silence des voisins vaut verdict."},{"texte":"Mon frère. Il n'a rien dit. Nous n'avons plus jamais dîné ensemble.","archetype":"lien","axe":"tranchant","note":"Coupure nette. Personne n'a rouvert."},{"texte":"Un collègue. Il a proposé de m'aider ; j'ai demandé un autre service.","archetype":"seuil","axe":"inversion","note":"Fuit l'aide plus vite que le danger."},{"texte":"Personne. J'ai attendu qu'il n'y ait personne. C'est cela qui fut long.","archetype":"mesure","axe":"vigueur","note":"A su attendre. Saura recommencer."}]},{"question":"Quand votre main a-t-elle touché quelqu'un pour la dernière fois avec l'intention de lui faire mal ? Date, endroit du corps, et ce que vous avez fait dans la minute qui a suivi.","precision":"La minute suivante nous renseigne davantage que le coup. Beaucoup frappent. Très peu savent dire ce qu'ils ont fait ensuite.","reponses":[{"texte":"14 mars, la mâchoire. J'ai ramassé ses lunettes et je suis parti.","archetype":"seuil","axe":"tranchant","note":"Frappe, puis range. Deux personnes, un corps."},{"texte":"Jamais la main. J'ai dit la phrase qui l'a cassé, à 19h.","archetype":"témoignage","axe":"lucidite","note":"Connaissait la phrase. La gardait en réserve."},{"texte":"Le tremblement est venu quatre heures après. Jamais pendant.","archetype":"métamorphose","axe":"vigueur","note":"Le corps règle ses comptes en différé."},{"texte":"Je me suis lavé les mains onze fois avant de dormir.","archetype":"répétition","axe":"inversion","note":"Onze lavages. La peau a payé."}]}]},"ambiance":{"convocation":["Vous avez franchi la porte de vous-même. C'est le premier élément versé au dossier.","Ne donnez pas votre nom tout de suite. Nous vérifions d'abord qu'il vous appartient encore.","Le dossier est ouvert depuis onze jours. Il porte votre date de naissance, et une seconde date laissée vide.","La salle est maintenue à seize degrés. Ce n'est pas pour votre confort.","Posez les mains à plat sur la table, paumes visibles. Ne les retirez pas quand elles chaufferont.","Vous n'êtes pas venu chercher quelque chose. Vous venez déclarer ce que vous transportez déjà.","Sept personnes se sont assises sur ce siège cette année. Quatre ont été enregistrées.","Nous n'employons pas le mot accueil. Nous employons le mot enregistrement.","Si vous entendez respirer derrière vous, ne vous retournez pas. C'est le greffe.","La procédure dure le temps qu'elle dure. Personne ne vous attend dehors, nous avons vérifié."],"bureau":["Répondez sans réfléchir. Ce que vous corrigez, nous devons le noter deux fois.","Ce n'est pas une opinion que je vous demande. C'est une mesure.","Vous avez marqué un temps. Trois secondes. C'est consigné en marge.","Reprenons la case précédente. Vous l'avez laissée vide, et le vide se remplit tout seul.","N'employez pas le mot pouvoir. Employez le mot loi.","Votre technique ne vous connaît pas. Elle applique. Nous voulons savoir ce qu'elle applique.","Un serment n'est pas une promesse. C'est une amputation dont on garde le reçu.","Détaillez la restriction. Si elle ne vous coûte rien de réel, elle ne vaut rien et je barre la ligne.","Encre noire uniquement. Les stylos bleus ne tiennent pas sur ce papier.","Vous transpirez. La pièce est à seize degrés. C'est une donnée, pas un reproche.","Trois formulaires vous concernent. Deux seulement seront transmis.","Le Haut Conseil ne lit pas les phrases. Il lit les cases.","Décrivez votre extension du territoire par ce qui y est interdit, non par ce qui y est possible.","À l'intérieur de votre domaine, le coup au but ne se refuse pas. Confirmez que vous l'avez compris.","Ne me remerciez pas. Je n'ai encore rien accordé.","Signez en bas. Le paraphe engage la chair, pas l'homme."],"voile":["Rideau demandé sur le secteur. Périmètre
