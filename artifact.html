/* =========================================================================
   RITUEL — interface, socle
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { el, $, $$, chaos, clamp, wait } = JJK.core;

  const UI = {};
  UI.etat = null;              /* l'état de partie, posé par le boot */
  let ecranActif = null;
  let murmureTimer = null;

  /* ---- écrans ---------------------------------------------------------- */
  function scene() { return document.getElementById('stage'); }

  function ecran(id) {
    let n = document.getElementById(id);
    if (!n) { n = el('section', 'ecran'); n.id = id; scene().appendChild(n); }
    return n;
  }

  function montrer(id) {
    $$('.ecran').forEach(e => e.classList.remove('actif'));
    const n = ecran(id);
    n.classList.add('actif');
    ecranActif = id;
    root.scrollTo({ top: 0, behavior: 'smooth' });
    return n;
  }
  function actif() { return ecranActif; }

  /* ---- boutons --------------------------------------------------------- */
  function bouton(texte, cls, fn) {
    const b = el('button', 'btn ' + (cls || ''), texte);
    b.addEventListener('click', e => { if (JJK.audio) JJK.audio.tick(1500, 0.02, 0.05); fn(e); });
    return b;
  }
  function rangee() { return el('div', 'btn-rangee'); }

  /* ---- lignes de rituel ------------------------------------------------ */
  /* La hâte : au premier clic, tout ce qui reste à dire est déjà dit.
     Un rituel qui impose son tempo n'est plus un rituel, c'est une attente. */
  UI.hate = false;
  function calmer() { UI.hate = false; }

  async function dire(parent, texte, opts) {
    const o = opts || {};
    const p = el('p', 'rituel-ligne' + (o.forte ? ' forte' : ''));
    parent.appendChild(p);
    if (UI.hate) {
      p.textContent = texte;
      await wait(24);
      return p;
    }
    const t = JJK.fx.type(p, texte, { speed: o.speed || 19, sound: o.sound !== false });
    UI._enCours = t;
    await t;
    UI._enCours = null;
    if (o.apres && !UI.hate) await wait(o.apres);
    return p;
  }

  function presser() {
    UI.hate = true;
    if (UI._enCours && UI._enCours.skip) UI._enCours.skip();
  }
  /* On ne presse que si quelque chose est en train de se dire : sinon un
     clic sur un bouton emporterait la tirade suivante avant qu'elle existe. */
  document.addEventListener('click', () => { if (UI._enCours) presser(); }, true);
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'Escape') && UI._enCours) presser();
  }, true);

  /* ---- murmures : le décor n'est jamais tout à fait muet --------------- */
  function murmures(on) {
    if (murmureTimer) { clearInterval(murmureTimer); murmureTimer = null; }
    if (!on) return;
    murmureTimer = setInterval(() => {
      if (document.hidden) return;
      const v = ((JJK.CORPUS || {}).voix || {}).murmures || [];
      if (!v.length || Math.random() > 0.55) return;
      const n = el('div', 'murmure-flottant', v[Math.floor(Math.random() * v.length)]);
      n.style.top = chaos.r(12, 82) + 'vh';
      n.style.left = chaos.r(45, 92) + 'vw';
      document.body.appendChild(n);
      if (JJK.audio && Math.random() < 0.35) JJK.audio.whisper(chaos.r(0.5, 1.1));
      setTimeout(() => n.remove(), 13500);
    }, 9000);
  }

  /* ---- le titre de l'onglet parle aussi -------------------------------- */
  const TITRE_BASE = 'RITUEL — 呪法帳';
  function titreOnglet(t) { document.title = t || TITRE_BASE; }
  function titreFurtif(t, ms) {
    titreOnglet(t);
    setTimeout(() => titreOnglet(), ms || 4000);
  }

  /* ---- barre d'état ---------------------------------------------------- */
  function barre() {
    let b = document.getElementById('barre-etat');
    if (b) return b;
    b = el('div'); b.id = 'barre-etat';
    b.innerHTML = '<span id="be-graine">—</span><span id="be-grade"></span><span class="sep"></span>' +
      '<span id="be-registre"></span>';
    const son = el('button', '', 'SON : ON');
    son.id = 'be-son';
    son.addEventListener('click', () => {
      /* Le Serment de l'Oreille Coupée ne se reprend pas : le bouton reste
         là, il refuse simplement d'obéir, et il le dit. */
      if (sonScelle()) { JJK.fx.shake(0.12); majSon(); return; }
      JJK.audio.unlock();
      JJK.audio.toggleMute();
      majSon();
    });
    const reg = bouton('REGISTRE', 'fantome', () => { if (JJK.ecrans) JJK.ecrans.registre(); });
    reg.style.cssText = 'border:0;padding:4px 0;font-size:10px;letter-spacing:.2em;margin:0;color:inherit';
    b.appendChild(son); b.appendChild(reg);
    document.body.appendChild(b);
    majSon();
    return b;
  }

  function sonScelle() {
    const g = JJK.jeu;
    if (g && g.mods && g.mods.coupeSon) return true;
    return !!(JJK.memoire && JJK.memoire.lire().sonCoupe);
  }
  function majSon() {
    const n = document.getElementById('be-son');
    if (!n) return;
    if (sonScelle()) { n.textContent = 'SON : SCELLÉ'; n.style.color = 'var(--sang)'; n.title = "Serment de l'Oreille Coupée."; return; }
    n.style.color = '';
    n.textContent = 'SON : ' + (JJK.audio.isMuted() ? 'OFF' : 'ON');
  }
  function majBarre(o) {
    barre();
    if (o.graine != null) document.getElementById('be-graine').textContent = o.graine ? ('DOSSIER : ' + o.graine.toUpperCase()) : '—';
    if (o.grade != null) document.getElementById('be-grade').textContent = o.grade ? ('GRADE ' + String(o.grade).toUpperCase()) : '';
    if (o.registre != null) document.getElementById('be-registre').textContent = o.registre;
  }

  /* ---- petites fabriques ----------------------------------------------- */
  /* Un titre porte parfois une emphase. el() écrit du texte, pas du balisage :
     sans ce raccourci, la page affichait « Six lois <em>possibles</em> ». */
  function titreRituel(html) {
    const h = el('h1', 'titre-rituel');
    h.innerHTML = String(html);
    return h;
  }

  function bloc(etiquette, contenu, cls) {
    const b = el('div', 'bloc ' + (cls || ''));
    b.appendChild(el('span', 'etiquette', etiquette));
    if (typeof contenu === 'string') {
      const p = el('p', cls === 'loi' ? 'enonce' : '');
      p.textContent = contenu;
      b.appendChild(p);
    } else if (contenu) b.appendChild(contenu);
    return b;
  }

  function stats(paires) {
    const g = el('div', 'grille-stats');
    paires.forEach(([v, k]) => {
      const s = el('div', 'stat');
      s.appendChild(el('b', '', String(v)));
      s.appendChild(el('span', '', k));
      g.appendChild(s);
    });
    return g;
  }

  function pointsDanger(n) {
    const d = el('span', 'danger');
    for (let i = 0; i < 5; i++) d.appendChild(el('i', i < n ? 'on' : ''));
    return d;
  }

  function pioche(liste, def) {
    if (!liste || !liste.length) return def || '';
    return liste[Math.floor(Math.random() * liste.length)];
  }
  function voix(k, def) { return pioche(((JJK.CORPUS || {}).voix || {})[k], def); }

  JJK.ui = {
    ecran, montrer, actif, bouton, rangee, dire, presser, calmer, murmures, titreOnglet, titreFurtif,
    barre, majBarre, majSon, sonScelle, bloc, titreRituel, stats, pointsDanger, pioche, voix, UI,
  };
})(window);

    boite.appendChild(alerte);
    n.appendChild(boite);

    const r = U.rangee();
    const go = U.bouton('Remplir le formulaire', 'rouge', valider);
    go.disabled = true;
    r.appendChild(go);
    /* Le service peut remplir à votre place. C'est plus rapide et c'est pire :
       vous découvrez ce que vous portez sans avoir rien déclaré.          */
    r.appendChild(U.bouton("Laisser le service remplir", '', () => tirageOffice(champ.value.trim())));
    r.appendChild(U.bouton('Reprendre un dossier', 'fantome', reprendre));
    if (reg.epitaphes.length || (reg.fiches || []).length) r.appendChild(U.bouton('Registre', 'fantome', registre));
    n.appendChild(r);

    champ.addEventListener('input', () => {
      go.disabled = champ.value.trim().length < 1;
      if (champ.value.length && Math.random() < 0.22 && JJK.audio) JJK.audio.tick(chaos.r(600, 1800), 0.014, 0.02);
      const g2 = JJK.core.normalizeSeed(champ.value);
      const morts = reg.epitaphes.filter(e => JJK.core.normalizeSeed(e.nom || '') === g2);
      if (g2 && morts.length) {
        alerte.textContent = 'Ce nom figure déjà au registre des pertes' + (morts.length > 1 ? ' (' + morts.length + ' fois)' : '') +
          ' — porteur de « ' + morts[0].technique + ' ».';
        JJK.fx.shake(0.08);
      } else alerte.textContent = '';
    });
    champ.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) valider(); });
    setTimeout(() => champ.focus(), 300);

    async function valider() {
      const v = champ.value.trim();
      if (!v) return;
      JJK.audio.unlock();
      G.porteur = v;
      M().ecrire({ graine: JJK.core.normalizeSeed(v) });
      U.majBarre({ graine: JJK.core.normalizeSeed(v) });
      JJK.fx.pulse(null, null, null, '#b31217', 1.2);
      await wait(280);
      declaration();
    }

    async function tirageOffice(nom) {
      JJK.audio.unlock();
      G.porteur = nom || 'sans nom';
      M().ecrire({ graine: JJK.core.normalizeSeed(G.porteur) });
      U.majBarre({ graine: JJK.core.normalizeSeed(G.porteur) });
      const d = {};
      T().AXES.forEach(a => { d[a.id] = a.tags[Math.floor(Math.random() * a.tags.length)]; });
      G.declaration = d;
      G.poids = { vigueur: 0, flux: 0, tranchant: 0, lucidite: 0, inversion: 0 };
      for (let i = 0; i < 8; i++) {
        const k = T().AXES_CORPS[Math.floor(Math.random() * 5)];
        G.poids[k] = Math.min(8, G.poids[k] + 1);
      }
      G.archetype = T().ARCH_LISTE[Math.floor(Math.random() * T().ARCH_LISTE.length)];
      G.variante = Math.floor(Math.random() * T().VARIANTES);
      assembler();
      JJK.audio.oath();
      JJK.fx.flash('#b31217', 700);
      JJK.fx.shake(0.4);
      await wait(320);
      revelation({ rapide: true, office: true });
    }

    function reprendre() {
      const code = prompt("Numéro de dossier (par exemple R1-B824-01E83) :", '');
      if (!code) return;
      const lu = T().lireDossierCode(code);
      if (!lu) { alerte.textContent = "Ce numéro ne correspond à aucun dossier."; JJK.fx.shake(0.2); return; }
      G.porteur = champ.value.trim() || 'sans nom';
      consultation(lu);
    }
  }

  /* =====================================================================
     2. LA DÉCLARATION — dix rubriques
     ===================================================================== */
  async function declaration() {
    U.calmer();
    const n = U.montrer('ecran-declaration');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.26);
    /* pas de murmures pendant qu'on lit un formulaire : ils passeraient
       par-dessus les questions, et ces questions demandent qu'on les lise */
    U.murmures(false);

    const f = formulaire();
    const questions = f.questions.slice().sort((a, b) => (a.numero || 0) - (b.numero || 0)).slice(0, 10);
    G.declaration = {};

    n.appendChild(el('span', 'etiquette rouge', '術式開示調書 · procès-verbal d\'ouverture de technique'));
    const preface = el('p', 'discret');
    preface.style.cssText = 'max-width:66ch;margin:10px 0 4px';
    preface.textContent = "Énoncer sa technique devant témoin est déjà un serment : vous perdez le secret, et le réel vous rend en efficacité ce que vous cédez en surprise. Le superviseur adjoint tient l'écriture. Il n'a pas de technique ; c'est pour cela qu'on le laisse écouter.";
    n.appendChild(preface);
    const grille = el('div', 'formulaire');

    const gauche = el('div');
    const droite = el('aside', 'feuille');
    const enTete = el('span', 'etiquette');
    enTete.textContent = 'Dossier en cours · 0 / 10';
    droite.appendChild(enTete);
    const lignes = el('div', 'lignes-dossier');
    droite.appendChild(lignes);
    const codeVif = el('div', 'code-dossier');
    codeVif.textContent = '— — — —';
    droite.appendChild(codeVif);

    grille.appendChild(gauche); grille.appendChild(droite);
    n.appendChild(grille);

    const jauge = el('div', 'jauge-rituel');
    questions.forEach(() => jauge.appendChild(el('i')));
    n.appendChild(jauge);

    /* la feuille se remplit à mesure : on voit son dossier se fermer sur soi */
    questions.forEach(q => {
      const l = el('div', 'ligne-dossier');
      l.appendChild(el('b', '', q.intitule || q.axe));
      l.appendChild(el('span', 'valeur', '—'));
      l.dataset.axe = q.axe;
      lignes.appendChild(l);
    });

    for (let i = 0; i < questions.length; i++) {
      const q = questions[i];
      gauche.innerHTML = '';
      const eyebrow = el('div', 'etiquette');
      eyebrow.textContent = 'Rubrique ' + (i + 1) + ' / ' + questions.length + ' · ' + (q.intitule || q.axe);
      gauche.appendChild(eyebrow);
      const h = el('h2', 'question-texte');
      gauche.appendChild(h);
      await JJK.fx.type(h, q.question, { speed: 16 });
      if (q.precision) {
        const p = el('p', 'precision');
        gauche.appendChild(p);
        await JJK.fx.type(p, q.precision, { speed: 12, sound: false });
      }

      const liste = el('div', 'reponses');
      gauche.appendChild(liste);
      const choix = await choisirDansListe(liste, q.reponses, 'consequence');

      const tag = T().tagValide(q.axe, choix.tag) ? choix.tag : T().AXE[q.axe].tags[0];
      G.declaration[q.axe] = tag;
      const rangee = lignes.querySelector('[data-axe="' + q.axe + '"]');
      if (rangee) {
        rangee.classList.add('remplie');
        const ligne = rangee.querySelector('.valeur');
        ligne.textContent = choix.texte;
        ligne.classList.add('inscrite');
      }
      enTete.textContent = 'Dossier en cours · ' + (i + 1) + ' / ' + questions.length;
      jauge.children[i].classList.add('pleine');
      JJK.fx.setIntensity(0.26 + (i / questions.length) * 0.3);
      /* le numéro de dossier se forme sous les yeux du déclarant */
      const partiel = {};
      T().AXES.forEach(a => { partiel[a.id] = G.declaration[a.id] || a.tags[0]; });
      codeVif.textContent = T().codeDeclaration(partiel);
      if (choix.consequence) {
        const note = el('p', 'consequence-inscrite');
        gauche.appendChild(note);
        await JJK.fx.type(note, '↳ ' + choix.consequence, { speed: 11, sound: false });
        await wait(340);
      }
    }

    /* toute rubrique manquante est remplie d'office : un dossier ne reste pas ouvert */
    T().AXES.forEach(a => { if (!G.declaration[a.id]) G.declaration[a.id] = a.tags[0]; });
    examen();
  }

  /* =====================================================================
     3. L'EXAMEN DU PORTEUR
     ===================================================================== */
  async function examen() {
    U.calmer();
    const n = U.montrer('ecran-examen');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.4);

    const src = examenSource().slice();
    for (let i = src.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = src[i]; src[i] = src[j]; src[j] = t; }
    const choisies = src.slice(0, Math.min(8, src.length));

    G.poids = { vigueur: 0, flux: 0, tranchant: 0, lucidite: 0, inversion: 0 };
    G.reponsesExamen = [];
    const compteArch = {};

    n.appendChild(el('span', 'etiquette rouge', '受肉体検査 · examen du réceptacle'));
    const intro = el('p', 'discret');
    intro.style.maxWidth = '64ch';
    intro.textContent = "La technique est enregistrée. Ce qui suit ne la modifiera pas : on établit seulement de quoi votre corps est capable en la portant.";
    n.appendChild(intro);

    const zone = el('div', 'question-bloc');
    n.appendChild(zone);
    const jauge = el('div', 'jauge-rituel');
    choisies.forEach(() => jauge.appendChild(el('i')));
    n.appendChild(jauge);

    const relances = (C().ambiance || {}).bureau || ['Noté.', 'Le dossier vous suit.', 'Poursuivons.'];

    for (let i = 0; i < choisies.length; i++) {
      const q = choisies[i];
      zone.innerHTML = '';
      const h = el('h2', 'question-texte');
      zone.appendChild(h);
      await JJK.fx.type(h, q.question, { speed: 16 });
      if (q.precision) {
        const p = el('p', 'precision');
        zone.appendChild(p);
        await JJK.fx.type(p, q.precision, { speed: 12, sound: false });
      }
      const liste = el('div', 'reponses');
      zone.appendChild(liste);
      const choix = await choisirDansListe(liste, q.reponses, 'note');
      const axe = T().AXES_CORPS.indexOf(choix.axe) >= 0 ? choix.axe : 'vigueur';
      G.poids[axe] = Math.min(8, (G.poids[axe] || 0) + 1);
      const a = choix.archetype || 'seuil';
      compteArch[a] = (compteArch[a] || 0) + 1;
      G.reponsesExamen.push({ axe, archetype: a });
      jauge.children[i].classList.add('pleine');
      if (i < choisies.length - 1) {
        zone.innerHTML = '';
        const t = el('p', 'rituel-ligne forte');
        zone.appendChild(t);
        await JJK.fx.type(t, relances[i % relances.length], { speed: 16 });
        await wait(320);
      }
    }

    G.archetype = Object.keys(compteArch).sort((a, b) => compteArch[b] - compteArch[a])[0] || 'seuil';
    assembler();
    revelation();
  }

  function assembler() {
    G.tech = JJK.forge.forgeDepuisDeclaration(G.declaration, G.variante || 0);
    G.ref = JJK.forge.forgeReceptacle(G.declaration, G.poids, G.tech.jubaku);
    G.corps = appliquerMaturation(G.ref, G.maturation);
    G.mods = JJK.serments.agreger(G.serments, G.ref.profil.mod);
    G.code = T().dossierCode(G.declaration, G.poids, G.archetype, G.variante || 0);
  }

  function appliquerMaturation(ref, m) {
    const c = JSON.parse(JSON.stringify(ref));
    c.attaque = Math.round(c.attaque * (1 + 0.09 * m));
    c.pvMax = Math.round(c.pvMax * (1 + 0.07 * m));
    c.enMax = c.enMax + Math.floor(m / 3);
    c.puissance = Math.round(c.puissance * (1 + 0.08 * m));
    c.crit = Math.min(0.45, c.crit + 0.008 * m);
    return c;
  }

  /* =====================================================================

    const t = G.tech;
    JJK.fx.setHue(t.couleur, '#f2c14e');

    U.majBarre({ grade: g.grade });

    /* toute fiche produite entre au registre : c'est une archive, pas un jeu */
    M().archiver({ code: G.code, nom: t.nom, nomJp: t.nomJp, grade: g.grade, jubaku: !!t.jubaku });

    const dossier = el('div', 'dossier');
    const gauche = corpsDeFiche(t, G.corps, { notes: true });

    /* le numéro de dossier, et de quoi le faire circuler */
    const part = el('div', 'bloc');
    part.appendChild(bandeau('Numéro de dossier', '整理番号'));

      else selectionner(lien);

    /* colonne de droite : sceau, grade, et les commandes du générateur */

    const leg = el('div', 'sceau-legende');
    leg.appendChild(el('div', 'tampon', 'Grade ' + g.grade));

    gl.style.marginTop = '14px';

    leg.appendChild(gl);

    const outils = el('div', 'outils-generateur');
    outils.appendChild(el('span', 'etiquette', '抽選 · tirage'));
    const varLigne = el('p', 'discret');
    varLigne.innerHTML = 'Variante <b class="mono or">' + (t.variante + 1) + '</b> sur ' + T().VARIANTES +
      '. La déclaration fixe les familles ; elle ne fixe pas tout.';
    outils.appendChild(varLigne);
    outils.appendChild(U.bouton('Retirer au sort', 'rouge large', () => {
      G.variante = T().codeVariante((G.variante || 0) + 1);
      assembler();
      revelation({ rapide: true });

    outils.appendChild(U.bouton('Voir six variantes', 'large', galerie));
    outils.appendChild(U.bouton('Modifier une rubrique', 'large', rubriques));

    const r = U.rangee();
    r.appendChild(U.bouton('Prêter serment et descendre', '', serments));
    r.appendChild(U.bouton('Descendre sans rien signer', 'fantome', () => { G.serments = []; assembler(); descente(); }));
    r.appendChild(U.bouton('Refaire une déclaration', 'fantome', declaration));
    n.appendChild(r);
  }

    const n = U.montrer('ecran-rubriques');
    n.innerHTML = '';
    n.appendChild(el('span', 'etiquette rouge', 'Correction · ' + (q.intitule || q.axe)));

      const p = el('p', 'precision');

  /* =====================================================================
     LA FICHE — c'est le produit. Tout le reste sert à l'obtenir.
     ===================================================================== */
  /* Les intitulés viennent du lexique du corpus quand il est présent ;
     la liste ci-dessous reste le repli. */
  function sectionsCanon() {
    const l = ((C().lexique || {}).libelles || {}).sections;
    if (!Array.isArray(l) || !l.length) return null;
    const m = {};
    l.forEach(x => { m[x.cle] = x; });
    return m;
  }
  const SECTIONS_REPLI = [
    { cle: 'loi',      libelle: 'Énoncé de la technique', kanji: '生得術式' },
    { cle: 'constat',  libelle: 'Constat', kanji: '所見' },
    { cle: 'junten',   libelle: 'Application directe', kanji: '術式順転' },
    { cle: 'vecteur',  libelle: 'Clause d\'énonciation', kanji: '発動条件' },
    { cle: 'faille',   libelle: 'Faille structurelle', kanji: '弱点' },
    { cle: 'hanten',   libelle: 'Technique inversée', kanji: '反転術式' },
    { cle: 'maximum',  libelle: 'Technique maximale', kanji: '術式最大' },
    { cle: 'kakucho',  libelle: 'Extension de technique', kanji: '術式拡張' },
    { cle: 'kanri',    libelle: 'Territoire simplifié', kanji: '簡易領域' },
    { cle: 'ryoiki',   libelle: 'Extension du territoire', kanji: '領域展開' },
    { cle: 'kokusen',  libelle: 'Aptitude à l\'Éclair Noir', kanji: '黒閃' },
    { cle: 'jubaku',   libelle: 'Restriction céleste', kanji: '天与呪縛' },
  ];

  const SECTIONS = SECTIONS_REPLI;
  function sec(cle, i, suffixe) {
    const m = sectionsCanon();
    const c = m && m[cle];
    const base = SECTIONS_REPLI[i] || { libelle: cle, kanji: '' };
    return {
      libelle: ((c && c.libelle) || base.libelle) + (suffixe || ''),
      kanji: (c && c.kanji) || base.kanji,
    };
  }

  function bandeau(libelle, kanji, rouge) {
    const b = el('div', 'bandeau-section');
    b.appendChild(el('span', 'etiquette' + (rouge ? ' rouge' : ''), libelle));
    if (kanji) b.appendChild(el('span', 'kanji-section jp', kanji));
    return b;
  }

  function section(libelle, kanji, contenu, cls) {
    const b = el('div', 'bloc ' + (cls || ''));
    b.appendChild(bandeau(libelle, kanji, cls === 'loi'));
    if (typeof contenu === 'string') {
      const p = el('p', cls === 'loi' ? 'enonce' : '');
      p.textContent = contenu;
      b.appendChild(p);
    } else if (contenu) b.appendChild(contenu);
    return b;
  }

  /* Construit la colonne de gauche d'une fiche. Utilisée à la nomination
     comme à la consultation : une fiche est une fiche. */
  function corpsDeFiche(t, corps, opts) {
    const o = opts || {};
    const g = el('div');
    g.appendChild(el('span', 'etiquette rouge', '生得術式 · ' + (t.essence.emotion_source || 'origine non établie')));
    g.appendChild(el('h1', 'nom-technique', t.nom));
    const jl = el('div', 'nom-jp');
    jl.textContent = t.nomJp + ' · ' + t.romaji;
    g.appendChild(jl);
    g.appendChild(el('hr', 'trait'));

    const s0 = sec('loi', 0); g.appendChild(section(s0.libelle, s0.kanji, t.loi.enonce || t.loi.nom, 'loi'));
    const desc = JJK.forge.dossier(t);
    const s1 = sec('constat', 1); if (desc) g.appendChild(section(s1.libelle, s1.kanji, desc));
    const s2 = sec('junten', 2); if (t.junten) g.appendChild(section(s2.libelle, s2.kanji, t.junten));
    if (t.vecteur && t.vecteur.condition) {
      const s3 = sec('vecteur', 3, ' — ' + t.vecteur.nom);
      g.appendChild(section(s3.libelle, s3.kanji, t.vecteur.condition));
    }
    if (!t.tenu.portee) {
      const w = section('Observation du superviseur adjoint', '補助監督所見', "La portée déclarée et la clause d'énonciation ne se rencontrent pas dans le réel. J'ai retenu la clause : c'est elle qui décide où la loi s'applique.");
      w.querySelector('p').style.color = 'var(--sang-vif)';
      g.appendChild(w);
    }
    const s4 = sec('faille', 4); if (t.loi.limite) g.appendChild(section(s4.libelle, s4.kanji, t.loi.limite));
    const s5 = sec('hanten', 5); if (t.hanten) g.appendChild(section(s5.libelle, s5.kanji, t.hanten));
    const s6 = sec('maximum', 6); if (t.maximum) g.appendChild(section(s6.libelle, s6.kanji, t.maximum));

    if (t.kakucho) {
      const d = el('div');
      const h = el('p', 'sous-nom');
      h.textContent = t.kakucho.nom;
      d.appendChild(h);
      if (t.kakucho.kanji) d.appendChild(el('div', 'jp faible', t.kakucho.kanji + (t.kakucho.romaji ? ' · ' + t.kakucho.romaji : '')));
      if (t.kakucho.principe) { const p = el('p'); p.style.marginTop = '10px'; p.textContent = t.kakucho.principe; d.appendChild(p); }
      if (t.kakucho.usage) { const p = el('p', 'discret'); p.textContent = t.kakucho.usage; d.appendChild(p); }
      if (t.kakucho.cout) { const p = el('p', 'cout-ligne'); p.textContent = '↳ ' + t.kakucho.cout; d.appendChild(p); }
      const s7 = sec('kakucho', 7); g.appendChild(section(s7.libelle, s7.kanji, d));
    }

    if (t.kanri) {
      const d = el('div');
      const h = el('p', 'sous-nom');
      h.textContent = t.kanri.nom;
      d.appendChild(h);
      if (t.kanri.kanji) d.appendChild(el('div', 'jp faible', t.kanri.kanji + (t.kanri.romaji ? ' · ' + t.kanri.romaji : '')));
      if (t.kanri.forme) { const p = el('p'); p.style.marginTop = '10px'; p.textContent = t.kanri.forme; d.appendChild(p); }
      if (t.kanri.effet) { const p = el('p', 'discret'); p.textContent = t.kanri.effet; d.appendChild(p); }
      if (t.kanri.limite) { const p = el('p', 'cout-ligne'); p.textContent = '↳ ' + t.kanri.limite; d.appendChild(p); }
      const s8 = sec('kanri', 8); g.appendChild(section(s8.libelle, s8.kanji, d));
    }

    if (t.domaine) {
      const d = el('div');
      const h = el('p', 'sous-nom grand');
      h.textContent = t.domaine.nom_fr;
      d.appendChild(h);
      d.appendChild(el('div', 'jp faible', (t.domaine.nom_jp || '') + ' · ' + (t.domaine.romaji || '')));
      if (t.domaine.paysage) { const p = el('p'); p.style.marginTop = '10px'; p.textContent = t.domaine.paysage; d.appendChild(p); }
      if (t.domaine.incantation) {
        const inc = el('div', 'incantation-fiche');
        String(t.domaine.incantation).replace(/([.;])\s+/g, '$1\n').split(/\n|\s*\/\s*/).filter(Boolean)
          .forEach(v => inc.appendChild(el('p', '', v.trim())));
        d.appendChild(inc);
      }
      if (t.domaine.effet_garanti) {
        const e2 = el('p', 'serif-italique');
        e2.style.cssText = 'margin-top:12px;color:var(--sang-vif)';
        e2.textContent = '↯ Coup au but — ' + t.domaine.effet_garanti;
        d.appendChild(e2);
      }
      if (t.domaine.faille) { const p = el('p', 'cout-ligne'); p.textContent = '↳ ' + t.domaine.faille; d.appendChild(p); }
      const s9 = sec('ryoiki', 9); g.appendChild(section(s9.libelle, s9.kanji, d));
    }

    if (t.kokusen) {
      const d = el('div');
      const h = el('p', 'sous-nom');
      h.textContent = t.kokusen.aptitude;
      d.appendChild(h);
      if (t.kokusen.description) { const p = el('p'); p.style.marginTop = '8px'; p.textContent = t.kokusen.description; d.appendChild(p); }
      const s10 = sec('kokusen', 10); g.appendChild(section(s10.libelle, s10.kanji, d));
    }

    if (t.jubaku) {
      const d = el('div', 'jubaku');
      const h = el('p', 'sous-nom or');
      h.textContent = t.jubaku.nom;
      d.appendChild(h);
      d.appendChild(el('div', 'jp faible', (t.jubaku.kanji || '天与呪縛') + ' · ' + (t.jubaku.romaji || "ten'yo-jubaku")));
      const pv = el('p', 'privation');
      pv.textContent = t.jubaku.privation;
      d.appendChild(pv);
      const cp = el('p', 'contrepartie');
      cp.textContent = t.jubaku.contrepartie;
      d.appendChild(cp);
      if (t.jubaku.constat) { const p = el('p', 'cout-ligne'); p.textContent = '↳ ' + t.jubaku.constat; d.appendChild(p); }
      const mec = el('div', 'echange');
      mec.style.marginTop = '12px';
      mec.appendChild(el('span', 'perte', t.jubaku.perte));
      mec.appendChild(el('span', 'gain', t.jubaku.gain));
      d.appendChild(mec);
      const s11 = sec('jubaku', 11); g.appendChild(section(s11.libelle, s11.kanji, d));
    }

    if (t.contre) {
      const w = section('Neutralisation connue', '対策', t.contre);
      w.querySelector('p').classList.add('discret');
      g.appendChild(w);
    }
    if (t.affectation) {
      const d = el('div');
      const h = el('p', 'sous-nom');
      h.textContent = t.affectation.intitule;
      d.appendChild(h);
      if (t.affectation.motif) { const p = el('p', 'discret'); p.style.marginTop = '6px'; p.textContent = t.affectation.motif; d.appendChild(p); }
      g.appendChild(section('Affectation — 上層部', '任務配属', d));
    }

    if (o.notes && corps && corps.profil) {
      const conseq = el('div', 'bloc');
      conseq.appendChild(bandeau('Conséquences de votre déclaration', '申告', true));
      const ul = el('div', 'notes-formulaire');
      corps.profil.notes.forEach(x => {
        const li = el('div', 'note-formulaire');
        li.appendChild(el('b', '', x.axe));
        li.appendChild(el('span', '', x.note));
        ul.appendChild(li);
      });
      conseq.appendChild(ul);
      g.appendChild(conseq);
    }

    if (corps) {
      const st = corps.stats;
      g.appendChild(U.stats([
        [st.vigueur, 'Vigueur'], [st.flux, 'Flux'], [st.tranchant, 'Tranchant'],
        [st.lucidite, 'Lucidité'], [st.inversion, 'Inversion'],
      ]));
      if (o.chiffres !== false) {
        g.appendChild(U.stats([
          [corps.pvMax, 'Points de vie'], [corps.enMax, '呪力 max'],
          [corps.attaque, 'Attaque'], [Math.round(corps.crit * 100) + '%', 'Critique'],
          [corps.puissance, 'Puissance'],
        ]));
      }
    }
    return g;
  }

  function lienDe(code) { return location.href.split('#')[0] + '#d=' + encodeURIComponent(code); }
  function selectionner(node) {
    try {
      const r = document.createRange(); r.selectNodeContents(node);
      const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r);
    } catch (e) {}
  }

  /* =====================================================================
     CONSULTATION — on arrive par un numéro de dossier
     ===================================================================== */
  async function consultation(lu) {
    U.calmer();
    const n = U.montrer('ecran-consultation');
    n.innerHTML = '';
    const tech = JJK.forge.forgeDepuisDeclaration(lu.declaration, lu.variante || 0);
    const ref = JJK.forge.forgeReceptacle(lu.declaration, lu.poids, tech.jubaku);
    JJK.fx.setHue(tech.couleur, '#f2c14e');
    JJK.fx.setIntensity(0.4);

    const flux = el('div');
    n.appendChild(flux);
    await U.dire(flux, "On vous a communiqué un numéro de dossier.", { apres: 300 });
    await U.dire(flux, "Le service ne fabrique rien. Il ressort la fiche.", { forte: true, apres: 340 });
    JJK.audio.oath();
    JJK.fx.flash('#b31217', 800);
    await wait(380);
    flux.remove();

    const d = el('div', 'dossier');
    const gauche = corpsDeFiche(tech, ref, { notes: false, chiffres: false });
    const decl = el('div', 'bloc');
    decl.appendChild(bandeau('Déclaration enregistrée', '申告'));
    const dl = el('div', 'notes-formulaire');
    const f = formulaire();
    T().AXES.forEach(a => {
      const q = f.questions.find(x => x.axe === a.id);
      const rep = q && (q.reponses || []).find(x => x.tag === lu.declaration[a.id]);
      const li = el('div', 'note-formulaire');
      li.appendChild(el('b', '', (q && q.intitule) || a.id));
      li.appendChild(el('span', '', rep ? rep.texte : String(lu.declaration[a.id]).replace(/_/g, ' ')));
      dl.appendChild(li);
    });
    decl.appendChild(dl);
    gauche.appendChild(decl);
    d.appendChild(gauche);

    const dr = el('div', 'sceau-boite');
    const cvs = el('canvas', 'sceau-rot');
    cvs.style.width = '100%';
    dr.appendChild(cvs);
    const lg = el('p', 'discret centre');
    lg.style.marginTop = '14px';
    lg.textContent = 'Dossier ' + T().dossierCode(lu.declaration, lu.poids, lu.archetype, lu.variante || 0);
    dr.appendChild(lg);
    d.appendChild(dr);
    n.appendChild(d);
    requestAnimationFrame(() => JJK.fx.sigil(cvs, tech.code, { size: cvs.clientWidth || 320, accent: tech.couleur }));

    const r = U.rangee();
    r.appendChild(U.bouton('Reprendre ce dossier', 'rouge', () => {
      if (history.replaceState) history.replaceState(null, '', location.href.split('#')[0]);
      G.declaration = lu.declaration; G.poids = lu.poids; G.archetype = lu.archetype;
      G.variante = lu.variante || 0;
      if (!G.porteur) G.porteur = 'sans nom';
      assembler();
      revelation({ rapide: true });
    }));
    r.appendChild(U.bouton('Ouvrir mon propre dossier', 'fantome', () => {
      if (history.replaceState) history.replaceState(null, '', location.href.split('#')[0]);
      seuil();
    }));
    n.appendChild(r);
  }

  /* =====================================================================
     5. LES SERMENTS
     ===================================================================== */
  function capSerments() { return Math.min(5, 3 + Math.floor(G.maturation / 4)); }

  async function serments() {
    U.calmer();
    const n = U.montrer('ecran-serments');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.4);
    G.catalogue = G.catalogue.length ? G.catalogue : JJK.serments.catalogue(G.tech.code);
    G.serments = G.serments || [];
    const cap = capSerments();
    while (G.serments.length > cap) G.serments.pop();

    n.appendChild(el('span', 'etiquette rouge', '縛り · serments contraignants'));
    n.appendChild(U.titreRituel('Ce que vous <em>rendez</em>'));
    const p = el('p');
    p.style.cssText = 'max-width:62ch;font-weight:300;color:var(--os-faible)';
    p.textContent = "Un serment n'est pas une amélioration : c'est une amputation payée d'avance. Vous perdez réellement ce qui est écrit, dans ce jeu, tout de suite. " +
      (cap > 3 ? "Vous êtes descendu assez bas pour qu'on vous en laisse signer " + cap + "." : "Trois pour l'instant. Plus bas, on vous en laissera davantage.");
    n.appendChild(p);

    const compteur = el('p', 'etiquette');
    compteur.style.marginTop = '18px';
    n.appendChild(compteur);
    const liste = el('div');
    liste.style.marginTop = '18px';
    n.appendChild(liste);

    const r = U.rangee();
    const suite = U.bouton('Descendre', 'rouge', () => {
      assembler();
      if (G.mods.coupeSon) { JJK.audio.toggleMute(true); M().ecrire({ sonCoupe: true }); }
      U.majSon();
      M().ecrire({ serments: G.serments.map(s => s.id) });
      descente();
    });
    r.appendChild(suite);
    n.appendChild(r);

    function maj() {
      const reste = cap - G.serments.length;
      compteur.textContent = reste > 0 ? (reste + ' serment' + (reste > 1 ? 's' : '') + ' encore possible' + (reste > 1 ? 's' : '')) : 'Le contrat est plein.';
      liste.innerHTML = '';
      G.catalogue.forEach(s => {
        const signe = G.serments.indexOf(s) >= 0;
        const c = el('div', 'contrat' + (signe ? ' signe' : ''));
        c.appendChild(el('h4', '', s.nom));
        c.appendChild(el('p', 'clause', '« ' + s.clause + ' »'));
        const e = el('div', 'echange');
        e.appendChild(el('span', 'perte', s.perte));
        e.appendChild(el('span', 'gain', s.gain));
        e.appendChild(U.pointsDanger(s.danger));
        c.appendChild(e);
        c.addEventListener('click', () => {
          if (signe) { G.serments.splice(G.serments.indexOf(s), 1); JJK.audio.tick(300, 0.08, 0.06); maj(); return; }
          if (G.serments.length >= cap) { JJK.fx.shake(0.15); return; }
          G.serments.push(s);
          JJK.audio.oath(); JJK.fx.invert(140); JJK.fx.flash('#b31217', 700);
          JJK.fx.shake(0.5); JJK.fx.slash('#b31217', 1); JJK.fx.ink(null, null, 0.5, '#b31217');
          U.titreFurtif('SIGNÉ — ' + s.nom, 4500);
          maj();
        });
        liste.appendChild(c);
      });
      suite.textContent = G.serments.length ? 'Descendre avec ' + G.serments.length + ' serment' + (G.serments.length > 1 ? 's' : '') : 'Descendre les mains libres';
    }
    maj();
  }

  /* =====================================================================
     6. LA DESCENTE
     ===================================================================== */
  const ORDRE = ['4', '4', '3', '3', '2', '2', '1', '1', 'semi-spécial', 'semi-spécial', 'spécial'];
  function gradeCible(i) { return ORDRE[Math.min(i, ORDRE.length - 1)]; }
  function courbe(i) { return 1 + i * 0.11; }

  function descente() {
    const n = U.montrer('ecran-descente');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.35);
    U.murmures(true);
    if (!G.mods) assembler();
    G.corps = appliquerMaturation(G.ref, G.maturation);
    const g = JJK.forge.grade(G.corps.puissance, G.serments.length);
    G.grade = g;
    U.majBarre({ grade: g.grade, registre: 'DESCENTE ' + (G.descente + 1) + ' · ' + M().lire().morts + ' MORT(S)' });

    const missions = (C().ambiance || {}).missions || [];
    const mission = missions.length ? missions[(G.descente + Math.floor(Math.random() * missions.length)) % missions.length] : null;

    n.appendChild(el('span', 'etiquette rouge', '任務 · ordre de mission ' + (G.descente + 1)));
    n.appendChild(U.titreRituel('Ce qui vous <em>ouvrira</em>'));

    if (mission) {
      const m = el('div', 'ordre-mission');
      m.appendChild(el('div', 'etiquette', '帳 · secteur à voiler'));
      m.appendChild(el('p', 'lieu-mission', mission.lieu));
      m.appendChild(el('p', 'signalement', mission.signalement));
      if (mission.consigne) m.appendChild(el('p', 'consigne', '« ' + mission.consigne + ' »'));
      n.appendChild(m);
    }

    const info = el('p', 'discret');
    info.style.maxWidth = '64ch';
    info.textContent = (G.porteur || 'Sans nom') + ', porteur de « ' + G.tech.nom + ' ». ' + G.corps.pvMax + ' points de vie, ' +
      G.corps.attaque + " d'attaque, " + G.serments.length + ' serment(s). Maturation ' + G.maturation + '. Dossier ' + G.code + '.';
    n.appendChild(info);
    n.appendChild(el('hr', 'trait'));

    const gr = gradeCible(G.descente);
    const bes = ((C().bestiaire || {}).fleaux) || [];
    const pool = bes.filter(f => String(f.grade) === gr);
    const choix = (pool.length ? pool : bes).slice();
    for (let i = choix.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = choix[i]; choix[i] = choix[j]; choix[j] = t; }
    let trois = choix.slice(0, 3);
    if (!trois.length) trois = [{ id: 'vide', nom: "Quelque chose qui n'a pas de nom", grade: gr, apparence: '', origine: '', replique: '…' }];

    const rev = M().revenant();
    const grille = el('div');
    grille.style.cssText = 'display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))';
    trois.forEach(f => grille.appendChild(carteFleau(f, false)));
    if (rev) grille.appendChild(carteFleau(rev, true));
    n.appendChild(grille);

    const r = U.rangee();
    r.appendChild(U.bouton('Revoir le dossier', 'fantome', revelation));
    r.appendChild(U.bouton('Modifier les serments', 'fantome', serments));
    r.appendChild(U.bouton('Registre', 'fantome', registre));
    n.appendChild(r);

    function carteFleau(f, estRevenant) {
      const c = el('div', 'contrat');
      if (estRevenant) c.style.borderColor = 'rgba(242,193,78,.5)';
      c.appendChild(el('h4', '', f.nom));
      const sg = el('div', 'etiquette' + (estRevenant ? ' or' : ''));
      sg.textContent = '呪霊 · grade ' + (f.grade || '?') + (estRevenant ? ' · revenant' : '');
      c.appendChild(sg);
      if (f.apparence) { const p2 = el('p', 'clause'); p2.style.marginTop = '10px'; p2.textContent = f.apparence; c.appendChild(p2); }
      if (f.origine) { const p3 = el('p', 'discret'); p3.textContent = 'Né de : ' + f.origine; c.appendChild(p3); }
      c.addEventListener('click', async () => {
        JJK.audio.tick(400, 0.06, 0.08);
        /* on abaisse le Voile sur le secteur : dehors, personne ne verra rien */
        await JJK.fx.voile({
          texte: amb('voile', "Le Voile tombe sur le secteur. Dehors, la rue continue sans savoir."),
          tenue: 820,
          pendant: () => JJK.duel.lancer(f, { courbe: courbe(G.descente), revenant: estRevenant }),
        });
      });
      return c;
    }
  }

  /* =====================================================================
     7. LE REGISTRE
     ===================================================================== */

        l.appendChild(t);
      });
      n.appendChild(l);
    }

/* ==== 78-duel.js ==== */
/* =========================================================================
   RITUEL — mise en scène du duel
   Le moteur décide. Ici, on ne fait que regarder ce qu'il a décidé,
   d'assez près pour que ça fasse quelque chose.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { el, clamp, wait, chaos } = JJK.core;
  const U = JJK.ui;

  let D = null, N = {}, verrou = false;
  function G() { return JJK.jeu; }
  function M() { return JJK.memoire; }
  function C() { return JJK.CORPUS || {}; }

  /* ---- lancement -------------------------------------------------------- */
  function lancer(fleau, opts) {
    const g = G();
    const o = opts || {};
    g.corps = JJK.ecrans.appliquerMaturation(g.ref, g.maturation);
    if (!g.mods) JJK.ecrans.assembler();

    const joueur = JJK.combat.combattantJoueur(g.tech, g.corps, g.mods, g.porteur);
    const R = new JJK.core.Rng('fleau:' + (fleau.id || fleau.nom) + ':' + g.descente);
    const ennemi = JJK.combat.combattantFleau(fleau, g.ref, R, o.courbe || 1);
    if (o.revenant) {
      /* Le revenant hérite de ta loi. Il sait donc s'en servir. */
      ennemi.archetype = fleau.archetype || 'seuil';
      ennemi.domaine = g.tech.domaine;
      ennemi.profil = JJK.combat.profilDe(fleau.grade);
      ennemi.attaque = Math.round(ennemi.attaque * 1.10);
    }
    D = JJK.combat.creer({ seed: g.tech.code, joueur, ennemi, numero: g.descente });
    N.decor = null;
    JJK.fx.domainClose();
    document.body.classList.remove('domaine-calme');
    const boite = document.getElementById('territoire');
    if (boite) { boite.classList.remove('actif'); boite.innerHTML = ''; }
    D.revenant = !!o.revenant;
    D.fleau = fleau;
    M().ecrire({ descentes: M().lire().descentes + 1 });
    dessiner();
    ouverture(fleau);
  }

  async function ouverture(fleau) {
    JJK.fx.setIntensity(0.55);
    JJK.fx.setHue(D.revenant ? '#f2c14e' : (G().tech.couleur || '#b31217'), '#f2c14e');
    JJK.audio.heartbeat(true, 66);
    journal(fleau.replique ? '« ' + fleau.replique + ' »' : '…', 'important');
    if (fleau.comportement) journal(fleau.comportement, '');
    JJK.fx.shake(0.3);
    JJK.fx.pulse(null, null, null, '#b31217', 1.1);
    if (D.revenant) {
      U.titreFurtif('IL PORTE TON NOM', 5000);
      JJK.fx.invert(180);
      JJK.audio.whisper(1.4);
    }
  }

  /* ---- rendu ------------------------------------------------------------ */
  function dessiner() {
    const n = U.montrer('ecran-duel');
    n.innerHTML = '';
    const g = G();

    const arene = el('div', 'arene');
    const cb = el('div', 'combattants');

    N.joueur = fiche(D.joueur, false);
    N.tour = el('div', 'versus centre');
    N.ennemi = fiche(D.ennemi, true);
    cb.appendChild(N.joueur.boite); cb.appendChild(N.tour); cb.appendChild(N.ennemi.boite);
    arene.appendChild(cb);

    const bas = el('div', 'duel-bas');
    N.actions = el('div', 'actions');
    bas.appendChild(N.actions);

    const colJ = el('div');
    N.journal = el('div', 'journal');
    N.journal.appendChild(el('span', 'etiquette', '報告書 · compte rendu'));
    colJ.appendChild(N.journal);
    bas.appendChild(colJ);
    arene.appendChild(bas);

    if (g.mods.masqueJournal) {
      JJK.fx.mutilate(N.journal, 'page blanche — serment');
      N.journal.style.minHeight = '54px';
    }

    n.appendChild(arene);
    majTout();
  }

  function fiche(c, ennemi) {
    const b = el('div', 'fiche' + (ennemi ? ' ennemi' : ''));
    const nom = el('div', 'nom', c.nom);
    const sous = el('div', 'sous', c.sousTitre || '');
    b.appendChild(nom); b.appendChild(sous);

    const pv = el('div', 'barre pv');
    const fant = el('i', 'fantomatique'); fant.style.position = 'absolute';
    const rempl = el('i');
    pv.appendChild(fant); pv.appendChild(rempl);
    b.appendChild(pv);
    const ch = el('div', 'chiffres');
    const gaucheN = el('span'), droiteN = el('span');
    ch.appendChild(gaucheN); ch.appendChild(droiteN);
    b.appendChild(ch);

    const en = el('div', 'barre energie');
    const enR = el('i');
    en.appendChild(enR);
    b.appendChild(en);
    const ch2 = el('div', 'chiffres');
    const e1 = el('span'), e2 = el('span');
    ch2.appendChild(e1); ch2.appendChild(e2);
    b.appendChild(ch2);

    const st = el('div', 'statuts');
    b.appendChild(st);

    if (ennemi && D.fleau && D.fleau.replique) {
      b.appendChild(el('p', 'replique', '« ' + D.fleau.replique + ' »'));
    }

    const o = { boite: b, nom, sous, pv, rempl, fant, gaucheN, droiteN, enR, e1, e2, st };
    if (ennemi && G().mods.masqueVieEnnemi) {
      const cache = el('div');
      cache.appendChild(pv); cache.appendChild(ch);
      b.insertBefore(cache, en);
      JJK.fx.mutilate(cache, 'œil fermé — serment');
      o.cache = cache;
    }
    return o;
  }

  function majFiche(o, c, ennemi) {
    const p = clamp(c.pv / c.pvMax, 0, 1);
    o.rempl.style.width = (p * 100) + '%';
    setTimeout(() => { o.fant.style.width = (p * 100) + '%'; }, 30);
    o.gaucheN.textContent = ennemi && G().mods.masqueVieEnnemi ? '— / —' : (Math.max(0, c.pv) + ' / ' + c.pvMax);
    o.droiteN.textContent = 'TENSION ' + Math.round(c.tension) + (c.tension >= 100 ? ' ↯' : '');
    o.enR.style.width = clamp(c.en / c.enMax, 0, 1) * 100 + '%';
    o.e1.textContent = '呪力 ' + c.en + ' / ' + c.enMax;
    o.e2.textContent = c.domaineTours > 0 ? '領域 ' + c.domaineTours : '';
    o.st.innerHTML = '';
    c.statuts.forEach(s => {
      const t = el('span', 'puce ' + (s.type === 'bon' ? 'bon' : 'mauvais'),
        s.nom + (s.tours < 90 ? ' ' + s.tours : ''));
      t.title = (JJK.combat.STATUTS[s.id] || {}).desc || '';
      o.st.appendChild(t);
    });
  }

  function majTout() {
    majFiche(N.joueur, D.joueur, false);
    majFiche(N.ennemi, D.ennemi, true);
    N.tour.textContent = 'TOUR ' + D.tour;
    majActions();
  }

  function majActions() {
    N.actions.innerHTML = '';
    D.actions().forEach(a => {
      const b = el('button', 'acte' + (a.ultime ? ' ultime' : ''));
      const c = el('span', 'cout', a.cout ? a.cout + ' 呪力' : '—');
      b.appendChild(c);
      b.appendChild(el('b', '', a.nom));
      if (a.sous) b.appendChild(el('small', '', a.sous));
      const d = el('small');
      d.style.cssText = 'display:block;margin-top:6px;font-family:var(--serif);font-size:.92rem;letter-spacing:0;text-transform:none;color:var(--os-mort)';
      d.textContent = a.ok ? a.desc : a.raison;
      b.appendChild(d);
      b.disabled = !a.ok || verrou;
      if (a.interdit) { b.classList.add('mutilated'); b.setAttribute('data-scar', 'retiré par serment'); }
      b.addEventListener('click', () => jouer(a.id));
      N.actions.appendChild(b);
    });
  }

  function journal(texte, cls) {
    if (!N.journal) return;
    const m = G().mods || {};
    if (m.masqueJournal) return;
    /* prélèvement déclaré sur la mémoire : le compte rendu se troue */
    if (m.journalTrouble && Math.random() < 0.45) {
      const p0 = el('p', 'troue');
      p0.textContent = '……';
      N.journal.appendChild(p0);
      N.journal.scrollTop = N.journal.scrollHeight;
      return;
    }
    const p = el('p', cls || '');
    p.innerHTML = texte;
    N.journal.appendChild(p);
    N.journal.scrollTop = N.journal.scrollHeight;
    while (N.journal.children.length > 61) N.journal.removeChild(N.journal.children[1]);
  }

  /* ---- jouer un tour ---------------------------------------------------- */
  async function jouer(id) {
    if (verrou || D.fini) return;
    verrou = true; majActions();
    const ev = D.jouer(id);
    for (let i = 0; i < ev.length; i++) {
      await mettreEnScene(ev[i]);
    }
    if (!D.fini) majDecor();
    majTout();
    verrou = false; majActions();
  }

  const NOM = c => (c === 'joueur' ? (D.joueur.nom || 'Toi') : D.ennemi.nom);

  /* Le décor du territoire est déduit de l'état du duel, jamais posé et
     retiré à la main : deux extensions peuvent se chevaucher, l'une peut
     se briser pendant que l'autre tient, et la précédente version fermait
     le décor de quelqu'un d'autre. */
  function majDecor() {
    const cote = D.joueur.domaineTours > 0 ? 'joueur' : (D.ennemi.domaineTours > 0 ? 'ennemi' : null);
    if (!cote) {
      JJK.fx.domainClose();
      document.body.classList.remove('domaine-calme');
      return;
    }
    const d = N.decor && N.decor[cote];
    if (d) JJK.fx.domainOpen(d);
    document.body.classList.add('domaine-calme');
  }

  async function mettreEnScene(e) {
    const g = G();
    switch (e.t) {
      case 'acte':
        journal('<span class="mono mort">' + (e.qui === 'joueur' ? '▸' : '◂') + '</span> ' +
          NOM(e.qui) + ' — <span class="important">' + esc(e.nom) + '</span>',
          e.qui === 'joueur' ? '' : 'mal');
        await wait(200);
        break;

      case 'degats': {
        const cible = e.cible === 'joueur' ? N.joueur : N.ennemi;
        const c = e.cible === 'joueur' ? D.joueur : D.ennemi;
        cible.boite.classList.remove('frappe');
        void cible.boite.offsetWidth;
        cible.boite.classList.add('frappe');
        if (e.kokusen) {
          /* 黒閃 : l'espace se fend. On s'arrête un instant. */
          JJK.fx.eclair();
          JJK.audio.hit(1.6); JJK.audio.slash();
          JJK.fx.pulse(null, null, 1100, '#ffffff', 2);
          U.titreFurtif('黒閃', 3000);
          await wait(520);
        }
        JJK.audio.hit(e.gros ? 1.4 : (e.crit ? 1.0 : 0.55));
        if (e.gros) { JJK.fx.slash('#fff6ee', 2); JJK.audio.slash(); }
        JJK.fx.shake(e.gros ? 0.9 : (e.crit ? 0.45 : 0.22));
        JJK.fx.pulse(null, null, e.gros ? 900 : 320, e.cible === 'joueur' ? '#b31217' : (g.tech.couleur || '#b31217'), e.gros ? 1.6 : 0.8);
        if (e.cible === 'joueur') {
          const grav = clamp(e.montant / D.joueur.pvMax, 0, 1);
          JJK.fx.ink(chaos.r(0.15, 0.85) * JJK.fx.size.W, chaos.r(0.15, 0.85) * JJK.fx.size.H, 0.25 + grav * 1.4, '#b31217');
          M().ecrire({ degatsSubis: M().lire().degatsSubis + e.montant });
        } else {
          M().ecrire({ degatsInfliges: M().lire().degatsInfliges + e.montant });
        }
        const masque = e.cible === 'ennemi' && g.mods.masqueVieEnnemi;
        const chiffre = masque ? '—' : e.montant;
        journal((e.dot ? '· ' : '') + NOM(e.cible === 'joueur' ? 'joueur' : 'ennemi') + ' ' + esc(e.verbe || 'encaisse') +
          ' <span class="n">' + chiffre + '</span>' +
          (e.kokusen ? ' <span class="mono kokusen">黒閃 ÉCLAIR NOIR ×2,5</span>' : (e.crit ? ' <span class="mono sang">CRITIQUE</span>' : '')) +
          (e.surAuBut ? ' <span class="mono or">COUP AU BUT</span>' : '') +
          (e.echo ? ' <span class="mono">ÉCHO</span>' : ''),
          e.cible === 'joueur' ? 'mal' : 'bien');
        majFiche(cible, c, e.cible === 'ennemi');
        await wait(e.gros ? 420 : 240);
        break;
      }

      case 'soin': {
        JJK.audio.heal();
        JJK.fx.inkFade(0.22);
        journal(NOM(e.qui) + ' recoud <span class="n">+' + e.montant + '</span>', 'bien');
        /* cercle inverse : la même énergie, prise à l'envers */
        if (e.qui === 'joueur') {
          const l = U.pioche(((C().ambiance || {}).inverse) || [], '');
          if (l && Math.random() < 0.55) journal(esc(l), '');
        }
        majTout();
        await wait(280);
        break;
      }

      case 'statut': {
        const s = JJK.combat.STATUTS[e.id] || { nom: e.id };
        journal('<span class="mono">' + s.nom.toUpperCase() + '</span> sur ' + NOM(e.qui), '');
        JJK.audio.tick(520, 0.05, 0.05);
        majTout();
        await wait(150);
        break;
      }
      case 'statutFin': break;

      case 'revele':
        journal('Tu lis son flux : il prépare <span class="important">' + esc(nomIntention(e.intention)) + '</span>.', 'bien');
        await wait(260);
        break;

      case 'serment':
        JJK.audio.oath();
        JJK.fx.invert(150); JJK.fx.slash('#b31217', 1);
        JJK.fx.ink(null, null, 1.1, '#b31217');
        JJK.fx.shake(0.6);
        M().ecrire({ sermentsPretes: M().lire().sermentsPretes + 1 });
        journal('Serment improvisé. Tu abandonnes <span class="n">' + e.prix + '</span> points de vie ici, sur place.', 'mal');
        await wait(600);
        break;

      case 'chair':
        JJK.audio.slash();
        JJK.fx.ink(null, null, 0.6, '#b31217');
        JJK.fx.shake(0.2);
        journal("Le prélèvement se fait sur la chair : <span class=\"n\">−" + e.montant + '</span>.', 'mal');
        majTout();
        await wait(240);
        break;

      case 'retour':
        JJK.fx.shake(0.16);
        journal('La loi ne distingue pas son porteur : <span class="n">−' + e.montant + '</span> en retour.', 'mal');
        majTout();
        await wait(200);
        break;

      case 'rate':
        JJK.audio.tick(180, 0.09, 0.07);
        JJK.fx.shake(0.12);
        journal('<span class="mono sang">LA LOI REFUSE.</span> Elle ne s\'applique pas ce battement-ci.', 'mal');
        await wait(420);
        break;

      case 'differe':
        JJK.audio.tick(300, 0.07, 0.05);
        journal('La loi est énoncée. Elle tombera au battement suivant.', 'important');
        majTout();
        await wait(280);
        break;

      case 'second':
        journal('<span class="mono sang">ET ENCORE UNE FOIS.</span>', 'mal');
        JJK.fx.shake(0.35);
        await wait(260);
        break;

      case 'ponction':
        JJK.audio.whisper(0.5);
        journal(NOM(e.qui) + ' te prend <span class="n">' + e.montant + '</span> d\'énergie maudite.', 'mal');
        majTout();
        await wait(240);
        break;

      case 'kanri':
        JJK.audio.tick(340, 0.10, 0.07);
        JJK.fx.pulse(null, null, 420, '#7fe3ff', 1.2);
        journal('<span class="mono or">簡易領域</span> — la frontière tient. Le coup au but ne passe pas entier.', 'bien');
        await wait(320);
        break;

      case 'sursis':
        JJK.fx.flash('#f2c14e', 500);
        journal(NOM(e.qui) + ' aurait dû tomber. <span class="or">Sursis.</span>', 'important');
        await wait(400);
        break;

      case 'domaine':
        await sequenceDomaine(e);
        break;

      case 'clash':
        await sequenceClash(e);
        break;

      case 'domaineBrise':
        JJK.fx.flash('#fff', 900);
        JJK.fx.invert(260);
        JJK.fx.shake(1.4);
        JJK.fx.slash('#fff6ee', 4);
        JJK.audio.hit(1.6);
        majDecor();
        journal('<span class="mono sang">TERRITOIRE BRISÉ</span> — ' + NOM(e.perdant) + ' encaisse <span class="n">' + e.degats + '</span>.', 'important');
        await wait(900);
        break;

      case 'brise':
        JJK.fx.flash('#fff', 1100);
        JJK.fx.shake(1.6);
        majDecor();
        journal('<span class="mono sang">LES DEUX TERRITOIRES SE FENDENT.</span>', 'important');
        await wait(900);
        break;

      case 'domaineFerme':
        journal('Le territoire de ' + NOM(e.qui) + ' se referme.', '');
        majDecor();
        await wait(200);
        break;

      case 'fuite':
        if (e.reussie) { journal('Tu romps le contact. ' + U.voix('domaine_brise', 'La chose te regarde partir.'), 'important'); }
        else journal('Impossible. Il y a quelque chose entre toi et la sortie.', 'mal');
        await wait(400);
        break;

      case 'sablier':
        JJK.fx.invert(600); JJK.fx.flash('#b31217', 1200); JJK.fx.shake(1.5);
        journal('<span class="mono sang">TOUR ' + (e.limite + 1) + '.</span> Ton serment arrive à échéance. Tu t\'écroules de toi-même.', 'mal');
        await wait(1100);
        break;

      case 'tour':
        journal('<span class="mono mort">— tour ' + e.n + ' —</span>', '');
        JJK.fx.setIntensity(clamp(0.4 + (1 - D.joueur.pv / D.joueur.pvMax) * 0.55, 0, 1));
        JJK.audio.setTension(clamp(1 - D.joueur.pv / D.joueur.pvMax, 0, 1));
        JJK.fx.setDead(clamp((1 - D.joueur.pv / D.joueur.pvMax) * 0.55, 0, 0.55));
        await wait(120);
        break;

      case 'fin':
        await finir(e.vainqueur);
        break;
    }
  }

  function nomIntention(i) {
    const a = JJK.combat.ACTIONS.find(x => x.id === i);
    return a ? a.nom : 'quelque chose';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  /* =====================================================================
     L'EXTENSION DU TERRITOIRE
     ===================================================================== */
  function boiteTerritoire() {
    let t = document.getElementById('territoire');
    if (!t) {
      t = el('div'); t.id = 'territoire';
      document.body.appendChild(t);
    }
    return t;
  }

  /* Un joueur qui a déjà vu la cérémonie trois fois a le droit de passer.
     Un clic emporte le reste de la séquence, comme au rituel. */
  function ecouterSaut() {
    const etat = { saute: false };
    const h = () => { etat.saute = true; };
    document.addEventListener('pointerdown', h, true);
    document.addEventListener('keydown', h, true);
    etat.fin = () => {
      document.removeEventListener('pointerdown', h, true);
      document.removeEventListener('keydown', h, true);
    };
    return etat;
  }

  async function sequenceDomaine(e) {
    const g = G();
    const joueur = e.qui === 'joueur';
    const saut = ecouterSaut();
    const souffle = ms => saut.saute ? wait(0) : wait(ms);
    const ecrire = (n, t2, o) => saut.saute
      ? Promise.resolve((n.textContent = t2))
      : JJK.fx.type(n, t2, o);
    const spec = e.spec || (joueur ? g.tech.domaine : D.ennemi.domaine) || {};
    const t = boiteTerritoire();
    t.innerHTML = '';
    t.classList.add('actif');
    const indice = el('div', 'etiquette');
    indice.style.cssText = 'position:absolute;bottom:22px;left:0;right:0;text-align:center;opacity:.4';
    indice.textContent = 'clic — abréger';
    t.appendChild(indice);

    M().ecrire({ domainesOuverts: M().lire().domainesOuverts + 1 });
    JJK.audio.heartbeat(false);
    JJK.audio.domain();
    JJK.fx.setIntensity(1);

    /* --- 1. la convergence : l'air se met à peser ------------------- */
    const sceau = el('canvas');
    sceau.style.cssText = 'width:min(62vmin,420px);height:auto;opacity:0;transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.7,.2,1);transform:scale(.6) rotate(-25deg)';
    t.appendChild(sceau);
    const graineSceau = joueur ? g.tech.code : ('fleau:' + (D.fleau.id || D.fleau.nom));
    JJK.fx.sigil(sceau, graineSceau, { size: 460, accent: joueur ? (g.tech.couleur || '#b31217') : '#b31217' });
    requestAnimationFrame(() => { sceau.style.opacity = '1'; sceau.style.transform = 'scale(1) rotate(0deg)'; });

    const inc = el('div', 'incantation');
    t.appendChild(inc);
    await ecrire(inc, '領域展開', { speed: 110, sound: false });

    const passes = JJK.fx.reduit() ? 4 : 12;
    for (let i = 0; i < passes && !saut.saute; i++) {
      JJK.fx.shake(0.14 + i * 0.07);
      JJK.fx.pulse(null, null, 120 + i * 70, joueur ? (g.tech.couleur || '#b31217') : '#b31217', 0.5 + i * 0.09);
      await wait(JJK.fx.reduit() ? 70 : 95);
    }

    /* --- 2. la bascule --------------------------------------------- */
    JJK.fx.flash('#ffffff', 1100);
    JJK.fx.invert(220);
    JJK.fx.shake(1.6);
    N.decor = N.decor || {};
    N.decor[joueur ? 'joueur' : 'ennemi'] = {
      seed: graineSceau,
      accent: joueur ? (g.tech.couleur || '#b31217') : '#b31217',
      invert: !joueur,               /* son territoire à lui retourne le monde */
      sigilCanvas: sceau,
    };
    JJK.fx.domainOpen(N.decor[joueur ? 'joueur' : 'ennemi']);
    U.titreFurtif('領域展開', 6000);
    await souffle(240);

    t.innerHTML = '';
    t.appendChild(indice);
    if (!joueur) t.style.color = '#0a0a0c';
    else t.style.color = '';

    const nomFr = el('div', 'nom-dom');
    t.appendChild(nomFr);
    const nomJp = el('div', 'incantation');
    nomJp.style.marginTop = '18px';
    t.appendChild(nomJp);
    await ecrire(nomFr, spec.nom_fr || 'Territoire sans nom', { speed: 26, sound: false });
    if (spec.nom_jp) nomJp.textContent = spec.nom_jp + (spec.romaji ? ' · ' + spec.romaji : '');

    /* --- 3. l'incantation ------------------------------------------- */
    if (spec.incantation) {
      const v = el('div', 'vers');
      t.appendChild(v);
      const vers = String(spec.incantation).replace(/([.;])\s+/g, '$1\n').split(/\n|\s*\/\s*/).filter(Boolean);
      for (const ligne of vers) {
        const p = el('p');
        v.appendChild(p);
        await ecrire(p, ligne.trim(), { speed: 11, sound: false });
      }
    }

    /* --- 4. le coup au but ------------------------------------------ */
    await souffle(320);
    if (spec.effet_garanti) {
      const s = el('div', 'sur');
      const lab = el('div', 'etiquette rouge', 'Coup au but — il ne se refuse pas');
      s.appendChild(lab);
      /* Le coup au but n'est pas une incantation : c'est un constat.
         On ne le scande pas lettre à lettre, on le pose. */
      const p = el('p', 'serif-italique');
      p.style.cssText = 'font-size:1.25rem;margin-top:10px;max-width:44ch;opacity:0;transition:opacity .5s ease';
      p.textContent = spec.effet_garanti;
      s.appendChild(p);
      t.appendChild(s);
      requestAnimationFrame(() => { p.style.opacity = '1'; });
      await souffle(900);
    }
    JJK.fx.slash('#fff6ee', 3);
    JJK.audio.slash();
    JJK.fx.ink(null, null, 1.6, joueur ? '#b31217' : '#e9e2d4');
    await souffle(900);
    saut.fin();

    t.classList.remove('actif');
    majDecor();
    journal('<span class="mono ' + (joueur ? 'or' : 'sang') + '">EXTENSION DU TERRITOIRE</span> — ' +
      esc(spec.nom_fr || '') + ' · ' + e.tours + ' tours.', 'important');
    if (spec.faille && joueur === false) journal('Une sortie existe : ' + esc(spec.faille), '');
    JJK.audio.heartbeat(true, 84);
  }

  async function sequenceClash(e) {
    const saut = ecouterSaut();
    const t = boiteTerritoire();
    t.innerHTML = ''; t.classList.add('actif');
    const h = el('div', 'nom-dom');
    h.style.fontSize = 'clamp(1.6rem,6vw,4rem)';
    t.appendChild(h);
    if (saut.saute) h.textContent = 'DEUX LOIS DANS LA MÊME PIÈCE';
    else await JJK.fx.type(h, 'DEUX LOIS DANS LA MÊME PIÈCE', { speed: 22, sound: false });
    const coups = JJK.fx.reduit() ? 4 : 10;
    for (let i = 0; i < coups && !saut.saute; i++) {
      JJK.fx.invert(60); JJK.fx.shake(1.2); JJK.audio.hit(1.2);
      JJK.fx.slash(i % 2 ? '#b31217' : '#fff6ee', 2);
      await wait(90);
    }
    const r = el('p', 'discret');
    r.style.marginTop = '20px';
    r.innerHTML = '<span class="mono">RAFFINEMENT ' + e.ra + ' — ' + e.rb + '</span>';
    t.appendChild(r);
    await (saut.saute ? wait(0) : wait(600));
    saut.fin();
    t.classList.remove('actif');
    journal('<span class="mono sang">AFFRONTEMENT DE TERRITOIRES</span> — ' + e.ra + ' contre ' + e.rb + '.', 'important');
  }

  /* =====================================================================
     FIN DE DUEL
     ===================================================================== */
  async function finir(vainqueur) {
    const g = G();
    N.decor = null;
    D.joueur.domaineTours = 0; D.ennemi.domaineTours = 0;
    JJK.fx.domainClose();
    document.body.classList.remove('domaine-calme');
    JJK.audio.heartbeat(false);
    JJK.audio.setTension(0.2);
    const t = boiteTerritoire();
    t.classList.remove('actif');

    if (vainqueur === 'joueur' || vainqueur === 'fuite') {
      const gagne = vainqueur === 'joueur';
      JJK.fx.flash(gagne ? '#f2c14e' : '#333', 900);
      JJK.fx.inkFade(0.45);
      journal(gagne ? U.voix('victoire', 'Ce qui te faisait face a cessé de faire face.')
                    : 'Tu sors. Le couloir est plus long qu\'à l\'aller.', 'important');
      const r = M().lire();
      M().ecrire(gagne ? { victoires: r.victoires + 1 } : { fuites: r.fuites + 1 });
      if (gagne) {
        g.maturation++; g.descente++;
        titres();
      }
      await wait(1400);
      ecranApres(gagne);
    } else {
      await mort();
    }
  }

  async function ecranApres(gagne) {
    const n = U.montrer('ecran-apres');
    n.innerHTML = '';
    const g = G();
    n.appendChild(el('span', 'etiquette rouge', gagne ? 'Fléau exorcisé' : 'Contact rompu'));
    n.appendChild(el('h1', 'titre-rituel', gagne ? 'Il ne reste <em>rien</em> à ramasser' : 'Vous êtes <em>sorti</em>'));

    /* Un fléau exorcisé laisse voir de quoi il était fait : une peur
       humaine, datée, ordinaire. C'est le moment où tout devient
       rétrospectivement évident, et misérable.                          */
    if (gagne) {
      const bloc = el('div', 'exorcisme');
      bloc.appendChild(el('div', 'etiquette', "Origine constatée du fléau"));
      const p0 = el('p', 'ligne-exorcisme');
      bloc.appendChild(p0);
      const orig = (D.fleau && D.fleau.origine) ? D.fleau.origine : '';
      const date = U.pioche(((C().ambiance || {}).exorcisme) || [], '');
      n.appendChild(bloc);
      await JJK.fx.type(p0, date || orig, { speed: 15, sound: false });
      if (date && orig) {
        const p1 = el('p', 'ligne-exorcisme faible');
        bloc.appendChild(p1);
        await JJK.fx.type(p1, orig, { speed: 12, sound: false });
      }
      JJK.fx.pulse(null, null, null, '#f2c14e', 0.8);
    }
    const p = el('p');
    p.style.cssText = 'max-width:60ch;color:var(--os-faible);font-weight:300';
    p.textContent = gagne
      ? 'Ta technique s\'est un peu ouverte. Maturation ' + g.maturation + ' : +' + Math.round(9 * g.maturation) + ' % d\'attaque, +' + Math.round(7 * g.maturation) + ' % de vitalité. Ce qui t\'attend en dessous a grandi aussi.'
      : 'Fuir ne coûte rien tout de suite. C\'est plus tard que ça se paie : le fléau que tu as laissé derrière toi continue, lui.';
    n.appendChild(p);
    const r = U.rangee();
    r.appendChild(U.bouton('Descendre encore', 'rouge', () => JJK.ecrans.descente()));
    r.appendChild(U.bouton('Modifier les serments', 'fantome', () => JJK.ecrans.serments()));
    r.appendChild(U.bouton('Registre', 'fantome', () => JJK.ecrans.registre()));
    n.appendChild(r);
  }

  function titres() {
    const g = G(), r = M().lire();
    const src = ((C().nomenclature || {}).titres_joueur) || [];
    const conditions = [
      [r.victoires >= 1, 0], [r.victoires >= 5, 1], [g.serments.length >= 3, 2],
      [r.domainesOuverts >= 1, 3], [r.morts >= 1, 4], [r.sermentsPretes >= 3, 5],
      [g.maturation >= 8, 6], [r.victoires >= 10, 7],
    ];
    conditions.forEach(([ok, i]) => {
      if (!ok || !src[i]) return;
      if (M().accorderTitre(src[i].titre)) {
        journal('<span class="mono or">TITRE — ' + esc(src[i].titre) + '</span>', 'important');
      }
    });
  }

  async function mort() {
    JJK.ui.calmer();
    const g = G();
    JJK.fx.setDead(1);
    JJK.fx.invert(900);
    JJK.fx.flash('#b31217', 1600);
    JJK.fx.ink(null, null, 3, '#b31217');
    JJK.fx.ink(null, null, 2.4, '#b31217');
    JJK.fx.shake(1.4);
    JJK.audio.hit(1.6);
    JJK.audio.stopDrone(2.5);
    U.titreFurtif('— ' + (g.porteur || '') + ' —', 9000);
    await wait(1500);

    const derniersMots = U.voix('mort', "Ce n'était pas assez.");
    const fiche = {
      graine: JJK.core.normalizeSeed(g.porteur || ''), dossier: g.code,
      nom: g.porteur, technique: g.tech.nom, nomJp: g.tech.nomJp,
      declaration: g.declaration, poids: g.poids,
      tueur: D.ennemi.nom, tour: D.tour, grade: (g.grade || {}).grade || '?',
      serments: g.serments.map(s => s.nom), derniersMots, archetype: g.tech.archetype,
    };
    const efface = g.mods && g.mods.effaceToutALaMort;
    if (!efface) M().inhumer(fiche);

    const n = U.montrer('ecran-mort');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.1);

    const flux = el('div');
    n.appendChild(flux);
    await U.dire(flux, derniersMots, { forte: true, apres: 700 });
    await U.dire(flux, (g.porteur || 'Le réceptacle') + ', porteur de « ' + g.tech.nom + ' », est tombé au tour ' + D.tour + ' devant ' + D.ennemi.nom + '. Dossier ' + g.code + ', clos.', { apres: 500 });

    if (efface) {
      await U.dire(flux, 'Tu avais signé le Serment de la Trace Effacée.', { forte: true, apres: 600 });
      await U.dire(flux, "Le registre n'écrira rien. Il n'y aura pas eu de toi ici.", { apres: 500 });
      M().effacer();
      JJK.fx.inkClear();
      JJK.fx.flash('#fff', 1400);
      await wait(900);
      await U.dire(flux, 'Tout est effacé. Y compris les morts d\'avant, qui ne t\'avaient rien demandé.', { forte: true, apres: 400 });
    } else {
      await U.dire(flux, "Le registre t'a inscrit. Ce que tu étais reviendra te chercher à la prochaine descente.", { forte: true, apres: 400 });
    }

    const r = U.rangee();
    r.appendChild(U.bouton('Reprendre sous le même nom', 'rouge', () => {
      JJK.fx.setDead(0); JJK.audio.startDrone();
      const gg = G();
      gg.maturation = Math.max(0, gg.maturation - 2);
      gg.descente = Math.max(0, gg.descente - 1);
      JJK.ecrans.descente();
    }));
    r.appendChild(U.bouton('Changer de nom', 'fantome', () => {
      JJK.fx.setDead(0); JJK.audio.startDrone();
      JJK.ecrans.reinit(); JJK.ecrans.seuil();
    }));
    r.appendChild(U.bouton('Registre', 'fantome', () => { JJK.fx.setDead(0); JJK.ecrans.registre(); }));
    n.appendChild(r);
  }

  JJK.duel = { lancer, get D() { return D; } };
})(window);


/* ==== 80-boot.js ==== */
/* =========================================================================
   RITUEL — allumage
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  function demarrer() {
    if (!document.getElementById('stage')) {
      const s = document.createElement('div');
      s.id = 'stage';
      document.body.appendChild(s);
    }
    JJK.fx.mount();
    JJK.ui.barre();
    JJK.ui.titreOnglet();
    JJK.ui.murmures(false);

    /* Le son attend un geste : les navigateurs l'exigent, et le rituel
       préfère de toute façon qu'on le touche avant de lui parler. */
    const eveil = () => {
      JJK.audio.unlock();
      const r = JJK.memoire.lire();
      if (r.sonCoupe) JJK.audio.toggleMute(true);
      JJK.ui.majSon();
      document.removeEventListener('pointerdown', eveil);
      document.removeEventListener('keydown', eveil);
    };
    document.addEventListener('pointerdown', eveil);
    document.addEventListener('keydown', eveil);

    /* Un lien porte un numéro de dossier : le service ressort la fiche. */
    const m = /[#&?]d=([^&]+)/.exec(location.hash + location.search);
    let code = null;
    if (m) { try { code = decodeURIComponent(m[1]); } catch (e) { code = m[1]; } }
    const lu = code ? JJK.taxo.lireDossierCode(code.trim()) : null;
    if (lu) JJK.ecrans.consultation(lu);
    else JJK.ecrans.seuil();

    /* raccourcis */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && JJK.ui.actif() !== 'ecran-duel') JJK.ecrans.registre();
      if (e.key >= '1' && e.key <= '9' && JJK.ui.actif() === 'ecran-duel') {
        const b = document.querySelectorAll('#ecran-duel .acte');
        const n = b[parseInt(e.key, 10) - 1];
        if (n && !n.disabled) n.click();
      }
    });

    /* L'onglet quitté n'est pas un onglet oublié. */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        JJK.ui.titreOnglet('… continue sans toi');
      } else {
        JJK.ui.titreOnglet();
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})(window);

</script>
