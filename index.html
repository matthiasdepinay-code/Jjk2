    },
    {
      id: 'fuite', nom: 'Rompre le contact', cout: 0,
      desc: "Partir. Le fléau se souviendra que tu es partie chose vivante.",
      exec(D, a, d, R) {
        const ev = [];
        if (R.chance(0.55 + a.crit)) { ev.push({ t: 'fuite', qui: a.cle, reussie: true }); D.fini = true; D.vainqueur = 'fuite'; }
        else { ev.push({ t: 'fuite', qui: a.cle, reussie: false }); }
        return ev;
      },
    },
  ];

  const parId = {};
  ACTIONS.forEach(a => { parId[a.id] = a; });

  /* ---- construction d'un combattant ------------------------------------ */
  function combattantJoueur(tech, corps, mods, nomJoueur) {
    const pvMax = Math.max(24, Math.round(corps.pvMax * mods.pvMaxMult));
    return {
      cle: 'joueur', nom: nomJoueur || 'Toi', sousTitre: tech.nom,
      pv: pvMax, pvMax,
      enMax: Math.max(3, corps.enMax + mods.enMaxBonus), en: 0,
      attaque: corps.attaque, crit: corps.crit + mods.critBonus, soin: corps.soin,
      archetype: tech.archetype, domaine: tech.domaine, technique: tech,
      statuts: [], tension: 0, domaineTours: 0, domaineUtilise: false,
      sermentPris: false, rancune: 0, derniereAction: null, mods,
      raffinement: corps.puissance + (mods.raffinementBonus || 0), intention: null, humain: true,
    };
  }

  /* Calibrage : le contenu écrit la couleur, le code écrit la difficulté.
     On vise une durée de duel, pas des chiffres arbitraires. Ainsi un fléau
     reste dangereux quel que soit le réceptacle qui lui fait face.        */
  const CADENCE = {
    '4':             { tours: 4.0,  survie: 13.0 },
    '3':             { tours: 5.5,  survie: 11.0 },
    '2':             { tours: 7.5,  survie: 10.0 },
    '1':             { tours: 10.0, survie: 9.5 },
    'semi-spécial':  { tours: 11.0, survie: 9.5 },
    'spécial':       { tours: 12.5, survie: 9.5 },
  };
  /* Rendement réel d'un tour de joueur : la technique innée vaut 2,3 fois
     l'attaque, mais elle pose « Marqué » (+30 %) et les critiques ajoutent
     encore. Mesuré en simulation, pas supposé — c'est 3,4, pas 1,9.       */
  const REGLAGE = {
    rendementJoueur: 3.4,   /* dégâts moyens d'un tour de joueur, en multiples d'attaque */
    rendementFleau: 1.9,    /* idem côté fléau */
    expoAttaque: 0.40,      /* la courbe pèse à plein sur les PV du fléau, à peine sur sa frappe :
                               une descente doit s'allonger, pas se raccourcir brutalement */
  };

  function combattantFleau(f, ref, R, courbe) {
    const g = String(f.grade || '4');
    const c = CADENCE[g] || CADENCE['2'];
    const rng = R || new Rng('fleau:' + (f.id || f.nom));
    const k = courbe || 1;

    /* IMPORTANT : on calibre sur le RÉCEPTACLE NU — sans serment, sans
       maturation. Sinon progresser ne servirait à rien : le monde grandirait
       exactement à la vitesse du joueur, et le joueur ne sentirait rien.
       Ici, le fléau ignore ce que tu as signé. C'est à toi d'en profiter.  */
    const dpsRef = Math.max(6, ref.attaque * REGLAGE.rendementJoueur);
    /* variance de caractère : deux fléaux de même grade ne se ressemblent pas */
    const vPv = rng.range(0.86, 1.16), vAtt = rng.range(0.86, 1.16);

    const pvMax = Math.max(40, Math.round(dpsRef * c.tours * vPv * k));
    const attaque = Math.max(6, Math.round((ref.pvMax / c.survie / REGLAGE.rendementFleau) * vAtt * Math.pow(k, REGLAGE.expoAttaque)));

    return {
      cle: 'ennemi', nom: f.nom, sousTitre: 'Fléau de grade ' + g,
      pv: pvMax, pvMax,
      enMax: 10, en: 2,
      attaque, crit: 0.08 + (g === 'spécial' ? 0.10 : g === 'semi-spécial' ? 0.06 : 0), soin: 0.5,
      archetype: f.archetype || 'seuil', domaine: f.domaine || null, fleau: f,
      statuts: [], tension: 0, domaineTours: 0, domaineUtilise: false,
      sermentPris: false, rancune: 0, derniereAction: null,
      mods: MODS_NEUTRES(),
      /* Le raffinement décide qui l'emporte quand deux territoires se
         touchent. On le veut comparable à la puissance du joueur, pas
         indexé sur des PV : sinon un grade spécial gagne toujours. */
      raffinement: ({ '4': 70, '3': 110, '2': 150, '1': 200, 'semi-spécial': 235, 'spécial': 290 }[g] || 150),
      intention: null, humain: false,
      profil: profilDe(g),
      grade: g,
      temperament: temperamentsDe(f),
      patience: 0,
    };
  }

  function MODS_NEUTRES() {
    return { degatsMult: 1, degatsRecusMult: 1, pvMaxMult: 1, soinMult: 1, critBonus: 0, critMult: 1,
      energieBonus: 0, energieDepart: 0, enMaxBonus: 0, remise: 0, frappeMult: 1, domaineMult: 1,
      domaineTours: 0, rancune: 0, interdit: {}, masqueVieEnnemi: false, masqueJournal: false,
      coupeSon: false, pasDeRepetition: false, domaineUnique: false, effaceToutALaMort: false, limiteTours: 0 };
  }

  /* ------------------------------------------------------------------
     Tempéraments. Le bestiaire décrit des comportements précis :
     « il attend », « il rejoue une de tes actions », « il frappe deux
     fois de suite ». Sans lecture, ce serait de la littérature posée
     sur une IA générique. On lit donc le texte, et on le tient.
     ------------------------------------------------------------------ */
  const TEMPERAMENTS = [
    { id: 'patient',    re: /attend|n['’]engage rien|patiente|immobile|sans bouger|ne bouge|reste au fond|laisse venir/i },
    { id: 'imitateur',  re: /rejoue|recopie|répète|imite|copie|reproduit|renvoie ton|ton propre geste/i },
    { id: 'double',     re: /deux fois de suite|frappe deux fois|double|coup double|enchaîne deux/i },
    { id: 'horloge',    re: /\bau (?:cinquième|sixième|septième|huitième|neuvième|dixième|\d+)(?:e|ème)?\b/i },
    { id: 'soigneur',   re: /se referme|se recoud|se répare|régénère|se soigne|repousse|cicatrise/i },
    { id: 'vorace',     re: /dévore|absorbe|aspire|se nourrit|draine|vide|siphonne/i },
    { id: 'fuyant',     re: /disparaît|s['’]efface|n['’]existe que|invisible|ne se laisse pas|hors de portée/i },
  ];
  const MOTS_TOUR = { cinquième: 5, sixième: 6, septième: 7, huitième: 8, neuvième: 9, dixième: 10 };

  function temperamentsDe(f) {
    const texte = [f.comportement, f.apparence, f.technique_signature].join(' ');
    const t = {};
    TEMPERAMENTS.forEach(x => { if (x.re.test(texte)) t[x.id] = true; });
    if (t.horloge) {
      const m = /\bau (cinquième|sixième|septième|huitième|neuvième|dixième|\d+)/i.exec(texte);
      const v = m ? (MOTS_TOUR[String(m[1]).toLowerCase()] || parseInt(m[1], 10)) : 7;
      t.tourCle = Math.max(3, Math.min(12, v || 7));
    }
    return t;
  }

  function profilDe(grade) {
    switch (String(grade)) {
      case '4': return { agressif: 0.75, technique: 0.10, garde: 0.15, soin: 0, domaine: false, seuilTension: 999 };
      case '3': return { agressif: 0.65, technique: 0.20, garde: 0.15, soin: 0.05, domaine: false, seuilTension: 999 };
      case '2': return { agressif: 0.52, technique: 0.30, garde: 0.12, soin: 0.10, domaine: false, seuilTension: 999 };
      case '1': return { agressif: 0.45, technique: 0.35, garde: 0.10, soin: 0.14, domaine: false, seuilTension: 999 };
      case 'semi-spécial': return { agressif: 0.40, technique: 0.38, garde: 0.10, soin: 0.16, domaine: true, seuilTension: 130 };
      default: return { agressif: 0.36, technique: 0.42, garde: 0.08, soin: 0.18, domaine: true, seuilTension: 100 };
    }
  }

  /* ---- le duel ---------------------------------------------------------- */
  function creer(opts) {
    const R = new Rng('duel:' + opts.seed + ':' + (opts.ennemi.id || 'x') + ':' + (opts.numero || 0));
    const D = {
      R, tour: 1, fini: false, vainqueur: null, journal: [],
      joueur: opts.joueur, ennemi: opts.ennemi,
      mods: opts.joueur.mods,
      numero: opts.numero || 0,
    };
    D.joueur.en = Math.min(D.joueur.enMax, 3 + (D.mods.energieDepart || 0));
    D.ennemi.intention = choisirIntention(D, D.ennemi, D.joueur);

    /* ---- calcul des dégâts : une seule porte d'entrée ---------------- */
    D.degats = function (ev, a, d, mult, o) {
      o = o || {};
      let base = a.attaque * mult;
      if (statut(a, 'fracture')) base *= 0.70;
      const el = statut(a, 'elan'); if (el) base *= 1 + (el.val || 0);
      base *= a.mods.degatsMult || 1;
      base *= 1 + (a.rancune || 0);
      if (a.domaineTours > 0) base *= 1.35;

      const lec = statut(a, 'lecture');
      const lisait = !!lec;
      const chanceCrit = clamp((a.crit || 0.1) + (lec ? 0.55 : 0), 0, 0.95);
      const crit = R.chance(chanceCrit);
      if (crit) base *= 1.85 * (a.mods.critMult || 1);
      if (lec) { retirer(a, 'lecture'); }

      base *= R.range(0.90, 1.12);

      const g = statut(d, 'garde');
      if (g && !o.ignoreGarde) { base *= 1 - (g.val || 0.5); retirer(d, 'garde'); }
      /* Ce qui n'existe que hors du regard encaisse mal les coups portés
         à l'aveugle. Le fixer — Lire l'adversaire — le rend solide, et
         c'est exactement ce que sa fiche annonce. */
      if (d.temperament && d.temperament.fuyant && !lisait && !statut(d, 'marque') && !o.surAuBut) base *= 0.68;
      if (statut(d, 'marque')) base *= 1.30;
      base *= d.mods.degatsRecusMult || 1;
      if (d.domaineTours > 0 && !o.surAuBut) base *= 0.70;

      let q = Math.max(1, Math.round(base));
      if (d.pv - q <= 0 && statut(d, 'sursis')) {
        retirer(d, 'sursis'); q = Math.max(0, d.pv - 1);
        ev.push({ t: 'sursis', qui: d.cle });
      }
      d.pv -= q;
      a.rancune = 0;
      a.tension = Math.min(200, a.tension + Math.round(q * 0.18) + 4);
      d.tension = Math.min(200, d.tension + Math.round(q * 0.35) + 3);
      d.rancune = Math.min(1.5, (d.rancune || 0) + (d.mods.rancune || 0));

      const ec = statut(d, 'echo');
      ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q, crit, verbe: o.verbe || 'frappe', gros: !!o.gros, surAuBut: !!o.surAuBut });
      if (ec) {
        const q2 = Math.max(1, Math.round(q * 0.45));
        d.pv -= q2; ec.tours -= 1;
        ev.push({ t: 'degats', par: a.cle, cible: d.cle, montant: q2, echo: true, verbe: 'se répète' });
        if (ec.tours <= 0) retirer(d, 'echo');
      }
      return q;
    };

    /* ---- actions disponibles ------------------------------------------ */
    D.actions = function () {
      const a = D.joueur;
      return ACTIONS.map(act => {
        const cout = coutReel(act, a);
        let ok = true, raison = '';
        if (a.mods.interdit[act.id]) { ok = false; raison = 'Interdit par un serment.'; }
        else if (a.en < cout) { ok = false; raison = 'Énergie insuffisante.'; }
        else if (act.req && !act.req(D, a, D.ennemi)) { ok = false; raison = act.raison || 'Impossible.'; }
        else if (a.mods.pasDeRepetition && a.derniereAction === act.id) { ok = false; raison = 'Serment : jamais deux fois le même geste.'; }
        return {
          id: act.id, nom: act.id === 'technique' ? (a.technique ? a.technique.nom : act.nom) : act.nom,
          sous: act.id === 'technique' ? 'Technique innée' : (act.id === 'maximum' && a.technique && a.technique.maximum ? 'Technique maximale' : ''),
          desc: act.desc, cout, ok, raison, ultime: !!act.ultime,
          interdit: !!a.mods.interdit[act.id],
        };
      });
    };

    function coutReel(act, a) {
      if (!act.cout) return 0;
      return Math.max(1, act.cout - (a.mods.remise || 0));
    }

    /* ---- un tour complet ----------------------------------------------- */
    D.jouer = function (id) {
      if (D.fini) return [];
      const act = parId[id];
      const a = D.joueur, d = D.ennemi;
      if (!act) return [];
      const cout = coutReel(act, a);
      if (a.en < cout || a.mods.interdit[id] || (act.req && !act.req(D, a, d))) return [];

      const ev = [];
      a.en -= cout;
      a.derniereAction = id;
      ev.push({ t: 'acte', qui: 'joueur', nom: id === 'technique' && a.technique ? a.technique.nom : act.nom, id });
      Array.prototype.push.apply(ev, act.exec(D, a, d, R) || []);

      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }
      if (D.fini) return ev;

      /* riposte */
      Array.prototype.push.apply(ev, tourEnnemi(D, ev));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      /* fin de tour */
      Array.prototype.push.apply(ev, finDeTour(D));
      if (a.pv <= 0) { finir(ev, 'ennemi'); return ev; }
      if (d.pv <= 0) { finir(ev, 'joueur'); return ev; }

      D.tour++;
      if (a.mods.limiteTours && D.tour > a.mods.limiteTours) {
        ev.push({ t: 'sablier', limite: a.mods.limiteTours });
        a.pv = 0; finir(ev, 'ennemi'); return ev;
      }
      d.intention = choisirIntention(D, d, a);
      ev.push({ t: 'tour', n: D.tour });
      return ev;
    };

    function finir(ev, qui) {
      D.fini = true; D.vainqueur = qui;
      ev.push({ t: 'fin', vainqueur: qui });
    }

    function finDeTour(D) {
      const ev = [];
      [D.joueur, D.ennemi].forEach(c => {
        const sg = statut(c, 'saignee');
        if (sg) {
          const q = Math.max(1, sg.val || 3);
          c.pv -= q;
          ev.push({ t: 'degats', par: 'saignee', cible: c.cle, montant: q, verbe: 'saigne', dot: true });
        }
        if (statut(c, 'corrosion')) c.en = Math.max(0, c.en - 1);
        /* +3 par tour : une technique innée (3) est ainsi soutenable,
           et mettre de côté les 8 d'une extension reste un vrai choix. */
        c.en = Math.min(c.enMax, c.en + 3 + (c.mods.energieBonus || 0));
        c.tension = Math.min(200, c.tension + 6);
        if (c.domaineTours > 0) {
          c.domaineTours--;
          const cible = c === D.joueur ? D.ennemi : D.joueur;
          const q = Math.max(2, Math.round(cible.pvMax * 0.06 * (c.mods.domaineMult || 1)));
          cible.pv -= q;
          ev.push({ t: 'degats', par: c.cle, cible: cible.cle, montant: q, verbe: 'ronge', domaine: true });
          if (c.domaineTours === 0) ev.push({ t: 'domaineFerme', qui: c.cle });
        }
        for (let i = c.statuts.length - 1; i >= 0; i--) {
          const s = c.statuts[i];
          if (s.id === 'garde' || s.id === 'elan') continue;
          s.tours--;
          if (s.tours <= 0) { c.statuts.splice(i, 1); ev.push({ t: 'statutFin', qui: c.cle, id: s.id }); }
        }
      });
      return ev;
    }

    /* ---- l'adversaire n'improvise pas : il a un tempérament ------------ */
    function choisirIntention(D, e, cible) {
      if (!e.profil) e.profil = profilDe((e.fleau || {}).grade || '2');
      const p = e.profil, t = e.temperament || {};
      const bas = e.pv / e.pvMax < 0.35;

      /* l'heure dite : ce qu'annonce sa fiche arrive au tour annoncé */
      if (t.tourCle && D.tour === t.tourCle && !statut(e, 'scelle')) {
        if (p.domaine && e.en >= 6 && e.domaineTours === 0) return 'domaine';
        if (e.en >= 6) return 'maximum';
      }
      if (p.domaine && e.tension >= p.seuilTension && e.en >= 6 && !statut(e, 'scelle') && e.domaineTours === 0) return 'domaine';
      if (e.tension >= 70 && e.en >= 5 && R.chance(0.55)) return 'maximum';
      if (bas && (p.soin > 0 || t.soigneur) && e.en >= 3 && R.chance(t.soigneur ? 0.75 : 0.55)) return 'inverse';

      /* celui qui attend : il se garde, et chaque attente le charge */
      if (t.patient && e.patience < 3 && R.chance(0.45)) return 'garde';
      /* celui qui rejoue : il te renvoie ton dernier geste */
      if (t.imitateur && cible.derniereAction && R.chance(0.55)) {
        const a = parId[cible.derniereAction];
        if (a && a.id !== 'fuite' && a.id !== 'serment' && a.id !== 'domaine' && e.en >= (a.cout || 0)) return a.id;
      }
      const r = R.next();
      if (r < p.agressif) return e.en >= 2 && R.chance(0.6) ? 'decharge' : 'frappe';
      if (r < p.agressif + p.technique) return e.en >= 3 ? 'technique' : 'frappe';
      if (r < p.agressif + p.technique + p.garde) return 'garde';
      return 'frappe';
    }

    function agirEnnemi(D, id) {
      const e = D.ennemi, j = D.joueur;
      const act = parId[id];
      const cout = act ? (act.cout || 0) : 0;
      if (!act || e.en < cout || (act.req && !act.req(D, e, j))) id = 'frappe';
      const a2 = parId[id];
      e.en -= (a2.cout || 0);
      e.derniereAction = id;
      const ev = [{ t: 'acte', qui: 'ennemi', nom: id === 'technique' && e.fleau ? (e.fleau.technique_signature || a2.nom) : a2.nom, id }];
      Array.prototype.push.apply(ev, a2.exec(D, e, j, R) || []);
      return ev;
    }

    function tourEnnemi(D) {
      const e = D.ennemi, j = D.joueur;
      const t = e.temperament || {};
      const id = e.intention || 'frappe';
      const ev = agirEnnemi(D, id);

      /* l'attente se paie en avance prise */
      if (t.patient) {
        if (e.derniereAction === 'garde') {
          e.patience++;
          const el2 = poser(e, 'elan', 99, 0);
          el2.val = Math.min(0.42, (el2.val || 0) + 0.11);
          ev.push({ t: 'statut', qui: e.cle, id: 'elan' });
        } else e.patience = 0;
      }
      /* le second coup, quand sa fiche le promet */
      if (t.double && j.pv > 0 && !D.fini && R.chance(0.26)) {
        ev.push({ t: 'second', qui: e.cle });
        Array.prototype.push.apply(ev, agirEnnemi(D, e.en >= 2 ? 'decharge' : 'frappe'));
      }
      /* ce qui se nourrit prend aussi la réserve */
      if (t.vorace && j.pv > 0 && j.en > 0 && R.chance(0.45)) {
        const q = Math.min(j.en, 2);
        j.en -= q; e.en = Math.min(e.enMax, e.en + q);
        ev.push({ t: 'ponction', qui: e.cle, montant: q });
      }
      return ev;
    }

    return D;
  }

  JJK.combat = { creer, combattantJoueur, combattantFleau, ACTIONS, STATUTS, MODS_NEUTRES, statut, profilDe, temperamentsDe, CADENCE, REGLAGE };
})(window);


/* ==== 60-memoire.js ==== */
/* =========================================================================
   RITUEL — mémoire
   Le jeu tient un registre. Il n'oublie ni les noms, ni les manières de
   mourir. Un serment peut détruire ce registre ; rien ne peut le corriger.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  const CLE = 'rituel.registre.v1';
  const VIDE = {
    version: 1,
    graine: null, reponses: [], maturation: 0,
    descentes: 0, victoires: 0, fuites: 0, morts: 0,
    serments: [], sonCoupe: false,
    epitaphes: [],           /* ceux qui sont tombés ici, sous n'importe quel nom */
    titres: [], vus: [],
    premiereVisite: null, derniereVisite: null,
    domainesOuverts: 0, sermentsPretes: 0, degatsSubis: 0, degatsInfliges: 0,
  };

  function dispo() {
    try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  const OK = dispo();
  let cache = null;

  function lire() {
    if (cache) return cache;
    if (!OK) return (cache = JSON.parse(JSON.stringify(VIDE)));
    try {
      const brut = localStorage.getItem(CLE);
      cache = brut ? Object.assign(JSON.parse(JSON.stringify(VIDE)), JSON.parse(brut)) : JSON.parse(JSON.stringify(VIDE));
    } catch (e) { cache = JSON.parse(JSON.stringify(VIDE)); }
    return cache;
  }
  function ecrire(patch) {
    const r = lire();
    if (patch) Object.assign(r, patch);
    r.derniereVisite = Date.now();
    if (!r.premiereVisite) r.premiereVisite = r.derniereVisite;
    if (OK) { try { localStorage.setItem(CLE, JSON.stringify(r)); } catch (e) {} }
    return r;
  }
  function effacer() {
    cache = null;
    if (OK) { try { localStorage.removeItem(CLE); } catch (e) {} }
    return lire();
  }

  /* ---- épitaphes : ce que le registre garde d'un mort ------------------ */
  function inhumer(fiche) {
    const r = lire();
    r.epitaphes.unshift({
      graine: fiche.graine, nom: fiche.nom, technique: fiche.technique, nomJp: fiche.nomJp,
      tueur: fiche.tueur, tour: fiche.tour, grade: fiche.grade,
      serments: fiche.serments || [], date: Date.now(),
      derniersMots: fiche.derniersMots || '',
      archetype: fiche.archetype || 'seuil',
    });
    r.epitaphes = r.epitaphes.slice(0, 12);
    r.morts++;
    ecrire();
    return r.epitaphes[0];
  }

  /* Le revenant : ton cadavre revient te chercher, avec ta propre loi.
     C'est la seule créature du jeu que tu as toi-même fabriquée.        */
  function revenant() {
    const r = lire();
    const e = r.epitaphes[0];
    if (!e) return null;

      nom: e.nom ? ('Ce qui reste de ' + e.nom) : 'Ce qui reste de toi',

      replique: e.derniersMots || "Tu as recommencé. Moi, je n'ai pas pu.",

    const r = lire();
    if (r.titres.indexOf(t) < 0) { r.titres.push(t); ecrire(); return true; }

    return Object.keys(noms);
  }

    lire, ecrire, effacer, inhumer, revenant, marquerVu, aVu,

/* =========================================================================
   RITUEL — interface, socle
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { el, $, $$, chaos, clamp, wait } = JJK.core;

  const UI = {};
  UI.etat = null;              /* l'état de partie, posé par le boot */
  let ecranActif = null;
  let murmureTimer = null;

  /* ---- écrans ---------------------------------------------------------- */
  function scene() { return document.getElementById('stage'); }

  function ecran(id) {
    let n = document.getElementById(id);
    if (!n) { n = el('section', 'ecran'); n.id = id; scene().appendChild(n); }
    return n;
  }

  function montrer(id) {
    $$('.ecran').forEach(e => e.classList.remove('actif'));
    const n = ecran(id);
    n.classList.add('actif');
    ecranActif = id;
    root.scrollTo({ top: 0, behavior: 'smooth' });
    return n;
  }
  function actif() { return ecranActif; }

  /* ---- boutons --------------------------------------------------------- */
  function bouton(texte, cls, fn) {
    const b = el('button', 'btn ' + (cls || ''), texte);
    b.addEventListener('click', e => { if (JJK.audio) JJK.audio.tick(1500, 0.02, 0.05); fn(e); });
    return b;
  }
  function rangee() { return el('div', 'btn-rangee'); }

  /* ---- lignes de rituel ------------------------------------------------ */
  /* La hâte : au premier clic, tout ce qui reste à dire est déjà dit.
     Un rituel qui impose son tempo n'est plus un rituel, c'est une attente. */
  UI.hate = false;
  function calmer() { UI.hate = false; }

  async function dire(parent, texte, opts) {
    const o = opts || {};
    const p = el('p', 'rituel-ligne' + (o.forte ? ' forte' : ''));
    parent.appendChild(p);
    if (UI.hate) {
      p.textContent = texte;
      await wait(24);
      return p;
    }
    const t = JJK.fx.type(p, texte, { speed: o.speed || 19, sound: o.sound !== false });
    UI._enCours = t;
    await t;
    UI._enCours = null;
    if (o.apres && !UI.hate) await wait(o.apres);
    return p;
  }

  function presser() {
    UI.hate = true;
    if (UI._enCours && UI._enCours.skip) UI._enCours.skip();
  }
  /* On ne presse que si quelque chose est en train de se dire : sinon un
     clic sur un bouton emporterait la tirade suivante avant qu'elle existe. */
  document.addEventListener('click', () => { if (UI._enCours) presser(); }, true);
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'Escape') && UI._enCours) presser();
  }, true);

  /* ---- murmures : le décor n'est jamais tout à fait muet --------------- */
  function murmures(on) {
    if (murmureTimer) { clearInterval(murmureTimer); murmureTimer = null; }
    if (!on) return;
    murmureTimer = setInterval(() => {
      if (document.hidden) return;
      const v = ((JJK.CORPUS || {}).voix || {}).murmures || [];
      if (!v.length || Math.random() > 0.55) return;
      const n = el('div', 'murmure-flottant', v[Math.floor(Math.random() * v.length)]);
      n.style.top = chaos.r(12, 82) + 'vh';
      n.style.left = chaos.r(45, 92) + 'vw';
      document.body.appendChild(n);
      if (JJK.audio && Math.random() < 0.35) JJK.audio.whisper(chaos.r(0.5, 1.1));
      setTimeout(() => n.remove(), 13500);
    }, 9000);
  }

  /* ---- le titre de l'onglet parle aussi -------------------------------- */
  const TITRE_BASE = 'RITUEL — 呪法帳';
  function titreOnglet(t) { document.title = t || TITRE_BASE; }
  function titreFurtif(t, ms) {
    titreOnglet(t);
    setTimeout(() => titreOnglet(), ms || 4000);
  }

  /* ---- barre d'état ---------------------------------------------------- */
  function barre() {
    let b = document.getElementById('barre-etat');
    if (b) return b;
    b = el('div'); b.id = 'barre-etat';
    b.innerHTML = '<span id="be-graine">—</span><span id="be-grade"></span><span class="sep"></span>' +
      '<span id="be-registre"></span>';
    const son = el('button', '', 'SON : ON');
    son.id = 'be-son';
    son.addEventListener('click', () => {
      /* Le Serment de l'Oreille Coupée ne se reprend pas : le bouton reste
         là, il refuse simplement d'obéir, et il le dit. */
      if (sonScelle()) { JJK.fx.shake(0.12); majSon(); return; }
      JJK.audio.unlock();
      JJK.audio.toggleMute();
      majSon();
    });
    const reg = bouton('REGISTRE', 'fantome', () => { if (JJK.ecrans) JJK.ecrans.registre(); });
    reg.style.cssText = 'border:0;padding:4px 0;font-size:10px;letter-spacing:.2em;margin:0;color:inherit';
    b.appendChild(son); b.appendChild(reg);
    document.body.appendChild(b);
    majSon();
    return b;
  }

  function sonScelle() {
    const g = JJK.jeu;
    if (g && g.mods && g.mods.coupeSon) return true;
    return !!(JJK.memoire && JJK.memoire.lire().sonCoupe);
  }
  function majSon() {
    const n = document.getElementById('be-son');
    if (!n) return;
    if (sonScelle()) { n.textContent = 'SON : SCELLÉ'; n.style.color = 'var(--sang)'; n.title = "Serment de l'Oreille Coupée."; return; }
    n.style.color = '';
    n.textContent = 'SON : ' + (JJK.audio.isMuted() ? 'OFF' : 'ON');
  }
  function majBarre(o) {
    barre();
    if (o.graine != null) document.getElementById('be-graine').textContent = o.graine ? ('GRAINE : ' + o.graine.toUpperCase()) : '—';
    if (o.grade != null) document.getElementById('be-grade').textContent = o.grade ? ('GRADE ' + String(o.grade).toUpperCase()) : '';
    if (o.registre != null) document.getElementById('be-registre').textContent = o.registre;
  }

  /* ---- petites fabriques ----------------------------------------------- */
  function bloc(etiquette, contenu, cls) {
    const b = el('div', 'bloc ' + (cls || ''));
    b.appendChild(el('span', 'etiquette', etiquette));
    if (typeof contenu === 'string') {
      const p = el('p', cls === 'loi' ? 'enonce' : '');
      p.textContent = contenu;
      b.appendChild(p);
    } else if (contenu) b.appendChild(contenu);
    return b;
  }

  function stats(paires) {
    const g = el('div', 'grille-stats');
    paires.forEach(([v, k]) => {
      const s = el('div', 'stat');
      s.appendChild(el('b', '', String(v)));
      s.appendChild(el('span', '', k));
      g.appendChild(s);
    });
    return g;
  }

  function pointsDanger(n) {
    const d = el('span', 'danger');
    for (let i = 0; i < 5; i++) d.appendChild(el('i', i < n ? 'on' : ''));
    return d;
  }

  function pioche(liste, def) {
    if (!liste || !liste.length) return def || '';
    return liste[Math.floor(Math.random() * liste.length)];
  }
  function voix(k, def) { return pioche(((JJK.CORPUS || {}).voix || {})[k], def); }

  JJK.ui = {
    ecran, montrer, actif, bouton, rangee, dire, presser, calmer, murmures, titreOnglet, titreFurtif,
    barre, majBarre, majSon, sonScelle, bloc, stats, pointsDanger, pioche, voix, UI,
  };
})(window);

    if (desc) gauche.appendChild(U.bloc('Constat', desc));
    if (t.vecteur && t.vecteur.condition) gauche.appendChild(U.bloc('Vecteur — ' + t.vecteur.nom, t.vecteur.condition));
    if (t.loi.limite) gauche.appendChild(U.bloc('Faille structurelle', t.loi.limite));
    if (t.revers) gauche.appendChild(U.bloc('Technique inversée', t.revers));
    if (t.maximum) gauche.appendChild(U.bloc('Technique maximale', t.maximum));

    if (t.domaine) {
      const d = el('div', 'bloc');
      d.appendChild(el('span', 'etiquette rouge', 'Extension du territoire'));
      const h = el('p');
      h.style.cssText = 'font-size:1.5rem;font-weight:300;margin:6px 0 4px';
      h.textContent = t.domaine.nom_fr;
      d.appendChild(h);
      d.appendChild(el('div', 'jp faible', (t.domaine.nom_jp || '') + ' · ' + (t.domaine.romaji || '')));
      if (t.domaine.paysage) { const p = el('p'); p.style.marginTop = '10px'; p.textContent = t.domaine.paysage; d.appendChild(p); }
      if (t.domaine.effet_garanti) {
        const e2 = el('p', 'serif-italique');
        e2.style.cssText = 'margin-top:10px;color:var(--sang-vif)';
        e2.textContent = '↯ ' + t.domaine.effet_garanti;
        d.appendChild(e2);
      }
      gauche.appendChild(d);
    }

    const s = G.corps.stats;
    gauche.appendChild(U.stats([
      [s.vigueur, 'Vigueur'], [s.flux, 'Flux'], [s.tranchant, 'Tranchant'],
      [s.lucidite, 'Lucidité'], [s.inversion, 'Inversion'],
    ]));
    gauche.appendChild(U.stats([
      [G.corps.pvMax, 'Points de vie'], [G.corps.enMax, 'Réserve'],
      [G.corps.attaque, 'Attaque'], [Math.round(G.corps.crit * 100) + '%', 'Critique'],
      [G.corps.puissance, 'Puissance'],
    ]));

    dossier.appendChild(gauche);

    /* colonne droite : le sceau */
    const droite = el('div', 'sceau-boite');
    const cvs = el('canvas', 'sceau-rot');
    cvs.style.width = '100%';
    droite.appendChild(cvs);
    const leg = el('div', 'sceau-legende');
    leg.appendChild(el('div', 'tampon', 'Grade ' + g.grade));
    const gl = el('p', 'discret');
    gl.style.marginTop = '14px';
    gl.textContent = g.nom + (g.description ? ' — ' + g.description : '');
    leg.appendChild(gl);
    const gl2 = el('p', 'discret');
    gl2.style.marginTop = '10px';
    gl2.innerHTML = 'Sceau tracé depuis la graine <span class="mono sang">' + escape2(t.seed) + '</span>. Aucune autre graine ne trace celui-ci.';
    leg.appendChild(gl2);
    droite.appendChild(leg);
    dossier.appendChild(droite);

    n.appendChild(dossier);
    requestAnimationFrame(() => JJK.fx.sigil(cvs, t.seed, { size: cvs.clientWidth || 320, accent: t.couleur }));

    /* Le lien : la technique d'un nom est vérifiable par n'importe qui,
       depuis n'importe quelle machine. C'est tout l'intérêt d'une lecture. */
    const part = el('div', 'bloc');
    part.appendChild(el('span', 'etiquette', 'Faire vérifier ce nom par quelqu\'un d\'autre'));
    const lien = el('p', 'mono discret');
    lien.style.cssText = 'word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--os-faible)';
    lien.textContent = lienDe(t.seed);
    part.appendChild(lien);
    const cp = U.bouton('Copier le lien', 'fantome', () => {
      const url = lienDe(t.seed);
      const fini = () => { cp.textContent = 'Lien copié'; setTimeout(() => { cp.textContent = 'Copier le lien'; }, 2200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(fini, () => selectionner(lien));
      else selectionner(lien);
    });
    cp.style.marginTop = '10px';
    part.appendChild(cp);
    gauche.appendChild(part);

    const r = U.rangee();
    r.appendChild(U.bouton('Prêter serment', 'rouge', serments));
    r.appendChild(U.bouton('Descendre sans rien signer', 'fantome', () => { G.serments = []; G.mods = JJK.serments.agreger([]); descente(); }));
    n.appendChild(r);
  }

  function lienDe(graine) {
    const base = location.href.split('#')[0];
    return base + '#g=' + encodeURIComponent(graine);
  }
  function selectionner(node) {
    try {
      const r = document.createRange(); r.selectNodeContents(node);
      const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r);
    } catch (e) {}
  }

  /* =====================================================================
     CONSULTATION — on arrive par un lien : on ne joue pas, on vérifie.
     ===================================================================== */
  async function consultation(graine) {
    U.calmer();
    const n = U.montrer('ecran-consultation');
    n.innerHTML = '';
    G.graine = graine;
    G.tech = JJK.forge.forgeTechnique(graine);
    const t = G.tech;
    JJK.fx.setHue(t.couleur, '#f2c14e');
    JJK.fx.setIntensity(0.4);
    U.majBarre({ graine: t.seed });

    const flux = el('div');
    n.appendChild(flux);
    await U.dire(flux, "Quelqu'un t'a envoyé un nom.", { apres: 380 });
    await U.dire(flux, '« ' + graine + ' ».', { forte: true, apres: 420 });
    await U.dire(flux, "Le registre ne fabrique rien. Il relit. Voici ce qui était déjà écrit dessous.", { apres: 500 });
    JJK.audio.oath();
    JJK.fx.flash('#b31217', 800);
    JJK.fx.invert(80);
    await JJK.core.wait(450);
    flux.remove();

    const d = el('div', 'dossier');
    const g2 = el('div');
    g2.appendChild(el('span', 'etiquette rouge', 'Consultation · lecture seule'));
    g2.appendChild(el('h1', 'nom-technique', t.nom));
    const jl = el('div', 'nom-jp'); jl.textContent = t.nomJp + ' · ' + t.romaji;
    g2.appendChild(jl);
    g2.appendChild(el('hr', 'trait'));
    g2.appendChild(U.bloc('La loi', t.loi.enonce || t.loi.nom, 'loi'));
    const pr = JJK.forge.dossier(t);
    if (pr) g2.appendChild(U.bloc('Constat', pr));
    if (t.loi.limite) g2.appendChild(U.bloc('Faille structurelle', t.loi.limite));
    if (t.domaine) g2.appendChild(U.bloc('Extension du territoire', t.domaine.nom_fr + ' — ' + (t.domaine.effet_garanti || '')));
    d.appendChild(g2);

    const dr = el('div', 'sceau-boite');
    const cvs = el('canvas', 'sceau-rot');
    cvs.style.width = '100%';
    dr.appendChild(cvs);
    const lg = el('p', 'discret centre');
    lg.style.marginTop = '14px';
    lg.textContent = 'Sceau de la graine « ' + t.seed + ' ».';
    dr.appendChild(lg);
    d.appendChild(dr);
    n.appendChild(d);
    requestAnimationFrame(() => JJK.fx.sigil(cvs, t.seed, { size: cvs.clientWidth || 320, accent: t.couleur }));

    const r = U.rangee();
    r.appendChild(U.bouton('Porter ce nom et descendre', 'rouge', () => {
      if (history.replaceState) history.replaceState(null, '', location.href.split('#')[0]);
      M().ecrire({ graine: t.seed });
      rituel();
    }));
    r.appendChild(U.bouton('Donner un autre nom', 'fantome', () => {
      if (history.replaceState) history.replaceState(null, '', location.href.split('#')[0]);
      seuil();
    }));
    n.appendChild(r);
  }

  function escape2(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  /* =====================================================================
     4. LES SERMENTS
     ===================================================================== */
  async function serments() {
    const n = U.montrer('ecran-serments');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.4);
    G.catalogue = G.catalogue.length ? G.catalogue : JJK.serments.catalogue(G.tech.seed);
    G.serments = G.serments || [];
    const cap = capSerments();
    /* si le contrat a rétréci (mort, recul de maturation), on rend le trop-plein */
    while (G.serments.length > cap) G.serments.pop();

    n.appendChild(el('span', 'etiquette rouge', 'Serments contraignants'));
    n.appendChild(el('h1', 'titre-rituel', 'Ce que tu <em>rends</em>'));
    const p = el('p');
    p.style.cssText = 'max-width:62ch;font-weight:300;color:var(--os-faible)';
    p.textContent = "Un serment n'est pas une amélioration. C'est une amputation payée d'avance : tu perds vraiment ce qui est écrit, dans ce jeu, tout de suite. En échange, le réel te doit quelque chose. " +
      (cap > 3 ? "Tu es descendu assez bas pour qu'on t'en laisse signer " + cap + "." : "Tu peux en signer trois. Plus bas, on t'en laissera davantage.");
    n.appendChild(p);

    const compteur = el('p', 'etiquette');
    compteur.style.marginTop = '18px';
    n.appendChild(compteur);

    const liste = el('div');
    liste.style.marginTop = '18px';
    n.appendChild(liste);

    const r = U.rangee();
    const suite = U.bouton('Descendre', 'rouge', () => {
      G.mods = JJK.serments.agreger(G.serments);
      /* le silence est persisté : il doit survivre au rechargement,
         sinon le serment ne coûte rien qu'un raccourci clavier */
      if (G.mods.coupeSon) { JJK.audio.toggleMute(true); M().ecrire({ sonCoupe: true }); }
      U.majSon();
      M().ecrire({ serments: G.serments.map(s => s.id) });
      descente();
    });
    r.appendChild(suite);
    n.appendChild(r);

    function maj() {
      const reste = cap - G.serments.length;
      compteur.textContent = reste > 0 ? (reste + ' serment' + (reste > 1 ? 's' : '') + ' encore possible' + (reste > 1 ? 's' : '')) : 'Le contrat est plein.';
      liste.innerHTML = '';
      G.catalogue.forEach(s => {
        const signe = G.serments.indexOf(s) >= 0;
        const c = el('div', 'contrat' + (signe ? ' signe' : ''));
        c.appendChild(el('h4', '', s.nom));
        c.appendChild(el('p', 'clause', '« ' + s.clause + ' »'));
        const e = el('div', 'echange');
        e.appendChild(el('span', 'perte', s.perte));
        e.appendChild(el('span', 'gain', s.gain));
        e.appendChild(U.pointsDanger(s.danger));
        c.appendChild(e);
        c.addEventListener('click', () => {
          if (signe) {
            G.serments.splice(G.serments.indexOf(s), 1);
            JJK.audio.tick(300, 0.08, 0.06);
            maj();
            return;
          }
          if (G.serments.length >= cap) { JJK.fx.shake(0.15); return; }
          G.serments.push(s);
          JJK.audio.oath();
          JJK.fx.invert(140);
          JJK.fx.flash('#b31217', 700);
          JJK.fx.shake(0.5);
          JJK.fx.slash('#b31217', 1);
          JJK.fx.ink(null, null, 0.5, '#b31217');
          U.titreFurtif('SIGNÉ — ' + s.nom, 4500);
          maj();
        });
        liste.appendChild(c);
      });
      suite.textContent = G.serments.length ? 'Descendre avec ' + G.serments.length + ' serment' + (G.serments.length > 1 ? 's' : '') : 'Descendre les mains libres';
    }
    maj();
  }

  /* Le contrat s'allonge à mesure qu'on descend : à ce niveau-là, plus
     personne ne s'inquiète de ce qu'on signe. */
  function capSerments() { return Math.min(5, 3 + Math.floor(G.maturation / 4)); }

  /* =====================================================================
     5. LA DESCENTE
     ===================================================================== */
  const ORDRE = ['4', '4', '3', '3', '2', '2', '1', '1', 'semi-spécial', 'semi-spécial', 'spécial'];

  function gradeCible(i) { return ORDRE[Math.min(i, ORDRE.length - 1)]; }
  function courbe(i) { return 1 + i * 0.11; }

  function descente() {
    const n = U.montrer('ecran-descente');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.35);
    if (!G.mods) G.mods = JJK.serments.agreger(G.serments);
    G.corps = appliquerMaturation(G.ref, G.maturation);
    const g = JJK.forge.grade(G.corps.puissance, G.serments.length);
    G.grade = g;
    U.majBarre({ grade: g.grade, registre: 'DESCENTE ' + (G.descente + 1) + ' · ' + M().lire().morts + ' MORT(S)' });

    n.appendChild(el('span', 'etiquette rouge', 'Descente ' + (G.descente + 1)));
    n.appendChild(el('h1', 'titre-rituel', 'Choisis ce qui <em>t\'ouvrira</em>'));

    const info = el('p', 'discret');
    info.style.maxWidth = '64ch';
    info.textContent = 'Porteur de « ' + G.tech.nom + ' ». ' + G.corps.pvMax + ' points de vie, ' +
      G.corps.attaque + ' d\'attaque, ' + G.serments.length + ' serment(s) signé(s). Maturation ' + G.maturation + '.';
    n.appendChild(info);
    n.appendChild(el('hr', 'trait'));

    const gr = gradeCible(G.descente);
    const bes = ((C().bestiaire || {}).fleaux) || [];
    const pool = bes.filter(f => String(f.grade) === gr);
    const choix = (pool.length ? pool : bes).slice();
    for (let i = choix.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = choix[i]; choix[i] = choix[j]; choix[j] = t; }
    let trois = choix.slice(0, 3);
    if (!trois.length) trois = [{ id: 'vide', nom: 'Quelque chose qui n\'a pas de nom', grade: gr, apparence: '', origine: '', replique: '…' }];

    const rev = M().revenant();
    const grille = el('div');
    grille.style.cssText = 'display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))';

    trois.forEach(f => grille.appendChild(carteFleau(f, false)));
    if (rev) grille.appendChild(carteFleau(rev, true));
    n.appendChild(grille);

    const r = U.rangee();
    r.appendChild(U.bouton('Revoir le dossier', 'fantome', revelation));
    r.appendChild(U.bouton('Modifier les serments', 'fantome', serments));
    r.appendChild(U.bouton('Registre', 'fantome', registre));
    n.appendChild(r);

    function carteFleau(f, estRevenant) {
      const c = el('div', 'contrat');
      if (estRevenant) c.style.borderColor = 'rgba(242,193,78,.5)';
      const h = el('h4', '', f.nom);
      c.appendChild(h);
      const sg = el('div', 'etiquette' + (estRevenant ? ' or' : ''));
      sg.textContent = 'Grade ' + (f.grade || '?') + (estRevenant ? ' · revenant' : '');
      c.appendChild(sg);
      if (f.apparence) { const p2 = el('p', 'clause'); p2.style.marginTop = '10px'; p2.textContent = f.apparence; c.appendChild(p2); }
      if (f.origine) { const p3 = el('p', 'discret'); p3.textContent = 'Né de : ' + f.origine; c.appendChild(p3); }
      c.addEventListener('click', () => {
        JJK.audio.tick(400, 0.06, 0.08);
        JJK.duel.lancer(f, { courbe: courbe(G.descente), revenant: estRevenant });
      });
      return c;
    }
  }

  /* =====================================================================
     6. LE REGISTRE
     ===================================================================== */
  function registre() {
    const n = U.montrer('ecran-registre');
    n.innerHTML = '';
    const r = M().lire();
    n.appendChild(el('span', 'etiquette rouge', 'Registre'));
    n.appendChild(el('h1', 'titre-rituel', 'Ceux qui sont <em>restés</em>'));

    n.appendChild(U.stats([
      [r.descentes, 'Descentes'], [r.victoires, 'Victoires'], [r.morts, 'Morts'],
      [r.domainesOuverts, 'Territoires'], [r.sermentsPretes, 'Serments'],
      [Math.round(r.degatsInfliges), 'Dégâts infligés'],
    ]));

    if (!r.epitaphes.length) {
      const p = el('p', 'discret');
      p.style.marginTop = '20px';
      p.textContent = "Personne n'est encore tombé ici. Le registre attend, comme une page réglée.";
      n.appendChild(p);
    } else {
      const l = el('div');
      l.style.marginTop = '24px';
      r.epitaphes.forEach(e => {
        const t = el('div', 'tombe');
        t.appendChild(el('div', 'nom', (e.nom || 'sans nom') + ' — « ' + (e.technique || '?') + ' »'));
        const d = el('div', 'det');
        d.textContent = 'Tombé au tour ' + (e.tour || '?') + ' · ' + (e.tueur || 'inconnu') +
          ' · grade ' + (e.grade || '?') + ' · ' + (e.serments || []).length + ' serment(s)';
        t.appendChild(d);
        if (e.derniersMots) { const m = el('p', 'clause'); m.style.marginTop = '8px'; m.textContent = '« ' + e.derniersMots + ' »'; t.appendChild(m); }
        l.appendChild(t);
      });
      n.appendChild(l);
    }

    if (r.titres && r.titres.length) {
      n.appendChild(el('hr', 'trait'));
      n.appendChild(el('span', 'etiquette', 'Titres obtenus'));
      const ul = el('div', 'pile');
      ul.style.marginTop = '10px';
      r.titres.forEach(t => { const s = el('div', 'tampon', t); s.style.marginRight = '8px'; ul.appendChild(s); });
      n.appendChild(ul);
    }

    const rr = U.rangee();
    if (G.tech) rr.appendChild(U.bouton('Reprendre la descente', '', descente));
    rr.appendChild(U.bouton('Repartir d\'un autre nom', 'fantome', () => { reinit(); seuil(); }));
    rr.appendChild(U.bouton('Brûler le registre', 'fantome', () => {
      if (!confirm("Effacer définitivement toutes les morts, tous les titres, toute la mémoire ? Cela ne se défait pas.")) return;
      M().effacer(); JJK.fx.inkClear(); JJK.fx.flash('#fff', 900); reinit(); seuil();
    }));
    n.appendChild(rr);
  }

  function reinit() {
    G.tech = null; G.ref = null; G.corps = null; G.mods = null;
    G.serments = []; G.reponses = []; G.maturation = 0; G.descente = 0;
    G.catalogue = []; G.subliminalMontre = false;
    JJK.fx.setDead(0);
  }

  JJK.ecrans = { seuil, rituel, revelation, serments, descente, registre, consultation, reinit, capSerments, appliquerMaturation, gradeCible, courbe, lienDe, G };
})(window);


/* ==== 78-duel.js ==== */
/* =========================================================================
   RITUEL — mise en scène du duel
   Le moteur décide. Ici, on ne fait que regarder ce qu'il a décidé,
   d'assez près pour que ça fasse quelque chose.
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});
  const { el, clamp, wait, chaos } = JJK.core;
  const U = JJK.ui;

  let D = null, N = {}, verrou = false;
  function G() { return JJK.jeu; }
  function M() { return JJK.memoire; }
  function C() { return JJK.CORPUS || {}; }

  /* ---- lancement -------------------------------------------------------- */
  function lancer(fleau, opts) {
    const g = G();
    const o = opts || {};
    g.corps = JJK.ecrans.appliquerMaturation(g.ref, g.maturation);
    if (!g.mods) g.mods = JJK.serments.agreger(g.serments);

    const joueur = JJK.combat.combattantJoueur(g.tech, g.corps, g.mods, g.graine);
    const R = new JJK.core.Rng('fleau:' + (fleau.id || fleau.nom) + ':' + g.descente);
    const ennemi = JJK.combat.combattantFleau(fleau, g.ref, R, o.courbe || 1);
    if (o.revenant) {
      /* Le revenant hérite de ta loi. Il sait donc s'en servir. */
      ennemi.archetype = fleau.archetype || 'seuil';
      ennemi.domaine = g.tech.domaine;
      ennemi.profil = JJK.combat.profilDe(fleau.grade);
      ennemi.attaque = Math.round(ennemi.attaque * 1.10);
    }
    D = JJK.combat.creer({ seed: g.tech.seed, joueur, ennemi, numero: g.descente });
    N.decor = null;
    JJK.fx.domainClose();
    document.body.classList.remove('domaine-calme');
    const boite = document.getElementById('territoire');
    if (boite) { boite.classList.remove('actif'); boite.innerHTML = ''; }
    D.revenant = !!o.revenant;
    D.fleau = fleau;
    M().ecrire({ descentes: M().lire().descentes + 1 });
    dessiner();
    ouverture(fleau);
  }

  async function ouverture(fleau) {
    JJK.fx.setIntensity(0.55);
    JJK.fx.setHue(D.revenant ? '#f2c14e' : (G().tech.couleur || '#b31217'), '#f2c14e');
    JJK.audio.heartbeat(true, 66);
    journal(fleau.replique ? '« ' + fleau.replique + ' »' : '…', 'important');
    if (fleau.comportement) journal(fleau.comportement, '');
    JJK.fx.shake(0.3);
    JJK.fx.pulse(null, null, null, '#b31217', 1.1);
    if (D.revenant) {
      U.titreFurtif('IL PORTE TON NOM', 5000);
      JJK.fx.invert(180);
      JJK.audio.whisper(1.4);
    }
  }

  /* ---- rendu ------------------------------------------------------------ */
  function dessiner() {
    const n = U.montrer('ecran-duel');
    n.innerHTML = '';
    const g = G();

    const arene = el('div', 'arene');
    const cb = el('div', 'combattants');

    N.joueur = fiche(D.joueur, false);
    N.tour = el('div', 'versus centre');
    N.ennemi = fiche(D.ennemi, true);
    cb.appendChild(N.joueur.boite); cb.appendChild(N.tour); cb.appendChild(N.ennemi.boite);
    arene.appendChild(cb);

    const bas = el('div', 'duel-bas');
    N.actions = el('div', 'actions');
    bas.appendChild(N.actions);

    const colJ = el('div');
    N.journal = el('div', 'journal');
    N.journal.appendChild(el('span', 'etiquette', 'Compte rendu'));
    colJ.appendChild(N.journal);
    bas.appendChild(colJ);
    arene.appendChild(bas);

    if (g.mods.masqueJournal) {
      JJK.fx.mutilate(N.journal, 'page blanche — serment');
      N.journal.style.minHeight = '54px';
    }

    n.appendChild(arene);
    majTout();
  }

  function fiche(c, ennemi) {
    const b = el('div', 'fiche' + (ennemi ? ' ennemi' : ''));
    const nom = el('div', 'nom', c.nom);
    const sous = el('div', 'sous', c.sousTitre || '');
    b.appendChild(nom); b.appendChild(sous);

    const pv = el('div', 'barre pv');
    const fant = el('i', 'fantomatique'); fant.style.position = 'absolute';
    const rempl = el('i');
    pv.appendChild(fant); pv.appendChild(rempl);
    b.appendChild(pv);
    const ch = el('div', 'chiffres');
    const gaucheN = el('span'), droiteN = el('span');
    ch.appendChild(gaucheN); ch.appendChild(droiteN);
    b.appendChild(ch);

    const en = el('div', 'barre energie');
    const enR = el('i');
    en.appendChild(enR);
    b.appendChild(en);
    const ch2 = el('div', 'chiffres');
    const e1 = el('span'), e2 = el('span');
    ch2.appendChild(e1); ch2.appendChild(e2);
    b.appendChild(ch2);

    const st = el('div', 'statuts');
    b.appendChild(st);

    if (ennemi && D.fleau && D.fleau.replique) {
      b.appendChild(el('p', 'replique', '« ' + D.fleau.replique + ' »'));
    }

    const o = { boite: b, nom, sous, pv, rempl, fant, gaucheN, droiteN, enR, e1, e2, st };
    if (ennemi && G().mods.masqueVieEnnemi) {
      const cache = el('div');
      cache.appendChild(pv); cache.appendChild(ch);
      b.insertBefore(cache, en);
      JJK.fx.mutilate(cache, 'œil fermé — serment');
      o.cache = cache;
    }
    return o;
  }

  function majFiche(o, c, ennemi) {
    const p = clamp(c.pv / c.pvMax, 0, 1);
    o.rempl.style.width = (p * 100) + '%';
    setTimeout(() => { o.fant.style.width = (p * 100) + '%'; }, 30);
    o.gaucheN.textContent = ennemi && G().mods.masqueVieEnnemi ? '— / —' : (Math.max(0, c.pv) + ' / ' + c.pvMax);
    o.droiteN.textContent = 'TENSION ' + Math.round(c.tension) + (c.tension >= 100 ? ' ↯' : '');
    o.enR.style.width = clamp(c.en / c.enMax, 0, 1) * 100 + '%';
    o.e1.textContent = 'ÉNERGIE ' + c.en + ' / ' + c.enMax;
    o.e2.textContent = c.domaineTours > 0 ? 'TERRITOIRE ' + c.domaineTours : '';
    o.st.innerHTML = '';
    c.statuts.forEach(s => {
      const t = el('span', 'puce ' + (s.type === 'bon' ? 'bon' : 'mauvais'),
        s.nom + (s.tours < 90 ? ' ' + s.tours : ''));
      t.title = (JJK.combat.STATUTS[s.id] || {}).desc || '';
      o.st.appendChild(t);
    });
  }

  function majTout() {
    majFiche(N.joueur, D.joueur, false);
    majFiche(N.ennemi, D.ennemi, true);
    N.tour.textContent = 'TOUR ' + D.tour;
    majActions();
  }

  function majActions() {
    N.actions.innerHTML = '';
    D.actions().forEach(a => {
      const b = el('button', 'acte' + (a.ultime ? ' ultime' : ''));
      const c = el('span', 'cout', a.cout ? a.cout + ' ÉM' : '—');
      b.appendChild(c);
      b.appendChild(el('b', '', a.nom));
      if (a.sous) b.appendChild(el('small', '', a.sous));
      const d = el('small');
      d.style.cssText = 'display:block;margin-top:6px;font-family:var(--serif);font-size:.92rem;letter-spacing:0;text-transform:none;color:var(--os-mort)';
      d.textContent = a.ok ? a.desc : a.raison;
      b.appendChild(d);
      b.disabled = !a.ok || verrou;
      if (a.interdit) { b.classList.add('mutilated'); b.setAttribute('data-scar', 'retiré par serment'); }
      b.addEventListener('click', () => jouer(a.id));
      N.actions.appendChild(b);
    });
  }

  function journal(texte, cls) {
    if (!N.journal) return;
    if (G().mods && G().mods.masqueJournal) return;
    const p = el('p', cls || '');
    p.innerHTML = texte;
    N.journal.appendChild(p);
    N.journal.scrollTop = N.journal.scrollHeight;
    while (N.journal.children.length > 61) N.journal.removeChild(N.journal.children[1]);
  }

  /* ---- jouer un tour ---------------------------------------------------- */
  async function jouer(id) {
    if (verrou || D.fini) return;
    verrou = true; majActions();
    const ev = D.jouer(id);
    for (let i = 0; i < ev.length; i++) {
      await mettreEnScene(ev[i]);
    }
    if (!D.fini) majDecor();
    majTout();
    verrou = false; majActions();
  }

  const NOM = c => (c === 'joueur' ? (D.joueur.nom || 'Toi') : D.ennemi.nom);

  /* Le décor du territoire est déduit de l'état du duel, jamais posé et
     retiré à la main : deux extensions peuvent se chevaucher, l'une peut
     se briser pendant que l'autre tient, et la précédente version fermait
     le décor de quelqu'un d'autre. */
  function majDecor() {
    const cote = D.joueur.domaineTours > 0 ? 'joueur' : (D.ennemi.domaineTours > 0 ? 'ennemi' : null);
    if (!cote) {
      JJK.fx.domainClose();
      document.body.classList.remove('domaine-calme');
      return;
    }
    const d = N.decor && N.decor[cote];
    if (d) JJK.fx.domainOpen(d);
    document.body.classList.add('domaine-calme');
  }

  async function mettreEnScene(e) {
    const g = G();
    switch (e.t) {
      case 'acte':
        journal('<span class="mono mort">' + (e.qui === 'joueur' ? '▸' : '◂') + '</span> ' +
          NOM(e.qui) + ' — <span class="important">' + esc(e.nom) + '</span>',
          e.qui === 'joueur' ? '' : 'mal');
        await wait(200);
        break;

      case 'degats': {
        const cible = e.cible === 'joueur' ? N.joueur : N.ennemi;
        const c = e.cible === 'joueur' ? D.joueur : D.ennemi;
        cible.boite.classList.remove('frappe');
        void cible.boite.offsetWidth;
        cible.boite.classList.add('frappe');
        JJK.audio.hit(e.gros ? 1.4 : (e.crit ? 1.0 : 0.55));
        if (e.gros) { JJK.fx.slash('#fff6ee', 2); JJK.audio.slash(); }
        JJK.fx.shake(e.gros ? 0.9 : (e.crit ? 0.45 : 0.22));
        JJK.fx.pulse(null, null, e.gros ? 900 : 320, e.cible === 'joueur' ? '#b31217' : (g.tech.couleur || '#b31217'), e.gros ? 1.6 : 0.8);
        if (e.cible === 'joueur') {
          const grav = clamp(e.montant / D.joueur.pvMax, 0, 1);
          JJK.fx.ink(chaos.r(0.15, 0.85) * JJK.fx.size.W, chaos.r(0.15, 0.85) * JJK.fx.size.H, 0.25 + grav * 1.4, '#b31217');
          M().ecrire({ degatsSubis: M().lire().degatsSubis + e.montant });
        } else {
          M().ecrire({ degatsInfliges: M().lire().degatsInfliges + e.montant });
        }
        const masque = e.cible === 'ennemi' && g.mods.masqueVieEnnemi;
        const chiffre = masque ? '—' : e.montant;
        journal((e.dot ? '· ' : '') + NOM(e.cible === 'joueur' ? 'joueur' : 'ennemi') + ' ' + esc(e.verbe || 'encaisse') +
          ' <span class="n">' + chiffre + '</span>' +
          (e.crit ? ' <span class="mono sang">CRITIQUE</span>' : '') +
          (e.surAuBut ? ' <span class="mono or">COUP AU BUT</span>' : '') +
          (e.echo ? ' <span class="mono">ÉCHO</span>' : ''),
          e.cible === 'joueur' ? 'mal' : 'bien');
        majFiche(cible, c, e.cible === 'ennemi');
        await wait(e.gros ? 420 : 240);
        break;
      }

      case 'soin':
        JJK.audio.heal();
        JJK.fx.inkFade(0.22);
        journal(NOM(e.qui) + ' recoud <span class="n">+' + e.montant + '</span>', 'bien');
        majTout();
        await wait(280);
        break;

      case 'statut': {
        const s = JJK.combat.STATUTS[e.id] || { nom: e.id };
        journal('<span class="mono">' + s.nom.toUpperCase() + '</span> sur ' + NOM(e.qui), '');
        JJK.audio.tick(520, 0.05, 0.05);
        majTout();
        await wait(150);
        break;
      }
      case 'statutFin': break;

      case 'revele':
        journal('Tu lis son flux : il prépare <span class="important">' + esc(nomIntention(e.intention)) + '</span>.', 'bien');
        await wait(260);
        break;

      case 'serment':
        JJK.audio.oath();
        JJK.fx.invert(150); JJK.fx.slash('#b31217', 1);
        JJK.fx.ink(null, null, 1.1, '#b31217');
        JJK.fx.shake(0.6);
        M().ecrire({ sermentsPretes: M().lire().sermentsPretes + 1 });
        journal('Serment improvisé. Tu abandonnes <span class="n">' + e.prix + '</span> points de vie ici, sur place.', 'mal');
        await wait(600);
        break;

      case 'second':
        journal('<span class="mono sang">ET ENCORE UNE FOIS.</span>', 'mal');
        JJK.fx.shake(0.35);
        await wait(260);
        break;

      case 'ponction':
        JJK.audio.whisper(0.5);
        journal(NOM(e.qui) + ' te prend <span class="n">' + e.montant + '</span> d\'énergie maudite.', 'mal');
        majTout();
        await wait(240);
        break;

      case 'sursis':
        JJK.fx.flash('#f2c14e', 500);
        journal(NOM(e.qui) + ' aurait dû tomber. <span class="or">Sursis.</span>', 'important');
        await wait(400);
        break;

      case 'domaine':
        await sequenceDomaine(e);
        break;

      case 'clash':
        await sequenceClash(e);
        break;

      case 'domaineBrise':
        JJK.fx.flash('#fff', 900);
        JJK.fx.invert(260);
        JJK.fx.shake(1.4);
        JJK.fx.slash('#fff6ee', 4);
        JJK.audio.hit(1.6);
        majDecor();
        journal('<span class="mono sang">TERRITOIRE BRISÉ</span> — ' + NOM(e.perdant) + ' encaisse <span class="n">' + e.degats + '</span>.', 'important');
        await wait(900);
        break;

      case 'brise':
        JJK.fx.flash('#fff', 1100);
        JJK.fx.shake(1.6);
        majDecor();
        journal('<span class="mono sang">LES DEUX TERRITOIRES SE FENDENT.</span>', 'important');
        await wait(900);
        break;

      case 'domaineFerme':
        journal('Le territoire de ' + NOM(e.qui) + ' se referme.', '');
        majDecor();
        await wait(200);
        break;

      case 'fuite':
        if (e.reussie) { journal('Tu romps le contact. ' + U.voix('domaine_brise', 'La chose te regarde partir.'), 'important'); }
        else journal('Impossible. Il y a quelque chose entre toi et la sortie.', 'mal');
        await wait(400);
        break;

      case 'sablier':
        JJK.fx.invert(600); JJK.fx.flash('#b31217', 1200); JJK.fx.shake(1.5);
        journal('<span class="mono sang">TOUR ' + (e.limite + 1) + '.</span> Ton serment arrive à échéance. Tu t\'écroules de toi-même.', 'mal');
        await wait(1100);
        break;

      case 'tour':
        journal('<span class="mono mort">— tour ' + e.n + ' —</span>', '');
        JJK.fx.setIntensity(clamp(0.4 + (1 - D.joueur.pv / D.joueur.pvMax) * 0.55, 0, 1));
        JJK.audio.setTension(clamp(1 - D.joueur.pv / D.joueur.pvMax, 0, 1));
        JJK.fx.setDead(clamp((1 - D.joueur.pv / D.joueur.pvMax) * 0.55, 0, 0.55));
        await wait(120);
        break;

      case 'fin':
        await finir(e.vainqueur);
        break;
    }
  }

  function nomIntention(i) {
    const a = JJK.combat.ACTIONS.find(x => x.id === i);
    return a ? a.nom : 'quelque chose';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  /* =====================================================================
     L'EXTENSION DU TERRITOIRE
     ===================================================================== */
  function boiteTerritoire() {
    let t = document.getElementById('territoire');
    if (!t) {
      t = el('div'); t.id = 'territoire';
      document.body.appendChild(t);
    }
    return t;
  }

  /* Un joueur qui a déjà vu la cérémonie trois fois a le droit de passer.
     Un clic emporte le reste de la séquence, comme au rituel. */
  function ecouterSaut() {
    const etat = { saute: false };
    const h = () => { etat.saute = true; };
    document.addEventListener('pointerdown', h, true);
    document.addEventListener('keydown', h, true);
    etat.fin = () => {
      document.removeEventListener('pointerdown', h, true);
      document.removeEventListener('keydown', h, true);
    };
    return etat;
  }

  async function sequenceDomaine(e) {
    const g = G();
    const joueur = e.qui === 'joueur';
    const saut = ecouterSaut();
    const souffle = ms => saut.saute ? wait(0) : wait(ms);
    const ecrire = (n, t2, o) => saut.saute
      ? Promise.resolve((n.textContent = t2))
      : JJK.fx.type(n, t2, o);
    const spec = e.spec || (joueur ? g.tech.domaine : D.ennemi.domaine) || {};
    const t = boiteTerritoire();
    t.innerHTML = '';
    t.classList.add('actif');
    const indice = el('div', 'etiquette');
    indice.style.cssText = 'position:absolute;bottom:22px;left:0;right:0;text-align:center;opacity:.4';
    indice.textContent = 'clic — abréger';
    t.appendChild(indice);

    M().ecrire({ domainesOuverts: M().lire().domainesOuverts + 1 });
    JJK.audio.heartbeat(false);
    JJK.audio.domain();
    JJK.fx.setIntensity(1);

    /* --- 1. la convergence : l'air se met à peser ------------------- */
    const sceau = el('canvas');
    sceau.style.cssText = 'width:min(62vmin,420px);height:auto;opacity:0;transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.7,.2,1);transform:scale(.6) rotate(-25deg)';
    t.appendChild(sceau);
    const graineSceau = joueur ? g.tech.seed : ('fleau:' + (D.fleau.id || D.fleau.nom));
    JJK.fx.sigil(sceau, graineSceau, { size: 460, accent: joueur ? (g.tech.couleur || '#b31217') : '#b31217' });
    requestAnimationFrame(() => { sceau.style.opacity = '1'; sceau.style.transform = 'scale(1) rotate(0deg)'; });

    const inc = el('div', 'incantation');
    t.appendChild(inc);
    await ecrire(inc, '領域展開', { speed: 110, sound: false });

    const passes = JJK.fx.reduit() ? 4 : 12;
    for (let i = 0; i < passes && !saut.saute; i++) {
      JJK.fx.shake(0.14 + i * 0.07);
      JJK.fx.pulse(null, null, 120 + i * 70, joueur ? (g.tech.couleur || '#b31217') : '#b31217', 0.5 + i * 0.09);
      await wait(JJK.fx.reduit() ? 70 : 95);
    }

    /* --- 2. la bascule --------------------------------------------- */
    JJK.fx.flash('#ffffff', 1100);
    JJK.fx.invert(220);
    JJK.fx.shake(1.6);
    N.decor = N.decor || {};
    N.decor[joueur ? 'joueur' : 'ennemi'] = {
      seed: graineSceau,
      accent: joueur ? (g.tech.couleur || '#b31217') : '#b31217',
      invert: !joueur,               /* son territoire à lui retourne le monde */
      sigilCanvas: sceau,
    };
    JJK.fx.domainOpen(N.decor[joueur ? 'joueur' : 'ennemi']);
    U.titreFurtif('領域展開', 6000);
    await souffle(240);

    t.innerHTML = '';
    t.appendChild(indice);
    if (!joueur) t.style.color = '#0a0a0c';
    else t.style.color = '';

    const nomFr = el('div', 'nom-dom');
    t.appendChild(nomFr);
    const nomJp = el('div', 'incantation');
    nomJp.style.marginTop = '18px';
    t.appendChild(nomJp);
    await ecrire(nomFr, spec.nom_fr || 'Territoire sans nom', { speed: 26, sound: false });
    if (spec.nom_jp) nomJp.textContent = spec.nom_jp + (spec.romaji ? ' · ' + spec.romaji : '');

    /* --- 3. l'incantation ------------------------------------------- */
    if (spec.incantation) {
      const v = el('div', 'vers');
      t.appendChild(v);
      const vers = String(spec.incantation).replace(/([.;])\s+/g, '$1\n').split(/\n|\s*\/\s*/).filter(Boolean);
      for (const ligne of vers) {
        const p = el('p');
        v.appendChild(p);
        await ecrire(p, ligne.trim(), { speed: 11, sound: false });
      }
    }

    /* --- 4. le coup au but ------------------------------------------ */
    await souffle(320);
    if (spec.effet_garanti) {
      const s = el('div', 'sur');
      const lab = el('div', 'etiquette rouge', 'Coup au but — il ne se refuse pas');
      s.appendChild(lab);
      /* Le coup au but n'est pas une incantation : c'est un constat.
         On ne le scande pas lettre à lettre, on le pose. */
      const p = el('p', 'serif-italique');
      p.style.cssText = 'font-size:1.25rem;margin-top:10px;max-width:44ch;opacity:0;transition:opacity .5s ease';
      p.textContent = spec.effet_garanti;
      s.appendChild(p);
      t.appendChild(s);
      requestAnimationFrame(() => { p.style.opacity = '1'; });
      await souffle(900);
    }
    JJK.fx.slash('#fff6ee', 3);
    JJK.audio.slash();
    JJK.fx.ink(null, null, 1.6, joueur ? '#b31217' : '#e9e2d4');
    await souffle(900);
    saut.fin();

    t.classList.remove('actif');
    majDecor();
    journal('<span class="mono ' + (joueur ? 'or' : 'sang') + '">EXTENSION DU TERRITOIRE</span> — ' +
      esc(spec.nom_fr || '') + ' · ' + e.tours + ' tours.', 'important');
    if (spec.faille && joueur === false) journal('Une sortie existe : ' + esc(spec.faille), '');
    JJK.audio.heartbeat(true, 84);
  }

  async function sequenceClash(e) {
    const saut = ecouterSaut();
    const t = boiteTerritoire();
    t.innerHTML = ''; t.classList.add('actif');
    const h = el('div', 'nom-dom');
    h.style.fontSize = 'clamp(1.6rem,6vw,4rem)';
    t.appendChild(h);
    if (saut.saute) h.textContent = 'DEUX LOIS DANS LA MÊME PIÈCE';
    else await JJK.fx.type(h, 'DEUX LOIS DANS LA MÊME PIÈCE', { speed: 22, sound: false });
    const coups = JJK.fx.reduit() ? 4 : 10;
    for (let i = 0; i < coups && !saut.saute; i++) {
      JJK.fx.invert(60); JJK.fx.shake(1.2); JJK.audio.hit(1.2);
      JJK.fx.slash(i % 2 ? '#b31217' : '#fff6ee', 2);
      await wait(90);
    }
    const r = el('p', 'discret');
    r.style.marginTop = '20px';
    r.innerHTML = '<span class="mono">RAFFINEMENT ' + e.ra + ' — ' + e.rb + '</span>';
    t.appendChild(r);
    await (saut.saute ? wait(0) : wait(600));
    saut.fin();
    t.classList.remove('actif');
    journal('<span class="mono sang">AFFRONTEMENT DE TERRITOIRES</span> — ' + e.ra + ' contre ' + e.rb + '.', 'important');
  }

  /* =====================================================================
     FIN DE DUEL
     ===================================================================== */
  async function finir(vainqueur) {
    const g = G();
    N.decor = null;
    D.joueur.domaineTours = 0; D.ennemi.domaineTours = 0;
    JJK.fx.domainClose();
    document.body.classList.remove('domaine-calme');
    JJK.audio.heartbeat(false);
    JJK.audio.setTension(0.2);
    const t = boiteTerritoire();
    t.classList.remove('actif');

    if (vainqueur === 'joueur' || vainqueur === 'fuite') {
      const gagne = vainqueur === 'joueur';
      JJK.fx.flash(gagne ? '#f2c14e' : '#333', 900);
      JJK.fx.inkFade(0.45);
      journal(gagne ? U.voix('victoire', 'Ce qui te faisait face a cessé de faire face.')
                    : 'Tu sors. Le couloir est plus long qu\'à l\'aller.', 'important');
      const r = M().lire();
      M().ecrire(gagne ? { victoires: r.victoires + 1 } : { fuites: r.fuites + 1 });
      if (gagne) {
        g.maturation++; g.descente++;
        titres();
      }
      await wait(1400);
      ecranApres(gagne);
    } else {
      await mort();
    }
  }

  function ecranApres(gagne) {
    const n = U.montrer('ecran-apres');
    n.innerHTML = '';
    const g = G();
    n.appendChild(el('span', 'etiquette rouge', gagne ? 'Fléau exorcisé' : 'Contact rompu'));
    n.appendChild(el('h1', 'titre-rituel', gagne ? 'Il ne reste <em>rien</em> à ramasser' : 'Tu es <em>sorti</em>'));
    const p = el('p');
    p.style.cssText = 'max-width:60ch;color:var(--os-faible);font-weight:300';
    p.textContent = gagne
      ? 'Ta technique s\'est un peu ouverte. Maturation ' + g.maturation + ' : +' + Math.round(9 * g.maturation) + ' % d\'attaque, +' + Math.round(7 * g.maturation) + ' % de vitalité. Ce qui t\'attend en dessous a grandi aussi.'
      : 'Fuir ne coûte rien tout de suite. C\'est plus tard que ça se paie : le fléau que tu as laissé derrière toi continue, lui.';
    n.appendChild(p);
    const r = U.rangee();
    r.appendChild(U.bouton('Descendre encore', 'rouge', () => JJK.ecrans.descente()));
    r.appendChild(U.bouton('Modifier les serments', 'fantome', () => JJK.ecrans.serments()));
    r.appendChild(U.bouton('Registre', 'fantome', () => JJK.ecrans.registre()));
    n.appendChild(r);
  }

  function titres() {
    const g = G(), r = M().lire();
    const src = ((C().nomenclature || {}).titres_joueur) || [];
    const conditions = [
      [r.victoires >= 1, 0], [r.victoires >= 5, 1], [g.serments.length >= 3, 2],
      [r.domainesOuverts >= 1, 3], [r.morts >= 1, 4], [r.sermentsPretes >= 3, 5],
      [g.maturation >= 8, 6], [r.victoires >= 10, 7],
    ];
    conditions.forEach(([ok, i]) => {
      if (!ok || !src[i]) return;
      if (M().accorderTitre(src[i].titre)) {
        journal('<span class="mono or">TITRE — ' + esc(src[i].titre) + '</span>', 'important');
      }
    });
  }

  async function mort() {
    JJK.ui.calmer();
    const g = G();
    JJK.fx.setDead(1);
    JJK.fx.invert(900);
    JJK.fx.flash('#b31217', 1600);
    JJK.fx.ink(null, null, 3, '#b31217');
    JJK.fx.ink(null, null, 2.4, '#b31217');
    JJK.fx.shake(1.4);
    JJK.audio.hit(1.6);
    JJK.audio.stopDrone(2.5);
    U.titreFurtif('— ' + (g.graine || '') + ' —', 9000);
    await wait(1500);

    const derniersMots = U.voix('mort', "Ce n'était pas assez.");
    const fiche = {
      graine: g.tech.seed, nom: g.graine, technique: g.tech.nom, nomJp: g.tech.nomJp,
      tueur: D.ennemi.nom, tour: D.tour, grade: (g.grade || {}).grade || '?',
      serments: g.serments.map(s => s.nom), derniersMots, archetype: g.tech.archetype,
    };
    const efface = g.mods && g.mods.effaceToutALaMort;
    if (!efface) M().inhumer(fiche);

    const n = U.montrer('ecran-mort');
    n.innerHTML = '';
    JJK.fx.setIntensity(0.1);

    const flux = el('div');
    n.appendChild(flux);
    await U.dire(flux, derniersMots, { forte: true, apres: 700 });
    await U.dire(flux, g.graine + ', porteur de « ' + g.tech.nom + ' », est tombé au tour ' + D.tour + ' devant ' + D.ennemi.nom + '.', { apres: 500 });

    if (efface) {
      await U.dire(flux, 'Tu avais signé le Serment de la Trace Effacée.', { forte: true, apres: 600 });
      await U.dire(flux, "Le registre n'écrira rien. Il n'y aura pas eu de toi ici.", { apres: 500 });
      M().effacer();
      JJK.fx.inkClear();
      JJK.fx.flash('#fff', 1400);
      await wait(900);
      await U.dire(flux, 'Tout est effacé. Y compris les morts d\'avant, qui ne t\'avaient rien demandé.', { forte: true, apres: 400 });
    } else {
      await U.dire(flux, "Le registre t'a inscrit. Ce que tu étais reviendra te chercher à la prochaine descente.", { forte: true, apres: 400 });
    }

    const r = U.rangee();
    r.appendChild(U.bouton('Reprendre sous le même nom', 'rouge', () => {
      JJK.fx.setDead(0); JJK.audio.startDrone();
      const gg = G();
      gg.maturation = Math.max(0, gg.maturation - 2);
      gg.descente = Math.max(0, gg.descente - 1);
      JJK.ecrans.descente();
    }));
    r.appendChild(U.bouton('Changer de nom', 'fantome', () => {
      JJK.fx.setDead(0); JJK.audio.startDrone();
      JJK.ecrans.reinit(); JJK.ecrans.seuil();
    }));
    r.appendChild(U.bouton('Registre', 'fantome', () => { JJK.fx.setDead(0); JJK.ecrans.registre(); }));
    n.appendChild(r);
  }

  JJK.duel = { lancer, get D() { return D; } };
})(window);


/* ==== 80-boot.js ==== */
/* =========================================================================
   RITUEL — allumage
   ========================================================================= */
(function (root) {
  'use strict';
  const JJK = (root.JJK = root.JJK || {});

  function demarrer() {
    if (!document.getElementById('stage')) {
      const s = document.createElement('div');
      s.id = 'stage';
      document.body.appendChild(s);
    }
    JJK.fx.mount();
    JJK.ui.barre();
    JJK.ui.titreOnglet();
    JJK.ui.murmures(false);

    /* Le son attend un geste : les navigateurs l'exigent, et le rituel
       préfère de toute façon qu'on le touche avant de lui parler. */
    const eveil = () => {
      JJK.audio.unlock();
      const r = JJK.memoire.lire();
      if (r.sonCoupe) JJK.audio.toggleMute(true);
      JJK.ui.majSon();
      document.removeEventListener('pointerdown', eveil);
      document.removeEventListener('keydown', eveil);
    };
    document.addEventListener('pointerdown', eveil);
    document.addEventListener('keydown', eveil);

    /* Un lien porte un nom : on ouvre alors le registre à cette page-là. */
    const m = /[#&?]g=([^&]+)/.exec(location.hash + location.search);
    let graine = null;
    if (m) { try { graine = decodeURIComponent(m[1]); } catch (e) { graine = m[1]; } }
    if (graine && graine.trim()) JJK.ecrans.consultation(graine.trim().slice(0, 40));
    else JJK.ecrans.seuil();

    /* raccourcis */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && JJK.ui.actif() !== 'ecran-duel') JJK.ecrans.registre();
      if (e.key >= '1' && e.key <= '9' && JJK.ui.actif() === 'ecran-duel') {
        const b = document.querySelectorAll('#ecran-duel .acte');
        const n = b[parseInt(e.key, 10) - 1];
        if (n && !n.disabled) n.click();
      }
    });

    /* L'onglet quitté n'est pas un onglet oublié. */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        JJK.ui.titreOnglet('… continue sans toi');
      } else {
        JJK.ui.titreOnglet();
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})(window);

</script>
