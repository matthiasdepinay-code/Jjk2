oupeSon=true irréversible (persisté) ; le réglage audio est retiré du menu ; le repère sonore de fin de battement n'est plus émis","gain_code":"critBonus +0.18","danger":2},{"id":"marge-vierge","nom":"Le Serment de la Marge Vierge","clause":"Je ne demanderai pas le détail. Ce qui m'a été fait m'a été fait dans les règles, et les règles ne se relisent pas.","restriction":"Le journal de combat est vidé et ne se remplit plus : tu ne sauras plus quelle technique t'a touché, ni ce qu'elle a prélevé.","gain":"+1 énergie par tour et +20 % de dégâts.","restriction_code":"masqueJournal=true ; les lignes d'événement ne sont plus poussées dans le registre visible (les événements restent au moteur)","gain_code":"energieBonus +1 ; degatsMult ×1.20","danger":3},{"id":"sablier-retourne","nom":"Le Serment du Sablier Retourné","clause":"J'aurai fini avant le huitième battement. Au neuvième, je m'écroulerai sans qu'on ait à me pousser.","restriction":"Si un duel atteint le neuvième tour, tu meurs sur place, quelle que soit ta structure restante et quel que soit l'état de l'adversaire.","gain":"×1,55 sur tes dégâts et +2 énergie par tour.","restriction_code":"limiteTours=8 ; à l'ouverture du tour 9, PV joueur := 0, cause de mort 'échéance' inscrite à l'ossuaire","gain_code":"degatsMult ×1.55 ; energieBonus +2","danger":5},{"id":"puits-sec","nom":"Le Serment du Puits Sec","clause":"Je ne puiserai qu'au fond. Le fond a l'avantage d'être propre, et de se voir venir.","restriction":"Ta réserve maximale d'énergie maudite perd 3 points. Ton domaine devient presque impayable.","gain":"Chaque technique coûte 1 énergie de moins, sans jamais descendre sous 1.","restriction_code":"enMaxBonus −3 ; réserve courante écrêtée au nouveau maximum immédiatement","gain_code":"remise +1 sur le coût de toute action (plancher 1)","danger":3},{"id":"mains-nues","nom":"Le Serment des Mains Nues","clause":"Ma loi restera pliée dans son étui. J'ai deux mains, et personne au Bureau ne les a jamais comptées.","restriction":"Ta technique innée t'est interdite tant que tes murs ne sont pas ouverts. Tu descends les quatre premiers battements sans elle.","gain":"Tes frappes renforcées ne coûtent rien et frappent trois fois plus fort.","restriction_code":"interdit=['technique'] hors état domaineActif ; la levée est vérifiée à chaque déclaration","gain_code":"frappeMult ×3.0 ; coût de la frappe renforcée := 0","danger":4},{"id":"trace-effacee","nom":"Le Serment de la Trace Effacée","clause":"Si je tombe, qu'il ne reste ni le nom, ni le grade, ni l'heure. Le Bureau n'aura rien à classer et personne n'aura à se souvenir de la manière.","restriction":"À ta prochaine mort, l'ossuaire est détruit pour de bon : graines, lois exorcisées, greffes, durées écoulées. Il n'y aura pas de deuxième visite, et rien ne t'attendra pour te dire depuis combien de temps tu as cessé.","gain":"×1,6 sur tes dégâts et +30 % de points de vie maximum.","restriction_code":"effaceToutALaMort=true ; à l'événement mort : localStorage.removeItem sur toutes les clés du registre, dans un try/catch, avant l'écran de fin","gain_code":"degatsMult ×1.60 ; pvMaxMult ×1.30","danger":5},{"id":"formule-unique","nom":"Le Serment de la Formule Unique","clause":"Je ne referai jamais deux fois le même geste. Ce qui se répète s'apprend, et ce qui s'apprend finit par m'être rendu.","restriction":"Tu ne peux pas déclarer deux tours de suite la même action. L'emplacement se verrouille dès qu'il a servi, y compris quand c'est le seul que tu peux payer.","gain":"+35 % de dégâts et +10 points de critique.","restriction_code":"pasDeRepetition=true ; l'action égale à derniereAction est refusée à la déclaration et grisée dans l'anneau","gain_code":"degatsMult ×1.35 ; critBonus +0.10","danger":4},{"id":"territoire-unique","nom":"Le Serment du Lieu Ouvert Une Fois","clause":"J'ouvrirai mes murs une fois par corps. Un lieu qu'on rouvre n'est plus un lieu : c'est un couloir, et un couloir se traverse.","restriction":"Une seule extension du territoire par duel, et jamais deux duels de suite. Le second duel, tu le fais à découvert.","gain":"Ton domaine tient 2 battements de plus et son sûr-au-but compte double à chaque battement.","restriction_code":"domaineUnique=true ; verrou reporté au duel suivant (flag persisté entre duels)","gain_code":"domaineTours +2 ; domaineMult ×2.0 sur le sûr-au-but par battement","danger":3},{"id":"dette-rendue","nom":"Le Serment de la Dette Rendue","clause":"Je tiens le compte exact de ce qu'on me prend, et je le rends au taux dont personne ne m'a demandé s'il me convenait.","restriction":"Tu subis 45 % de dégâts en plus. Un enchaînement de trois coups adverses te tue à partir de la moitié de ta structure.","gain":"Chaque coup encaissé ajoute +30 % cumulatifs à ta prochaine attaque.","restriction_code":"degatsRecusMult ×1.45","gain_code":"rancune +0.30 : rancuneCourante += 0.30 à chaque coup subi, appliquée en multiplicateur à la prochaine attaque puis remise à 0","danger":4},{"id":"nom-saisi","nom":"Le Serment du Nom Saisi","clause":"Je n'appliquerai rien que je ne puisse écrire sans faute, à la main, pendant qu'on me frappe.","restriction":"Avant chaque technique, tu dois retaper au clavier le nom exact de ta loi, kanji exclus, en moins de quatre secondes. Une faute, une lettre en trop, un retard : le tour est perdu et l'énergie est prélevée quand même.","gain":"+40 % de dégâts de technique et +1 énergie par tour.","restriction_code":"saisieNomRequise=true : modale de saisie 4000 ms avant toute action de type technique ; comparaison stricte après normalizeSeed ; échec → action := 'passe', coût prélevé","gain_code":"degatsTechniqueMult ×1.40 ; energieBonus +1","danger":4},{"id":"tour-blanc","nom":"Le Serment du Tour Blanc","clause":"Le premier battement ne m'appartient pas. Je le laisse à celui qui a eu la politesse de se déplacer.","restriction":"Au premier tour de chaque duel, ton anneau reste fermé : tu ne déclares rien, tu encaisses, et tu regardes.","gain":"À partir du deuxième tour, +50 % de dégâts jusqu'à la fin du duel.","restriction_code":"tour===1 : toutes les actions verrouillées, action forcée 'attendre', aucune garde possible ; dégâts subis au taux normal","gain_code":"degatsMult ×1.50 appliqué à partir du tour 2","danger":3},{"id":"fenetre-etroite","nom":"Le Serment de la Fenêtre Étroite","clause":"Je réduis à un battement de cil l'instant où j'ai raison. En échange, j'aurai raison deux fois dans la même descente.","restriction":"La fenêtre du coup noir passe de 180 ms à 70 ms. Presque tous tes essais tomberont à côté, et un essai raté te coûte ta garde du tour.","gain":"Deux coups noirs autorisés par duel au lieu d'un, et +25 % sur leurs dégâts.","restriction_code":"fenetreCoupNoir=70 ms ; échec de fenêtre → gardeIndisponible pour le tour en cours","gain_code":"coupsNoirsParDuel=2 ; degatsCoupNoirMult ×1.25","danger":3},{"id":"reserve-aveugle","nom":"Le Serment de la Réserve Aveugle","clause":"Je cesse de compter ce qu'il me reste. Compter, c'est déjà choisir le battement où l'on s'arrêtera.","restriction":"Ta propre réserve d'énergie n'est plus chiffrée ni graduée : des blocs pleins, rien d'autre. Tu déclareras des techniques que tu ne peux pas payer, et elles échoueront en te prenant le tour.","gain":"+4 de réserve maximale et +1 énergie par tour.","restriction_code":"masqueEnergieJoueur=true : valeur numérique et graduation retirées du DOM ; les actions trop chères restent cliquables, échouent à la résolution et consomment le tour","gain_code":"enMaxBonus +4 ; energieBonus +1","danger":4},{"id":"usure-inscrite","nom":"Le Serment de l'Usure Inscrite","clause":"Chaque battement me retire deux lignes, et je signe pour que ces lignes ne soient jamais réécrites.","restriction":"À la fin de chaque tour, ton maximum de points de vie perd 2 points, définitivement, dans ce duel et dans tous ceux qui suivront. Un duel de seize tours te coûte trente-deux points que rien ne rendra.","gain":"+6 % de dégâts cumulatifs par tour écoulé, sans plafond jusqu'à la fin du duel.","restriction_code":"fin de tour : pvMax −2 (persisté, plancher 1) ; PV courants écrêtés au nouveau maximum","gain_code":"degatsMult ×(1 + 0.06 × toursEcoules), réinitialisé au duel suivant","danger":5},{"id":"dossier-ouvert","nom":"Le Serment du Dossier Ouvert","clause":"Je laisse lire mes annotations. Qu'on sache où je me suis trompé, puisque je saurai enfin où il se trompe.","restriction":"Tes deux failles sont affichées à l'adversaire dès le premier battement : il frappe 25 % plus fort et vise en priorité ta condition d'énonciation, qu'il coupera dès qu'il en aura les moyens.","gain":"Les quatre cases d'hypothèse sont cochées d'office : la faille rituelle et la faille arithmétique de l'adversaire s'affichent au tour 1, sans coûter un seul battement d'avance.","restriction_code":"degatsRecusMult ×1.25 ; IA adverse : priorité absolue aux actions ciblant la condition d'énonciation du joueur","gain_code":"casesHypothese := 4 résolues gratuitement ; failles adverses (rituelle + arithmétique) révélées au tour 1 ; aucun battement d'avance cédé au fléau","danger":4}]},"domaines":{"domaines":[{"id":"hyotenbo","nom_fr":"Le Relevé au Point de Congélation","nom_jp":"氷点簿","romaji":"Hyōtenbo","paysage":"Une chaufferie municipale éteinte depuis l'hiver, les tuyaux blanchis de givre jusqu'aux brides, les vannes prises. Devant chaque occupant, un thermomètre à alcool planté dans l'air, sans support, qui descend à la vitesse d'une signature.","effet_garanti":"Toute chaleur que vous avez cédée depuis votre naissance est portée au registre, additionnée, et retranchée de ce que votre corps a désormais le droit de tenir. Ce n'est pas une blessure : c'est une écriture, et rien n'efface une écriture.","effet_code":"À l'ouverture, mesure la structure maximale M de chaque occupant, imprime relevé = plancher(M × 0,45) et pose structure_max := relevé, conservé dans la sauvegarde après la fermeture. Ensuite −4 structure par battement. Entretien 11 RÉSERVE / battement.","incantation":"Relevé du jour, établi sans témoin.\nPortez au débit la chaleur donnée aux mains, aux draps, à l'air.\nLe solde figure en tête de page.\nLe solde ne se conteste pas.","faille":"Le registre n'inscrit que la chaleur cédée à l'air. Une paume à plat sur la fonte froide et c'est la fonte qui figure au relevé : on ressort avec les doigts détruits et la ligne inchangée."},{"id":"juden","nom_fr":"Le Palais des Charges Non Déclarées","nom_jp":"重殿","romaji":"Jūden","paysage":"Une consigne de gare aux casiers tous ouverts, valises éventrées, courroies pendantes. Au centre, une balance à fléau assez grande pour un homme, dont le plateau vide est déjà au plus bas.","effet_garanti":"Ici, chaque chose pèse ce qu'elle a pesé de plus lourd un jour : le bras, la tête, la faute. Nul ne se déclare plus léger que son maximum, et le maximum n'oublie pas.","effet_code":"Chaque occupant passe à une action par battement au lieu de deux ; esquive fixée à 0 tant que le poids déclaré est supérieur à zéro. Le poids monte de 1 par battement, plafond 6 ; à 6, l'occupant reste au sol un battement sur deux. Entretien 9 RÉSERVE / battement.","incantation":"Déclarez vos charges. Vous ne l'avez jamais fait.\nLa balance retient le plus lourd de vos jours et l'appelle votre poids.\nAvancez maintenant, si vous savez encore où sont vos genoux.","faille":"Le fléau pèse un corps entier ou rien. Entrer en deux masses tenues par un serment — un membre laissé dehors, une main sectionnée sur le seuil — ne présente que des moitiés, et la loi n'a pas de ligne pour la moitié d'un homme."},{"id":"seikan","nom_fr":"L'Anneau de l'Élan Confisqué","nom_jp":"勢環","romaji":"Seikan","paysage":"Un dépôt de tramways à trois heures du matin : six motrices sans conducteur tournent sur une boucle unique, toujours à la même vitesse, et le rail est poli jusqu'au miroir sur toute sa longueur.","effet_garanti":"Aucun mouvement ne peut être plus vif que celui qui l'a précédé. L'élan acquis est retenu au seuil et n'est rendu à personne, pas même à celui qui l'a produit.","effet_code":"Les dégâts et la vitesse de chaque action sont plafonnés à la valeur de l'action précédente −1, plancher 1. Chaque cran refusé verse +2 RÉSERVE au porteur du domaine. Entretien 8 RÉSERVE / battement.","incantation":"Ce qui prend de la vitesse ici la laisse au premier tour.\nL'anneau garde l'élan, l'anneau ne rend rien.\nFrappez : votre coup d'avant est déjà votre plafond.","faille":"Le plafond se calcule sur l'action précédente. Un coup porté à vide, dans l'air, ne vaut rien : la loi ne sait pas retrancher un cran à rien, et le compteur repart entier au battement suivant."},{"id":"onkoku","nom_fr":"La Geôle de Ce Qui a Déjà Été Dit","nom_jp":"音獄","romaji":"Onkoku","paysage":"Un standard téléphonique désaffecté, quarante cabines capitonnées ouvertes sur la même travée. Dans chaque combiné décroché, votre voix, avec deux secondes de retard, disant ce que vous n'avez pas encore dit.","effet_garanti":"Tout son émis ici demeure et se rejoue à chaque battement, en couches, sans s'atténuer. On ne finit jamais de payer ce qu'on a fait entendre.","effet_code":"Chaque action bruyante inscrit une trace, plafond 12. À chaque battement, tous les occupants subissent 2 × nombre de traces ; le porteur n'en subit que la moitié, arrondie au supérieur. Entretien 10 RÉSERVE / battement.","incantation":"Vous avez parlé, c'est consigné.\nLa phrase revient à l'heure, puis à l'heure d'après, en couches.\nÉcoutez-vous jusqu'à ce que cela cesse.\nCela ne cesse pas.","faille":"Le silence n'ajoute rien, mais les couches déjà écrites tuent quand même. La sortie tient à l'opposition de phase : parler exactement sur le rejeu, syllabe contre syllabe, efface une couche par battement."},{"id":"eitei","nom_fr":"Le Jardin où les Ombres Restent à leur Place","nom_jp":"影庭","romaji":"Eitei","paysage":"Une cour d'école à midi, sans enfants. Les ombres sont peintes au sol à l'endroit exact de la récréation d'hier, et le soleil, arrêté, ne les déplacera plus.","effet_garanti":"Aucune ombre ne suit son corps. Tout écart entre l'homme et l'ombre qu'il a portée s'inscrit dans les tendons, au pas près.","effet_code":"Déplacement et esquive supprimés (probabilité 0). Chaque tentative de déplacement inflige 5 + 2 par pas d'écart, cumulatif jusqu'à la fin du duel. Entretien 7 RÉSERVE / battement.","incantation":"Le soleil est arrêté, la cour est peinte.\nVotre ombre est restée où elle a joué hier.\nÉloignez-vous d'elle : ce sont vos tendons qui mesurent.","faille":"Une ombre exige une surface pour tomber. Se tenir sur une grille, un caillebotis, une arête de rail — là où l'ombre se rompt en morceaux — ne laisse plus rien à mesurer à la loi."},{"id":"ketsuden","nom_fr":"Le Salon des Transfusions Réciproques","nom_jp":"血殿","romaji":"Ketsuden","paysage":"Une salle de don du sang aux fauteuils inclinés, poches suspendues, aucune étiquette sur aucune poche. Les tubes ne descendent pas : ils remontent, doucement, vers les bras.","effet_garanti":"Le sang sorti retourne à la main qui l'a fait sortir. Chaque plaie ouverte ici alimente celui qui l'a ouverte, la vôtre comprise.","effet_code":"Chaque saignement actif draine 6 structure / battement à son porteur et en rend 4 à l'auteur de la blessure. Les blessures infligées par le porteur du domaine comptent double dans les deux sens. Entretien 12 RÉSERVE / battement.","incantation":"Le sang qui sort d'ici retourne à la main qui l'a ouvert.\nOuvrez donc. Ouvrez encore.\nVous alimentez ce qui vous vide.","faille":"La loi ne connaît que le sang sorti. Cautériser à chaud, ou frapper à l'os sans jamais rompre la peau, laisse le circuit vide : le domaine se paie alors tout seul, sur sa propre réserve."},{"id":"shokubo","nom_fr":"Le Registre de l'Usure Anticipée","nom_jp":"蝕簿","romaji":"Shokubo","paysage":"Un atelier d'horloger dont les tiroirs sont classés par degré d'usure. Sur le drap vert, des pièces de cuivre se creusent pendant qu'on les regarde, et la limaille tombe sans bruit.","effet_garanti":"Tout ce qui sert ici s'use maintenant plutôt que plus tard. Une lame, une articulation, une résolution : la loi avance leur fin et l'inscrit à sa date.","effet_code":"Chaque objet, technique et articulation employée perd 1 rang d'usure par battement ; au cinquième rang, hors service, définitif dans la sauvegarde. CONTRÔLE −0,5 par battement. Entretien 9 RÉSERVE / battement.","incantation":"Rien n'attend son usure.\nCe qui sert s'use maintenant, à la vue de tous.\nComptez les rangs : cinq, et l'outil cesse d'être un outil.\nVotre poignet est un outil.","faille":"L'usure se compte sur un geste mené à son terme. Un mouvement haché, arrêté puis repris avant l'appui final, n'accumule jamais un rang complet : on se bat mal, on se bat court, on ressort avec ses mains."},{"id":"kyokan","nom_fr":"L'Anneau du Retour Obligé","nom_jp":"距環","romaji":"Kyokan","paysage":"Une piste de cendrée sous une neige fine, une seule ligne blanche tracée en travers. C'est le départ et c'est l'arrivée, et rien sur la piste ne permet de les distinguer.","effet_garanti":"Toute distance parcourue est refaite en sens inverse à la fin du battement. On revient au point d'entrée avec la fatigue du trajet et rien d'autre.","effet_code":"En fin de battement, chaque occupant est replacé sur sa case d'entrée. FATIGUE +1 par tranche de trois pas effectués ; à 8 FATIGUE, une action sur deux échoue. Entretien 8 RÉSERVE / battement.","incantation":"La ligne blanche est le départ, la ligne blanche est l'arrivée.\nCourez : on vous rendra à votre place, la fatigue en supplément.\nIl n'y a pas d'ailleurs à gagner ici.","faille":"Le retour se calcule sur des distances distinctes. Deux occupants qui échangent leurs positions ont parcouru la même longueur en sens contraire : ex æquo, la loi ne sait plus qui rendre où et les laisse tous deux où ils sont."},{"id":"shokucho","nom_fr":"Le Registre du Dernier Contact","nom_jp":"触帳","romaji":"Shokuchō","paysage":"Le vestiaire d'un bain public à la fermeture. Sur chaque casier, l'empreinte grasse d'une main qui n'est plus là ; la buée reste collée au métal et refuse de tomber.","effet_garanti":"Tout ce que vous avez touché depuis l'aube se tient ici et vous touche en retour, en remontant l'ordre, du plus récent au premier.","effet_code":"Compte les contacts du jour, plafond 20. Dégâts par battement = contacts ÷ 2, arrondi au supérieur. +1 contact chaque fois qu'un occupant touche quoi que ce soit dans le domaine, le sol compris. Entretien 10 RÉSERVE / battement.","incantation":"Depuis l'aube, tout ce que vos mains ont pris est venu.\nLes poignées, les manches, la nuque de quelqu'un.\nElles vous touchent à leur tour, en remontant.","faille":"Un contact qu'on ne quitte pas n'est jamais un dernier contact. Rester agrippé au même barreau, sans jamais lâcher, gèle le registre à sa valeur d'entrée : il faut seulement se battre d'une seule main."},{"id":"jocho","nom_fr":"Le Rideau des Rangs d'Arrivée","nom_jp":"序帳","romaji":"Jochō","paysage":"Un bureau de tri postal la nuit : le tapis avance, chaque colis reçoit son numéro d'ordre au tampon. L'un des colis porte votre numéro et il est déjà passé sous la presse.","effet_garanti":"L'ordre d'arrivée est fixé au seuil et ne change plus. Le dernier n'agit qu'un battement sur deux, et seule une mort fait remonter la file.","effet_code":"Initiative verrouillée sur l'ordre d'entrée : le rang n ne peut agir qu'après tous les rangs inférieurs. Dernier rang : une action tous les deux battements et −25 % de dégâts. Chaque mort libère un rang, tous remontent d'un cran. Entretien 6 RÉSERVE / battement.","incantation":"Le tapis avance, les numéros sont tamponnés.\nVous êtes classé, et le classement ne se discute plus.\nLe dernier attend son tour ; le dernier attend deux tours.\nSeul un mort libère un rang.","faille":"Le registre ne classe que les vivants. Un battement complet sans action, sans souffle, cœur ralenti sous serment, vous retire de la file : on y revient au dernier rang, mais on y revient après avoir vu jouer tout le monde."},{"id":"saigoku","nom_fr":"La Geôle des Échéances","nom_jp":"債獄","romaji":"Saigoku","paysage":"Une salle des scellés, enveloppes kraft alignées par date d'ouverture, ficelées, cachetées. Chacune est gonflée par quelque chose qui n'a pas encore eu lieu et qui bouge un peu.","effet_garanti":"Rien ne se produit à l'instant où on le fait. Coup, soin, rupture : tout est mis sous enveloppe et arrive au huitième battement, intérêts compris.","effet_code":"Tous les dégâts et soins sont différés en dépôt et s'appliquent au battement 8 à 150 %. Jusque-là, structure figée. Si le domaine se referme avant l'échéance, le dépôt s'applique quand même, à 200 %, à celui qui l'a produit.","incantation":"Rien n'a lieu à l'instant où vous le faites.\nTout part sous enveloppe, datée du huitième battement.\nFrappez, soignez, rompez : on ouvrira tout ensemble.","faille":"L'échéance est datée, donc prévisible. Tenir jusqu'au septième battement sans rien déposer — ne frapper personne, ne se soigner de rien — laisse une seule enveloppe vide quand toutes s'ouvrent : la sienne."},{"id":"keiden","nom_fr":"Le Palais des Filiations Reconnues","nom_jp":"系殿","romaji":"Keiden","paysage":"Une salle de généalogie sous verrière, registres paroissiaux ouverts à la même page, tous. Sur chaque page, la même écriture, qui n'appartient à personne de vivant.","effet_garanti":"Nulle blessure ne reste sur un seul corps : elle remonte la lignée jusqu'à trouver un vivant, et à défaut redescend sur celui qui ressemble le plus au blessé.","effet_code":"40 % de tout dégât reçu est transféré au parent le plus proche présent ; à défaut au porteur du domaine, qui en garde 20 % et en renvoie 20 % à l'attaquant. Le transfert ignore les résistances et les serments défensifs. Entretien 11 RÉSERVE / battement.","incantation":"Aucune blessure ne reste sur un seul corps.\nElle remonte la ligne jusqu'au premier vivant qui vous ressemble.\nNommez celui qui paiera : vous l'avez nommé en naissant.","faille":"La remontée exige un lien reconnu. Un nom de famille renié par serment gravé, ou jamais déclaré, ne présente aucune marche à gravir : le dégât reste entier là où il est tombé, ce qui est rarement une bonne nouvelle, seulement une nouvelle exacte."},{"id":"tsutei","nom_fr":"Le Jardin des Douleurs Mises en Commun","nom_jp":"痛庭","romaji":"Tsūtei","paysage":"Un dispensaire de nuit, douze lits, une seule perfusion partagée par des tubes qui passent d'un bras à l'autre et se resserrent à mesure que le niveau descend.","effet_garanti":"Il n'y a plus qu'une douleur pour tout le monde. Elle ne diminue pas : elle se divise, et chaque corps qui tombe augmente la part de ceux qui restent debout.","effet_code":"Jauge unique partagée : tous les dégâts y sont versés. À chaque battement, la jauge se répartit à parts égales entre les occupants conscients, +3 par occupant tombé. Entretien 12 RÉSERVE / battement.","incantation":"Il n'y a qu'une douleur ici, et elle est à tout le monde.\nOn la divise par le nombre de ceux qui tiennent debout.\nChaque chute augmente la part des autres.","faille":"Le partage se fait entre conscients, et le porteur en est un. Perdre connaissance volontairement un battement retire une part au dénominateur : l'arithmétique se retourne, et c'est lui qui porte la somme entière."},{"id":"sokugoku","nom_fr":"La Geôle de l'Air Compté","nom_jp":"息獄","romaji":"Sokugoku","paysage":"Une salle de contrôle de mine, les cages arrêtées à mi-puits, les lampes alignées sur leur crochet. Sur un fil, trois cages à canaris dont les oiseaux respirent exactement en cadence avec vous.","effet_garanti":"Chacun entre avec un nombre de souffles fixé au seuil. Rien ici ne se fait sans en dépenser un, et le compte est affiché au-dessus des têtes.","effet_code":"14 souffles à l'entrée par occupant, 20 pour le porteur. Une action coûte 1, un déplacement 1, une technique 3. À 0 souffle : −8 structure par battement et CONTRÔLE divisé par deux. Entretien 9 RÉSERVE / battement.","incantation":"Vous êtes entrés avec quatorze souffles.\nChaque geste en prend un, chaque technique en prend trois.\nLe compte est affiché au-dessus de vos têtes.\nNe parlez pas pour rien.","faille":"L'air compté est l'air d'ici. Un souffle emprunté à autrui — bouche contre bouche, ou une poche scellée apportée du dehors — n'a pas de ligne au registre et ne décrémente rien."},{"id":"shocho","nom_fr":"Le Rideau des Cicatrices Rouvertes","nom_jp":"傷帳","romaji":"Shōchō","paysage":"Un cabinet de suture aux instruments encore tièdes, un bocal de fils retirés à d'autres, et sur le drap l'empreinte d'un corps qui vient à peine de se lever.","effet_garanti":"Aucune cicatrice n'est finie. Chacune redevient la plaie qu'elle a été, à la date exacte, dans l'ordre où on vous les a faites.","effet_code":"À l'ouverture, compte les cicatrices C de chaque occupant depuis la sauvegarde : perte immédiate de 3 × C structure, puis 1 × C par battement. Les soins d'énergie inversée sont plafonnés à 50 % tant que le domaine tient. Entretien 10 RÉSERVE / battement.","incantation":"Aucune cicatrice n'est finie.\nElles rouvrent dans l'ordre où on vous les a faites, à la date exacte.\nTenez la première : c'est la plus ancienne, elle saigne encore.","faille":"Une plaie ouverte n'est pas une cicatrice. Se rouvrir soi-même la plus ancienne avant le seuil la retire du compte, interrompt la série en tête, et tout le décompte glisse d'un cran vers le vide."},{"id":"kiro","nom_fr":"Le Réfectoire des Parts Non Servies","nom_jp":"飢廊","romaji":"Kirō","paysage":"Un réfectoire d'internat sans fenêtres, deux cents couverts mis au cordeau, cloches d'argent posées sur des assiettes propres. Sous chaque cloche, un bruit de mastication très régulier.","effet_garanti":"Ce qui n'est pas servi est prélevé sur celui qui a faim. Ici l'énergie maudite se consomme comme un repas, et le service ne commence jamais.","effet_code":"−9 RÉSERVE par battement pour chaque occupant, +6 RÉSERVE au porteur par occupant affamé. À RÉSERVE 0, toute technique se paie en structure au double du tarif. Entretien 8 RÉSERVE / battement.","incantation":"Le couvert est mis pour deux cents, personne ne sert.\nCe qui n'est pas mangé est prélevé sur celui qui a faim.\nLevez la cloche si vous voulez : vous entendrez mâcher.","faille":"La faim se mesure au manque réclamé. Trois battements sans appeler la moindre technique, sans rien demander à sa réserve, et l'on cesse d'être une part à servir : le service passe devant vous sans s'arrêter."},{"id":"minden","nom_fr":"Le Palais du Sommeil Dû","nom_jp":"眠殿","romaji":"Minden","paysage":"Un dortoir de caserne, lits faits au carré, couvertures rabattues à main d'homme, chaussures alignées sous les sommiers. La pendule murale n'a plus que l'aiguille des heures et elle avance.","effet_garanti":"Toute heure de sommeil que vous n'avez pas prise est réclamée ici, à l'heure, et le corps s'exécute sans consulter personne.","effet_code":"Dette D = heures d'éveil au-delà de 16, par tranche de 4. Tous les 3 battements, l'occupant perd un battement entier (aucune action, esquive 0) ; à D ≥ 6, deux battements. Le porteur est exempté tant qu'il paie l'entretien de 10 RÉSERVE / battement.","incantation":"L'heure est réclamée.\nToute nuit que vous n'avez pas dormie est due, et due maintenant.\nLe corps s'exécute sans vous demander.\nFermez les yeux ; vous les fermerez de toute façon.","faille":"La dette se solde par du sommeil, pas par de la résistance. Un micro-sommeil consenti à l'instant exact de la réclamation éteint la ligne pour un prix dérisoire : il faut seulement accepter de ne pas voir le coup qui arrive pendant ce temps."},{"id":"reikan","nom_fr":"L'Anneau des Âges Égalisés","nom_jp":"齢環","romaji":"Reikan","paysage":"Une salle de radiologie où tous les clichés punaisés montrent la même main, os pour os. En bas à droite de chaque film, des dates séparées par quarante ans.","effet_garanti":"Tous les occupants sont ramenés à l'âge moyen du domaine. L'écart, en années, est payé comptant, dans les os, sans échelonnement possible.","effet_code":"Calcule l'âge moyen A des occupants. Chaque occupant subit |âge − A| × 2 structure à l'ouverture, puis |âge − A| ÷ 2 par battement. Vitesse et régénération recalculées sur A. Entretien 9 RÉSERVE / battement.","incantation":"Nous prenons l'âge de chacun et nous faisons la moyenne.\nL'écart se paie en os, comptant, sans échelonnement.\nVous aurez tous le même âge avant le troisième battement.","faille":"La moyenne se fait sur les présents, et un cadavre récent compte encore. Faire entrer un troisième corps déplace A ; deux âges rendus identiques ne se doivent plus rien du tout."},{"id":"meibo","nom_fr":"Le Registre des Noms Entendus","nom_jp":"名簿","romaji":"Meibo","paysage":"Un bureau d'état civil, tiroirs de fiches cartonnées jusqu'au plafond, encriers bouchés. Une machine à dicter tourne à vide au bout de la table et prend note quand même.","effet_garanti":"Tout nom prononcé ici est inscrit, et l'inscrit n'a plus le droit d'être ailleurs que là où sa fiche le dit.","effet_code":"Un nom entendu inscrit son porteur : esquive 0, position publique, +30 % de dégâts subis. L'inscription tombe si le nom n'est pas répété pendant 4 battements. Le porteur peut inscrire un nom par battement. Entretien 7 RÉSERVE / battement.","incantation":"Un nom prononcé est un nom inscrit.\nL'inscrit n'a plus le droit d'être ailleurs que sur sa fiche.\nDites-le encore : la machine tourne à vide et prend note quand même.","faille":"Le registre n'accepte que le nom exact. Un surnom, une initiale, un patronyme d'emprunt gravé par serment avant le seuil, et la fiche part au rebut : plus rien ici ne sait où vous êtes."},{"id":"mukonden","nom_fr":"Le Sanctuaire Sans Personne Dedans","nom_jp":"無魂殿","romaji":"Mukonden","paysage":"Un colombarium neuf, niches ouvertes, plaques déjà gravées aux noms de gens vivants. L'une d'elles n'a pas de nom, seulement une date, et la date est celle d'aujourd'hui.","effet_garanti":"Le domaine ne blesse pas : il retranche. À chaque battement il retire à chaque occupant une chose qu'il pourrait nommer, et cette chose ne revient pas.","effet_code":"Chaque battement, perte définitive d'un élément de fiche (un serment, une greffe, une entrée d'ossuaire ou 1 point de CONTRÔLE), écrite dans la sauvegarde. Énergie inversée interdite aux deux camps pour tout le duel. Prépaiement irrécupérable de 40 RÉSERVE à l'ouverture, entretien 18 / battement.","incantation":"Nous ne blessons pas. Nous retranchons.\nDonnez le nom de ce que vous tenez : la niche est ouverte, la plaque est gravée.\nCe qui entre ici n'a pas de ligne de retour.","faille":"La loi ne prend que ce qui peut être nommé. Celui qui n'a jamais dit à voix haute ce à quoi il tient — pas une fois, à personne — présente une fiche vide : les niches restent ouvertes et le domaine se ruine à ne rien trouver."},{"id":"shigoku","nom_fr":"La Geôle Faite de Votre Propre Dossier","nom_jp":"紙獄","romaji":"Shigoku","paysage":"Quatre murs de pages collées bord à bord : c'est votre dossier, monté à l'échelle d'une pièce. Vos annotations rouges se lisent à l'envers, parfaitement, depuis l'intérieur.","effet_garanti":"Votre loi vous est appliquée, opérateur inversé, à chaque battement et sans condition d'énonciation : les murs ont vu, touché et porté l'inscription à votre place.","effet_code":"Copie la loi du joueur, remplace le verbe par son inverse, applique à quantité minimale chaque battement : dégâts = rang de coût × 3. Les serments du joueur deviennent opposables contre lui. Entretien 14 RÉSERVE / battement.","incantation":"Les murs sont votre dossier ; l'encre rouge est de vous.\nNous appliquons votre loi, verbe retourné, sans condition.\nLe papier a vu, le papier a touché, le papier a entendu.\nLisez-vous à l'envers.","faille":"Le papier récite la fiche telle qu'elle est écrite, corruptions comprises. Une greffe hors compatibilité y a imposé une condition involontaire que du papier ne peut pas exécuter : au battement où l'on refuse de l'accomplir à sa place, la ligne saute."},{"id":"jintei","nom_fr":"Le Jardin de la Poussière Rendue","nom_jp":"塵庭","romaji":"Jintei","paysage":"Un sous-sol d'archives, un rai de lumière oblique plein de particules parfaitement immobiles. Sur la table, une brosse d'orfèvre et un tas gris trié par provenance, avec des étiquettes.","effet_garanti":"Tout ce qui est tombé de vous — peau, cheveu, écaille d'ongle — est ici, et le domaine le remet en place sans savoir quelle place était la sienne.","effet_code":"Chaque battement, réintégration d'une unité : −4 structure et −1 CONTRÔLE cumulatif ; à partir du troisième battement, l'ordre des actions déclarées s'inverse une fois sur trois. Au sixième, toute action ratée frappe un allié. Entretien 10 RÉSERVE / battement.","incantation":"Tout ce qui est tombé de vous est resté.\nNous le remettons en place, sans savoir laquelle.\nTenez votre main : elle obéit avec un battement de retard.","faille":"Le tri se fait par provenance. Se couvrir de la poussière d'un autre — cendre, vêtements d'un mort, limaille d'atelier — brouille les étiquettes : la loi rend alors à chacun ce qui n'est pas à lui, c'est-à-dire rien qui tienne."}]},"bestiaire":{"fleaux":[{"id":"temoin","nom":"Le Témoin Rouge","grade":"4","origine":"La peur d'avoir laissé un appareil branché dans un appartement vide.","apparence":"Une diode rouge à hauteur de plinthe, au bout d'un cordon dont l'autre extrémité n'est reliée à rien. Le sol autour est tiède comme un fer qu'on vient de poser.","comportement":"Il s'éteint un battement sur trois : éteint, il ne peut ni frapper ni être touché. Il faut apprendre son cycle et ne porter ses coups que sur l'allumage.","pv":55,"attaque":7,"energie":1,"replique":"Tu es sorti quand même.","technique_signature":"Rémanence"},{"id":"accuse","nom":"Les Deux Traits","grade":"4","origine":"La peur d'un message lu et laissé sans réponse.","apparence":"Un adolescent au regard baissé, deux petites barres bleues incisées en travers du front, cicatrisées depuis longtemps. Ses mains sentent le plastique chaud.","comportement":"Il ne riposte jamais dans le battement : il retient ta dernière attaque et la restitue à l'identique deux battements plus tard. Placer un coup faible juste avant un coup fort trompe la restitution.","pv":62,"attaque":8,"energie":1,"replique":"J'ai vu. Je réponds plus tard.","technique_signature":"Accusé de réception"},{"id":"interphone","nom":"L'Interphone","grade":"4","origine":"La peur de la voix qui répond quand on n'a sonné chez personne.","apparence":"Une bouche en grille de haut-parleur encastrée dans le mur d'une cage d'escalier, à hauteur d'homme. Il n'y a rien derrière ce mur : on l'a ouvert pour vérifier.","comportement":"Il annonce l'étage avant de frapper, toujours un battement à l'avance. Le frapper pendant l'annonce coupe le message et annule la frappe.","pv":48,"attaque":10,"energie":2,"replique":"Troisième. C'est ouvert, montez.","technique_signature":"Ouverture"},{"id":"bonde","nom":"La Bonde","grade":"4","origine":"La peur de l'eau qui remonte au lieu de descendre.","apparence":"Un poing de cheveux mouillés, serré, gros comme un torse, qui laisse partout où il s'arrête une flaque exactement à la température du corps.","comportement":"Chaque coup encaissé le gorge : il gagne deux points d'attaque et ne les rend jamais. Deux battements sans le toucher et il sèche, perdant la moitié de sa masse.","pv":78,"attaque":6,"energie":2,"replique":"Tout ce que tu as perdu est resté là.","technique_signature":"Engorgement"},{"id":"audessus","nom":"Celui d'Au-Dessus","grade":"4","origine":"La peur des pas du voisin qui s'arrêtent juste au-dessus de la chambre.","apparence":"Un plafond bas qui suit la pièce, portant une empreinte de talon fraîche, en creux, qui se déplace à contresens de la marche.","comportement":"Il frappe l'endroit où tu seras, jamais celui où tu es : avancer te met dessous, rester immobile le fait manquer. Il ne peut pas frapper deux battements de suite au même aplomb.","pv":85,"attaque":12,"energie":2,"replique":"Il s'est arrêté juste au-dessus de toi.","technique_signature":"Aplomb"},{"id":"pli","nom":"Le Pli Non Ouvert","grade":"3","origine":"La peur des résultats d'analyse qu'on garde deux jours sans décacheter.","apparence":"Une silhouette d'homme en papier kraft cacheté, sans visage, la poitrine barrée d'une bande de fermeture intacte. Elle sent la colle et le froid des halls.","comportement":"Tant qu'il est scellé, il n'encaisse qu'un point par coup. Le déchirer le rend vulnérable pour tout le reste du duel, mais libère aussitôt sa frappe entière, une fois, sans parade possible.","pv":130,"attaque":15,"energie":3,"replique":"Vous préférez savoir plus tard.","technique_signature":"Résultat"},{"id":"kilometres","nom":"Les Vingt Kilomètres","grade":"3","origine":"La peur d'arriver chez soi sans se rappeler la route.","apparence":"Un conducteur assis dans le vide, mains à dix heures dix, phalanges blanches, les yeux ouverts et parfaitement secs.","comportement":"Il joue par séquences de trois battements, puis rejoue exactement les trois mêmes. Noter l'ordre une fois revient à connaître tous ses coups suivants.","pv":165,"attaque":18,"energie":3,"replique":"Je ne me souviens pas d'avoir freiné.","technique_signature":"Trajet"},{"id":"cinq","nom":"Cinq Secondes","grade":"3","origine":"La peur de lâcher la main d'un enfant dans une allée de supermarché.","apparence":"Une main d'adulte seule, ouverte à hauteur de hanche, qui se referme sur du vide avec un bruit sec, à intervalle régulier.","comportement":"Elle compte à voix haute. Sur cinq, elle est déjà dans ton dos et la frappe part avant que tu te retournes. Agir sur quatre casse le compte et la ramène à un.","pv":145,"attaque":20,"energie":4,"replique":"Un. Deux. Tu ne regardais pas.","technique_signature":"Perte de vue"},{"id":"cabine","nom":"L'Entre-Deux-Étages","grade":"3","origine":"La peur de la cabine qui s'immobilise entre deux paliers.","apparence":"Une cabine sans porte, parois de miroir piqué, où l'on ne voit pas son propre reflet mais le sien, penché, un peu trop près.","comportement":"Toute attaque lancée à distance se perd contre les parois. Au contact il rend la moitié de ce qu'il reçoit : on ne le tue qu'en acceptant de payer chaque coup deux fois.","pv":190,"attaque":14,"energie":4,"replique":"On va rester ensemble un moment.","technique_signature":"Immobilisation"},{"id":"table","nom":"Le Silence Après La Phrase","grade":"2","origine":"La peur d'avoir dit en réunion quelque chose qu'on ne pourra pas reprendre.","apparence":"Une table de conférence de six mètres portée par des jambes humaines nues, entourée de chaises toutes tournées vers toi. Le bois est tiède aux endroits où l'on s'est appuyé.","comportement":"Chaque fois que tu répètes une action déjà employée, il ajoute une chaise, et chaque chaise ajoute une frappe au battement. Ne jamais se répéter le maintient à une seule.","pv":260,"attaque":25,"energie":5,"replique":"Personne n'a répondu. Continuez.","technique_signature":"Tour de table"},{"id":"videmaison","nom":"Le Vide-Maison","grade":"2","origine":"La peur d'avoir un jour à vider l'appartement d'un mort.","apparence":"Un empilement d'affaires à hauteur d'homme — manteaux, cadres, sacs de linge — qui tient debout et respire par le fond des cartons.","comportement":"À chaque battement il te tend un objet, et refuser n'est pas prévu : chaque objet reçu ferme une de tes actions. Chaque coup encaissé lui arrache un objet, et l'objet qui tombe rouvre l'action correspondante ; au septième, il s'effondre.","pv":340,"attaque":24,"energie":5,"replique":"Prends ça, ça se garde.","technique_signature":"Succession"},{"id":"rediffusion","nom":"L'Enregistrement","grade":"2","origine":"La peur d'une vidéo de soi qu'on n'a jamais tournée.","apparence":"Un corps grenu qui amorce chaque geste une fraction avant de le faire, vêtu de ce que tu portais hier.","comportement":"Il rejoue ton action du battement précédent à soixante pour cent de sa force. Il ne connaît que ce qu'il a vu : deux battements sans rien tenter le laissent sans répertoire, et il se blesse en cherchant.","pv":295,"attaque":30,"energie":6,"replique":"On t'a vu faire ça.","technique_signature":"Rediffusion"},{"id":"sonnerie","nom":"La Sonnerie de Quatre Heures","grade":"2","origine":"La peur du téléphone qui sonne à quatre heures du matin.","apparence":"Un combiné de plastique jauni greffé dans une orbite, le fil descendant dans la gorge ; le visage est celui d'un proche, mal tendu sur l'os.","comportement":"Il sonne trois fois avant chaque frappe. Décrocher annule la frappe mais lui cède un point d'énergie ; laisser sonner coûte une frappe pleine et l'épuise d'autant.","pv":270,"attaque":34,"energie":6,"replique":"Décroche. C'est pour toi.","technique_signature":"Annonce"},{"id":"champ","nom":"Le Patient Attentif","grade":"1","origine":"La peur de se réveiller pendant l'opération sans pouvoir le dire.","apparence":"Un corps sous un champ opératoire vert, immobile, un seul doigt battant la mesure. Sous le tissu, la respiration va deux fois trop vite.","comportement":"Il ne se déplace pas du duel. Il ne frappe que les battements où tu te soignes, recharges ou prépares : il punit le repos et rien d'autre. On ne le tue qu'en ne reprenant jamais son souffle.","pv":410,"attaque":46,"energie":7,"replique":"Je sens tout. Je ne peux rien dire.","technique_signature":"封痛 Fūtsū — le scellement de la douleur"},{"id":"interpellation","nom":"L'Appel Par Le Prénom","grade":"1","origine":"La peur d'entendre son prénom dans la rue, prononcé par quelqu'un qu'on ne connaît pas.","apparence":"Un homme de dos à trente mètres, dont la nuque pivote seule quand les épaules restent de face.","comportement":"Chaque syllabe de ton nom qu'il prononce lui donne huit points d'attaque et un pas d'approche. Le nom entier prononcé le fixe : il perd toute portée pendant deux battements, et c'est la seule fenêtre du duel.","pv":455,"attaque":41,"energie":7,"replique":"Tu t'es retourné. C'était bien toi.","technique_signature":"索名 Sakumei — l'indexation du nom entendu"},{"id":"poussee","nom":"La Poussée","grade":"1","origine":"La peur d'une foule qui se met à courir dans le même sens.","apparence":"Un mur de dos et d'épaules à hauteur d'homme, sans un seul visage, avançant au pas d'une marche lente et ne s'arrêtant pas aux obstacles.","comportement":"Il n'avance que d'un pas par battement et ne recule jamais ; l'espace derrière toi se réduit d'autant. Il ne sait pas tourner : se ranger de flanc contre une paroi le laisse passer et découvre son côté pendant trois battements.","pv":480,"attaque":44,"energie":8,"replique":"Personne ne peut plus s'arrêter.","technique_signature":"積勢 Sekisei — la sommation de l'élan acquis"},{"id":"visite","nom":"L'Étrangère du Dimanche","grade":"semi-spécial","origine":"La peur que sa mère demande un jour à quel titre on vient la voir.","apparence":"Une femme assise au bord d'un lit fait au carré, très propre, qui sourit du sourire réservé aux visiteurs. Ses mains ont trente ans de moins que son visage.","comportement":"À chaque battement elle oublie une de tes actions, et l'action oubliée cesse d'exister jusqu'à la fin du duel. Elle oublie aussi sa propre frappe la plus forte au quatrième battement : tenir jusque-là avec deux actions suffit à survivre.","pv":520,"attaque":50,"energie":8,"replique":"Vous êtes le fils de qui, déjà ?","technique_signature":"断系 Dankei — la séparation de la filiation"},{"id":"tirage","nom":"La Cage d'Escalier Unique","grade":"semi-spécial","origine":"La peur de l'incendie dans une tour qui n'a qu'un escalier.","apparence":"Une colonne de fumée tiède qui monte dans un corps d'immeuble, portant à l'intérieur des empreintes de mains propres, à hauteur d'épaule, toutes tournées vers le haut.","comportement":"Il occupe la sortie et retire un cran d'air par battement : ta réserve plafonne, puis se rétracte. Il ne sait que monter — se tenir plus bas que lui le rend inoffensif, au prix de rester enfermé avec lui.","pv":560,"attaque":56,"energie":9,"replique":"L'air est meilleur en bas. Descends.","technique_signature":"移息 Isoku — le transfert du souffle"},{"id":"archive","nom":"Ce Qui A Été Sauvegardé","grade":"spécial","origine":"La peur que tout ce qu'on a écrit à seize ans existe encore quelque part.","apparence":"Un corps cousu de feuillets montrant le même homme à tous ses âges, mis à plat et superposés. Il ne prononce que des phrases que tu as réellement dites.","comportement":"Chaque battement il rejoue une de tes actions passées, y compris celles des duels précédents. Il ne peut citer que ce qui est consigné : une action jamais employée le laisse sans réponse un battement entier. Au septième, il ouvre son registre et inscrit ta structure maximale.","pv":780,"attaque":74,"energie":11,"replique":"Rien n'a été supprimé. Rien ne le sera.","technique_signature":"保名 Homei — la conservation de ce qui a été nommé"},{"id":"sediment","nom":"Celui Qu'on Retrouve En Août","grade":"spécial","origine":"La peur de mourir chez soi et d'être découvert par l'odeur.","apparence":"Un fauteuil, un téléviseur d'information resté muet, et derrière, sur le mur, la silhouette jaunie de quelqu'un qui est resté assis très longtemps. Le fléau est le mur.","comportement":"Il n'engage rien : il attend, et chaque battement où tu ne commets aucune erreur lui rapporte deux points d'attaque. Il n'existe que pendant les battements où on ne le regarde pas ; le fixer deux battements de suite le rend solide et frappable, et coûte une frappe pleine à chaque fois.","pv":860,"attaque":86,"energie":12,"replique":"Personne n'est venu depuis quatre mois.","technique_signature":"積齢 Sekirei — la sommation de l'âge"}]},"rituel":{"ouverture":["Le registre est ouvert à la page suivante. Elle est vide, ce qui n'a jamais voulu dire libre.","On ne délivre rien ici. On relève.","Une technique innée n'est pas un don : c'est une phrase que votre corps impose au réel, et que le réel exécute sans discuter.","Elle existait avant vous, sous la forme d'une émotion que personne n'a évacuée à temps.","Elle ne sait pas qui la porte. C'est précisément pour cela qu'elle se retourne.","Le Bureau n'a besoin ni de votre accord ni de votre courage. Il a besoin d'un nom à normaliser.","Huit questions vont suivre. Aucune ne porte sur ce que vous savez faire.","Répondez vite. Les réponses lentes finissent toutes par se ressembler.","L'encre sèche en douze secondes. Passé ce délai, ce n'est plus une hypothèse."],"questions":[{"question":"Enfant, dans une maison endormie, qu'alliez-vous vérifier ?","reponses":[{"texte":"Que la porte d'entrée était bien fermée.","archetype":"seuil","note":"Vous ne gardiez pas la maison. Vous gardiez le passage."},{"texte":"Que les autres respiraient encore.","archetype":"lien","note":"Vous teniez des souffles qui n'étaient pas les vôtres. On ne repose jamais ça."},{"texte":"Je recomptais les marches en remontant.","archetype":"répétition","note":"Douze à l'aller, douze au retour. Le monde tient tant que le compte tient."},{"texte":"Que le gaz était coupé.","archetype":"mesure","note":"Un robinet, deux positions. Vous avez appris tôt qu'un état binaire peut vider une famille."}]},{"question":"On vous a fait un tort qui n'a jamais été reconnu. Où se trouve-t-il aujourd'hui ?","reponses":[{"texte":"Dans un carnet, avec la date et l'heure.","archetype":"mesure","note":"Vous n'avez pas pardonné. Vous avez archivé."},{"texte":"Je l'ai rendu plus tard, à quelqu'un d'autre.","archetype":"échange","note":"Le montant était juste. Ce n'est pas la même chose que la justice."},{"texte":"Nulle part : j'ai retiré la personne, proprement.","archetype":"soustraction","note":"Vous savez soustraire sans laisser de reste. Ça s'entend, dans une pièce."},{"texte":"Je peux encore décrire la lumière qu'il y avait ce jour-là.","archetype":"témoignage","note":"Vous n'avez pas conservé la blessure. Vous avez conservé la preuve."}]},{"question":"Un inconnu vous frôle dans un couloir étroit. Que se passe-t-il dans la seconde qui suit ?","reponses":[{"texte":"Je m'écarte avant de savoir qui c'est.","archetype":"seuil","note":"Votre corps trace des frontières que votre nom n'a pas signées."},{"texte":"J'enregistre la texture du tissu.","archetype":"témoignage","note":"Rien ne se perd chez vous. C'est une charge, pas une qualité."},{"texte":"Je frotte l'endroit, plusieurs fois, sans y penser.","archetype":"répétition","note":"Le geste ne nettoie rien. Il rejoue."},{"texte":"Rien. Je rends le contact, brièvement.","archetype":"lien","note":"Vous avez répondu. Cela vaut signature."}]},{"question":"Vous avez menti une fois pour de bon. À quoi ressemblait la phrase ?","reponses":[{"texte":"Une omission. J'ai seulement retiré un mot.","archetype":"soustraction","note":"Un mot retiré ne laisse pas de trou. Il laisse une phrase qui a l'air entière."},{"texte":"J'ai donné une autre vérité à la place.","archetype":"échange","note":"Vous avez payé. Mal, mais vous avez payé."},{"texte":"Je l'ai répétée jusqu'à ce qu'elle tienne debout seule.","archetype":"répétition","note":"Au septième passage ce n'était plus un mensonge, c'était un usage."},{"texte":"Je l'ai dite en regardant quelqu'un, et je l'y revois encore.","archetype":"témoignage","note":"Vous avez pris un témoin. Il ne vous rendra pas ce regard."}]},{"question":"On vous doit une somme dérisoire depuis des années.","reponses":[{"texte":"Je connais le chiffre au centime.","archetype":"mesure","note":"Le montant ne vous intéresse pas. C'est l'exactitude qui vous tient debout."},{"texte":"J'ai effacé la dette. Elle coûtait plus cher que son montant.","archetype":"soustraction","note":"Effacer n'est pas absoudre. Le registre le distingue très bien."},{"texte":"J'attends le jour où il aura besoin de moi.","archetype":"échange","note":"Vous ne réclamez pas : vous laissez la créance prendre de la valeur."},{"texte":"Je la reprendrai sur son fils, s'il le faut.","archetype":"lien","note":"Une dette se transmet mieux qu'un nom. Vous le saviez avant nous."}]},{"question":"La nuit, devant une vitrine, vous voyez votre reflet une seconde avant de le reconnaître. Cette seconde-là :","reponses":[{"texte":"Elle m'a soulagé.","archetype":"métamorphose","note":"Vous préférez l'inconnu que vous étiez. Le corps entend ce genre de préférence."},{"texte":"Elle m'a fait chercher les différences, une par une.","archetype":"mesure","note":"Deux images, un écart. Vous avez immédiatement voulu le chiffre."},{"texte":"C'est toujours exactement la même seconde.","archetype":"répétition","note":"Ce qui revient à l'identique n'est plus un souvenir. C'est un mécanisme."},{"texte":"Je suis resté sur le trottoir, du mauvais côté du verre.","archetype":"seuil","note":"Vous savez toujours de quel côté vous êtes. C'est plus rare qu'on ne croit."}]},{"question":"Quelqu'un est mort et vous n'êtes pas allé à l'enterrement.","reponses":[{"texte":"Je n'ai pas pu passer la grille du cimetière.","archetype":"seuil","note":"La grille était ouverte. Ce n'était pas la grille."},{"texte":"J'y suis allé après, seul, quand il n'y avait plus rien à voir.","archetype":"témoignage","note":"Vous vouliez constater, pas partager. Le Bureau recrute là-dedans."},{"texte":"Je fais autre chose ce jour-là, à la même heure, chaque année.","archetype":"répétition","note":"Vous appelez ça une habitude. Ailleurs on appelle ça une condition d'énonciation."},{"texte":"J'ai gardé un de ses objets, et je m'en sers.","archetype":"lien","note":"L'objet fonctionne encore. C'est ce qui vous dérange."}]},{"question":"On vous propose de retirer une seule chose du monde, sans conséquence apparente.","reponses":[{"texte":"Un bruit précis.","archetype":"soustraction","note":"Vous avez répondu en moins de deux secondes. La liste était faite depuis longtemps."},{"texte":"Le droit qu'a un certain visage de me reconnaître.","archetype":"lien","note":"Couper un lien par le haut. Ça se paie toujours en descendant."},{"texte":"Rien. J'échangerais plutôt, et je sais quoi contre quoi.","archetype":"échange","note":"Vous n'avez même pas demandé qui tenait la caisse."},{"texte":"Ma part. Le reste continue sans moi, autrement.","archetype":"métamorphose","note":"Se retirer soi n'est pas disparaître. C'est changer de support."}]},{"question":"Une pièce est froide alors que personne n'a ouvert la fenêtre. Votre première pensée :","reponses":[{"texte":"Quelqu'un est resté ici très longtemps.","archetype":"témoignage","note":"Vous lisez les lieux comme des dépositions. Ils mentent moins que les gens."},{"texte":"Combien de degrés manquent ?","archetype":"mesure","note":"La bonne question. Elle vous coûtera une vie ou deux."},{"texte":"C'est parti quelque part. Il faut chercher où c'est arrivé.","archetype":"échange","note":"Rien ne se perd. Vous cherchez déjà le compte d'en face."},{"texte":"Je m'y habitue en trois minutes. C'est plus simple.","archetype":"métamorphose","note":"Votre corps négocie sans vous consulter. Un jour il signera sans vous."}]}],"transitions":["Consigné. On ne revient pas dessus.","La réponse est arrivée avant la fin de la question. Cela figure aussi au dossier.","Vous n'avez pas hésité là où les gens hésitent.","Le stylo change de main.","Rien de ce que vous dites ici ne sera retenu contre vous. Tout y sera utilisé.","Suivante. Elle sera plus courte, et pire.","Deux personnes sur trois mentent à celle-là. Le registre s'en accommode.","Ne relisez pas. On ne corrige pas une déposition.","Vous venez de vous décrire sans employer un seul adjectif. C'était l'exercice.","Le classeur descend d'un cran.","Le grain du papier change. Nous quittons les formulaires.","Encore une. Ensuite on ira chercher la loi là où elle dort."],"verdicts":["Voilà. Ce n'est pas une attribution, c'est un constat, et il est daté.","La loi n'a pas été choisie pour vous. Elle a été relevée sur vous, comme une empreinte sur un verre.","Aucune de vos réponses ne l'a modifiée d'une lettre. Elles ont seulement permis de l'écrire lisiblement.","Elle ignore qui la porte. Retenez-le : c'est exactement par là qu'on vous tuera.","Il y a une exception. Elle est en bas, en petit corps, et elle vous survivra.","Elle agira sur vous aussi bien que sur eux. Le réel ne fait pas de faveur au signataire.","Vous connaissez votre verbe. Vous ne connaissez pas encore votre gage : il se présentera seul, et il ne frappera pas.","Le nom se tamponne. À compter de cette seconde, quelque chose, quelque part, perd un battement par tour.","On vous a écouté par procédure. Le nom, lui, avait déjà tout dit à la troisième lettre.","Prenez la fiche. Elle pèse plus qu'une feuille : elle contient une règle du monde.","Ce que vous venez de recevoir a d'abord été la peur de quelqu'un d'autre. Vous n'en êtes que le support en service.","Le dossier se referme sur votre pouce. Ce n'est pas un présage, c'est du papier."]},"voix":{"mort":["Le porteur a cessé à 4 h 09. Le dossier reste ouvert.","On a retrouvé la loi intacte. C'est le corps qui manquait.","Vous avez arrêté de payer l'entretien. Le reste a suivi tout seul.","La dernière chose énoncée n'était pas votre nom.","Votre exception ne vous couvrait pas : vous n'avez jamais valu zéro.","L'énergie inversée répare la chair. Il n'en restait pas assez pour l'appliquer.","Il a fallu quatre secondes pour que vos mains rejoignent la température du sol.","Vous avez tenu onze battements. La moyenne est de neuf. Ce n'est pas une consolation, c'est une statistique.","Le fléau n'a pas terminé son geste. Il n'en a pas eu l'usage.","Votre sang est sorti dans l'ordre où il était compté.","Personne n'a prononcé votre nom en entier. Vous êtes tombé comme une quantité.","Le métronome continue. Il ne vous comptait pas.","Classé. Le tampon est sec avant que vous ne le soyez."],"victoire":["Le fléau se défait dans l'ordre inverse de son assemblage.","La loi adverse est éteinte. Vous en gardez un axe, et l'axe vous garde.","Il n'a plus de condition à remplir. Dans les rapports, on appelle cela la paix.","Vous avez payé jusqu'au dernier battement. Il a manqué le sien.","Ce qui restait de lui tient dans une ligne de registre, sans marge.","Sa faille était rituelle : il lui fallait la peau nue. Vous aviez des gants.","Le vermillon retombe. L'encre sèche plus vite que le sang.","Le dossier se referme sur un nom complet. Le vôtre est encore lisible.","Fin de relevé. Vous ressortez avec une articulation de moins et une loi de plus.","Il a cessé d'être une exception. Il redevient une adresse, une date, une peur."],"serment_accepte":["Gravé. La laque ne s'écaille pas.","Vous avez signé sans relire. Le Bureau le note en marge.","Un serment avec soi-même ne se trahit pas : il se subit.","Ce que vous venez de céder ne figure plus dans vos options. Cherchez-le, il n'y est plus.","La restriction est réelle. C'est exactement pour cela qu'elle paie.","L'encre a mordu jusque sous le sceau, des deux côtés de la feuille.","Vous êtes plus fort de tout ce que vous ne ferez plus jamais.","Le tiroir se referme sur votre clause. Il n'a pas de poignée à l'intérieur.","Contresigné par personne. C'est la seule forme qui tienne."],"serment_rompu":["Vous avez fait ce que vous aviez juré de ne pas faire. Le gain se retire d'abord, la dette ensuite.","La clause vous relit.","Rupture consignée. Le vermillon vire à la laque.","Ce n'est pas une sanction, c'est une restitution.","L'énergie avancée est reprise à la source. La source, c'est vous.","Le pacte n'est pas annulé. Il a changé de bénéficiaire.","Vous respirez ce que vous vous étiez interdit. Chaque inspiration est facturée."],"domaine_ouvert":["La marge se referme. Il n'y a plus de dehors à atteindre.","Les murs touchent, voient et portent l'inscription. La condition n'a plus lieu d'être.","Ici, énoncer devient inutile : le lieu énonce.","Le registre s'ouvre à la page où vous êtes déjà inscrit.","La barrière se pose comme un couvercle sur un bocal, sans bruit d'air.","Le sûr-au-but s'imprime en haut, comme une ligne de comptabilité.","Vous êtes à l'intérieur d'une phrase, et la phrase est déjà terminée.","À chaque battement, la loi vous est appliquée à la quantité minimale, sans faute et sans hâte.","L'entretien court. Regardez votre réserve, pas votre adversaire.","Le sol a pris la température de la loi."],"domaine_brise":["La résille cède par le bord. Le dehors revient d'un coup, plus froid que prévu.","Barrière rompue : la condition d'énonciation redevient exigible.","Vous avez cessé de pouvoir payer. Le lieu vous a rendu au monde.","Le relevé s'interrompt en milieu de ligne. Il compte quand même.","Les murs retombent en pages. Certaines portent votre écriture.","L'entretien n'a pas été honoré au douzième battement. Le douzième battement s'en souvient.","La marge se rouvre. Il manque trois pas au monde, et personne ne les remettra."],"inversion":["L'encre remonte le long du trait qui vous a ouvert.","La plaie se referme en reprenant sa cause à l'envers.","Cyan sur vermillon. Ne les regardez pas longtemps ensemble.","Le verbe tourne : ce que vous preniez, vous le rendez, et cela coûte deux fois.","Huit pour cent de structure. La fatigue, elle, ne s'inverse pas.","Vous réparez la chair. L'âme n'est pas dans le périmètre.","Le sens du flux change sans que le débit baisse. Comptez avant de recommencer."],"retour":["Le porteur a cessé il y a 3 jours, 4 heures et 11 minutes. Le dossier n'a pas été rouvert depuis.","Vous revenez. Le bouton, lui, n'est pas revenu avec vous.","Nous avons gardé votre loi au chaud. Elle vous attend de l'autre côté de la table.","Votre nom figure deux fois au registre : une fois comme porteur, une fois comme cause.","Ce qui a été caviardé la dernière fois l'est encore. Ne cherchez pas la ligne, vous l'avez payée.","L'adversaire du jour a votre grade, votre substrat et vos rayures aux poignets.","Vous ne reverrez pas l'interface intacte. Elle n'existe plus dans ce dossier.","Le Bureau ne demande pas comment vous êtes revenu. Il note l'heure.","La première fois, vous êtes tombé au onzième tour. Nous avons laissé le compteur là où il s'est arrêté.","Vous connaissez déjà votre faille. C'est la seule chose que vous ayez emportée."],"murmures":["quelque chose compte à voix basse","le café a la température du sol","n'écris pas ton nom en entier","il manque un battement quelque part","la grille n'est plus droite","on t'a déjà mesuré","garde tes gants","le tiroir du bas ne s'ouvre plus","une main d'inconnu, un train bondé","ce qui vaut zéro passe au travers","respire moins fort, ça se facture","la dette court, même à l'arrêt","il y a une page de trop dans ton dossier","tu as signé avant de lire","le métronome ne t'attend pas","quelqu'un relit ta loi à l'envers","la cicatrice se souvient de l'ordre","l'encre sèche du bord vers le centre"]},"nomenclature":{"grades":[{"grade":"4","nom":"Quatrième grade · 四級","description":"On te confie des couloirs après fermeture, des cages d'escalier, des choses qui n'ont jamais eu de nom. Le Bureau ne prévient personne : il n'y a rien à annoncer.","seuil":0},{"grade":"3","nom":"Troisième grade · 三級","description":"Un étage entier, un fléau qui a déjà mangé au moins une fois, un rapport à rendre avant six heures. Les frais de nettoyage sont retenus sur ta solde.","seuil":104},{"grade":"2","nom":"Deuxième grade · 二級","description":"On te confie des vivants. À partir d'ici, l'erreur a un nom, une adresse et un âge, et c'est toi qui écris les trois de ta main.","seuil":122},{"grade":"1","nom":"Premier grade · 一級","description":"On ne te confie plus rien : on te prévient. Ta fiche est recopiée en double, et le second exemplaire part au service chargé d'exorciser les porteurs.","seuil":142},{"grade":"semi-spécial","nom":"Semi-spécial · 準特級","description":"Ton nom circule avant ton corps. L'évacuation du quartier commence quand tu montes dans le train, et personne ne te l'a jamais     x.fillRect(0, 0, W, H);

    const acc = D.accent || '#b31217';

    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, D.invert ? 'rgba(233,226,212,0.78)' : 'rgba(0,0,0,0.80)');

    const stats = {};
    AXES.forEach(k => { stats[k] = Math.max(6, Math.round((brut[k] / somme) * BUDGET)); });

    const dominante = AXES.slice().sort((a, b) => stats[b] - stats[a])[0];
    const pvMax = 90 + stats.vigueur * 3.4 | 0;
    /* la réserve doit pouvoir contenir une extension du territoire (8),
       sinon la moitié du jeu reste hors d'atteinte quel que soit le talent */
    const enMax = 8 + Math.round(stats.flux / 9);
    const enTour = 2 + (stats.flux >= 26 ? 1 : 0) + (stats.flux >= 40 ? 1 : 0);

    return {
      stats, dominante,
      pvMax, enMax, enTour,
      attaque: 13 + Math.round(stats.tranchant * 0.80),
      crit: clamp(0.05 + stats.lucidite * 0.006, 0.05, 0.42),
      soin: 0.35 + stats.inversion * 0.022,
      puissance: Math.round(stats.tranchant * 1.5 + stats.vigueur * 1.1 + stats.flux * 1.2 + stats.lucidite * 1.0 + stats.inversion * 0.9),
    };
  }

  function grade(puissance, sermentsSignes) {
    const grades = liste('grades', []).length ? liste('grades') : (C().nomenclature || {}).grades || [];
    const p = puissance + (sermentsSignes || 0) * 22;
    const tri = grades.slice().sort((a, b) => (a.seuil || 0) - (b.seuil || 0));
    let g = tri[0] || { grade: '4', nom: 'Quatrième grade', description: '' };
    tri.forEach(x => { if (p >= (x.seuil || 0)) g = x; });
    return g;
  }

  /* ---- prose du dossier ------------------------------------------------ */
  function dossier(tech) {
    const e = tech.essence || {}, v = tech.vecteur || {}, l = tech.loi || {};
    const phrases = [];
    if (e.concept) phrases.push(e.concept.replace(/\.$/, '') + '.');
    if (e.sensoriel) phrases.push(e.sensoriel.replace(/\.$/, '') + '.');
    if (l.consequence) phrases.push(l.consequence.replace(/\.$/, '') + '.');
    return phrases.join(' ');
  }
  function minuscule(s) { const t = String(s || ''); return t.charAt(0).toLowerCase() + t.slice(1); }

  JJK.forge = { forgeTechnique, forgeReceptacle, grade, dossier, fr, decoupe, avecArticle, accorder, plurielDe, raccourcir, AXES, affinite, liste };
