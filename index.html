<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>RITUEL — 呪法帳</title>
<meta name="description" content="Générateur déterministe de techniques maudites et duel occulte dans l'univers de Jujutsu Kaisen.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@400;700&display=swap">
<style>
/* =========================================================================
   RITUEL — feuille de style
   Un dossier d'autopsie qu'on aurait laissé trop longtemps dans le noir.
   ========================================================================= */

:root {
  --nuit:      #07070a;
  --nuit-2:    #0c0c11;
  --nuit-3:    #131319;
  --os:        #e9e2d4;
  --os-faible: #9d968a;
  --os-mort:   #5d574e;
  --sang:      #b31217;
  --sang-vif:  #ff2d1a;
  --or:        #f2c14e;
  --inverse:   #7fe3ff;
  --vert-mal:  #6f8f5a;

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;

  --hair: 1px solid rgba(233, 226, 212, 0.14);
  --hair-fort: 1px solid rgba(233, 226, 212, 0.32);
  --ease: cubic-bezier(.16,.84,.28,1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--nuit);
  color: var(--os);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { position: relative; overflow-y: auto; }

html.is-inverted { filter: invert(1) hue-rotate(180deg); }
html.is-inverted #fx-flash { filter: invert(1); }

::selection { background: var(--sang); color: var(--os); }

/* Le clavier doit voir où il est : personne ne joue à l'aveugle sans
   l'avoir signé. */
:focus-visible {
  outline: 2px solid var(--sang-vif);
  outline-offset: 3px;
}
.reponse:focus-visible, .contrat:focus-visible, .acte:focus-visible {
  outline-offset: -2px;
  color: var(--os);
}

/* ---- calques d'effets ---------------------------------------------- */
.fx-layer {
  position: fixed; inset: 0; pointer-events: none;
  width: 100%; height: 100%;
}
#fx-ink { z-index: 76; mix-blend-mode: screen; opacity: .62; }
#fx-dom.is-hidden { display: none; }
#fx-flash {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; background: #fff; mix-blend-mode: screen;
}

/* grain : un vieux capteur qui chauffe */
body::after {
  content: ""; position: fixed; inset: -50%; z-index: 80; pointer-events: none;
  opacity: .045; will-change: transform;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation: grain 1.1s steps(4) infinite;
}
@keyframes grain {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-3%, 2%); }
  50%  { transform: translate(2%, -3%); }
  75%  { transform: translate(-2%, -2%); }
  100% { transform: translate(3%, 1%); }
}
/* lignes de balayage */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 79; pointer-events: none;
  opacity: .25;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px);
}

/* ---- scène ----------------------------------------------------------- */
#stage {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px) 120px;
  will-change: transform;
}
.ecran { width: 100%; max-width: 1120px; display: none; animation: fadeUp .8s var(--ease) both; }
.ecran.actif { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---- typographie ----------------------------------------------------- */
.etiquette {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: .34em; text-transform: uppercase;
  color: var(--os-mort);
}
.etiquette.rouge { color: var(--sang); }
.titre-rituel {
  font-family: var(--serif); font-weight: 300; text-wrap: balance;
  font-size: clamp(2.1rem, 7vw, 4.6rem); line-height: 1.02;
  letter-spacing: -.02em; margin: .1em 0 .2em;
}
.titre-rituel em { font-style: italic; color: var(--sang); }
.jp { font-family: var(--jp); letter-spacing: .18em; }
.mono { font-family: var(--mono); }
.faible { color: var(--os-faible); }
.mort { color: var(--os-mort); }
.sang { color: var(--sang); }
.or { color: var(--or); }
.serif-italique { font-style: italic; font-weight: 300; }

hr.trait { border: 0; border-top: var(--hair); margin: 28px 0; }
hr.trait.fort { border-top: var(--hair-fort); }

.typing::after {
  content: "▌"; margin-left: 2px; color: var(--sang);
  animation: blink .7s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---- boutons --------------------------------------------------------- */
.btn {
  appearance: none; -webkit-appearance: none;
  background: transparent; color: var(--os);
  border: var(--hair-fort); border-radius: 0;
  padding: 13px 26px; cursor: pointer;
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  letter-spacing: .26em; text-transform: uppercase;
  position: relative; overflow: hidden;
  transition: color .25s var(--ease), border-color .25s var(--ease), letter-spacing .35s var(--ease);
}
.btn::before {
  content: ""; position: absolute; inset: 0;
  background: var(--os); transform: scaleY(0); transform-origin: bottom;
  transition: transform .34s var(--ease); z-index: -1;
}
.btn:hover:not(:disabled) { color: var(--nuit); border-color: var(--os); letter-spacing: .32em; }
.btn:hover:not(:disabled)::before { transform: scaleY(1); }
.btn:disabled { opacity: .28; cursor: not-allowed; }
.btn.rouge { border-color: rgba(179,18,23,.6); color: var(--sang-vif); }
.btn.rouge::before { background: var(--sang); }
.btn.rouge:hover:not(:disabled) { color: #fff; border-color: var(--sang); }
.btn.fantome { border-color: transparent; color: var(--os-mort); padding-left: 0; padding-right: 0; margin-right: 24px; }
.btn.fantome:hover:not(:disabled) { color: var(--os); letter-spacing: .3em; }
.btn.fantome::before { display: none; }
.btn.large { display: block; width: 100%; padding: 18px 26px; }

.btn-rangee { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

/* ---- champ de saisie -------------------------------------------------- */
.champ {
  width: 100%; background: transparent; border: 0;
  border-bottom: var(--hair-fort);
  color: var(--os); font-family: var(--serif); font-weight: 300;
  font-size: clamp(1.6rem, 5vw, 2.8rem); padding: 10px 2px 12px;
  outline: none; letter-spacing: .02em;
  transition: border-color .3s var(--ease);
}
.champ::placeholder { color: rgba(233,226,212,.16); font-style: italic; }
.champ:focus { border-color: var(--sang); }

/* ---- rituel ---------------------------------------------------------- */
.rituel-ligne {
  font-size: clamp(1.05rem, 2.6vw, 1.5rem); font-weight: 300;
  min-height: 1.6em; margin: 0 0 .55em; color: var(--os-faible);
}
.rituel-ligne.forte { color: var(--os); font-style: italic; }

.question-bloc { margin-top: 40px; }
.question-texte {
  font-size: clamp(1.35rem, 3.6vw, 2.1rem); font-weight: 300; text-wrap: balance;
  line-height: 1.25; margin: 0 0 28px; max-width: 34ch;
}
.reponses { display: grid; gap: 10px; max-width: 780px; }
.reponse {
  text-align: left; background: transparent; cursor: pointer;
  border: 0; border-left: 2px solid rgba(233,226,212,.14);
  padding: 14px 20px; color: var(--os-faible);
  font-family: var(--serif); font-size: 1.05rem; font-weight: 300; line-height: 1.4;
  transition: all .3s var(--ease);
}
.reponse:hover {
  border-left-color: var(--sang); color: var(--os);
  background: linear-gradient(90deg, rgba(179,18,23,.10), transparent 70%);
  padding-left: 30px;
}
.reponse .murmure {
  display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--os-mort); margin-top: 8px;
  opacity: 0; transform: translateY(-4px); transition: all .3s var(--ease);
}
.reponse:hover .murmure { opacity: 1; transform: none; color: var(--sang); }

.jauge-rituel { display: flex; gap: 6px; margin: 34px 0 0; }
.jauge-rituel i {
  flex: 1; height: 2px; background: rgba(233,226,212,.12);
  transition: background .5s var(--ease);
}
.jauge-rituel i.pleine { background: var(--sang); }

/* ---- dossier de technique ------------------------------------------- */
.dossier {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  gap: clamp(20px, 4vw, 56px); align-items: start;
}
@media (max-width: 860px) { .dossier { grid-template-columns: 1fr; } }

.nom-technique {
  font-size: clamp(2rem, 6.4vw, 4.2rem); font-weight: 300; line-height: 1.03; text-wrap: balance;
  letter-spacing: -.025em; margin: 6px 0 10px;
}
.nom-jp { font-family: var(--jp); font-size: clamp(.95rem, 2.2vw, 1.3rem); color: var(--sang); letter-spacing: .3em; }

.bloc { margin: 26px 0; }
.bloc > .etiquette { display: block; margin-bottom: 9px; }
.bloc p { margin: 0; font-weight: 300; font-size: 1.08rem; }
.bloc .enonce {
  font-size: clamp(1.15rem, 2.8vw, 1.55rem); font-style: italic; font-weight: 300;
  border-left: 2px solid var(--sang); padding-left: 18px; margin-left: 0;
}

.grille-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1px; background: rgba(233,226,212,.12); border: var(--hair); margin: 26px 0;
}
.stat { background: var(--nuit); padding: 14px 16px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.45rem; font-weight: 400; color: var(--os); }
.stat span { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--os-mort); margin-top: 4px; }

.sceau-boite { position: relative; }
.sceau-boite canvas { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 24px rgba(179,18,23,.28)); }
.sceau-rot { animation: rot 90s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.sceau-legende { text-align: center; margin-top: 14px; }

.tampon {
  display: inline-block; border: 2px solid var(--sang); color: var(--sang);
  font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  padding: 7px 14px; transform: rotate(-3.5deg); opacity: .9;
}

/* ---- serments -------------------------------------------------------- */
.contrat {
  border: var(--hair); padding: 22px 24px; margin-bottom: 14px;
  background: linear-gradient(180deg, rgba(233,226,212,.02), transparent);
  cursor: pointer; transition: all .3s var(--ease); position: relative;
}
.contrat:hover { border-color: rgba(179,18,23,.55); background: linear-gradient(180deg, rgba(179,18,23,.07), transparent); }
.contrat.signe { border-color: var(--sang); }
.contrat.signe::after {
  content: "SIGNÉ"; position: absolute; top: 14px; right: 16px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .3em; color: var(--sang);
  border: 1px solid var(--sang); padding: 3px 8px; transform: rotate(-6deg);
}
.contrat h4 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 400; }
.contrat .clause { font-style: italic; color: var(--os-faible); font-weight: 300; margin: 0 0 14px; max-width: 62ch; }
.echange { display: flex; flex-wrap: wrap; gap: 10px 26px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }
.echange .perte { color: var(--sang-vif); }
.echange .gain { color: var(--or); }
.echange .perte::before { content: "− "; }
.echange .gain::before { content: "+ "; }
.danger { display: inline-flex; gap: 3px; margin-left: auto; }
.danger i { width: 6px; height: 6px; background: var(--os-mort); border-radius: 50%; }
.danger i.on { background: var(--sang); }

/* ---- combat ---------------------------------------------------------- */
.arene { display: grid; gap: 22px; }
.combattants { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; }
@media (max-width: 720px) { .combattants { grid-template-columns: 1fr; } .versus { display: none; } }
.versus { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--os-mort); }

.fiche { border: var(--hair); padding: 18px 20px; position: relative; overflow: hidden; }
.fiche.ennemi { border-color: rgba(179,18,23,.35); }
.fiche .nom { font-size: 1.5rem; font-weight: 300; line-height: 1.1; margin-bottom: 2px; }
.fiche .sous { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--os-mort); }
.fiche.frappe { animation: frappe .32s var(--ease); }
@keyframes frappe {
  0%,100% { transform: none; }
  25% { transform: translateX(-9px) skewX(3deg); }
  60% { transform: translateX(6px); }
}

.barre { height: 8px; background: rgba(233,226,212,.09); margin-top: 14px; position: relative; overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--os); transition: width .5s var(--ease); }
.barre.pv i { background: linear-gradient(90deg, var(--sang), var(--sang-vif)); }
.barre.pv .fantomatique {
  position: absolute; top: 0; left: 0; height: 100%;
  background: rgba(255,45,26,.28); transition: width 1.1s .25s var(--ease);
}
.barre.energie { height: 4px; }
.barre.energie i { background: var(--inverse); }
.chiffres { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--os-mort); margin-top: 6px; }

.statuts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 20px; }
.puce {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  border: 1px solid rgba(233,226,212,.25); padding: 2px 7px; color: var(--os-faible);
}
.puce.mauvais { border-color: rgba(179,18,23,.5); color: var(--sang-vif); }
.puce.bon { border-color: rgba(242,193,78,.5); color: var(--or); }

/* Le filtre porte sur les enfants, pas sur l'élément : sinon il s'applique
   aussi aux pseudo-éléments et la cicatrice devient illisible. */
.mutilated { position: relative; min-height: 42px; }
.mutilated > * { opacity: .16; filter: grayscale(1) brightness(.5); }
.mutilated::before {
  content: ""; position: absolute; left: -4%; right: -4%; top: 50%; height: 2px;
  background: var(--sang-vif); transform: rotate(-2.4deg); z-index: 2;
  box-shadow: 0 0 12px rgba(255,45,26,.8);
}
.mutilated::after {
  content: attr(data-scar); position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--mono); font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: #ff6f5e; background: rgba(30,4,6,.86); z-index: 3; filter: none;
}

.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.acte {
  text-align: left; background: transparent; border: var(--hair);
  padding: 12px 14px; cursor: pointer; color: var(--os-faible);
  font-family: var(--serif); transition: all .22s var(--ease);
}
.acte:hover:not(:disabled) { border-color: var(--os); color: var(--os); transform: translateY(-2px); }
.acte:disabled { opacity: .26; cursor: not-allowed; }
.acte b { display: block; font-size: 1.08rem; font-weight: 400; }
.acte small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--os-mort); }
.acte .cout { float: right; font-family: var(--mono); font-size: 10px; color: var(--inverse); letter-spacing: .1em; }
.acte.ultime { border-color: rgba(179,18,23,.55); }
.acte.ultime b { color: var(--sang-vif); }
.acte.ultime:hover:not(:disabled) { border-color: var(--sang-vif); box-shadow: inset 0 0 40px rgba(179,18,23,.18); }

.duel-bas { display: grid; grid-template-columns: minmax(0,1fr) minmax(280px, 34%); gap: 22px; align-items: start; }
@media (max-width: 900px) { .duel-bas { grid-template-columns: 1fr; } }
.journal {
  border-top: var(--hair); padding-top: 14px; max-height: 340px; overflow-y: auto;
  font-size: 1rem; font-weight: 300;
}
.journal .etiquette { display: block; margin-bottom: 10px; }
.fiche .replique { font-style: italic; font-weight: 300; color: var(--os-mort); margin-top: 12px; font-size: .96rem; }
.journal p { margin: 0 0 7px; color: var(--os-faible); animation: fadeUp .4s var(--ease) both; }
.journal p.important { color: var(--os); font-style: italic; }
.journal p.mal { color: var(--sang-vif); }
.journal p.bien { color: var(--or); }
.journal p .n { font-family: var(--mono); font-size: .92em; }
.journal::-webkit-scrollbar { width: 3px; }
.journal::-webkit-scrollbar-thumb { background: rgba(179,18,23,.5); }

/* ---- territoire ------------------------------------------------------ */
#territoire {
  position: fixed; inset: 0; z-index: 65; display: none;
  align-items: center; justify-content: center; flex-direction: column;
  text-align: center; padding: 24px; pointer-events: none;
}
#territoire.actif { display: flex; }
#territoire .incantation {
  font-family: var(--jp); font-size: clamp(.95rem, 2.4vw, 1.35rem);
  color: var(--sang-vif); letter-spacing: .34em; margin-bottom: 26px; opacity: .9;
}
#territoire .nom-dom {
  font-size: clamp(2.2rem, 9vw, 6.4rem); font-weight: 300; line-height: .98; text-wrap: balance;
  letter-spacing: -.03em; max-width: 16ch; margin: 0 auto;
  text-shadow: 0 0 60px rgba(179,18,23,.6);
}
#territoire .vers { margin-top: 30px; max-width: 44ch; }
#territoire .vers p { margin: .18em 0; font-style: italic; font-weight: 300; color: var(--os-faible); }
#territoire .sur { margin-top: 34px; }
body.in-domain #stage { filter: blur(3px) brightness(.35); }

/* ---- épitaphe / mémoire ---------------------------------------------- */
.tombe {
  border: var(--hair); border-left: 2px solid var(--sang);
  padding: 16px 20px; margin-bottom: 12px;
  background: linear-gradient(90deg, rgba(179,18,23,.06), transparent 60%);
}
.tombe .nom { font-size: 1.25rem; font-weight: 300; }
.tombe .det { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--os-mort); }

/* ---- barre d'état ---------------------------------------------------- */
#barre-etat {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 9px clamp(14px, 4vw, 40px);
  background: linear-gradient(180deg, rgba(7,7,10,0), rgba(7,7,10,.94) 40%);
  font-family: var(--mono); font-size: 10px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--os-mort);
}
#barre-etat .sep { flex: 1; }
#barre-etat button {
  background: none; border: 0; color: var(--os-mort); cursor: pointer;
  font: inherit; letter-spacing: .2em; padding: 4px 0;
}
#barre-etat button:hover { color: var(--sang); }

/* ---- murmures -------------------------------------------------------- */
.murmure-flottant {
  position: fixed; z-index: 50; pointer-events: none;
  font-family: var(--serif); font-style: italic; font-weight: 300;
  font-size: clamp(1rem, 2.4vw, 1.5rem); color: rgba(233,226,212,.32);
  white-space: nowrap;
  animation: derive 13s linear forwards;
}
@keyframes derive {
  0% { opacity: 0; transform: translateX(0) scale(1); }
  12% { opacity: 1; }
  85% { opacity: .5; }
  100% { opacity: 0; transform: translateX(-16vw) scale(1.06); }
}

/* ---- divers ---------------------------------------------------------- */
.deux-colonnes { columns: 2; column-gap: 40px; }
@media (max-width: 700px) { .deux-colonnes { columns: 1; } }
.centre { text-align: center; }
.plein { width: 100%; }
.pile > * + * { margin-top: 12px; }
.discret { font-size: .92rem; color: var(--os-mort); }

@media (prefers-reduced-motion: reduce) {
  body::after, .sceau-rot, .murmure-flottant { animation: none !important; }
  * { transition-duration: .01ms !important; }
}

/* ---- lisibilité pendant que le territoire est déployé ---------------- */
/* Le territoire déployé recouvre la scène (calque 60). Tant qu'il dure,
   la scène doit repasser au-dessus, sinon on joue sans voir ses boutons. */
body.domaine-calme #stage { filter: none; position: relative; z-index: 62; }
body.domaine-calme .fiche,
body.domaine-calme .acte,
body.domaine-calme .journal {
  background: rgba(7, 7, 10, .74);
  backdrop-filter: blur(2px);
}
body.domaine-calme .fiche { border-color: rgba(233, 226, 212, .3); }
.etiquette.or { color: var(--or); }
#territoire .etiquette { color: inherit; opacity: .7; }

/* le titre de la page ne doit jamais dépasser sur mobile */
@media (max-width: 520px) {
  .btn { padding: 12px 18px; letter-spacing: .18em; }
  .btn.fantome { margin-right: 14px; }
  #barre-etat { font-size: 9px; gap: 10px; letter-spacing: .12em; }
  #stage { padding-bottom: 96px; }
}

/* ---- téléphone : l'écran est petit, le rituel reste lisible ---------- */
#barre-etat > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 620px) {
  #be-registre, #be-grade { display: none; }
  #barre-etat { gap: 12px; padding: 8px 14px; }
  #stage { padding-bottom: 84px; }
  .fiche { padding: 12px 14px; }
  .fiche .nom { font-size: 1.2rem; }
  .fiche .replique { font-size: .88rem; margin-top: 8px; }
  .statuts { min-height: 0; }
  .combattants { gap: 10px; }
  .acte { padding: 10px 12px; }
  .acte b { font-size: 1rem; }
  .titre-rituel { font-size: clamp(1.9rem, 11vw, 3rem); }
  .contrat { padding: 16px 16px; }
  .grille-stats { grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
  .stat { padding: 10px 12px; }
  .stat b { font-size: 1.15rem; }
}
/* les murmures ne doivent jamais recouvrir une action */
@media (max-width: 860px) { .murmure-flottant { display: none; } }

<script>
window.JJK = window.JJK || {};
window.JJK.CORPUS = {"essences":{"essences":[{"id":"rouille","nom":"La Rouille","kanji":"錆","romaji":"Sabi","concept":"L'oxydation érigée en jugement : tout ce qui a été laissé sans entretien accepte de vieillir d'un seul coup, et la loi choisit la date de l'échéance.","sensoriel":"Un goût de pièce de monnaie au fond de la bouche, et toutes les charnières alentour se mettent à grincer dans le même ton.","couleur":"#8A4B24","emotion_source":"la résignation de celui qui a cessé d'entretenir ce qu'il aimait encore"},{"id":"recensement","nom":"Le Recensement","kanji":"戸籍","romaji":"Koseki","concept":"Ce qui est inscrit sur une liste perd le droit de varier : nommer une chose au registre, c'est lui interdire d'être autrement qu'écrite.","sensoriel":"Une voix neutre énumère des noms à trois pièces d'ici, sans jamais reprendre son souffle entre deux.","couleur":"#5D6470","emotion_source":"la peur d'être réduit à une ligne exacte dans un dossier"},{"id":"dette","nom":"La Dette","kanji":"負債","romaji":"Fusai","concept":"Tout ce qui est reçu ouvre une créance ; la loi tient le compte et peut exiger le remboursement en chair, en temps ou en distance parcourue.","sensoriel":"Les poches, les manches, l'intérieur des chaussures : tout s'alourdit d'exactement la même quantité, en même temps.","couleur":"#8C2F2F","emotion_source":"l'humiliation de devoir quelque chose à quelqu'un que l'on méprise"},{"id":"echo","nom":"L'Écho","kanji":"谺","romaji":"Kodama","concept":"Un son émis n'est jamais quitte : il continue d'appartenir à la bouche qui l'a produit et peut lui être rendu intact, très longtemps après.","sensoriel":"Vos propres phrases de la veille reviennent depuis le couloir, dans le bon ordre, sans que personne s'y trouve.","couleur":"#4B5E63","emotion_source":"la solitude de n'avoir pas été entendu la première fois"},{"id":"attente","nom":"L'Attente","kanji":"待合","romaji":"Machiai","concept":"Le temps passé à attendre est une matière : il s'accumule, se transvase, et peut être imposé à un autre corps qui devra le traverser entier.","sensoriel":"Les aiguilles ne bougent plus mais tout le monde a soif ; la chaise sous vous est tiède comme si quelqu'un venait de la quitter.","couleur":"#9A9384","emotion_source":"l'angoisse de celui à qui l'on n'a jamais dit à quelle heure"},{"id":"cicatrice","nom":"La Cicatrice","kanji":"傷痕","romaji":"Shōkon","concept":"La chair guérie conserve la géométrie exacte de la blessure ; la loi relit ce dessin et exige qu'il soit refait à l'identique.","sensoriel":"Une démangeaison précise le long d'une ancienne suture, et le fil, retiré depuis des années, tire de nouveau.","couleur":"#B9857A","emotion_source":"la rancune tenue longtemps, entretenue comme un pansement qu'on refuse de décoller"},{"id":"inventaire","nom":"L'Inventaire","kanji":"棚卸","romaji":"Tanaoroshi","concept":"N'existe que ce qui a été compté : à la clôture de l'inventaire, ce qui manque à la liste cesse simplement d'être disponible.","sensoriel":"Un claquement de compteur mécanique, puis un objet quotidien manque à sa place et personne ne parvient à retrouver son nom.","couleur":"#7C7A46","emotion_source":"l'avarice de qui a connu le manque et compte encore ses réserves chaque soir"},{"id":"maree-basse","nom":"La Marée Basse","kanji":"干潟","romaji":"Higata","concept":"Le retrait pris comme opérateur : la loi fait refluer ce qui recouvrait et met à découvert ce qui n'a jamais été prévu pour la lumière.","sensoriel":"L'air se charge d'iode et de vase ; sous les pas, des choses molles se rétractent au bruit.","couleur":"#55605A","emotion_source":"le chagrin sans forme de qui découvre ce qu'il y avait sous une habitude"},{"id":"anesthesie","nom":"L'Anesthésie","kanji":"麻酔","romaji":"Masui","concept":"La douleur n'est pas supprimée mais ajournée : elle est mise en réserve, capitalisée, puis rendue en une seule fois à l'échéance.","sensoriel":"Les doigts obéissent encore mais ne renvoient plus rien ; on s'aperçoit qu'on saigne en regardant sa manche.","couleur":"#9FB6B2","emotion_source":"le dégoût de sentir, chez celui qui a décidé un jour de ne plus rien sentir du tout"},{"id":"proces-verbal","nom":"Le Procès-Verbal","kanji":"調書","romaji":"Chōsho","concept":"Ce qui est consigné devient ce qui s'est passé ; la loi n'agit pas sur les corps mais sur la version officielle, et les corps suivent.","sensoriel":"Une machine à écrire frappe deux lignes quelque part, et ensuite votre souvenir de la scène ne vous convainc plus vous-même.","couleur":"#3F4550","emotion_source":"le sentiment de n'avoir pas été cru le jour où l'on disait la vérité"},{"id":"prescription","nom":"La Prescription","kanji":"時効","romaji":"Jikō","concept":"Passé un délai, un fait cesse d'être opposable ; la loi étend cette clémence aux plaies, aux appuis et aux promesses, qui cessent alors de tenir.","sensoriel":"Un coup de tampon sec, très loin, puis une articulation qu'on croyait solide accepte d'aller trop loin, sans douleur.","couleur":"#7E7466","emotion_source":"l'injustice restée impunie jusqu'à ce que plus personne n'ait le droit d'en parler"},{"id":"quarantaine","nom":"La Quarantaine","kanji":"隔離","romaji":"Kakuri","concept":"Le contact ouvre une créance de contagion : tout ce qui a touché la même chose est réuni en une catégorie unique et traité ensemble.","sensoriel":"Une odeur d'alcool évaporé, et une ligne de craie se dessine au sol autour de tout ce qui s'est frôlé depuis l'aube.","couleur":"#B8A24E","emotion_source":"le dégoût du contact, la certitude d'être sali par la peau des autres"},{"id":"reste","nom":"Le Reste","kanji":"剰余","romaji":"Jōyo","concept":"Toute répartition laisse un reste ; la loi désigne ce reste et lui retire le droit de participer à ce qui vient d'être partagé.","sensoriel":"On compte par deux à voix basse, et le dernier de la file cesse d'être regardé : sa chaleur part la première.","couleur":"#4E4A44","emotion_source":"le sentiment d'être en trop, chez qui n'a jamais été choisi dans un partage"},{"id":"vacance","nom":"La Vacance","kanji":"欠員","romaji":"Ketsuin","concept":"Une place vide est une force : elle appelle un occupant et attire vers elle le corps le plus conforme à sa description.","sensoriel":"Un uniforme plié sur une chaise, exactement à votre taille ; le formulaire porte déjà votre écriture, mais pas votre nom.","couleur":"#DAD5C7","emotion_source":"la peur d'être remplaçable, d'avoir été une fonction plutôt qu'une personne"},{"id":"bornage","nom":"Le Bornage","kanji":"境界","romaji":"Kyōkai","concept":"Une limite déclarée devient matérielle : la ligne tracée entre deux propriétés cesse d'être une convention et se met à refuser le passage.","sensoriel":"Un fil de chaux au sol, et un froid net qui coupe le corps en deux à la hauteur exacte où l'on tente de l'enjamber.","couleur":"#7B6A50","emotion_source":"la haine froide du voisin, pour quelques centimètres empiétés il y a vingt ans"},{"id":"delestage","nom":"Le Délestage","kanji":"停電","romaji":"Teiden","concept":"Il n'y en a jamais assez pour tous : la loi choisit qui reste alimenté et coupe le reste, sans rien détruire, en se contentant d'éteindre.","sensoriel":"Un déclic de disjoncteur, un rang de lampes qui tient, et un autre rang de gens dont les mains deviennent froides.","couleur":"#2E3338","emotion_source":"la culpabilité de celui qui a survécu à un tri qu'il n'a pas décidé"},{"id":"condensation","nom":"La Condensation","kanji":"結露","romaji":"Ketsuro","concept":"Le souffle trahit : tout ce qui respire dépose sur le monde une pellicule qui garde la trace de son passage et peut être relevée.","sensoriel":"Les vitres se couvrent de buée par l'intérieur, et sur chacune apparaît la marque d'une paume qui n'y a jamais été posée.","couleur":"#AEC0C6","emotion_source":"la honte d'être là, de laisser une trace rien qu'en existant"},{"id":"legs","nom":"Le Legs","kanji":"遺贈","romaji":"Izō","concept":"Ce que les morts n'ont pas réglé se répartit entre les vivants ; la loi désigne l'héritier et lui transfère le passif, sans acceptation possible.","sensoriel":"Un tiroir de bureau s'ouvre seul sur des papiers pliés en quatre, et vos mains prennent une posture qui n'est pas la vôtre.","couleur":"#5B4636","emotion_source":"le ressentiment envers une filiation qu'on n'a pas choisie et qu'on n'a pas su refuser"},{"id":"claudication","nom":"La Claudication","kanji":"跛行","romaji":"Hakō","concept":"Un déséquilibre se propage : la loi impose à toute démarche une asymétrie que le corps compense, jusqu'à user l'appui qui restait.","sensoriel":"Un pas plus court que l'autre dans le couloir, chez tout le monde en même temps, et le rythme finit par s'installer.","couleur":"#8B6E63","emotion_source":"la honte du corps qui trahit son propriétaire devant témoin"},{"id":"date-anniversaire","nom":"La Date Anniversaire","kanji":"命日","romaji":"Meinichi","concept":"Certaines dates gardent la faculté d'agir : la loi ramène un événement à son heure exacte et exige qu'il soit revécu par quelqu'un d'autre.","sensoriel":"Une odeur d'encens froid, une horloge domestique qui sonne un chiffre qu'elle ne possède pas, et tout le monde se tait à la même seconde.","couleur":"#5A4B52","emotion_source":"le deuil qui revient chaque année à la même heure sans avoir rien appris"},{"id":"eau-dormante","nom":"L'Eau Dormante","kanji":"死水","romaji":"Shisui","concept":"Ce qui ne circule plus se corrompt : la loi arrête la circulation d'une chose — le sang, la parole, la monnaie — et laisse la stagnation faire le travail.","sensoriel":"Un film irisé à la surface d'un verre, une douceur écœurante dans l'air, et les phrases prononcées restent à hauteur de bouche.","couleur":"#3E4A42","emotion_source":"l'aigreur d'une rancune qu'on n'a jamais formulée devant l'intéressé"},{"id":"creux-du-seuil","nom":"Le Creux du Seuil","kanji":"敷居","romaji":"Shikii","concept":"La répétition creuse la pierre : la loi comptabilise les passages d'un être et convertit ce compte en usure, sur lui plutôt que sous ses pieds.","sensoriel":"Le bruit de la semelle change de note au franchissement d'une porte, et la marche paraît chaque fois un peu plus basse.","couleur":"#8D7F6A","emotion_source":"la lassitude de qui refait le même trajet depuis vingt ans sans l'avoir jamais choisi"},{"id":"ankylose","nom":"L'Ankylose","kanji":"拘縮","romaji":"Kōshuku","concept":"Ce qu'on immobilise pour le soigner ne se remet plus à bouger : la loi accorde la protection, puis la rend définitive.","sensoriel":"Une chaleur d'attelle sous les vêtements, un craquement sec quand un doigt refuse de se déplier, et rien ne fait mal.","couleur":"#9B9EA3","emotion_source":"la peur du mouvement chez celui qui, blessé une fois, a préféré ne plus jamais s'exposer"},{"id":"anonymat","nom":"L'Anonymat","kanji":"匿名","romaji":"Tokumei","concept":"Ce qui n'a pas de nom ne peut être ni convoqué ni facturé ; la loi retire son nom à une chose et la met hors d'atteinte, donc hors de secours.","sensoriel":"Les étiquettes se vident une à une, et la personne en face vous appelle deux fois sans parvenir à dire quoi.","couleur":"#A8A29B","emotion_source":"la honte de son propre nom, chez qui a passé sa vie à ne pas vouloir être appelé"}]},"vecteurs":{"vecteurs":[{"id":"VEC-01","nom":"Par le nom prononcé en entier","condition":"Le porteur énonce à voix audible le nom d'état civil complet de la cible — patronyme et prénom, dans l'ordre du registre — d'un seul tenant, dans un air que les deux corps partagent. Une syllabe reprise, un bégaiement, une inversion, et l'énoncé est nul : il faut recommencer du premier son.","portee":"moyenne","verbe":"Prononcer","faille":"Cesser d'être nommable. Un changement d'état civil déposé, un prénom d'usage porté depuis assez longtemps pour que l'ancien ne soit plus su, et la loi énonce quelqu'un qui n'existe pas. À défaut : tousser sur la deuxième syllabe. L'adversaire qui interrompt l'énoncé une fois par battement ne sera jamais atteint, et il le sait dès qu'il a entendu le porteur reprendre."},{"id":"VEC-02","nom":"Par le sang bu","condition":"Le porteur avale au moins une gorgée du sang de la cible, sorti depuis moins de douze battements, encore au-dessus de la température de sa propre bouche, non mêlé d'eau, de salive étrangère ou de terre. La gorgée doit descendre : gardée sous la langue, elle ne compte pas.","portee":"illimitée conditionnelle","verbe":"Ingérer","faille":"Refroidir ou diluer avant que la main n'arrive. Saigner dans la neige, dans un seau, sous la pluie. Cautériser au fer une plaie qui coule. Les vieux exorcistes portent une lame passée dans un sel qui prend le sang en quatre secondes : ce qu'ils cèdent au sol est déjà mort et le porteur boit de la pierre."},{"id":"VEC-03","nom":"Par le regard soutenu","condition":"Ligne de vue réciproque, sans verre teinté ni fumée, tenue trois secondes pleines, le porteur ne clignant pas. Un reflet ne vaut rien : il faut l'œil, pas son image. Le compte repart à zéro à la première paupière.","portee":"longue","verbe":"Soutenir","faille":"Rompre par le bas. Baisser les yeux au deuxième temps coûte une demi-seconde et annule trois. Une poignée de cendre lancée en cloche, une vitre passée au noir de fumée, une paupière recousue. Un borgne qui se tient du côté mort ne peut jamais être compté : la loi exige la réciprocité, et il n'a rien à rendre."},{"id":"VEC-04","nom":"Par le sol partagé","condition":"Les deux corps posent leur poids sur une même surface continue — une dalle, un plancher, une veine de roche — sans joint de dilatation ni vide entre eux. La continuité se vérifie à l'oreille : un talon frappé par le porteur doit s'entendre sous le pied de la cible.","portee":"moyenne","verbe":"Fouler","faille":"S'élever ou se désolidariser. Deux centimètres suffisent : une caisse retournée, une marche isolée, un tapis épais, une flaque. Sauter au battement d'application est la parade des débutants et elle fonctionne. Un adversaire qui repère les joints du carrelage combat en restant du mauvais côté de la ligne et ne fait plus rien d'autre."},{"id":"VEC-05","nom":"Par la respiration comptée","condition":"Le porteur compte à voix basse sept expirations de la cible dans un volume d'air clos et commun. Le compte se dit en continu ; toute reprise, toute expiration manquée par le porteur lui-même, remet le nombre à un.","portee":"courte","verbe":"Compter","faille":"Fausser le débit. Apnée sur quatre temps, expiration par le nez puis par la bouche, souffles hachés qui empêchent de trancher où finit l'un et commence l'autre. Plus simple encore : ouvrir une fenêtre. Le volume cesse d'être commun, et le porteur compte l'air de la rue."},{"id":"VEC-06","nom":"Par l'objet touché deux fois","condition":"Un objet inerte de moins de trois kilos reçoit la paume nue du porteur, puis, dans le même quart d'heure et sans intermédiaire, la paume nue de la cible. L'ordre est fixe : le porteur d'abord. Une tasse rendue, une poignée de porte, une pièce de monnaie dans le creux de la main.","portee":"illimitée conditionnelle","verbe":"Repasser","faille":"Un gant, une manche tirée sur les doigts, un mouchoir. Ou l'ordre inverse, que rien n'interdit à l'adversaire d'imposer : prendre l'objet le premier, puis le tendre. La chaîne ne se ferme pas. Laver la chose ne sert à rien ; la casser, oui — l'objet doit rester d'une seule pièce."},{"id":"VEC-07","nom":"Par l'ombre franchie","condition":"L'ombre portée du porteur, projetée par une source lumineuse unique, recouvre à un instant donné le pied ou la tête de la cible. Le recouvrement doit être franc : une frange grise ne compte pas.","portee":"moyenne","verbe":"Recouvrir","faille":"Multiplier les sources. Deux lampes font deux ombres, et aucune n'est celle du porteur. Le zénith ne donne rien à franchir, l'obscurité pleine non plus. Un adversaire qui allume une seconde lanterne et se tient dans l'ombre d'un tiers a désarmé la loi sans lever la main."},{"id":"VEC-08","nom":"Par la signature contrefaite","condition":"Le porteur trace de sa propre main le nom de la cible en imitant son graphisme, sur un support qui boit l'encre — papier, bois tendre, peau. L'application doit intervenir tant que le tracé est humide.","portee":"illimitée conditionnelle","verbe":"Contresigner","faille":"Changer de main. Une nouvelle boucle apprise en une semaine, une signature à la croix, une écriture de la gauche : la contrefaçon ne trouve plus quoi contrefaire. À défaut, souffler dessus. Une signature sèche est une signature morte, et un support verni ne prend jamais."},{"id":"VEC-09","nom":"Par la dette reconnue","condition":"La cible reconnaît à voix haute, en présence d'un tiers vivant, devoir au porteur une chose chiffrée : une somme, une heure, un nombre de services. Le chiffre doit être dit par elle, pas par lui.","portee":"longue","verbe":"Créditer","faille":"Ne jamais dire le nombre. « Je te dois quelque chose » ne donne aucune prise : la loi cherche une quantité et n'en trouve pas. Payer sur-le-champ referme aussi. Le plus élégant reste le surpaiement : celui qui rend le double crée une dette inverse et le porteur se retrouve du mauvais côté de son propre registre."},{"id":"VEC-10","nom":"Par l'écho rendu","condition":"Un son émis par la cible revient à l'oreille du porteur après réflexion sur une surface dure, avec un retard perceptible d'au moins un dixième de seconde. Le porteur doit pouvoir désigner le mur qui l'a renvoyé.","portee":"moyenne","verbe":"Renvoyer","faille":"Tuer la réverbération. Combattre dans la neige, dans un couloir tendu de tissu, au milieu d'une foule. Ou réduire la distance : sous dix-sept mètres, l'écho ne se sépare plus du son et le porteur n'a plus qu'une voix, la sienne. Se taire fonctionne, mais peu d'adversaires tiennent quatre minutes sans un cri."},{"id":"VEC-11","nom":"Par le pas compté","condition":"Le porteur énonce le nombre de pas parcourus par la cible depuis le lever du jour, à moins de cent près, et le dit entier, sans arrondi. Le chiffre annoncé est vérifié à l'énoncé même : faux, il ferme la loi pour le reste du battement.","portee":"longue","verbe":"Énumérer","faille":"Rendre le compte insoluble ou nul. Tourner en rond sur douze mètres carrés, se faire porter, dormir jusqu'à midi. Zéro pas est l'exception écrite dans la loi elle-même : celui qui n'a pas bougé depuis l'aube ne peut pas être dénombré, et l'adversaire qui l'a compris commence ses journées assis."},{"id":"VEC-12","nom":"Par le sel versé","condition":"Une ligne continue de matière sèche — sel, cendre, chaux — versée par le porteur sur un sol dur, et franchie par la cible en la foulant. La ligne doit être ininterrompue d'un bord à l'autre du passage au moment du franchissement.","portee":"courte","verbe":"Répandre","faille":"Rompre avant de passer. Un coup de talon, un souffle, une semelle traînée : la continuité est ce qu'il y a de plus fragile au monde. Enjamber suffit également, puisque la loi exige que la ligne soit foulée, non traversée. Un courant d'air fait le travail sans que personne ait à s'en occuper."},{"id":"VEC-13","nom":"Par le vêtement porté","condition":"Le porteur tient contre sa peau nue une pièce de tissu ayant passé une nuit entière contre la peau de la cible, non lavée depuis. Un vêtement porté une heure ne vaut rien ; il faut le sommeil.","portee":"illimitée conditionnelle","verbe":"Revêtir","faille":"L'eau bouillante annule tout en quatre minutes. Dormir la peau nue ne cède rien du tout. Les maisons qui savent changent le linge chaque matin et brûlent l'ancien devant témoin — la dépense est ridicule au regard de ce qu'elle empêche, et c'est pour cela que si peu de gens la font."},{"id":"VEC-14","nom":"Par le tiers témoin","condition":"Un troisième vivant, ni porteur ni cible, voit les deux au même instant et peut les nommer tous les deux. Un animal fait l'affaire s'il porte un nom donné par un humain.","portee":"moyenne","verbe":"Convoquer","faille":"S'isoler, ou se rendre innommable au témoin. Se présenter sous un faux nom à celui qui regarde suffit : il voit deux corps et n'en connaît qu'un, l'énoncé reste ouvert. Aveugler le témoin fonctionne, le tuer aussi, et c'est précisément ce que la loi finit par exiger de son porteur — on la reconnaît aux pièces vides qu'elle laisse derrière elle."},{"id":"VEC-15","nom":"Par la mesure prise","condition":"Le porteur relève une dimension du corps de la cible avec un instrument gradué — corde nouée, mètre, empan calibré — et l'annonce à l'unité près : tour de poignet, envergure, longueur de l'avant-bras.","portee":"courte","verbe":"Toiser","faille":"Produire l'ex æquo. Deux corps de même mesure dans la même pièce, et la loi ne sait plus lequel elle désigne ; les frères se battent en paire pour cette raison. Autrement, fausser la dimension : un bandage sous la manche, une inspiration tenue, un poignet gonflé par le garrot déplacent le relevé d'une unité, et une unité suffit."},{"id":"VEC-16","nom":"Par le seuil franchi ensemble","condition":"Porteur et cible traversent la même ouverture — porte, portique, arche, brèche — dans le même battement et dans le même sens. Le cadre doit être matériel : une limite peinte au sol n'est pas un seuil.","portee":"contact","verbe":"Franchir","faille":"Céder le passage. Un temps d'attente d'une seconde, une main tendue vers la poignée qu'on laisse retomber, et rien ne se ferme. Entrer quand l'autre sort n'ouvre rien : le sens fait partie de la condition. Contre ce vecteur, on se bat par la fenêtre, et les couloirs deviennent des lieux de politesse extrême."},{"id":"VEC-17","nom":"Par le registre tenu","condition":"Le porteur inscrit sur un registre paginé la date, l'heure et l'acte de la cible, sur une ligne numérotée qui suit immédiatement la précédente. Aucun saut de numéro, aucune rature : la série doit être intègre du premier feuillet à la ligne du jour.","portee":"longue","verbe":"Inscrire","faille":"Corrompre la série. Faire écrire deux fois la même heure, provoquer une rature, arracher un feuillet — l'adversaire qui atteint le cahier n'a même pas besoin de le détruire, il lui suffit d'y ajouter une ligne fausse. Une goutte d'eau sur le numéro et la loi n'a plus de rang où s'accrocher."},{"id":"VEC-18","nom":"Par l'aiguille laissée","condition":"Un objet métallique du porteur, gravé de son nom ou trempé de son sang, demeure à moins d'un empan du corps de la cible pendant douze battements consécutifs : dans une doublure, une semelle, une plaie, un ourlet.","portee":"illimitée conditionnelle","verbe":"Ficher","faille":"Se fouiller. Un aimant passé sur les coutures, un déshabillage complet, une plaie ouverte au couteau plutôt que sondée. La parade la plus dure à supporter est la plus simple : retrouver l'aiguille et la rendre au porteur, dans sa main, en le regardant. L'objet revenu rompt la chaîne, et il doit tout recommencer à zéro empan."},{"id":"VEC-19","nom":"Par le repas partagé","condition":"Porteur et cible prélèvent leur part d'un même plat, cuit dans le même récipient, au même repas, et avalent. Deux portions de la même recette cuites séparément ne valent rien : la loi lit le récipient, pas le goût.","portee":"moyenne","verbe":"Rompre","faille":"Ne pas avaler. Garder en bouche, recracher dans la serviette, se servir dans un second plat identique mais sorti d'une autre marmite. Les banquets de trêve prévoient deux fonds de cuisson pour cette raison, et les convives qui savent regardent l'ustensile plutôt que l'assiette."},{"id":"VEC-20","nom":"Par la chaleur cédée","condition":"Peau nue contre peau nue, maintenues jusqu'à ce que les deux surfaces atteignent la même température : la vérification est sensorielle, la frontière entre les deux peaux cesse d'être perceptible. En moyenne quarante secondes, davantage sur un blessé.","portee":"contact","verbe":"Égaliser","faille":"Tenir l'écart ouvert. Une pièce de monnaie froide serrée dans le poing, une main plongée dans l'eau avant l'engagement, la fièvre. Rompre le contact à trente secondes annule tout et ne coûte rien. Contre ce vecteur, on ne meurt que si l'on est déjà trop faible pour retirer son bras — ce qui est exactement le cas visé."},{"id":"VEC-21","nom":"Par le mensonge accepté","condition":"Le porteur énonce sur la cible une phrase fausse et vérifiable, et la cible l'accepte : un mot, un hochement de tête, ou un silence tenu plus de trois secondes. L'acceptation doit être unique et pleine.","portee":"moyenne","verbe":"Faire acquiescer","faille":"Contredire, même mal, même à côté. Ou l'état à moitié, qui est la faille propre de toute condition binaire : acquiescer et nier dans la même phrase laisse la loi suspendue entre deux valeurs, et elle ne s'applique pas. Il existe enfin la parade rare — rendre la phrase vraie, et se transformer en ce dont on est accusé."},{"id":"VEC-22","nom":"Par la cicatrice nommée","condition":"Le porteur désigne une cicatrice visible sur la cible et en énonce l'origine exacte : l'objet, l'année, la main qui l'a faite. Les trois éléments, sans erreur, à voix haute, devant la marque découverte.","portee":"courte","verbe":"Nommer","faille":"Couvrir la marque : la loi exige qu'elle soit vue. Mentir sur son histoire n'aide en rien, la loi lit le fait et non le récit. Reste la solution des vétérans, qui est une mutilation : rouvrir la peau au même endroit. La nouvelle cicatrice recouvre l'ancienne, son origine est d'un jour, et personne ne la connaît encore."},{"id":"VEC-23","nom":"Par l'ordre d'arrivée","condition":"Porteur et cible sont entrés dans le lieu par la même issue, et le porteur peut établir sans erreur lequel des deux est entré le premier — par un registre d'entrée, un ticket numéroté, ou le témoignage d'un portier.","portee":"moyenne","verbe":"Classer","faille":"L'ex æquo, faille écrite de toute mesure ordinale : franchir la porte épaule contre épaule, ou entrer par deux issues différentes, et il n'y a plus de rang à établir. Un adversaire qui déchire son ticket et en tire un second brouille sa place dans la série. Les portiers achetés le sont d'abord pour cela."},{"id":"VEC-24","nom":"Par le silence tenu","condition":"Quatre secondes pendant lesquelles aucun son ne part du corps de la cible — ni voix, ni pas, ni frottement d'étoffe, ni déglutition — dans un lieu où le porteur entend tout ce qui s'y produit.","portee":"courte","verbe":"Guetter","faille":"Ne jamais se taire. Parler pour ne rien dire, traîner un pied, faire tinter une boucle de ceinture à chaque temps : le combat lui-même annule ce vecteur, qui ne mord que sur l'immobile. C'est sa cruauté propre — il ne prend jamais un adversaire debout, seulement celui qui s'est arrêté derrière une porte pour retenir son souffle."}]},"lois":{"lois":[{"id":"solde-thermique","nom":"Le Solde Thermique","enonce":"La chaleur qu'un corps a laissée derrière lui reste portée à mon compte.","consequence":"Onze heures de tiédeur dans un lit sont un capital : je les restitue en une seconde et l'air prend feu à hauteur de hanche. Poussée sur une salle chauffée depuis novembre, la loi rend en un souffle un hiver entier, et le verre coule avant de casser.","limite":"Un corps qui n'a jamais eu chaud ne me doit rien : l'adversaire qui s'immerge dans l'eau froide avant de venir se présente à mon registre avec un solde nul, et je n'ai rien à réclamer sur lui.","inversion":"Je rends la chaleur à qui l'a perdue : la brûlure remonte son propre trajet et la peau redevient de la peau, à la température exacte d'avant le contact.","maximum":"Je porte à mon compte toute la chaleur que j'ai moi-même cédée depuis ma naissance, et je la restitue en un seul point : celui où je me tiens.","archetype":"mesure"},{"id":"troisieme-fois","nom":"La Troisième Fois","enonce":"Ce qui se produit trois fois devant moi ne sait plus s'arrêter.","consequence":"Un homme qui tousse trois fois tousse jusqu'à ce que ses côtes cèdent. Un cœur dont j'ai compté trois battements n'a plus de pause pour se remplir : il bat à vide, et la mort arrive par manque de silence.","limite":"Il me faut trois occurrences identiques et je dois les voir. Un adversaire qui varie — un pas long, un pas court, un pas sauté — ne me fournit jamais la troisième, et la série retombe à zéro dès qu'une différence s'y glisse.","inversion":"Je casse la série : ce qui s'était produit trois fois cesse entièrement, y compris la première fois — l'hémorragie n'a pas commencé, le compte à rebours n'a pas été lancé.","maximum":"Je laisse la loi elle-même s'appliquer trois fois de suite : elle ne sait plus s'arrêter, et tout ce que je regarde entre dans la série dès sa première occurrence.","archetype":"répétition"},{"id":"main-restee","nom":"La Main Restée","enonce":"Le dernier qui m'a touché reste sur moi jusqu'à ce qu'un autre le remplace.","consequence":"Je répartis mes blessures sur lui à la distance que je veux. Poussée, la loi fait mourir à trois kilomètres l'infirmier qui m'a bandé le matin, de ce qu'on me fait ici, dans l'ordre exact où on me le fait.","limite":"Un seul remplaçant suffit à couper le fil. L'adversaire qui m'effleure volontairement au premier échange devient mon unique attache, et je n'ai plus personne d'autre sur qui poser ce que je reçois.","inversion":"Je remonte le fil au lieu de le descendre : ce qu'on lui a fait revient sur moi, et la plaie qu'il porte se referme exactement à mesure qu'elle s'ouvre sur ma peau.","maximum":"Je me touche moi-même en dernier. La loi se boucle : chaque coup que je porte à un autre m'est aussi porté, et je peux donc me tuer d'un geste destiné à quelqu'un.","archetype":"lien"},{"id":"porte-refermee","nom":"La Porte Refermée","enonce":"Aucune ouverture que j'ai refermée derrière moi ne fonctionne dans les deux sens.","consequence":"Tout encadrement devient à sens unique : une fenêtre, une mâchoire, une cage thoracique. Ce qui est entré reste, ce qui est sorti ne rentre pas, et un poumon qui vient d'expirer ne reprend plus rien.","limite":"Il faut que ce soit ma main qui referme. On me combat portes ouvertes, on entre par ce qui n'a pas de battant, et on me pousse vers les espaces sans seuil où la loi ne trouve rien à verrouiller.","inversion":"J'ouvre dans le sens interdit : ce qui était sorti rentre, le sang retourne dans la plaie par le trajet dont il est parti, la balle ressort du mur.","maximum":"Je referme derrière moi le seuil de ma propre bouche : plus rien de ce que j'ai dit ne peut être repris par personne, moi compris, et chaque phrase que je prononce est ma dernière fois de la prononcer.","archetype":"seuil"},{"id":"temoin-unique","nom":"Le Témoin Unique","enonce":"Ce dont je suis le seul témoin n'a pas eu lieu.","consequence":"J'isole un homme dans un couloir vide et je le démonte pièce par pièce. À la sortie il est intact, il n'a rien subi, et le couloir n'en garde pas la trace parce que l'événement n'a jamais été inscrit nulle part.","limite":"Un second regard annule tout : une caméra, un enfant à une fenêtre, un chien qui tourne la tête. Contre moi on n'apporte pas d'arme, on apporte du monde, et un seul suffit.","inversion":"J'atteste au lieu d'effacer : ce dont je suis le seul témoin devient irrévocablement arrivé, y compris ce que j'ai seulement cru voir — et personne ne peut plus le défaire, moi le premier.","maximum":"Je deviens le seul témoin de moi-même. Je n'ai pas eu lieu ; rien de ce qui m'atteint ne trouve de lieu où atteindre, et rien de ce que je fais n'a jamais été fait.","archetype":"témoignage"},{"id":"poids-declare","nom":"Le Poids Déclaré","enonce":"Rien ne pèse plus que le chiffre que j'ai annoncé pour lui.","consequence":"J'annonce quatre cents kilos pour une lame de cent grammes : elle traverse le sol jusqu'au niveau inférieur. J'annonce zéro pour un homme en pleine course et il continue, sans rien pour l'arrêter ni pour le poser.","limite":"L'annonce doit être un nombre entier, dit avant le contact, et je ne peux pas répéter deux fois le même chiffre dans la journée. Ce qui n'a pas de masse — une flamme, un cri, une ombre — reste hors du registre.","inversion":"Je démesure : la chose reprend d'un coup tout le poids que je lui avais retiré depuis l'aube, et le porteur d'un objet allégé toute la matinée s'effondre sous ce qu'il portait déjà.","maximum":"Je m'annonce moi-même à zéro. Rien de ce qui me frappe ne trouve de masse à déplacer, rien ne me retient au sol, et je continue de m'éloigner sans jamais me reposer nulle part.","archetype":"mesure"},{"id":"homonymie","nom":"L'Homonymie","enonce":"Ce qui porte le même nom occupe la même place.","consequence":"Je donne à la lame le nom de la main qui la tient et l'entaille apparaît dans la paume. Poussée, j'apprends le prénom entier d'un homme, je le donne à un clou, et il faut le voir marcher jusqu'au mur.","limite":"L'orthographe fait foi, l'homophonie ne suffit pas. Une seule syllabe fausse rend la substitution nulle, et celui qui refuse son nom, qu'on n'appelle plus, sort du monde de la loi.","inversion":"Je fixe au lieu de substituer : deux choses de même nom cessent de pouvoir se remplacer, et l'homme cloué dans sa propre place n'en est plus tiré ni par un déplacement ni par un domaine.","maximum":"Je donne mon nom à la loi. Elle occupe ma place et j'occupe la sienne : je ne suis plus quelqu'un qui l'applique, je suis ce qui s'applique, et on ne me tue plus qu'en la réfutant.","archetype":"échange"},{"id":"ordre-de-passage","nom":"L'Ordre de Passage","enonce":"Rien ne m'atteint avant d'avoir atteint tout ce qui est arrivé avant moi.","consequence":"J'entre le dernier dans une salle de quarante personnes et je suis intouchable jusqu'à ce que les trente-neuf autres soient tombés, dans l'ordre où ils ont franchi la porte. Le coup destiné à moi les traverse tous, et il arrive épuisé.","limite":"La file ne compte que ceux qui sont entrés. Seul avec moi, l'adversaire n'a qu'un nom devant lui, et c'est le mien : la loi ne me protège plus d'un seul battement.","inversion":"Je rends l'ordre : je passe volontairement en tête et j'encaisse à la place de tous ceux qui sont entrés après moi, leurs blessures déjà reçues comprises.","maximum":"Je m'inscris deux fois dans la file, en tête et en queue. Rien ne peut m'atteindre avant de m'avoir atteint, et la loi tourne sur elle-même jusqu'à ce que quelqu'un sorte de la pièce.","archetype":"mesure"},{"id":"prelevement-usure","nom":"Le Prélèvement d'Usure","enonce":"L'usure d'une chose m'appartient et je décide du jour où elle est due.","consequence":"Je diffère l'usure d'une lame pendant six ans, puis je la lui rends : elle tombe en limaille dans la main qui la serre. Sur un homme, l'usure d'une vie entière tient dans la durée d'un souffle.","limite":"Ce qui n'a jamais servi ne s'use pas. Une arme sortie de l'atelier, une main d'enfant, un os qui n'a rien porté ne me donnent aucun prélèvement, et l'on m'affronte avec du neuf.","inversion":"Je restitue l'usure retenue : le fer redevient droit, la corde neuve, la dent refaite — mais ce qui a été rendu sort définitivement de mon registre et ne pourra plus jamais être prélevé.","maximum":"Je prélève l'usure du prélèvement lui-même : la loi cesse de vieillir et devient permanente, et tout ce que j'avais différé depuis toujours échoit au même instant.","archetype":"soustraction"},{"id":"dette-de-sommeil","nom":"La Dette de Sommeil","enonce":"Les heures de sommeil que je ne prends pas, un autre les doit.","consequence":"Après quatre nuits blanches, l'homme en face s'effondre debout, paupières collées ; son corps entre en sommeil profond pendant que je lui ouvre la gorge, et les heures qu'il paie s'ajoutent aux miennes.","limite":"Le compte doit être réel, donc je veille vraiment. Un adversaire qui tient le duel court affronte un corps privé de sommeil depuis quatre-vingts heures, aux mains qui tremblent et aux yeux qui décrochent.","inversion":"Je paie dans l'autre sens : je dors une nuit d'avance et je la cède, et celui qui la reçoit se relève reposé au milieu d'un combat qu'il avait déjà perdu.","maximum":"Je réclame en une seule fois tout le sommeil que je dois depuis l'enfance. Celui qui l'endosse ne se réveille pas, et moi je ne me rendors plus jamais.","archetype":"échange"},{"id":"heritage-marques","nom":"L'Héritage des Marques","enonce":"Toute cicatrice que je touche devient une cicatrice que je porte.","consequence":"Après vingt contacts je porte les fractures de vingt corps, et je peux les rouvrir sur eux à l'endroit exact et dans l'ordre exact. Poussée jusqu'à la marque de naissance, l'homme redevient l'enfant qu'on a ouvert.","limite":"Il faut la peau nue et la marque refermée. Les blessures fraîches ne se transmettent pas, celui qui n'a jamais été entamé ne me laisse rien, et une manche suffit à me rendre inoffensif.","inversion":"Je déshérite : je retire la marque et son histoire avec elle. L'os ressoudé se ressoude autrement, et l'homme perd jusqu'au souvenir de la manière dont on l'a coupé.","maximum":"Je fais de la loi ma propre cicatrice et je l'hérite : tout ce qui m'a marqué devient transmissible par simple contact, y compris la blessure dont je mourrai, que je peux donner avant de l'avoir reçue.","archetype":"lien"},{"id":"archive-du-bruit","nom":"L'Archive du Bruit","enonce":"Aucun son émis devant moi n'a le droit de finir.","consequence":"Je garde cinq ans de sons dans une pièce close, puis j'ouvre : la pression cumulée casse les vitres, les tympans et les cages thoraciques dans cet ordre, et le cri d'un mort de février s'entend distinctement à la fin.","limite":"Ce que je conserve, je le porte. Chaque son gardé occupe une place, et un adversaire qui parle sans arrêt me remplit jusqu'à ce que je doive tout lâcher au même endroit — c'est-à-dire sur moi autant que sur lui.","inversion":"Je laisse fuir : un son conservé s'efface de l'air, des murs et des mémoires, et la phrase prononcée devant moi n'a plus jamais été prononcée par personne.","maximum":"Je conserve le son de mon propre énoncé : la loi ne finit plus de se dire, elle s'applique en continu, et je n'entendrai plus jamais rien d'autre.","archetype":"répétition"},{"id":"coupe-d-ombre","nom":"La Coupe d'Ombre","enonce":"Ce que je sépare de son ombre cesse de tenir ensemble.","consequence":"Un mur privé de son ombre s'écroule à la seconde suivante. Un homme séparé de la sienne se défait par couches, du bas vers le haut, à la vitesse à laquelle le soleil monte au-dessus de lui.","limite":"Il me faut une source de lumière unique et un sol pour recevoir l'ombre. Dans le noir complet, ou sous deux lampes qui se contredisent, la loi n'a rien à couper.","inversion":"Je recolle : je rends son ombre à ce qui l'avait perdue et la chose se retient — un corps ouvert tient à sa propre ombre le temps qu'on le recouse.","maximum":"Je me sépare de mon ombre. La coupe n'a plus besoin de lumière : tout ce que je désigne se défait, et plus rien ne me suit au sol.","archetype":"soustraction"},{"id":"versement-de-faim","nom":"Le Versement de Faim","enonce":"La faim se transporte d'un corps à un autre comme un objet qu'on pose.","consequence":"Je verse dans un homme les quatre jours de faim d'un autre : les sucs remontent, l'estomac se digère lui-même, et il mord ce qui est le plus proche de sa bouche, y compris sa propre main.","limite":"La faim doit exister quelque part avant d'être versée. Dans une ville rassasiée je n'ai presque rien à déplacer, et celui qui a mangé une heure plus tôt n'encaisse qu'une charge dérisoire.","inversion":"Je transporte la satiété au lieu du manque : un mourant est nourri sans rien avaler, et du poids revient sur ses os en quelques battements.","maximum":"Je verse en moi la faim de tout ce qui a faim à portée d'oreille, et je décide de ne rien manger tant qu'elle n'a pas trouvé un autre corps.","archetype":"échange"},{"id":"concordance-des-ages","nom":"La Concordance des Âges","enonce":"Deux choses qui se touchent finissent par avoir le même âge.","consequence":"Ma paume à plat sur une poutre de trois cents ans : mes cheveux blanchissent par la pointe pendant que la poutre reprend de la sève. L'écart se comble par le milieu, et sur un enfant la moyenne se fait aussi.","limite":"Je ne choisis pas la part et la moyenne va toujours dans les deux sens. Il suffit de me faire toucher plus vieux que moi — un mur, un os, une pierre — pour me coûter des décennies en un contact.","inversion":"J'écarte les âges au lieu de les rapprocher : je rends dix ans à l'un en les prenant à l'autre, avec un choix que le sens direct ne m'accorde jamais.","maximum":"Je pose les deux paumes à plat sur la terre et je laisse la concordance se faire avec elle.","archetype":"métamorphose"},{"id":"remontee-de-ligne","nom":"La Remontée de Ligne","enonce":"Un coup porté à un homme se paie d'abord sur la ligne qui l'a fait.","consequence":"Je frappe un cadet et trois générations reçoivent le coup avant lui, déterrées à distance. Quand la lignée est longue, il ne sent presque rien ; quand elle est courte, il n'en reste pas assez pour tomber.","limite":"Je n'atteins que ce qui a des ascendants nommés. Un homme sans nom de famille, un enfant abandonné, un fléau sans naissance absorbe seul la totalité du coup et reste debout devant moi.","inversion":"Je descends la ligne au lieu de la remonter : le coup se paie sur les descendants, y compris ceux qui ne sont pas encore nés — la loi les compte, donc ils sont.","maximum":"Je me frappe moi-même : toute ma ligne encaisse au même instant, et il ne reste plus personne pour porter la loi après moi.","archetype":"lien"},{"id":"passage-oblige","nom":"Le Passage Obligé","enonce":"Aucune douleur n'atteint un corps avant d'avoir traversé le mien.","consequence":"Je me place entre la lame et lui : le coup me traverse d'abord et lui arrive tiède. Sur une salle entière, plus personne ne peut souffrir tant que je tiens debout, et je tiens tout, jusqu'à la brûlure d'un enfant à l'étage.","limite":"Tout passe par un seul corps, et un corps a une capacité. Il suffit de blesser beaucoup de monde à la fois : la file me tue avant d'avoir atteint le troisième nom.","inversion":"Je renvoie au lieu d'absorber : la douleur repart par où elle est venue, remonte le bras, et la main qui a frappé reçoit l'intégralité de ce qui devait être reçu.","maximum":"Je me déclare passage de toute douleur à trente pas, puis je refuse de la relayer : autour de moi plus rien ne souffre, plus rien ne se protège, et je porte seul la totalité de ce que le monde aurait dû sentir.","archetype":"seuil"},{"id":"elan-confisque","nom":"L'Élan Confisqué","enonce":"Tout élan pris devant moi cesse d'appartenir à celui qui l'a pris.","consequence":"Dix pas de course me sont cédés ; je les replace dans un éclat de verre. La chute de quelqu'un est une réserve : je la garde une heure et je la dépose plus tard contre une nuque, avec toute la hauteur d'origine.","limite":"L'immobilité me prive de tout. Contre un adversaire qui ne se déplace plus et qui frappe du seul poignet, je n'ai rien à confisquer sinon mon propre mouvement, et je me vide en avançant.","inversion":"Je restitue l'élan à ce qui l'a perdu : un corps arrêté reprend exactement la vitesse qu'on lui avait ôtée, dans la direction d'origine, et le geste interrompu s'achève.","maximum":"Je confisque mon propre élan et je le garde : je ne peux plus bouger, et tout le mouvement du terrain m'appartient — chaque pas de l'autre est un pas que je place.","archetype":"soustraction"},{"id":"registre-du-sang","nom":"Le Registre du Sang","enonce":"Le sang qui a quitté un corps demeure sous mon autorité.","consequence":"Une goutte séchée sous un plancher depuis vingt ans m'obéit encore. Je la rappelle, et le trajet du retour ouvre tout ce qui se trouve entre elle et le corps qui l'a perdue, murs compris.","limite":"Le sang lavé, brûlé ou mêlé à celui d'un autre sort du registre. On me combat en saignant dans un seau d'eau salée, et il suffit de ne jamais saigner deux fois au même endroit.","inversion":"Je rends le sang à son corps : la restitution est entière et immédiate, l'homme se relève avec ses cinq litres — mais ce sang sort à jamais de mon autorité et ne me répondra plus.","maximum":"Je rappelle en une fois tout le sang que j'ai moi-même perdu depuis ma naissance, où qu'il soit et quel que soit ce qu'il doit traverser pour revenir.","archetype":"lien"},{"id":"executoire","nom":"L'Exécutoire","enonce":"Une promesse prononcée devant moi devient exigible dans sa lettre.","consequence":"« Je reviens tout de suite » oblige un homme à revenir d'où qu'il soit : les murs deviennent ce qu'il traverse et non ce qui l'arrête. Ce qui reste de lui arrive quand même, et à l'heure.","limite":"Je n'exige que la lettre, jamais l'intention. Une promesse ambiguë s'exécute au moins-disant, et celui qui ne promet rien — ou qui promet l'impossible — me laisse une créance nulle entre les mains.","inversion":"Je délie au lieu d'exiger : une promesse devient inexécutable pour toujours, et ce qu'elle retenait tombe — une garde, une allégeance, un serment gravé sous un sceau.","maximum":"Je prononce devant moi la promesse de tenir cette loi. Elle devient exigible contre moi dans sa lettre : je ne peux plus mentir, ni m'interrompre, ni mourir avant de l'avoir tenue.","archetype":"témoignage"},{"id":"droit-d-entree","nom":"Le Droit d'Entrée","enonce":"Nul n'entre dans une pièce où je me tiens sans y laisser une chose.","consequence":"Le prélèvement se fait à son insu : une lettre de son nom, le visage de quelqu'un, la sensibilité d'un doigt. Au bout de six pièces, celui qui me poursuit ne sait plus qui il poursuit et sa main tient mal.","limite":"C'est la pièce qui prélève, pas moi, et je ne choisis rien de ce qui est pris. En terrain ouvert, sans porte ni cloison, la loi ne s'exerce pas du tout — on me combat dehors.","inversion":"Je rends à la sortie : celui qui quitte la pièce récupère tout ce qu'il y avait laissé, et davantage — on en ressort avec ce que les autres y ont perdu.","maximum":"Je fais du monde une seule pièce et je me place dedans : chaque pas de chaque vivant vers moi lui coûte une chose, et je ne saurai jamais laquelle.","archetype":"seuil"},{"id":"trois-traits","nom":"Les Trois Traits","enonce":"Une chose décrite en trois traits vrais ne peut plus être que ces trois traits.","consequence":"Je décris un homme : grand, gaucher, essoufflé. Il perd tout le reste — la vue, le nom, l'estomac, la capacité de saigner — et se tient debout comme un meuble jusqu'à ce qu'on le pousse.","limite":"Je dois dire vrai : un seul trait faux annule la description entière. Celui qui se rend illisible — masqué, muet, immobile — ne me laisse jamais trois traits sûrs à énoncer.","inversion":"Je désécris : j'ôte les trois traits et je rends tout le reste. Un corps réduit reprend ses organes ; un fléau simplifié récupère une complexité qu'il ne sait plus gouverner.","maximum":"Je me décris moi-même : vivant, debout, porteur de la loi. Rien d'autre n'est vrai de moi, donc rien d'autre ne peut m'être retiré.","archetype":"métamorphose"},{"id":"oubli-operant","nom":"L'Oubli Opérant","enonce":"Ce dont je perds le souvenir cesse d'exister pour tout le monde.","consequence":"Une rue oubliée disparaît du plan et des jambes qui l'empruntaient. Poussée, j'oublie une technique adverse pendant qu'elle est en cours et elle s'interrompt au milieu de son geste, sans que son porteur sache ce qu'il faisait.","limite":"Je ne choisis pas ce que j'oublie et je perds réellement : chaque suppression prélève un morceau de ma propre vie. Il suffit de me faire oublier ce que je suis venu défendre pour que je le défasse moi-même.","inversion":"Je me souviens de ce qui n'a pas eu lieu et cela commence à exister : un mort revient, mais seulement la part que j'en garde, et il s'aperçoit très vite de ce qui manque.","maximum":"Je m'oublie moi-même. La loi reste, et continue de s'appliquer, sans plus personne pour se rappeler qui l'a énoncée.","archetype":"soustraction"},{"id":"plafond-releve","nom":"Le Plafond Relevé","enonce":"Ce que j'ai mesuré une fois ne peut plus dépasser la mesure.","consequence":"Je relève la vitesse d'un bras au premier échange : il n'ira plus jamais plus vite, ni ce soir, ni dans dix ans, ni contre un autre que moi. Le relevé vaut aussi pour un souffle, une portée, une réserve.","limite":"Une seule grandeur par relevé, et le chiffre doit être lu à l'instant exact. Ce qui varie pendant que je mesure ne se laisse pas fixer : un adversaire irrégulier m'impose un plafond haut, et le plafond est définitif pour moi aussi.","inversion":"Je démesure : je retire son plafond à une chose et elle n'a plus de valeur maximale tant que personne ne la mesure à nouveau — y compris moi, y compris un mourant.","maximum":"Je mesure la mesure : je relève le plafond de mon propre relevé et je le fixe à un. Désormais un seul chiffre suffit à figer un homme entier, et je n'aurai plus jamais qu'un chiffre par homme.","archetype":"mesure"},{"id":"heure-reprise","nom":"L'Heure Reprise","enonce":"À chaque minute, mon corps refait ce qu'il faisait la veille à la même minute.","consequence":"Je bâtis mes journées comme des pièges. Hier à 14 h 03 j'ai frappé le vide ; aujourd'hui à 14 h 03 mon poing part seul, avec la force d'hier ajoutée à celle d'aujourd'hui, et celui qui se tient là n'a rien vu venir parce que moi non plus.","limite":"Je n'ai aucun choix pendant la reprise. Celui qui a pu m'observer un jour connaît le lendemain à la minute près, et il lui suffit de se placer là où mes mains seront occupées.","inversion":"Je romps la veille : j'annule ce que je faisais à cette minute-là et tout ce qui en découlait — la blessure prise hier à 14 h 03 n'a plus de cause aujourd'hui, et se referme faute d'origine.","maximum":"Je passe une journée entière à ne rien faire d'autre qu'appliquer cette loi. Le lendemain, mes vingt-quatre heures ne sont plus qu'une reprise, et je ne m'appartiens plus d'aucune minute.","archetype":"répétition"},{"id":"premiere-version","nom":"La Première Version","enonce":"La première version d'un fait dite devant moi devient le fait.","consequence":"Un homme dit « je ne l'ai pas touchée » : sa main n'a plus jamais touché personne, elle traverse les corps et ne peut plus rien saisir. Un mensonge sur une blessure la fait disparaître, avec la chair qui allait autour.","limite":"Je retiens la première version, pas la plus utile. Celui qui parle vite décide de la loi à ma place, et une phrase absurde lancée avant moi me lie pour tout le duel.","inversion":"Je rétracte : la version retenue est retirée du monde et ce qu'elle avait fixé redevient libre — la main revient, la blessure revient, et l'homme redevient coupable.","maximum":"Je dis de moi la première version : « je suis intact ». Tant que personne ne parle de moi avant moi, je le suis — et je ne pourrai plus jamais dire de moi autre chose.","archetype":"témoignage"},{"id":"fonction-unique","nom":"La Fonction Unique","enonce":"Ce qui a servi deux fois au même usage ne peut plus servir à un autre.","consequence":"Une poignée ouverte mille fois n'est plus qu'ouverture : elle ne pèse plus, ne blesse plus, ne bloque plus. J'assigne à une main le seul fait de tenir : elle ne frappe plus, ne lâche plus, et se referme sur ce qu'elle tient jusqu'à l'os.","limite":"Il faut que j'aie vu les deux usages. Celui qui change de garde à chaque échange ne fixe jamais de fonction, et une arme sans histoire ne m'offre rien à verrouiller.","inversion":"Je déverrouille : la chose perd sa fonction et devient disponible pour n'importe quelle autre — un mur cesse de séparer, un os cesse de porter, une porte cesse d'être un passage.","maximum":"J'assigne à mon corps sa fonction unique : appliquer la loi. Je ne mange plus, je ne dors plus, je ne fais plus rien d'autre — et rien ne peut plus m'en empêcher.","archetype":"métamorphose"},{"id":"chambre-commune","nom":"La Chambre Commune","enonce":"Deux êtres qui respirent le même air respirent la même chose.","consequence":"Ce qui entre dans mes poumons entre dans les siens : une gorgée d'eau, une lame de fumée, une hémorragie interne. Dans une pièce close, il me suffit de cesser de respirer pour que la pièce cesse, et je tiens quatre minutes de plus que n'importe qui.","limite":"Le partage est intégral et symétrique. Tout ce qu'il inhale, je l'inhale : un poison fait deux morts, une apnée en fait deux, et il lui suffit d'accepter de mourir pour m'emporter à la même seconde.","inversion":"Je sépare les airs : plus personne ne respire ce que je respire. J'extrais un homme d'une fumée ou d'une eau, et il respire au fond du fleuve l'air d'une chambre que j'ai quittée le matin.","maximum":"J'ouvre la chambre commune à tout ce qui respire à portée d'oreille, puis j'inspire une seule fois, lentement, de la poussière d'os.","archetype":"lien"}]},"serments":{"serments":[{"id":"paupiere-cousue","nom":"Le Serment de la Paupière Cousue","clause":"Je renonce à voir ce qu'il me reste à entamer. Je le saurai fini quand mes mains ne rencontreront plus de résistance.","restriction":"La jauge et le nombre de points de vie de l'adversaire disparaissent de l'écran. Le bloc n'est pas masqué, il est retiré : il ne revient à aucun duel suivant.","gain":"Tes techniques frappent 45 % plus fort.","restriction_code":"masqueVieEnnemi=true ; suppression du nœud DOM de la jauge adverse, remplacé par des blocs U+2588 aux mêmes métriques ; état écrit en sauvegarde, réappliqué avant le premier paint","gain_code":"degatsMult ×1.45 sur toutes les techniques","danger":2},{"id":"gantelet-depose","nom":"Le Serment du Gantelet Déposé","clause":"Je n'oppose plus rien. Ce qui vient jusqu'à moi entrera entier, dans l'ordre où il a été lancé.","restriction":"Les actions Garde et Esquive te sont retirées. Leurs deux emplacements restent dans l'anneau, barrés, pour que tu les vises par réflexe pendant encore trois tours.","gain":"+2 énergie maudite au début de chaque tour.","restriction_code":"interdit=['garde','esquive'] ; boutons conservés à l'écran, rayés d'un trait 1 px, non cliquables (aria-disabled)","gain_code":"energieBonus +2 par tour","danger":3},{"id":"seuil-scelle","nom":"Le Serment du Seuil Scellé","clause":"Je ne repasserai pas la porte par laquelle je suis entré. On me sortira d'ici porté, ou on ne me sortira pas.","restriction":"Fuir devient impossible, dans ce duel et dans tous les suivants, y compris contre un fléau surclassé.","gain":"Tu encaisses 20 % de dégâts en moins et tu gagnes 10 % de points de vie maximum.","restriction_code":"interdit=['fuite'] ; l'action est retirée de l'anneau et l'abandon de duel est refusé","gain_code":"degatsRecusMult ×0.80 ; pvMaxMult ×1.10","danger":2},{"id":"tiers-rendu","nom":"Le Serment du Tiers Rendu","clause":"Je rends la part de moi qui ne servait qu'à durer. Je n'avais pas l'intention de durer.","restriction":"Tu perds 45 % de tes points de vie maximum, pour le reste de cette vie. Aucune greffe, aucun soin, aucune victoire ne les rend.","gain":"Tous tes dégâts sont multipliés par 2,1.","restriction_code":"pvMaxMult ×0.55 permanent (persisté) ; PV courants recalculés au prorata immédiatement","gain_code":"degatsMult ×2.10","danger":5},{"id":"plaie-tenue","nom":"Le Serment de la Plaie Tenue Ouverte","clause":"Rien de ce qui s'ouvre en moi ne se refermera avant la fin de la phrase. J'ai besoin qu'on voie par où ça passe.","restriction":"La technique inversée t'est retirée. Plus aucun soin, ni pendant le duel, ni entre deux dossiers.","gain":"+3 énergie au premier tour et +30 % sur les dégâts de tes coups critiques.","restriction_code":"interdit=['inverse'] ; soinMult=0 ; aucune régénération inter-duel","gain_code":"energieDepart +3 ; critMult ×1.30","danger":4},{"id":"cire-versee","nom":"Le Serment de la Cire Versée","clause":"Je ne veux plus entendre ce qui se déplace derrière moi pendant que je frappe devant.","restriction":"Le son est coupé, définitivement, et tu ne pourras pas le rallumer. Le métronome sourd qui calait les battements part avec le reste : tu perds la seule chose qui t'annonçait le tour adverse.","gain":"+18 points de chance de coup critique.","restriction_code":"c
